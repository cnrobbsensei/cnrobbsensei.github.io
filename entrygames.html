const MAX_ATTEMPTS_PER_DAY = 3;

function isInputWindowOpen(){ return true; }

function groupEntries(entries){
  const map = {};
  for(const e of entries){
    if(!e || !e.name) continue; // skip malformed entries instead of crashing
    // Group case-insensitively so "john", "John", and "JOHN" are the same ninja —
    // the displayed name uses whichever casing was typed most recently.
    const nameKey = e.name.trim().toLowerCase();
    const key = `${e.week}|${nameKey}|${e.date}`;
    if(!map[key]) map[key]={week:e.week,name:e.name,date:e.date,points:0,ids:[],attempts:0};
    map[key].name = e.name; // keep most-recent casing for display
    map[key].points += e.points;
    map[key].attempts += 1;
    map[key].ids.push(e.id);
  }
  return Object.values(map);
}
function getAttemptsToday(allEntries, name, week, date){
  return allEntries.filter(e =>
    e && e.name &&
    e.week === week &&
    e.name.toLowerCase() === name.trim().toLowerCase() &&
    e.date === date
  ).length;
}
function calcBoard(groupedForWeek){
  return groupedForWeek
    .map(e => ({name:e.name,date:e.date,points:e.points,attempts:e.attempts,ids:e.ids}))
    .sort((a,b) => b.points - a.points);
}
function calcNinjaSummary(groupedForWeek){
  const map = {};
  for(const e of groupedForWeek){
    if(!e || !e.name) continue;
    const nameKey = e.name.trim().toLowerCase();
    if(!map[nameKey]) map[nameKey]={name:e.name,total:0,days:[]};
    map[nameKey].name = e.name; // keep most-recent casing for display
    map[nameKey].total += e.points;
    map[nameKey].days.push({date:e.date,points:e.points,attempts:e.attempts,ids:e.ids});
  }
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

function Glass({children,style={},onClick,onMouseEnter,onMouseLeave}){
  return(
    <div onClick={onClick} onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave} style={{
      background:"rgba(255,255,255,0.06)",backdropFilter:"blur(18px)",WebkitBackdropFilter:"blur(18px)",

      boxShadow:"0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08)",...style
    }}>{children}</div>
  );
}
function Toast({msg,color="#39ff14",onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3500);return()=>clearTimeout(t);},[]);
  return(
    <div style={{position:"fixed",bottom:24,right:16,left:16,zIndex:9999,maxWidth:380,margin:"0 auto",

      padding:"14px 20px",color,fontFamily:"'Fira Code',monospace",fontWeight:600,fontSize:13,
      boxShadow:`0 0 24px ${color}55`,animation:"slideIn .3s ease"}}>{msg}</div>

}

const SESSION_DAYS = [
  {label:"Tuesday",dow:2},{label:"Wednesday",dow:3},{label:"Thursday",dow:4},{label:"Saturday",dow:6},{label:"Sunday",dow:0},
];
function dowFromDateStr(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  return new Date(y, m-1, d).getDay();
}

function LeaderboardView({allEntries}){
  const totalWeeks=window.getCurrentWeek()+1;
  const [week,setWeek]=useState(window.getCurrentWeek());
  const weekEntries=allEntries.filter(e=>e.week===week);
  const grouped=groupEntries(weekEntries);
  const board=calcBoard(grouped);

  const dayBuckets = SESSION_DAYS.map(sd => ({...sd,rows: board.filter(row => dowFromDateStr(row.date) === sd.dow)})).filter(b => b.rows.length > 0);
  const bucketedDates = new Set(dayBuckets.flatMap(b=>b.rows.map(r=>r.date)));
  const otherRows = board.filter(row => !bucketedDates.has(row.date));

  function DaySection({label,color,rows}){
    return(
      <div style={{marginBottom:24}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,color,margin:0,letterSpacing:1}}>{label.toUpperCase()}</h3>
          <div style={{flex:1,height:1,background:`linear-gradient(90deg,${color}33,transparent)`}}/>
        </div>
        {rows.sort((a,b)=>b.points-a.points).map((row,i)=>{
          const rank=i+1;
          const gc=rank===1?"#ffd700":rank===2?"#c0c0c0":rank===3?"#cd7f32":color;
          return(
            <Glass key={row.name+row.date} style={{padding:"12px 18px",marginBottom:8,
              borderColor:rank<=3?`${gc}44`:"rgba(255,255,255,0.08)",
              boxShadow:rank<=3?`0 0 18px ${gc}22,0 4px 20px rgba(0,0,0,0.4)`:"0 4px 14px rgba(0,0,0,0.3)",
              animation:`fadeUp .35s ease both ${i*.05}s`}}>
              <div style={{display:"grid",gridTemplateColumns:"40px 1fr 80px",gap:10,alignItems:"center"}}>
                <div style={{width:32,height:32,borderRadius:"50%",flexShrink:0,
                  background:rank<=3?`linear-gradient(135deg,${gc},${gc}99)`:"rgba(255,255,255,0.08)",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontWeight:700,fontSize:rank<=3?14:11,color:rank<=3?"#000":"#999",
                  boxShadow:rank<=3?`0 0 12px ${gc}88`:"none"}}>
                  {rank===1?"👑":rank===2?"🥈":rank===3?"🥉":`#${rank}`}
                </div>
                <div>
                  <div style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:"clamp(12px,1.5vw,14px)",color:"#fff"}}>{row.name}</div>
                  {row.attempts>1&&(
                    <div style={{fontFamily:"'Fira Code',monospace",fontSize:8,color:"rgba(255,255,255,0.25)",marginTop:2}}>{row.attempts}/{MAX_ATTEMPTS_PER_DAY} attempts</div>
                  )}
                </div>
                <div style={{textAlign:"right",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:"clamp(13px,1.8vw,17px)",color:rank<=3?gc:"#39ff14",textShadow:rank<=3?`0 0 10px ${gc}88`:"0 0 8px #39ff1455"}}>
                  {row.points.toLocaleString()}
                </div>
              </div>
            </Glass>
          );
        })}
      </div>
    );
  }
  const DAY_COLORS=["#00cfff","#39ff14","#ff2d78","#ffd700","#bf5fff"];
  return(
    <div style={{padding:"clamp(16px,3vw,28px) clamp(14px,3vw,36px)",animation:"fadeUp .4s ease both"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28,flexWrap:"wrap"}}>
        <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:"clamp(15px,2vw,20px)",color:"#fff",margin:0}}>🏆 Points Leaderboard</h2>
        <select value={week} onChange={e=>setWeek(Number(e.target.value))}
          style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:"#fff",padding:"7px 12px",fontFamily:"'Fira Code',monospace",fontSize:11,cursor:"pointer"}}>
          {Array.from({length:totalWeeks},(_,i)=>i+1).map(w=>(
            <option key={w} value={w} style={{background:"#0a0a0f"}}>{window.getWeekLabel(w)}{w===window.getCurrentWeek()?" ← Current":""}</option>
          ))}
        </select>
      </div>
      {board.length===0?(
        <Glass style={{padding:40,textAlign:"center"}}>
          <p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.4)",fontSize:15}}>No scores yet for this week. Be the first! 🥷</p>
        </Glass>
      ):(
        <>
          {dayBuckets.map((bucket,bi)=>(<DaySection key={bucket.label} label={bucket.label} color={DAY_COLORS[bi%DAY_COLORS.length]} rows={bucket.rows}/>))}
          {otherRows.length>0&&<DaySection label="Other" color="#aaa" rows={otherRows}/>}
        </>
      )}
    </div>
  );
}

function EnterScores({allEntries,setAllEntries,setToast}){
  const [name,setName]=useState("");
  const [pts,setPts]=useState("");
  const [errors,setErrors]=useState({});
  const [saving,setSaving]=useState(false);
  const [deleting,setDeleting]=useState(null);
  const [usernames,setUsernames]=useState([]);
  const [pendingChoice,setPendingChoice]=useState(null); // {matches:[...], pts:number}
  const inputOpen=isInputWindowOpen();
  const cw=window.getCurrentWeek();
  const today=window.todayStr();

  useEffect(()=>{
    (async()=>{
      try{ setUsernames(await window.fbUsernames.getAll()); }catch(e){console.warn(e);}
    })();
  },[]);

  function firstNameOf(u){ return String(u||"").split(".")[0].trim().toLowerCase(); }

  const weekEntries=allEntries.filter(e=>e.week===cw);
  const grouped=groupEntries(weekEntries);
  const board=calcNinjaSummary(grouped);

  // Figure out whether the typed name corresponds to exactly one registered
  // username (e.g. "juilee" -> "juilee.kadam"), several (ambiguous — needs a
  // prompt), or none (ninja isn't registered yet — fall back to the typed name).
  const typedTrim=name.trim();
  const typedLower=typedTrim.toLowerCase();
  const exactUsernameMatch=typedTrim?usernames.find(u=>u.toLowerCase()===typedLower):null;
  const candidateMatches=typedTrim&&!exactUsernameMatch?usernames.filter(u=>firstNameOf(u)===typedLower.split(".")[0]):[];
  const isAmbiguous=!exactUsernameMatch&&candidateMatches.length>1;
  const resolvedName=exactUsernameMatch||(candidateMatches.length===1?candidateMatches[0]:typedTrim);
  // Only use the resolved name to look up existing data when it's unambiguous —
  // with 2+ possible accounts we don't know whose stats to show yet.
  const previewName=typedTrim&&!isAmbiguous?resolvedName:"";

  const ninjaGrouped=previewName?grouped.filter(e=>e.name.toLowerCase()===previewName.toLowerCase()):[];
  const ninjaSummary=board.find(n=>n.name.toLowerCase()===previewName.toLowerCase());
  const ninjaRank=board.findIndex(n=>n.name.toLowerCase()===previewName.toLowerCase())+1;

  const attemptsToday=previewName?getAttemptsToday(allEntries,previewName,cw,today):0;
  const attemptsLeft=Math.max(0,MAX_ATTEMPTS_PER_DAY-attemptsToday);
  const maxedOut=attemptsToday>=MAX_ATTEMPTS_PER_DAY;
  const barColor=attemptsLeft===0?"#ff2d78":attemptsLeft===1?"#ffd700":"#39ff14";

  async function doSubmit(rawName,p){
    setSaving(true);
    const normName = window.cnNormalizeName ? window.cnNormalizeName(rawName) : rawName.trim();
    const priorAttempts = getAttemptsToday(allEntries,normName,cw,today);
    try{
      const result=await window.fbLeaderboard.addEntry(cw,normName,p,today);
      const newEntry={id:result.id,week:cw,name:normName,points:p,date:today,createdAt:Date.now()};
      setAllEntries(prev=>[...prev,newEntry]);
      setPts("");
      setPendingChoice(null);
      const rem=MAX_ATTEMPTS_PER_DAY-(priorAttempts+1);
      setToast({msg:rem>0?`${normName} +${p} pts! (${rem} attempt${rem!==1?"s":""} left today) ✅ — login access refreshed for ${window.SESSION_HOURS}h`:`${normName} +${p} pts! No more attempts today. ✅`,color:"#39ff14"});
    } catch(e){setToast({msg:`Save failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  async function submit(){
    if(!inputOpen||maxedOut) return;
    const errs={};
    if(!name.trim()) errs.name="Name is required";
    const p=Number(pts);
    if(!pts||isNaN(p)) errs.pts="Must be a number";
    else if(p<0) errs.pts="No negative points!";
    if(Object.keys(errs).length){setErrors(errs);return;}
    setErrors({});

    // Multiple registered usernames share this first name — ask which one
    // before saving anything.
    if(isAmbiguous){ setPendingChoice({matches:candidateMatches,pts:p}); return; }
    doSubmit(resolvedName,p);
  }

  async function deleteEntry(entry){
    setDeleting(entry.date+entry.name);
    try{
      const rawMatches=allEntries.filter(e=>e.week===cw&&e.name.toLowerCase()===entry.name.toLowerCase()&&e.date===entry.date);
      await Promise.all(rawMatches.map(e=>window.fbLeaderboard.deleteEntry(cw,e.id)));
      setAllEntries(prev=>prev.filter(e=>!(e.week===cw&&e.name.toLowerCase()===entry.name.toLowerCase()&&e.date===entry.date)));
      setToast({msg:`Deleted all of ${entry.name}'s entries for ${entry.date}.`,color:"#ff2d78"});
    } catch(e){setToast({msg:`Delete failed: ${e.message}`,color:"#ff2d78"});}
    setDeleting(null);
  }

  return(
    <div style={{padding:"clamp(16px,3vw,28px) clamp(14px,3vw,36px)",animation:"fadeUp .4s ease both"}}>
      <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:"clamp(14px,2vw,20px)",color:"#fff",marginBottom:6}}>📝 Enter Scores</h2>
      <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.35)",marginBottom:8}}>{window.getWeekLabel(cw)}</p>
      <div style={{marginBottom:24,background:"rgba(0,207,255,0.06)",border:"1px solid #00cfff33",borderRadius:8,padding:"8px 14px"}}>
        <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"#00cfff",margin:0,lineHeight:1.6}}>
          💡 Entering a ninja here also grants them login access for the next {window.SESSION_HOURS} hours — logging in requires being entered here first.
        </p>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:24}}>
        <Glass style={{padding:22}}>
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>NINJA NAME</label>
            <input value={name} onChange={e=>{setName(e.target.value);setErrors({});}} placeholder="e.g. ShadowByte" style={iStyle(errors.name)}
              onFocus={e=>e.target.style.borderColor="#00cfff"}
              onBlur={e=>e.target.style.borderColor=errors.name?"#ff2d78":"rgba(255,255,255,0.15)"}/>
            {errors.name&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.name}</p>}
            {!errors.name&&typedTrim&&(isAmbiguous?(
              <p style={{color:"#ffd700",fontSize:10,marginTop:5,fontFamily:"'Fira Code',monospace"}}>⚠️ {candidateMatches.length} ninjas share this name — you'll pick the right one on submit</p>
            ):(exactUsernameMatch||candidateMatches.length===1)?(
              <p style={{color:"#39ff14",fontSize:10,marginTop:5,fontFamily:"'Fira Code',monospace"}}>🔗 Linked to {resolvedName}</p>
            ):null)}
          </div>

          {name.trim()&&(
            <div style={{marginBottom:16,borderRadius:10,padding:"11px 14px",
              background:maxedOut?"rgba(255,45,120,0.1)":"rgba(57,255,20,0.06)",
              border:`1px solid ${barColor}33`,transition:"all .3s"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.4)",letterSpacing:1}}>TODAY'S ATTEMPTS</span>
                <span style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,fontWeight:700,color:barColor}}>{attemptsToday} / {MAX_ATTEMPTS_PER_DAY}</span>
              </div>
              <div style={{display:"flex",gap:6,marginBottom:maxedOut||attemptsToday>0?8:0}}>
                {Array.from({length:MAX_ATTEMPTS_PER_DAY},(_,i)=>(
                  <div key={i} style={{flex:1,height:7,borderRadius:99,background:i<attemptsToday?barColor:"rgba(255,255,255,0.1)",boxShadow:i<attemptsToday?`0 0 8px ${barColor}88`:"none",transition:"background .3s"}}/>
                ))}
              </div>
              {maxedOut&&<p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"#ff2d78",textAlign:"center",margin:0}}>🚫 Max attempts reached — come back tomorrow!</p>}
              {!maxedOut&&attemptsToday>0&&<p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.35)",margin:0}}>{attemptsLeft} attempt{attemptsLeft!==1?"s":""} remaining today</p>}
            </div>
          )}

          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>POINTS THIS ATTEMPT</label>
            <input value={pts} onChange={e=>setPts(e.target.value)} placeholder="e.g. 850" type="number" min="0"
              disabled={maxedOut}
              style={{...iStyle(errors.pts),fontFamily:"'Fira Code',monospace",fontSize:16,opacity:maxedOut?.4:1,cursor:maxedOut?"not-allowed":"text"}}
              onFocus={e=>{if(!maxedOut)e.target.style.borderColor="#39ff14";}}
              onBlur={e=>e.target.style.borderColor=errors.pts?"#ff2d78":"rgba(255,255,255,0.15)"}
              onKeyDown={e=>e.key==="Enter"&&!saving&&!maxedOut&&submit()}/>
            {errors.pts&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.pts}</p>}
          </div>

          <div style={{marginBottom:14,background:"rgba(57,255,20,0.06)",borderRadius:8,padding:"8px 12px",border:"1px solid #39ff1422"}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)"}}>TODAY: </span>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"#39ff14"}}>{today}</span>
          </div>

          <button onClick={submit} disabled={saving||!inputOpen||maxedOut} style={{width:"100%",padding:12,borderRadius:10,border:"none",
            cursor:saving||!inputOpen||maxedOut?"not-allowed":"pointer",
            background:saving||maxedOut?"rgba(255,255,255,0.08)":"linear-gradient(135deg,#39ff14,#00cfff)",
            color:saving||maxedOut?"rgba(255,255,255,0.3)":"#000",
            fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:12,letterSpacing:1,
            display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
            {saving?<><Spinner/> SAVING...</>:maxedOut?"🚫 MAX ATTEMPTS REACHED":"SUBMIT SCORE ⚡"}
          </button>
        </Glass>

        <Glass style={{padding:22,borderColor:ninjaSummary?"#39ff1433":"rgba(255,255,255,0.08)"}}>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"#39ff14",marginBottom:16,letterSpacing:1}}>LIVE PREVIEW</h3>
          {ninjaSummary?(
            <>
              <div style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:16,color:"#fff",marginBottom:2}}>{ninjaSummary.name}</div>
              <div style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.35)",marginBottom:14}}>Rank #{ninjaRank} this week · {ninjaSummary.total} pts total</div>
              <div style={{background:"rgba(255,255,255,0.04)",borderRadius:8,padding:"10px 12px",marginBottom:10}}>
                <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)",marginBottom:8,letterSpacing:1}}>DAILY TOTALS — ✕ deletes all attempts for that day</div>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {ninjaGrouped.sort((a,b)=>a.date.localeCompare(b.date)).map((e,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"rgba(57,255,20,0.08)",border:"1px solid #39ff1433",borderRadius:6,padding:"6px 10px"}}>
                      <div>
                        <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"#39ff14"}}>{e.date.slice(5)} → {e.points} pts</span>
                        <span style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.35)",marginLeft:8}}>({e.attempts}/{MAX_ATTEMPTS_PER_DAY} attempt{e.attempts!==1?"s":""})</span>
                      </div>
                      <button onClick={()=>deleteEntry(e)} disabled={!!deleting}
                        style={{background:"rgba(255,45,120,0.15)",border:"1px solid #ff2d7844",borderRadius:5,color:"#ff2d78",padding:"2px 7px",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:11}}>
                        {deleting===e.date+e.name?<Spinner/>:"✕"}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div style={{background:"rgba(57,255,20,0.08)",border:"1px solid #39ff1433",borderRadius:8,padding:"10px 12px"}}>
                  <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)",marginBottom:3}}>WEEKLY TOTAL</div>
                  <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:18,color:"#39ff14"}}>{ninjaSummary.total}</div>
                </div>
                <div style={{background:"rgba(0,207,255,0.08)",border:"1px solid #00cfff33",borderRadius:8,padding:"10px 12px"}}>
                  <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)",marginBottom:3}}>DAYS PLAYED</div>
                  <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:18,color:"#00cfff"}}>{ninjaSummary.days.length}</div>
                </div>
              </div>
            </>
          ):(
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:180,gap:10}}>
              <div style={{fontSize:32}}>🥷</div>
              <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.3)",textAlign:"center"}}>Enter a ninja name to see their stats</p>
            </div>
          )}
        </Glass>
      </div>
      {pendingChoice&&(
        <PersonPickerModal matches={pendingChoice.matches} busy={saving}
          onSelect={u=>doSubmit(u,pendingChoice.pts)}
          onCancel={()=>{if(!saving)setPendingChoice(null);}}/>
      )}
    </div>
  );
}

function LeaderboardsTab({allEntries,setAllEntries,setToast,isAdmin}){
  const [sub,setSub]=useState("view");
  const tabs=[{id:"view",label:"🏆 Leaderboard"}];
  if(isAdmin) tabs.push({id:"enter",label:"📝 Enter Scores"});
  return(
    <div style={{minHeight:"100%"}}>
      <div style={{padding:"clamp(16px,3vw,28px) clamp(14px,3vw,36px) 0",display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setSub(t.id)} style={{padding:"9px 18px",borderRadius:99,border:"none",cursor:"pointer",
            fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:12,transition:"all .2s",
            background:sub===t.id?"linear-gradient(135deg,#39ff14,#00cfff)":"rgba(255,255,255,0.07)",
            color:sub===t.id?"#000":"rgba(255,255,255,0.6)",
            boxShadow:sub===t.id?"0 0 20px #39ff1444":"none"}}>{t.label}</button>
        ))}
        {!isAdmin&&(
          <div style={{padding:"7px 14px",borderRadius:99,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)"}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.35)"}}>👀 Guest — view only</span>
          </div>
        )}
      </div>
      {sub==="view"&&<LeaderboardView allEntries={allEntries}/>}
      {sub==="enter"&&isAdmin&&<EnterScores allEntries={allEntries} setAllEntries={setAllEntries} setToast={setToast}/>}
    </div>
  );
}

function EntryGamesApp(){
  const {auth,ready} = window.useCnAuth();
  const [allEntries,setAllEntries]=useState([]);
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState(null);
  const isMobile=useIsMobile();

  useEffect(()=>{
    if(!ready) return;
    (async()=>{
      try{ setAllEntries(await window.fbLeaderboard.getAll()); }catch(e){console.warn(e);}
      setLoading(false);
    })();
  },[ready]);

  if(!auth||loading) return <LoadingScreen status="Loading leaderboard..."/>;
  const isAdmin=auth.role==="admin", isStudent=auth.role==="student";

  return(
    <>
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",
        background:"radial-gradient(ellipse 60% 50% at 80% 20%,rgba(57,255,20,0.06) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(0,207,255,0.07) 0%,transparent 70%),#060609"}}/>
      <div style={{display:"flex",flexDirection:isMobile?"column":"row",minHeight:"100vh",position:"relative",zIndex:1,width:"100%"}}>
        {isMobile
          ?<MobileNav active="leaderboards" isAdmin={isAdmin} isStudent={isStudent} studentUsername={auth.username}/>
          :<Sidebar active="leaderboards" isAdmin={isAdmin} isStudent={isStudent} studentUsername={auth.username}/>
        }
        <div style={{flex:1,overflowY:"auto",...(isMobile?{}:{height:"100vh"})}}>
          <LeaderboardsTab allEntries={allEntries} setAllEntries={setAllEntries} setToast={setToast} isAdmin={isAdmin}/>
        </div>
      </div>
      {toast&&<Toast msg={toast.msg} color={toast.color||"#39ff14"} onDone={()=>setToast(null)}/>}
      <TourOverlay/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<EntryGamesApp/>);
</script>
</body>
</html>
