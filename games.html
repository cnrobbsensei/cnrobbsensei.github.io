<script>
// Games-specific Firebase helpers (per-game leaderboards). Break flags and
// the cnKeySafe/cnIsBreakActive helpers now live in shared.js.
window.fbGames = {
  // Live-watches this student's break flag (set from the "Start Break" button on the
  // In The Dojo page) and fires the callback immediately whenever it changes, so a
  // Sensei ending a break instantly kicks the student out of whatever game they're in.
  watchStudentBreak(username, callback){
    if(!username) return ()=>{};
    const ref = window.cnDb.ref(`games/onBreak/${window.cnKeySafe(username)}`);
    const handler = snap => callback(snap.val());
    ref.on("value", handler);
    return ()=> ref.off("value", handler);
  },
  async getLeaderboard(gameId){
    const snap = await window.cnDb.ref(`games/${gameId}/leaderboard`).once("value");
    const val = snap.val() || {};
    return Object.entries(val).map(([id,e])=>({id,...e})).sort((a,b)=>b.score-a.score).slice(0,5);
  },
// One entry PER PLAYER: each player's row is keyed off their (trimmed,
// lowercased) name instead of a random push() id, so replaying never adds
// extra rows — it can only raise that player's own best score. Only the
// single highest score any given person has ever gotten counts toward the
// leaderboard / top 5.
async submitScore(gameId, name, score){
  const cleanName = name.trim();
  const key = window.cnKeySafe(cleanName.toLowerCase());
  const entryRef = window.cnDb.ref(`games/${gameId}/leaderboard/${key}`);

  const existingSnap = await entryRef.once("value");
  const existing = existingSnap.val();
  const isNewPersonalBest = !existing || score > existing.score;

  if(isNewPersonalBest){
    await entryRef.set({name: cleanName, score, ts: Date.now()});
  }

  const snap = await window.cnDb.ref(`games/${gameId}/leaderboard`).once("value");
  const val = snap.val() || {};
  const entries = Object.entries(val).map(([id,e])=>({id,...e})).sort((a,b)=>b.score-a.score);

  if(entries.length > 5){
    const toDelete = entries.slice(5);
    await Promise.all(toDelete.map(e => window.cnDb.ref(`games/${gameId}/leaderboard/${e.id}`).remove()));
  }

  const top5 = entries.slice(0, 5);
  const madeIt = top5.some(e => e.id === key);
  return {top5, madeIt};
}
};
</script>

// Canvas helper: draws a rounded-rectangle path (used by the dino + snake art below).
function roundRectPath(ctx,x,y,w,h,r){
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}

// ── Memory Match game ────────────────────────────────────────────────────────
const SYMBOL_POOL = ['🥷','🐉','⚡','🔥','🌟','💎','🎯','🚀','🎮','🧩','🏆','⚔️','🛡️','🎲','🔮','👾','🍀','🎧'];
function makeDeck(){
  const shuffledPool = [...SYMBOL_POOL].sort(()=>Math.random()-0.5).slice(0,8);
  const pairs = [...shuffledPool,...shuffledPool];
  const deck = pairs
    .map(sym=>({sym,r:Math.random()}))
    .sort((a,b)=>a.r-b.r)
    .map((c,i)=>({id:i,sym:c.sym,matched:false}));
  return deck;
}

function MemoryMatchGame({defaultName,onExit}){
  const MAX_HEARTS = 5;
  const PREVIEW_MS = 2000;
  const [hearts,setHearts]=useState(MAX_HEARTS);
  const [score,setScore]=useState(0);
  const [round,setRound]=useState(1);
  const [roundKey,setRoundKey]=useState(0);
  const [deck,setDeck]=useState(()=>makeDeck());
  const [flipped,setFlipped]=useState([]);
  const [locked,setLocked]=useState(false);
  const [previewing,setPreviewing]=useState(true);
  const [gameOver,setGameOver]=useState(false);
  const [shakeIdx,setShakeIdx]=useState([]);
  const [name,setName]=useState(defaultName||"");
  const [submitting,setSubmitting]=useState(false);
  const [submitted,setSubmitted]=useState(false);
  const [madeIt,setMadeIt]=useState(false);
  const [leaderboard,setLeaderboard]=useState(null);
  const timers=useRef([]);

  useEffect(()=>()=>{ timers.current.forEach(clearTimeout); },[]);

  // Briefly reveal the whole board at the start of every round so ninjas can memorize it,
  // then flip everything face-down and unlock play. Keyed off `roundKey` — a counter that
  // increments every time a fresh deck is dealt (new round, or Play Again) — rather than
  // `round` or `deck` directly, since `deck` also changes (new array reference) whenever a
  // correct match marks cards matched, and `round` can stay at 1 across a Play Again.
  useEffect(()=>{
    setPreviewing(true);
    setLocked(true);
    const t=setTimeout(()=>{
      setPreviewing(false);
      setLocked(false);
    },PREVIEW_MS);
    timers.current.push(t);
    return ()=>clearTimeout(t);
  },[roundKey]);

  useEffect(()=>{
    if(deck.length && deck.every(c=>c.matched)){
      const t=setTimeout(()=>{
        setScore(s=>s+200);
        setRound(r=>r+1);
        setDeck(makeDeck());
        setRoundKey(k=>k+1);
      },550);
      timers.current.push(t);
    }
  },[deck]);

  useEffect(()=>{
    if(gameOver){
      window.fbGames.getLeaderboard("memoryMatch").then(setLeaderboard).catch(()=>setLeaderboard([]));
    }
  },[gameOver]);

  function handleCardClick(idx){
    if(locked||gameOver) return;
    if(flipped.includes(idx)) return;
    if(deck[idx].matched) return;
    if(flipped.length>=2) return;
    const next=[...flipped,idx];
    setFlipped(next);
    if(next.length===2){
      setLocked(true);
      const [a,b]=next;
      if(deck[a].sym===deck[b].sym){
        const t=setTimeout(()=>{
          setDeck(prev=>prev.map((c,i)=>(i===a||i===b)?{...c,matched:true}:c));
          setScore(s=>s+100);
          setFlipped([]);
          setLocked(false);
        },450);
        timers.current.push(t);
      } else {
        setShakeIdx([a,b]);
        const t=setTimeout(()=>{
          setFlipped([]);
          setLocked(false);
          setShakeIdx([]);
          setHearts(h=>{
            const nh=h-1;
            if(nh<=0) setGameOver(true);
            return nh;
          });
        },700);
        timers.current.push(t);
      }
    }
  }

  async function saveScore(){
    if(!name.trim()||submitting||submitted) return;
    setSubmitting(true);
    try{
      const {top5,madeIt:mi} = await window.fbGames.submitScore("memoryMatch",name.trim(),score);
      setLeaderboard(top5);
      setMadeIt(mi);
      setSubmitted(true);
    } catch(e){ console.warn(e); }
    setSubmitting(false);
  }

  function playAgain(){
    setHearts(MAX_HEARTS);setScore(0);setRound(1);setDeck(makeDeck());setRoundKey(k=>k+1);
    setFlipped([]);setLocked(false);setGameOver(false);
    setSubmitted(false);setMadeIt(false);setLeaderboard(null);
  }

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {!gameOver?(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
            <div style={{display:"flex",gap:5}}>
              {Array.from({length:MAX_HEARTS}).map((_,i)=>(
                <span key={i} style={{fontSize:19,animation:hearts===i+1?"heartLose .3s ease":"none"}}>
                  {i<hearts?"❤️":"🖤"}
                </span>
              ))}
            </div>
            <div style={{display:"flex",gap:14,fontFamily:"'Fira Code',monospace",fontSize:12}}>
              <span style={{color:"rgba(255,255,255,0.4)"}}>ROUND <b style={{color:"#00cfff"}}>{round}</b></span>
              <span style={{color:"rgba(255,255,255,0.4)"}}>SCORE <b style={{color:"#39ff14"}}>{score}</b></span>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,flex:1,alignContent:"center"}}>
            {deck.map((card,idx)=>{
              const isUp = previewing||flipped.includes(idx)||card.matched;
              const isShaking = shakeIdx.includes(idx);
              return(
                <div key={card.id} onClick={()=>handleCardClick(idx)}
                  style={{
                    aspectRatio:"1",borderRadius:10,cursor:(card.matched||previewing)?"default":"pointer",
                    display:"flex",alignItems:"center",justifyContent:"center",fontSize:"clamp(20px,5vw,28px)",
                    userSelect:"none",transition:"transform .15s, background .2s, border-color .2s",
                    animation:isShaking?"shakeCard .4s ease":card.matched?"cardPop .3s ease":"none",
                    background:isUp?(card.matched?"rgba(57,255,20,0.15)":"rgba(0,207,255,0.15)"):"rgba(255,255,255,0.06)",
                    border:`1px solid ${isUp?(card.matched?"#39ff1455":"#00cfff55"):"rgba(255,255,255,0.15)"}`,
                    opacity:card.matched?0.55:1,
                    transform:isUp?"scale(1)":"scale(1)"
                  }}>
                  {isUp?card.sym:"❔"}
                </div>
              );
            })}
          </div>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:previewing?"#ffd700":"rgba(255,255,255,0.25)",textAlign:"center",marginTop:14}}>
            {previewing?"👀 Memorize the board...":"Match all pairs to advance — it never ends until you're out of hearts!"}
          </p>
        </>
      ):(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center",gap:6,overflowY:"auto"}}>
          <div style={{fontSize:40,marginBottom:4}}>💔</div>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:18,color:"#ff2d78"}}>GAME OVER</h3>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:10}}>
            Final Score: <b style={{color:"#39ff14"}}>{score}</b> · Reached Round {round}
          </p>

          {!submitted?(
            <div style={{width:"100%",maxWidth:280,marginBottom:18}}>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>SAVE YOUR SCORE</label>
              <div style={{display:"flex",gap:8}}>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" style={iStyle(false)}/>
                <button onClick={saveScore} disabled={!name.trim()||submitting}
                  style={{flexShrink:0,padding:"10px 16px",borderRadius:10,border:"none",
                    cursor:!name.trim()||submitting?"not-allowed":"pointer",
                    background:!name.trim()||submitting?"rgba(255,255,255,0.08)":"linear-gradient(135deg,#39ff14,#00cfff)",
                    color:!name.trim()||submitting?"rgba(255,255,255,0.3)":"#000",
                    fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
                  {submitting?<Spinner/>:"SAVE"}
                </button>
              </div>
            </div>
          ):(
            <p style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:madeIt?"#ffd700":"#39ff14",marginBottom:14}}>
              {madeIt?"🏆 New Top 5 Leaderboard Entry!":"✅ Score submitted!"}
            </p>
          )}

          <div style={{width:"100%",maxWidth:320}}>
            <h4 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"#ffd700",marginBottom:10,letterSpacing:1}}>🏆 TOP 5 — MEMORY MATCH</h4>
            {leaderboard===null?(
              <div style={{display:"flex",justifyContent:"center",padding:20}}><Spinner/></div>
            ):leaderboard.length===0?(
              <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.35)"}}>No scores yet — you could be first!</p>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {leaderboard.map((e,i)=>{
                  const isMe = submitted && e.name===name.trim() && e.score===score;
                  const medal = i===0?"👑":i===1?"🥈":i===2?"🥉":`#${i+1}`;
                  return(
                    <div key={e.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                      padding:"8px 12px",borderRadius:8,
                      background:isMe?"rgba(255,215,0,0.12)":"rgba(255,255,255,0.04)",
                      border:`1px solid ${isMe?"#ffd70066":"rgba(255,255,255,0.08)"}`}}>
                      <span style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,fontWeight:700,color:isMe?"#ffd700":"#fff"}}>{medal} {e.name}</span>
                      <span style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,fontWeight:700,color:"#39ff14"}}>{e.score}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div style={{display:"flex",gap:10,marginTop:20}}>
            <button onClick={playAgain}
              style={{padding:"10px 20px",borderRadius:10,border:"none",cursor:"pointer",
                background:"linear-gradient(135deg,#39ff14,#00cfff)",color:"#000",
                fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
              ↻ PLAY AGAIN
            </button>
            <button onClick={onExit}
              style={{padding:"10px 20px",borderRadius:10,border:"1px solid rgba(255,255,255,0.2)",cursor:"pointer",
                background:"rgba(255,255,255,0.05)",color:"rgba(255,255,255,0.6)",
                fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
              EXIT
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Dino Runner game (Chrome offline dino clone) ─────────────────────────────
function DinoGame({defaultName,onExit}){
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const stateRef = useRef({dinoY:0,velY:0,obstacles:[],speed:220,distance:0,spawnTimer:0,running:true});
  const [score,setScore]=useState(0);
  const [gameOver,setGameOver]=useState(false);
  const [name,setName]=useState(defaultName||"");
  const [submitting,setSubmitting]=useState(false);
  const [submitted,setSubmitted]=useState(false);
  const [madeIt,setMadeIt]=useState(false);
  const [leaderboard,setLeaderboard]=useState(null);

  const W=360,H=180;
  const GROUND_Y=H-30;
  const DINO_SIZE=28;
  const DINO_X=36;
  const GRAVITY=1900;
  const JUMP_V=-620;

  function reset(){
    stateRef.current={dinoY:GROUND_Y-DINO_SIZE,velY:0,obstacles:[],speed:220,distance:0,spawnTimer:0.8,running:true,legPhase:false,legTimer:0};
    setScore(0);setGameOver(false);setSubmitted(false);setMadeIt(false);setLeaderboard(null);
  }

  function jump(){
    const st=stateRef.current;
    if(!st.running) return;
    if(st.dinoY >= GROUND_Y-DINO_SIZE-1){
      st.velY = JUMP_V;
    }
  }

  // Draws an actual little dinosaur (not a plain square) — rounded body, tail,
  // head with snout + eye, back spikes, and two alternating running legs.
  function drawDino(ctx,x,y,w,h,airborne,legPhase){
    const body="#39ff14", shade="#1f8f0c", dark="#06110a";
    ctx.save();
    ctx.translate(x,y);
    ctx.shadowColor="#39ff14"; ctx.shadowBlur=6;

    // legs (drawn first so the body overlaps their tops)
    ctx.fillStyle=shade; ctx.shadowBlur=0;
    if(airborne){
      roundRectPath(ctx,w*0.16,h*0.74,w*0.16,h*0.26,2); ctx.fill();
      roundRectPath(ctx,w*0.46,h*0.74,w*0.16,h*0.26,2); ctx.fill();
    } else if(legPhase){
      roundRectPath(ctx,w*0.10,h*0.70,w*0.15,h*0.32,2); ctx.fill();
      roundRectPath(ctx,w*0.48,h*0.60,w*0.15,h*0.42,2); ctx.fill();
    } else {
      roundRectPath(ctx,w*0.10,h*0.60,w*0.15,h*0.42,2); ctx.fill();
      roundRectPath(ctx,w*0.48,h*0.70,w*0.15,h*0.32,2); ctx.fill();
    }

    // tail, curving back and slightly up
    ctx.fillStyle=body; ctx.shadowColor="#39ff14"; ctx.shadowBlur=6;
    ctx.beginPath();
    ctx.moveTo(w*0.02,h*0.5);
    ctx.quadraticCurveTo(-w*0.28,h*0.42,-w*0.34,h*0.22);
    ctx.quadraticCurveTo(-w*0.2,h*0.5,w*0.05,h*0.62);
    ctx.closePath(); ctx.fill();

    // body
    roundRectPath(ctx,w*0.02,h*0.18,w*0.66,h*0.56,h*0.16); ctx.fill();

    // back spikes
    ctx.fillStyle=shade; ctx.shadowBlur=0;
    for(let i=0;i<3;i++){
      const bx=w*0.14+i*w*0.15;
      ctx.beginPath();
      ctx.moveTo(bx,h*0.2); ctx.lineTo(bx+w*0.06,h*0.04); ctx.lineTo(bx+w*0.12,h*0.2);
      ctx.closePath(); ctx.fill();
    }

    // small arm
    ctx.fillStyle=shade;
    roundRectPath(ctx,w*0.38,h*0.5,w*0.1,h*0.16,2); ctx.fill();

    // head + snout
    ctx.fillStyle=body; ctx.shadowColor="#39ff14"; ctx.shadowBlur=6;
    ctx.beginPath();
    ctx.ellipse(w*0.72,h*0.2,w*0.26,h*0.22,0,0,Math.PI*2); ctx.fill();
    roundRectPath(ctx,w*0.88,h*0.06,w*0.22,h*0.2,3); ctx.fill();

    // eye + mouth line
    ctx.shadowBlur=0;
    ctx.fillStyle=dark;
    ctx.beginPath(); ctx.arc(w*0.82,h*0.12,Math.max(1.3,w*0.045),0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=dark; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(w*0.9,h*0.24); ctx.lineTo(w*1.08,h*0.24); ctx.stroke();

    ctx.restore();
  }

  // Draws a cactus with one arm instead of a flat rectangle.
  function drawCactus(ctx,x,groundY,w,h){
    const green="#0fbf5c", dark="#0a7a3a";
    ctx.save();
    ctx.fillStyle=green;
    roundRectPath(ctx,x,groundY-h,w,h,w*0.3); ctx.fill();
    const armH=h*0.32;
    roundRectPath(ctx,x-w*0.65,groundY-h*0.62,w*0.65,armH*0.55,w*0.25); ctx.fill();
    roundRectPath(ctx,x-w*0.65,groundY-h*0.62-armH*0.55,w*0.5,armH,w*0.25); ctx.fill();
    if(w>18){
      roundRectPath(ctx,x+w,groundY-h*0.78,w*0.55,armH*0.5,w*0.25); ctx.fill();
      roundRectPath(ctx,x+w+w*0.15,groundY-h*0.78-armH*0.6,w*0.4,armH*0.9,w*0.25); ctx.fill();
    }
    ctx.strokeStyle=dark; ctx.lineWidth=1;
    for(let i=0;i<3;i++){
      ctx.beginPath(); ctx.moveTo(x+w*0.2+i*w*0.3,groundY-h*0.9); ctx.lineTo(x+w*0.2+i*w*0.3,groundY-h*0.1); ctx.stroke();
    }
    ctx.restore();
  }

  useEffect(()=>{
    reset();
    let last = performance.now();
    let acc = 0;
    function draw(){
      const canvas=canvasRef.current; if(!canvas) return;
      const ctx=canvas.getContext("2d");
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle="rgba(255,255,255,0.25)";
      ctx.beginPath();ctx.moveTo(0,GROUND_Y+1);ctx.lineTo(W,GROUND_Y+1);ctx.stroke();
      const st=stateRef.current;
      const airborne = st.dinoY < GROUND_Y-DINO_SIZE-1;
      drawDino(ctx,DINO_X,st.dinoY,DINO_SIZE,DINO_SIZE,airborne,st.legPhase);
      st.obstacles.forEach(o=>{ drawCactus(ctx,o.x,GROUND_Y,o.w,o.h); });
    }
    function loop(now){
      const dt=Math.min(0.033,(now-last)/1000);
      last=now;
      const st=stateRef.current;
      if(st.running){
        st.velY += GRAVITY*dt;
        st.dinoY += st.velY*dt;
        if(st.dinoY > GROUND_Y-DINO_SIZE){ st.dinoY = GROUND_Y-DINO_SIZE; st.velY = 0; }
        st.distance += st.speed*dt;
        st.speed = 220 + Math.min(260, st.distance*0.02);

        // toggle running-leg animation faster as the dino speeds up
        st.legTimer += dt;
        const legInterval = Math.max(0.09, 0.22 - st.distance*0.00002);
        if(st.legTimer >= legInterval){ st.legTimer=0; st.legPhase=!st.legPhase; }

        st.spawnTimer -= dt;
        if(st.spawnTimer<=0){
          const h = 22+Math.random()*20;
          st.obstacles.push({x:W, w:14+Math.random()*10, h});
          st.spawnTimer = Math.max(0.5, 1.1 - Math.min(0.55, st.distance*0.00006) + Math.random()*0.6);
        }
        st.obstacles.forEach(o=>{ o.x -= st.speed*dt; });
        st.obstacles = st.obstacles.filter(o=>o.x+o.w>-5);

        const dinoRect = {x:DINO_X+4,y:st.dinoY+4,w:DINO_SIZE-8,h:DINO_SIZE-8};
        for(const o of st.obstacles){
          const oRect={x:o.x,y:GROUND_Y-o.h,w:o.w,h:o.h};
          if(dinoRect.x < oRect.x+oRect.w && dinoRect.x+dinoRect.w > oRect.x &&
             dinoRect.y < oRect.y+oRect.h && dinoRect.y+dinoRect.h > oRect.y){
            st.running=false;
            setGameOver(true);
          }
        }
        acc+=dt;
        if(acc>0.1){ acc=0; setScore(Math.floor(st.distance/5)); }
      }
      draw();
      rafRef.current = requestAnimationFrame(loop);
    }
    rafRef.current = requestAnimationFrame(loop);
    return ()=>cancelAnimationFrame(rafRef.current);
  },[]);

  useEffect(()=>{
    function onKey(e){ if(e.code==="Space"||e.code==="ArrowUp"){ e.preventDefault(); jump(); } }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[]);

  useEffect(()=>{
    if(gameOver){
      window.fbGames.getLeaderboard("dino").then(setLeaderboard).catch(()=>setLeaderboard([]));
    }
  },[gameOver]);

  async function saveScore(){
    if(!name.trim()||submitting||submitted) return;
    setSubmitting(true);
    try{
      const {top5,madeIt:mi} = await window.fbGames.submitScore("dino",name.trim(),score);
      setLeaderboard(top5);
      setMadeIt(mi);
      setSubmitted(true);
    } catch(e){ console.warn(e); }
    setSubmitting(false);
  }

  function playAgain(){ reset(); }

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {!gameOver?(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.4)"}}>TAP / CLICK / SPACE TO JUMP</span>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"#39ff14"}}>SCORE <b>{score}</b></span>
          </div>
          <div onClick={jump} onTouchStart={e=>{e.preventDefault();jump();}}
            style={{borderRadius:10,overflow:"hidden",border:"1px solid rgba(255,255,255,0.15)",
              background:"rgba(255,255,255,0.03)",cursor:"pointer",touchAction:"none"}}>
            <canvas ref={canvasRef} width={W} height={H} style={{display:"block",width:"100%",height:"auto"}}/>
          </div>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.25)",textAlign:"center",marginTop:10}}>
            Jump the cacti — it speeds up the longer you survive!
          </p>
        </>
      ):(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center",gap:6,overflowY:"auto"}}>
          <div style={{fontSize:40,marginBottom:4}}>🦖💥</div>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:18,color:"#ff2d78"}}>GAME OVER</h3>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:10}}>
            Final Score: <b style={{color:"#39ff14"}}>{score}</b>
          </p>

          {!submitted?(
            <div style={{width:"100%",maxWidth:280,marginBottom:18}}>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>SAVE YOUR SCORE</label>
              <div style={{display:"flex",gap:8}}>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" style={iStyle(false)}/>
                <button onClick={saveScore} disabled={!name.trim()||submitting}
                  style={{flexShrink:0,padding:"10px 16px",borderRadius:10,border:"none",
                    cursor:!name.trim()||submitting?"not-allowed":"pointer",
                    background:!name.trim()||submitting?"rgba(255,255,255,0.08)":"linear-gradient(135deg,#39ff14,#00cfff)",
                    color:!name.trim()||submitting?"rgba(255,255,255,0.3)":"#000",
                    fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
                  {submitting?<Spinner/>:"SAVE"}
                </button>
              </div>
            </div>
          ):(
            <p style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:madeIt?"#ffd700":"#39ff14",marginBottom:14}}>
              {madeIt?"🏆 New Top 5 Leaderboard Entry!":"✅ Score submitted!"}
            </p>
          )}

          <div style={{width:"100%",maxWidth:320}}>
            <h4 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"#ffd700",marginBottom:10,letterSpacing:1}}>🏆 TOP 5 — DINO RUNNER</h4>
            {leaderboard===null?(
              <div style={{display:"flex",justifyContent:"center",padding:20}}><Spinner/></div>
            ):leaderboard.length===0?(
              <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.35)"}}>No scores yet — you could be first!</p>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {leaderboard.map((e,i)=>{
                  const isMe = submitted && e.name===name.trim() && e.score===score;
                  const medal = i===0?"👑":i===1?"🥈":i===2?"🥉":`#${i+1}`;
                  return(
                    <div key={e.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                      padding:"8px 12px",borderRadius:8,
                      background:isMe?"rgba(255,215,0,0.12)":"rgba(255,255,255,0.04)",
                      border:`1px solid ${isMe?"#ffd70066":"rgba(255,255,255,0.08)"}`}}>
                      <span style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,fontWeight:700,color:isMe?"#ffd700":"#fff"}}>{medal} {e.name}</span>
                      <span style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,fontWeight:700,color:"#39ff14"}}>{e.score}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div style={{display:"flex",gap:10,marginTop:20}}>
            <button onClick={playAgain}
              style={{padding:"10px 20px",borderRadius:10,border:"none",cursor:"pointer",
                background:"linear-gradient(135deg,#39ff14,#00cfff)",color:"#000",
                fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
              ↻ PLAY AGAIN
            </button>
            <button onClick={onExit}
              style={{padding:"10px 20px",borderRadius:10,border:"1px solid rgba(255,255,255,0.2)",cursor:"pointer",
                background:"rgba(255,255,255,0.05)",color:"rgba(255,255,255,0.6)",
                fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
              EXIT
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Snake game ────────────────────────────────────────────────────────────
// Drawn as an actual snake (segmented, tapering body, distinct head with
// eyes + a flicking tongue) and a real little apple for food — not plain
// colored squares.
function SnakeGame({defaultName,onExit}){
  const CELL=15, COLS=20, ROWS=20;
  const W=CELL*COLS, H=CELL*ROWS;
  const canvasRef=useRef(null);
  const rafRef=useRef(null);
  const stateRef=useRef(null);
  const [score,setScore]=useState(0);
  const [gameOver,setGameOver]=useState(false);
  const [name,setName]=useState(defaultName||"");
  const [submitting,setSubmitting]=useState(false);
  const [submitted,setSubmitted]=useState(false);
  const [madeIt,setMadeIt]=useState(false);
  const [leaderboard,setLeaderboard]=useState(null);

  function randCell(exclude){
    let c;
    do{ c={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}; }
    while(exclude.some(s=>s.x===c.x&&s.y===c.y));
    return c;
  }

  function reset(){
    const startSnake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    stateRef.current={
      snake:startSnake, dir:{x:1,y:0}, nextDir:{x:1,y:0},
      food:randCell(startSnake), tickMs:150, acc:0,
      tongueTimer:0, tongueOut:false, running:true
    };
    setScore(0); setGameOver(false); setSubmitted(false); setMadeIt(false); setLeaderboard(null);
  }

  function setDirection(dx,dy){
    const st=stateRef.current; if(!st||!st.running) return;
    // ignore reversing straight into the snake's own neck — check against
    // whatever direction is already queued for the next tick, not just the
    // last-committed one, so two quick key presses in the same tick can't
    // sneak a reversal through.
    if(st.nextDir.x===-dx && st.nextDir.y===-dy) return;
    st.nextDir={x:dx,y:dy};
  }

  function drawApple(ctx,cx,cy,r){
    ctx.save();
    ctx.fillStyle="#ff2d3d";
    ctx.beginPath(); ctx.arc(cx,cy+r*0.1,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#7a4a1e"; ctx.lineWidth=Math.max(1,r*0.25);
    ctx.beginPath(); ctx.moveTo(cx,cy-r*0.9); ctx.lineTo(cx+r*0.15,cy-r*1.5); ctx.stroke();
    ctx.fillStyle="#39ff14";
    ctx.beginPath();
    ctx.ellipse(cx+r*0.55,cy-r*1.15,r*0.5,r*0.28,-0.5,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawSnake(ctx,snake,dir,tongueOut){
    const n=snake.length;
    // body, tail-to-head so the head is drawn last (on top)
    for(let i=n-1;i>=0;i--){
      const seg=snake[i];
      const isHead=i===0;
      const tailFrac = i>=n-2 ? (n-1-i)/2 : 1; // 0 = very tip of tail, 1 = normal size
      const size = CELL*(isHead?0.92:0.8+0.14*tailFrac);
      const off=(CELL-size)/2;
      const cx=seg.x*CELL+off, cy=seg.y*CELL+off;
      const scaleShade = i%2===0;
      const green = isHead ? "#39ff14" : (scaleShade?"#2fe010":"#1f9a0d");
      ctx.save();
      ctx.fillStyle=green;
      if(isHead){ ctx.shadowColor="#39ff14"; ctx.shadowBlur=6; }
      roundRectPath(ctx,cx,cy,size,size,size*0.4);
      ctx.fill();
      ctx.restore();
    }
    // head details: eyes + tongue, oriented with travel direction
    const head=snake[0];
    const hx=head.x*CELL+CELL/2, hy=head.y*CELL+CELL/2;
    const ex = dir.x*CELL*0.18, ey = dir.y*CELL*0.18;
    const perpX = -dir.y*CELL*0.22, perpY = dir.x*CELL*0.22;
    ctx.fillStyle="#06110a";
    ctx.beginPath(); ctx.arc(hx+ex+perpX, hy+ey+perpY, CELL*0.09, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+ex-perpX, hy+ey-perpY, CELL*0.09, 0, Math.PI*2); ctx.fill();
    if(tongueOut){
      const tx=hx+dir.x*CELL*0.62, ty=hy+dir.y*CELL*0.62;
      const forkX=dir.y*CELL*0.12, forkY=dir.x*CELL*0.12;
      ctx.strokeStyle="#ff2d78"; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(hx+dir.x*CELL*0.46,hy+dir.y*CELL*0.46); ctx.lineTo(tx,ty); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx+dir.x*CELL*0.14+forkX, ty+dir.y*CELL*0.14+forkY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx+dir.x*CELL*0.14-forkX, ty+dir.y*CELL*0.14-forkY); ctx.stroke();
    }
  }

  useEffect(()=>{
    reset();
    let last=performance.now();
    function draw(){
      const canvas=canvasRef.current; if(!canvas) return;
      const ctx=canvas.getContext("2d");
      const st=stateRef.current;
      ctx.clearRect(0,0,W,H);
      // subtle checkerboard field so the grid reads clearly
      for(let y=0;y<ROWS;y++){
        for(let x=0;x<COLS;x++){
          ctx.fillStyle=(x+y)%2===0?"rgba(255,255,255,0.02)":"rgba(255,255,255,0.045)";
          ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
        }
      }
      drawApple(ctx, st.food.x*CELL+CELL/2, st.food.y*CELL+CELL/2, CELL*0.32);
      drawSnake(ctx, st.snake, st.dir, st.tongueOut);
    }
    function loop(now){
      const dt=now-last; last=now;
      const st=stateRef.current;
      if(st.running){
        st.tongueTimer+=dt;
        if(st.tongueTimer>1400){ st.tongueOut=true; }
        if(st.tongueTimer>1650){ st.tongueOut=false; st.tongueTimer=0; }

        st.acc+=dt;
        if(st.acc>=st.tickMs){
          st.acc=0;
          st.dir=st.nextDir;
          const head=st.snake[0];
          const newHead={x:head.x+st.dir.x, y:head.y+st.dir.y};
          const hitWall = newHead.x<0||newHead.x>=COLS||newHead.y<0||newHead.y>=ROWS;
          const hitSelf = st.snake.some(s=>s.x===newHead.x&&s.y===newHead.y);
          if(hitWall||hitSelf){
            st.running=false;
            setGameOver(true);
          } else {
            st.snake.unshift(newHead);
            if(newHead.x===st.food.x && newHead.y===st.food.y){
              st.food=randCell(st.snake);
              st.tickMs=Math.max(70, st.tickMs-3);
              setScore(s=>s+10);
            } else {
              st.snake.pop();
            }
          }
        }
      }
      draw();
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
    return ()=>cancelAnimationFrame(rafRef.current);
  },[]);

  useEffect(()=>{
    function onKey(e){
      const map={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
        KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]};

      if(d){ e.preventDefault(); setDirection(d[0],d[1]); }
    }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);

          </div>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.25)",textAlign:"center",marginTop:6}}>
            Eat apples to grow — don't hit the walls or yourself!

// ── Minesweeper (endless) ────────────────────────────────────────────────
// Classic reveal-the-safe-tiles mechanic: +20 points per safe tile cleared,
// touching a mine ends the run instantly. Clearing a whole board rolls
// straight into a fresh, slightly harder one — no "you win" screen, it just
// keeps going (endless) until a mine is hit.
function MinesweeperGame({defaultName,onExit}){
  const ROWS=9, COLS=9, CELL=28, BASE_MINES=16;

  function mineCountForLevel(lv){ return Math.min(30, BASE_MINES + (lv-1)*3); }
  function makeEmptyBoard(){
    return Array.from({length:ROWS},()=>Array.from({length:COLS},()=>({mine:false,revealed:false,flagged:false,adj:0})));
  }

  const [level,setLevel]=useState(1);
  const [board,setBoard]=useState(()=>makeEmptyBoard());
  const [placed,setPlaced]=useState(false);
  const [score,setScore]=useState(0);
  const [gameOver,setGameOver]=useState(false);
  const [flagMode,setFlagMode]=useState(false);
  const [name,setName]=useState(defaultName||"");
  const [submitting,setSubmitting]=useState(false);
  const [submitted,setSubmitted]=useState(false);
  const [madeIt,setMadeIt]=useState(false);
  const [leaderboard,setLeaderboard]=useState(null);

  function resetGame(){
    setLevel(1); setBoard(makeEmptyBoard()); setPlaced(false); setScore(0); setGameOver(false);
    setSubmitted(false); setMadeIt(false); setLeaderboard(null);
  }
  function nextLevel(fromLevel){
    setLevel(fromLevel+1); setBoard(makeEmptyBoard()); setPlaced(false);
  }

  function placeMinesAvoiding(b, er, ec, lv){
    const forbidden = new Set();
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const rr=er+dr, cc=ec+dc;
      if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS) forbidden.add(rr+"_"+cc);
    }
    const count = mineCountForLevel(lv);
    const nb = b.map(row=>row.map(c=>({...c})));
    let placedCount=0, guard=0;
    while(placedCount<count && guard<5000){
      guard++;
      const r=Math.floor(Math.random()*ROWS), c=Math.floor(Math.random()*COLS);
      if(forbidden.has(r+"_"+c) || nb[r][c].mine) continue;
      nb[r][c].mine=true; placedCount++;
    }
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      if(nb[r][c].mine){ nb[r][c].adj=-1; continue; }
      let n=0;
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
        const rr=r+dr, cc=c+dc;
        if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS&&nb[rr][cc].mine) n++;
      }
      nb[r][c].adj=n;
    }
    return nb;
  }

  function floodReveal(b, sr, sc){
    const nb = b.map(row=>row.map(c=>({...c})));
    const stack=[[sr,sc]]; const seen=new Set(); let revealedCount=0;
    while(stack.length){
      const [r,c]=stack.pop();
      const key=r+"_"+c;
      if(seen.has(key)) continue;
      seen.add(key);
      if(r<0||r>=ROWS||c<0||c>=COLS) continue;
      const cell=nb[r][c];
      if(cell.revealed||cell.flagged||cell.mine) continue;
      cell.revealed=true; revealedCount++;
      if(cell.adj===0){
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
          if(dr!==0||dc!==0) stack.push([r+dr,c+dc]);
        }
      }
    }
    return {board:nb, revealedCount};
  }

  function handleReveal(r,c){
    if(gameOver) return;
    if(board[r][c].flagged) return;
    let curBoard = board;
    if(!placed){
      curBoard = placeMinesAvoiding(board, r, c, level);
      setPlaced(true);
    }
    if(curBoard[r][c].mine){
      const revealedAll = curBoard.map(row=>row.map(cc=>cc.mine?{...cc,revealed:true,hit:cc===curBoard[r][c]}:cc));
      // mark the exact tile that was touched so it renders distinctly
      const finalBoard = revealedAll.map((row,ri)=>row.map((cc,ci)=>({...cc, hit: ri===r&&ci===c})));
      setBoard(finalBoard);
      setGameOver(true);
      return;
    }
    const {board:afterReveal, revealedCount} = floodReveal(curBoard, r, c);
    setBoard(afterReveal);
    setScore(s=>s+revealedCount*20);
    const cleared = afterReveal.every(row=>row.every(cc=>cc.mine||cc.revealed));
    if(cleared){
      const lv=level;
      setTimeout(()=>nextLevel(lv),550);
    }
  }

  function handleFlag(r,c,e){
    if(e) e.preventDefault();
    if(gameOver) return;
    setBoard(b=>{
      const nb=b.map(row=>row.map(cc=>({...cc})));
      const cell=nb[r][c];
      if(!cell.revealed) cell.flagged=!cell.flagged;
      return nb;
    });
  }

  function onCellClick(r,c){ flagMode ? handleFlag(r,c) : handleReveal(r,c); }

  useEffect(()=>{
    if(gameOver){
      window.fbGames.getLeaderboard("minesweeper").then(setLeaderboard).catch(()=>setLeaderboard([]));
    }
  },[gameOver]);

  async function saveScore(){
    if(!name.trim()||submitting||submitted) return;
    setSubmitting(true);
    try{
      const {top5,madeIt:mi} = await window.fbGames.submitScore("minesweeper",name.trim(),score);
      setLeaderboard(top5);
      setMadeIt(mi);
      setSubmitted(true);
    } catch(e){ console.warn(e); }
    setSubmitting(false);
  }

  const numColors={1:"#5ea1ff",2:"#39ff14",3:"#ff5252",4:"#c26bff",5:"#ffab40",6:"#2ce6d9",7:"#fff",8:"#9aa0a6"};
  const flagsPlaced = board.flat().filter(c=>c.flagged).length;
  const minesLeft = Math.max(0, mineCountForLevel(level)-flagsPlaced);

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {!gameOver?(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,flexWrap:"wrap",gap:6}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.4)"}}>LEVEL {level} · 💣 {minesLeft} LEFT</span>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"#39ff14"}}>SCORE <b>{score}</b></span>
          </div>
          <div style={{display:"flex",justifyContent:"center",marginBottom:10}}>
            <button onClick={()=>setFlagMode(f=>!f)}
              style={{padding:"7px 16px",borderRadius:99,border:`1px solid ${flagMode?"#ffd700aa":"rgba(255,255,255,0.15)"}`,
                background:flagMode?"rgba(255,215,0,0.15)":"rgba(255,255,255,0.05)",
                color:flagMode?"#ffd700":"rgba(255,255,255,0.6)",cursor:"pointer",
                fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:10,letterSpacing:1}}>
              {flagMode?"🚩 FLAG MODE ON":"👆 TAP TO FLAG INSTEAD"}
            </button>
          </div>
          <div style={{alignSelf:"center",display:"grid",gridTemplateColumns:`repeat(${COLS},${CELL}px)`,gridTemplateRows:`repeat(${ROWS},${CELL}px)`,
            gap:2,padding:6,borderRadius:10,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.12)"}}>
            {board.map((row,r)=>row.map((cell,c)=>{
              const isNum = cell.revealed && !cell.mine && cell.adj>0;
              return(
                <button key={r+"_"+c} onClick={()=>onCellClick(r,c)} onContextMenu={(e)=>handleFlag(r,c,e)}
                  style={{width:CELL,height:CELL,borderRadius:5,cursor:"pointer",
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontFamily:"'Orbitron',sans-serif",fontWeight:800,fontSize:12,
                    border:cell.revealed?"1px solid rgba(255,255,255,0.06)":"1px solid rgba(255,255,255,0.18)",
                    background:cell.revealed?(cell.mine?"rgba(255,45,120,0.25)":"rgba(255,255,255,0.03)"):"rgba(255,255,255,0.09)",
                    color:isNum?numColors[cell.adj]:"#fff"}}>
                  {cell.revealed
                    ? (cell.mine ? "💣" : (cell.adj>0?cell.adj:""))
                    : (cell.flagged ? "🚩" : "")}
                </button>
              );
            }))}
          </div>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.25)",textAlign:"center",marginTop:10}}>
            Tap a tile to clear it (+20 pts). Right-click, or toggle Flag Mode, to mark suspected mines.
          </p>
        </>
      ):(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center",gap:6,overflowY:"auto"}}>
          <div style={{fontSize:40,marginBottom:4}}>💥🚩</div>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:18,color:"#ff2d78"}}>GAME OVER</h3>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:10}}>
            Final Score: <b style={{color:"#39ff14"}}>{score}</b> · Reached Level {level}
          </p>

          {!submitted?(
            <div style={{width:"100%",maxWidth:280,marginBottom:18}}>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>SAVE YOUR SCORE</label>
              <div style={{display:"flex",gap:8}}>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" style={iStyle(false)}/>
                <button onClick={saveScore} disabled={!name.trim()||submitting}
                  style={{flexShrink:0,padding:"10px 16px",borderRadius:10,border:"none",
                    cursor:!name.trim()||submitting?"not-allowed":"pointer",
                    background:!name.trim()||submitting?"rgba(255,255,255,0.08)":"linear-gradient(135deg,#39ff14,#00cfff)",
                    color:!name.trim()||submitting?"rgba(255,255,255,0.3)":"#000",
                    fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
                  {submitting?<Spinner/>:"SAVE"}
                </button>
              </div>
            </div>
          ):(
            <p style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:madeIt?"#ffd700":"#39ff14",marginBottom:14}}>
              {madeIt?"🏆 New Top 5 Leaderboard Entry!":"✅ Score submitted!"}
            </p>
          )}

          <div style={{width:"100%",maxWidth:320}}>
            <h4 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"#ffd700",marginBottom:10,letterSpacing:1}}>🏆 TOP 5 — MINESWEEPER</h4>
            {leaderboard===null?(
              <div style={{display:"flex",justifyContent:"center",padding:20}}><Spinner/></div>
            ):leaderboard.length===0?(
              <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.35)"}}>No scores yet — you could be first!</p>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {leaderboard.map((e,i)=>{
                  const isMe = submitted && e.name===name.trim() && e.score===score;
                  const medal = i===0?"👑":i===1?"🥈":i===2?"🥉":`#${i+1}`;
                  return(
                    <div key={e.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                      padding:"8px 12px",borderRadius:8,
                      background:isMe?"rgba(255,215,0,0.12)":"rgba(255,255,255,0.04)",
                      border:`1px solid ${isMe?"#ffd70066":"rgba(255,255,255,0.08)"}`}}>
                      <span style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,fontWeight:700,color:isMe?"#ffd700":"#fff"}}>{medal} {e.name}</span>
                      <span style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,fontWeight:700,color:"#39ff14"}}>{e.score}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div style={{display:"flex",gap:10,marginTop:20}}>
            <button onClick={resetGame}
              style={{padding:"10px 20px",borderRadius:10,border:"none",cursor:"pointer",
                background:"linear-gradient(135deg,#39ff14,#00cfff)",color:"#000",
                fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
              ↻ PLAY AGAIN
            </button>
            <button onClick={onExit}
              style={{padding:"10px 20px",borderRadius:10,border:"1px solid rgba(255,255,255,0.2)",cursor:"pointer",
                background:"rgba(255,255,255,0.05)",color:"rgba(255,255,255,0.6)",

          </div>
        </div>

              const medal = i===0?"👑":i===1?"🥈":i===2?"🥉":`#${i+1}`;
              return(
                <div key={e.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                  padding:"8px 12px",borderRadius:8,
                  background:isMe?"rgba(255,215,0,0.12)":"rgba(255,255,255,0.04)",
                  border:`1px solid ${isMe?"#ffd70066":"rgba(255,255,255,0.08)"}`}}>
                  <span style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,fontWeight:700,color:isMe?"#ffd700":"#fff"}}>{medal} {e.name}</span>
                  <span style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,fontWeight:700,color:"#39ff14"}}>{e.score}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div style={{display:"flex",gap:10,marginTop:20}}>
        <button onClick={onPlayAgain}
          style={{padding:"10px 20px",borderRadius:10,border:"none",cursor:"pointer",
            background:"linear-gradient(135deg,#39ff14,#00cfff)",color:"#000",
            fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
          ↻ PLAY AGAIN
        </button>
        <button onClick={onExit}
          style={{padding:"10px 20px",borderRadius:10,border:"1px solid rgba(255,255,255,0.2)",cursor:"pointer",
            background:"rgba(255,255,255,0.05)",color:"rgba(255,255,255,0.6)",
            fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
          EXIT
        </button>
      </div>
    </div>
  );
}
// Handles the "gameOver -> fetch leaderboard -> optionally save score" flow
// shared by every game below. resetFlow() is called from each game's own
// playAgain() alongside its own board/state reset.
function useGameOverFlow(gameId, gameOver, score, defaultName){
  const [name,setName]=useState(defaultName||"");
  const [submitting,setSubmitting]=useState(false);
  const [submitted,setSubmitted]=useState(false);
  const [madeIt,setMadeIt]=useState(false);
  const [leaderboard,setLeaderboard]=useState(null);

  useEffect(()=>{
    if(gameOver){
      window.fbGames.getLeaderboard(gameId).then(setLeaderboard).catch(()=>setLeaderboard([]));
    }
  },[gameOver]);

  async function saveScore(){
    if(!name.trim()||submitting||submitted) return;
    setSubmitting(true);
    try{
      const {top5,madeIt:mi} = await window.fbGames.submitScore(gameId,name.trim(),score);
      setLeaderboard(top5);
      setMadeIt(mi);
      setSubmitted(true);
    } catch(e){ console.warn(e); }
    setSubmitting(false);
  }

  function resetFlow(){ setSubmitted(false); setMadeIt(false); setLeaderboard(null); }

  return {name,setName,submitting,submitted,madeIt,leaderboard,saveScore,resetFlow};
}

// ── Flappy Ninja ─────────────────────────────────────────────────────────
function FlappyGame({defaultName,onExit}){
  const canvasRef=useRef(null);
  const rafRef=useRef(null);
  const stateRef=useRef(null);
  const [score,setScore]=useState(0);
  const [gameOver,setGameOver]=useState(false);
  const gof=useGameOverFlow("flappy",gameOver,score,defaultName);

  const W=300,H=360;
  const BIRD_X=64, BIRD_R=13;
  const GRAVITY=1500, FLAP_V=-420;
  const GAP=110, PIPE_W=46;

  function reset(){
    stateRef.current={birdY:H/2,velY:0,pipes:[],spawnTimer:0.5,speed:150,running:true,started:false};
    setScore(0); setGameOver(false);
  }
  function playAgain(){ reset(); gof.resetFlow(); }

  function flap(){
    const st=stateRef.current; if(!st||!st.running) return;
    st.started=true;
    st.velY=FLAP_V;
  }

  useEffect(()=>{
    reset();
    let last=performance.now();
    function draw(){
      const canvas=canvasRef.current; if(!canvas) return;
      const ctx=canvas.getContext("2d");
      const st=stateRef.current;
      const grad=ctx.createLinearGradient(0,0,0,H);
      grad.addColorStop(0,"#0a1a2a"); grad.addColorStop(1,"#06121f");
      ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
      st.pipes.forEach(p=>{
        ctx.fillStyle="#0fbf5c"; ctx.strokeStyle="#0a7a3a"; ctx.lineWidth=2;
        roundRectPath(ctx,p.x,0,PIPE_W,Math.max(0,p.gapY-GAP/2),4); ctx.fill(); ctx.stroke();
        roundRectPath(ctx,p.x,p.gapY+GAP/2,PIPE_W,H-(p.gapY+GAP/2),4); ctx.fill(); ctx.stroke();
      });
      ctx.save();
      ctx.translate(BIRD_X,st.birdY);
      const angle=Math.max(-0.5,Math.min(0.9,st.velY/700));
      ctx.rotate(angle);
      ctx.fillStyle="#39ff14"; ctx.shadowColor="#39ff14"; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(0,0,BIRD_R,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle="#ff2d78";
      ctx.fillRect(-BIRD_R,-BIRD_R*0.35,BIRD_R*2,BIRD_R*0.5);
      ctx.fillStyle="#06110a";
      ctx.beginPath(); ctx.arc(BIRD_R*0.4,-BIRD_R*0.2,2.5,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    function loop(now){
      const dt=Math.min(0.033,(now-last)/1000); last=now;
      const st=stateRef.current;
      if(st.running && st.started){
        st.velY+=GRAVITY*dt;
        st.birdY+=st.velY*dt;
        st.spawnTimer-=dt;
        if(st.spawnTimer<=0){
          st.pipes.push({x:W,gapY:70+Math.random()*(H-140),scored:false});
          st.spawnTimer=1.6;
        }
        st.pipes.forEach(p=>{ p.x-=st.speed*dt; });
        st.pipes=st.pipes.filter(p=>p.x>-PIPE_W-5);
        st.pipes.forEach(p=>{
          if(!p.scored && p.x+PIPE_W<BIRD_X){ p.scored=true; setScore(s=>s+1); }
        });
        if(st.birdY-BIRD_R<0 || st.birdY+BIRD_R>H){ st.running=false; setGameOver(true); }
        for(const p of st.pipes){
          if(BIRD_X+BIRD_R>p.x && BIRD_X-BIRD_R<p.x+PIPE_W){
            if(st.birdY-BIRD_R<p.gapY-GAP/2 || st.birdY+BIRD_R>p.gapY+GAP/2){
              st.running=false; setGameOver(true);
            }
          }
        }
      }
      draw();
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
    return ()=>cancelAnimationFrame(rafRef.current);
  },[]);

  useEffect(()=>{
    function onKey(e){ if(e.code==="Space"||e.code==="ArrowUp"){ e.preventDefault(); flap(); } }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[]);

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {!gameOver?(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.4)"}}>TAP / CLICK / SPACE TO FLAP</span>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"#39ff14"}}>SCORE <b>{score}</b></span>
          </div>
          <div onClick={flap} onTouchStart={e=>{e.preventDefault();flap();}}
            style={{borderRadius:10,overflow:"hidden",border:"1px solid rgba(255,255,255,0.15)",
              background:"rgba(255,255,255,0.03)",cursor:"pointer",touchAction:"none",alignSelf:"center"}}>
            <canvas ref={canvasRef} width={W} height={H} style={{display:"block",width:"min(100%,280px)",height:"auto"}}/>
          </div>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.25)",textAlign:"center",marginTop:10}}>
            Flap through the gaps — one hit and it's over!
          </p>
        </>
      ):(
        <GameOverPanel emoji="🥷💥" scoreLabel={<>Final Score: <b style={{color:"#39ff14"}}>{score}</b></>}
          gameLabel="FLAPPY NINJA"
          name={gof.name} setName={gof.setName} submitting={gof.submitting} submitted={gof.submitted}
          madeIt={gof.madeIt} leaderboard={gof.leaderboard} onSave={gof.saveScore}
          onPlayAgain={playAgain} onExit={onExit}/>
      )}
    </div>
  );
}

// ── 2048 ─────────────────────────────────────────────────────────────────
function make2048Board(){
  const board=Array.from({length:4},()=>Array(4).fill(0));
  spawn2048(board); spawn2048(board);
  return board;
}
function spawn2048(board){
  const empty=[];
  for(let r=0;r<4;r++)for(let c=0;c<4;c++) if(board[r][c]===0) empty.push([r,c]);
  if(empty.length===0) return false;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  board[r][c]=Math.random()<0.9?2:4;
  return true;
}
function slideAndMergeLine(line){
  const nums=line.filter(v=>v!==0);
  const merged=[]; let gained=0;
  for(let i=0;i<nums.length;i++){
    if(i<nums.length-1 && nums[i]===nums[i+1]){
      const val=nums[i]*2; merged.push(val); gained+=val; i++;
    } else merged.push(nums[i]);
  }
  while(merged.length<4) merged.push(0);
  const moved=merged.some((v,i)=>v!==line[i]);
  return {line:merged,gained,moved};
}
function move2048(board,dir){
  let newBoard=board.map(row=>[...row]);
  let totalGained=0, anyMoved=false;
  function getLine(i,axis){ return axis==="row" ? newBoard[i] : [0,1,2,3].map(r=>newBoard[r][i]); }
  function setLine(i,axis,line){
    if(axis==="row") newBoard[i]=line;
    else [0,1,2,3].forEach(r=>{ newBoard[r][i]=line[r]; });
  }
  const axis=(dir==="left"||dir==="right")?"row":"col";
  for(let i=0;i<4;i++){
    let line=getLine(i,axis);
    const reversed=(dir==="right"||dir==="down");
    if(reversed) line=[...line].reverse();
    const {line:newLine,gained,moved}=slideAndMergeLine(line);
    const finalLine=reversed?[...newLine].reverse():newLine;
    setLine(i,axis,finalLine);
    totalGained+=gained;
    if(moved) anyMoved=true;
  }
  return {board:newBoard,gained:totalGained,moved:anyMoved};
}
function has2048Moves(board){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    if(board[r][c]===0) return true;
    if(c<3 && board[r][c]===board[r][c+1]) return true;
    if(r<3 && board[r][c]===board[r+1][c]) return true;
  }
  return false;
}
const TILE_COLORS_2048={
  2:"#3a3f4a",4:"#454b57",8:"#ff8c42",16:"#ff6b35",32:"#ff4d4d",64:"#ff2d78",
  128:"#ffd23f",256:"#ffc107",512:"#39ff14",1024:"#00cfff",2048:"#c26bff"
};
function Game2048({defaultName,onExit}){
  const [board,setBoard]=useState(()=>make2048Board());
  const [score,setScore]=useState(0);
  const [gameOver,setGameOver]=useState(false);
  const gof=useGameOverFlow("game2048",gameOver,score,defaultName);

  function reset(){ setBoard(make2048Board()); setScore(0); setGameOver(false); }
  function playAgain(){ reset(); gof.resetFlow(); }

  function handleMove(dir){
    if(gameOver) return;
    setBoard(prev=>{
      const {board:nb,gained,moved}=move2048(prev,dir);
      if(!moved) return prev;
      spawn2048(nb);
      setScore(s=>s+gained);
      if(!has2048Moves(nb)) setGameOver(true);
      return nb;
    });
  }

  useEffect(()=>{
    function onKey(e){
      const map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",
        KeyA:"left",KeyD:"right",KeyW:"up",KeyS:"down"};
      const d=map[e.code];
      if(d){ e.preventDefault(); handleMove(d); }
    }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[gameOver]);

  const touchRef=useRef(null);
  function onTouchStart(e){ const t=e.touches[0]; touchRef.current={x:t.clientX,y:t.clientY}; }
  function onTouchEnd(e){
    const start=touchRef.current; if(!start) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-start.x, dy=t.clientY-start.y;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24) return;
    if(Math.abs(dx)>Math.abs(dy)) handleMove(dx>0?"right":"left");
    else handleMove(dy>0?"down":"up");
  }

  function DirBtn({label,dir}){
    return(
      <button onClick={()=>handleMove(dir)} style={{width:38,height:38,borderRadius:9,
        border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.06)",color:"#39ff14",
        fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{label}</button>
    );
  }

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {!gameOver?(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.4)"}}>ARROWS / WASD / SWIPE</span>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"#39ff14"}}>SCORE <b>{score}</b></span>
          </div>
          <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
            style={{alignSelf:"center",display:"grid",gridTemplateColumns:"repeat(4,60px)",gridTemplateRows:"repeat(4,60px)",
            gap:6,padding:8,borderRadius:10,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.12)",touchAction:"none"}}>
            {board.map((row,r)=>row.map((v,c)=>(
              <div key={r+"_"+c} style={{width:60,height:60,borderRadius:7,
                display:"flex",alignItems:"center",justifyContent:"center",
                background:v?(TILE_COLORS_2048[v]||"#c26bff"):"rgba(255,255,255,0.05)",
                boxShadow:v?"0 0 10px rgba(57,255,20,0.15)":"none",
                fontFamily:"'Orbitron',sans-serif",fontWeight:800,
                fontSize:v>=1024?14:v>=128?16:18,
                color:v<=4?"rgba(255,255,255,0.8)":"#06110a"}}>
                {v||""}
              </div>
            )))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"38px 38px 38px",gridTemplateRows:"38px 38px 38px",
            gap:6,justifyContent:"center",margin:"14px 0 4px"}}>
            <div/><DirBtn label="▲" dir="up"/><div/>
            <DirBtn label="◀" dir="left"/><div/><DirBtn label="▶" dir="right"/>
            <div/><DirBtn label="▼" dir="down"/><div/>
          </div>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.25)",textAlign:"center",marginTop:6}}>
            Slide tiles to merge matching numbers — reach 2048 (or just keep going)!
          </p>
        </>
      ):(
        <GameOverPanel emoji="🔢💥" scoreLabel={<>Final Score: <b style={{color:"#39ff14"}}>{score}</b></>}
          gameLabel="2048"
          name={gof.name} setName={gof.setName} submitting={gof.submitting} submitted={gof.submitted}
          madeIt={gof.madeIt} leaderboard={gof.leaderboard} onSave={gof.saveScore}
          onPlayAgain={playAgain} onExit={onExit}/>
      )}
    </div>
  );
}

// ── Whack-a-Ninja ────────────────────────────────────────────────────────
function WhackAMoleGame({defaultName,onExit}){
  const GRID=9, GAME_SECONDS=30, MAX_UP=3;
  const stateRef=useRef(null);
  const [holesView,setHolesView]=useState(Array(GRID).fill(false));
  const [score,setScore]=useState(0);
  const [timeLeft,setTimeLeft]=useState(GAME_SECONDS);
  const [gameOver,setGameOver]=useState(false);
  const gof=useGameOverFlow("whack",gameOver,score,defaultName);
  const intervalRef=useRef(null);
  const startRef=useRef(0);

  function reset(){
    stateRef.current={holes:Array(GRID).fill(null).map(()=>({up:false,upAt:0,dur:0}))};
    setHolesView(Array(GRID).fill(false));
    setScore(0); setTimeLeft(GAME_SECONDS); setGameOver(false);
  }
  function playAgain(){ clearInterval(intervalRef.current); reset(); startGameLoop(); gof.resetFlow(); }

  function startGameLoop(){
    startRef.current=Date.now();
    intervalRef.current=setInterval(()=>{
      const now=Date.now();
      const st=stateRef.current;
      const elapsed=(now-startRef.current)/1000;
      const remain=Math.max(0,Math.ceil(GAME_SECONDS-elapsed));
      setTimeLeft(remain);
      if(remain<=0){
        clearInterval(intervalRef.current);
        setGameOver(true);
        return;
      }
      let upCount=0;
      st.holes.forEach(h=>{
        if(h.up){
          if(now-h.upAt>h.dur) h.up=false; else upCount++;
        }
      });
      if(upCount<MAX_UP && Math.random()<0.35){
        const downIdxs=st.holes.map((h,i)=>h.up?-1:i).filter(i=>i>=0);
        if(downIdxs.length){
          const idx=downIdxs[Math.floor(Math.random()*downIdxs.length)];
          st.holes[idx]={up:true,upAt:now,dur:600+Math.random()*500};
        }
      }
      setHolesView(st.holes.map(h=>h.up));
    },120);
  }

  useEffect(()=>{
    reset();
    startGameLoop();
    return ()=>clearInterval(intervalRef.current);
  },[]);

  function whack(i){
    if(gameOver) return;
    const st=stateRef.current;
    if(st.holes[i].up){
      st.holes[i].up=false;
      setHolesView(st.holes.map(h=>h.up));
      setScore(s=>s+10);
    }
  }

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {!gameOver?(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.4)"}}>TAP THE NINJAS</span>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"#ff8c42"}}>⏱ {timeLeft}s</span>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"#39ff14"}}>SCORE <b>{score}</b></span>
          </div>
          <div style={{alignSelf:"center",display:"grid",gridTemplateColumns:"repeat(3,70px)",gridTemplateRows:"repeat(3,70px)",
            gap:8,padding:10,borderRadius:12,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.12)"}}>
            {holesView.map((up,i)=>(
              <button key={i} onClick={()=>whack(i)}
                style={{width:70,height:70,borderRadius:"50%",cursor:"pointer",
                  border:"1px solid rgba(255,255,255,0.15)",
                  background:up?"radial-gradient(circle,#39ff14,#1f8f0c)":"rgba(255,255,255,0.05)",
                  fontSize:28,display:"flex",alignItems:"center",justifyContent:"center",
                  transition:"transform .08s",transform:up?"scale(1.05)":"scale(1)",
                  boxShadow:up?"0 0 16px rgba(57,255,20,0.4)":"none"}}>
                {up?"🥷":""}
              </button>
            ))}
          </div>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.25)",textAlign:"center",marginTop:10}}>
            Tap ninjas the instant they pop up — 10 points each, {GAME_SECONDS}s on the clock!
          </p>
        </>
      ):(
        <GameOverPanel emoji="🥷⏱️" scoreLabel={<>Final Score: <b style={{color:"#39ff14"}}>{score}</b></>}
          gameLabel="WHACK-A-NINJA"
          name={gof.name} setName={gof.setName} submitting={gof.submitting} submitted={gof.submitted}
          madeIt={gof.madeIt} leaderboard={gof.leaderboard} onSave={gof.saveScore}
          onPlayAgain={playAgain} onExit={onExit}/>
      )}
    </div>
  );
}

// ── Brick Breaker ────────────────────────────────────────────────────────
function BreakoutGame({defaultName,onExit}){
  const canvasRef=useRef(null);
  const rafRef=useRef(null);
  const stateRef=useRef(null);
  const [score,setScore]=useState(0);
  const [lives,setLives]=useState(3);
  const [gameOver,setGameOver]=useState(false);
  const gof=useGameOverFlow("breakout",gameOver,score,defaultName);

  const W=280,H=320;
  const PADDLE_W=54,PADDLE_H=9,PADDLE_Y=H-18;
  const BALL_R=5;
  const ROWS=5,COLS=8,BRICK_W=30,BRICK_H=11,BRICK_GAP=3,BRICK_TOP=26;
  const COLORS=["#ff2d78","#ff8c42","#ffd700","#39ff14","#00cfff"];

  function makeBricks(){
    const bricks=[];
    const totalW=COLS*(BRICK_W+BRICK_GAP)-BRICK_GAP;
    const startX=(W-totalW)/2;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      bricks.push({x:startX+c*(BRICK_W+BRICK_GAP),y:BRICK_TOP+r*(BRICK_H+BRICK_GAP),alive:true,color:COLORS[r%COLORS.length]});
    }
    return bricks;
  }

  function reset(){
    stateRef.current={
      paddleX:(W-PADDLE_W)/2, ballX:W/2, ballY:PADDLE_Y-BALL_R-2, ballVX:140, ballVY:-210,
      bricks:makeBricks(), running:true, launched:false
    };
    setScore(0); setLives(3); setGameOver(false);
  }
  function playAgain(){ reset(); gof.resetFlow(); }

  function movePaddleTo(px){
    const st=stateRef.current; if(!st) return;
    st.paddleX=Math.max(0,Math.min(W-PADDLE_W,px-PADDLE_W/2));
  }
  function launch(){ const st=stateRef.current; if(st && st.running && !st.launched){ st.launched=true; } }

  useEffect(()=>{
    reset();
    let last=performance.now();
    function draw(){
      const canvas=canvasRef.current; if(!canvas) return;
      const ctx=canvas.getContext("2d");
      const st=stateRef.current;
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle="rgba(255,255,255,0.02)"; ctx.fillRect(0,0,W,H);
      st.bricks.forEach(b=>{
        if(!b.alive) return;
        ctx.fillStyle=b.color; ctx.shadowColor=b.color; ctx.shadowBlur=4;
        roundRectPath(ctx,b.x,b.y,BRICK_W,BRICK_H,2); ctx.fill();
      });
      ctx.shadowBlur=0;
      ctx.fillStyle="#00cfff"; ctx.shadowColor="#00cfff"; ctx.shadowBlur=6;
      roundRectPath(ctx,st.paddleX,PADDLE_Y,PADDLE_W,PADDLE_H,4); ctx.fill();
      ctx.shadowBlur=8; ctx.fillStyle="#39ff14"; ctx.shadowColor="#39ff14";
      ctx.beginPath(); ctx.arc(st.ballX,st.ballY,BALL_R,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
    function loop(now){
      const dt=Math.min(0.02,(now-last)/1000); last=now;
      const st=stateRef.current;
      if(st.running){
        if(!st.launched){
          st.ballX=st.paddleX+PADDLE_W/2;
        } else {
          st.ballX+=st.ballVX*dt; st.ballY+=st.ballVY*dt;
          if(st.ballX-BALL_R<0){ st.ballX=BALL_R; st.ballVX*=-1; }
          if(st.ballX+BALL_R>W){ st.ballX=W-BALL_R; st.ballVX*=-1; }
          if(st.ballY-BALL_R<0){ st.ballY=BALL_R; st.ballVY*=-1; }
          if(st.ballY+BALL_R>=PADDLE_Y && st.ballY+BALL_R<=PADDLE_Y+PADDLE_H+6 &&
             st.ballX>=st.paddleX && st.ballX<=st.paddleX+PADDLE_W && st.ballVY>0){
            const hitPos=(st.ballX-(st.paddleX+PADDLE_W/2))/(PADDLE_W/2);
            st.ballVY=-Math.abs(st.ballVY);
            st.ballVX=hitPos*210;
          }
          for(const b of st.bricks){
            if(!b.alive) continue;
            if(st.ballX+BALL_R>b.x && st.ballX-BALL_R<b.x+BRICK_W &&
               st.ballY+BALL_R>b.y && st.ballY-BALL_R<b.y+BRICK_H){
              b.alive=false;
              st.ballVY*=-1;
              setScore(s=>s+15);
              break;
            }
          }
          if(st.bricks.every(b=>!b.alive)){
            st.bricks=makeBricks();
            st.ballVX*=1.08; st.ballVY*=1.08;
          }
          if(st.ballY-BALL_R>H){
            st.launched=false;
            setLives(l=>{
              const nl=l-1;
              if(nl<=0){ st.running=false; setGameOver(true); }
              else { st.ballVX=140*(Math.random()<0.5?1:-1); st.ballVY=-210; }
              return nl;
            });
          }
        }
      }
      draw();
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
    return ()=>cancelAnimationFrame(rafRef.current);
  },[]);

  useEffect(()=>{
    function onKey(e){
      const st=stateRef.current; if(!st) return;
      if(e.code==="ArrowLeft"||e.code==="KeyA"){ st.paddleX=Math.max(0,st.paddleX-24); }
      else if(e.code==="ArrowRight"||e.code==="KeyD"){ st.paddleX=Math.min(W-PADDLE_W,st.paddleX+24); }
      else if(e.code==="Space"){ e.preventDefault(); launch(); }
    }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[]);

  function onPointerMove(e){
    const canvas=canvasRef.current; if(!canvas) return;
    const rect=canvas.getBoundingClientRect();
    const clientX=e.touches?e.touches[0].clientX:e.clientX;
    movePaddleTo((clientX-rect.left)*(W/rect.width));
  }

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {!gameOver?(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.4)"}}>DRAG · TAP TO LAUNCH</span>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"#ff2d78"}}>❤️ {lives}</span>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"#39ff14"}}>SCORE <b>{score}</b></span>
          </div>
          <div onMouseMove={onPointerMove} onTouchMove={e=>{e.preventDefault();onPointerMove(e);}}
            onClick={launch} onTouchStart={e=>{e.preventDefault();onPointerMove(e);launch();}}
            style={{borderRadius:10,overflow:"hidden",border:"1px solid rgba(255,255,255,0.15)",
              background:"rgba(255,255,255,0.03)",cursor:"pointer",touchAction:"none",alignSelf:"center"}}>
            <canvas ref={canvasRef} width={W} height={H} style={{display:"block",width:"min(100%,260px)",height:"auto"}}/>
          </div>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.25)",textAlign:"center",marginTop:10}}>
            Move the paddle to keep the ball alive — clear every brick to level up!
          </p>
        </>
      ):(
        <GameOverPanel emoji="🧱💥" scoreLabel={<>Final Score: <b style={{color:"#39ff14"}}>{score}</b></>}
          gameLabel="BRICK BREAKER"
          name={gof.name} setName={gof.setName} submitting={gof.submitting} submitted={gof.submitted}
          madeIt={gof.madeIt} leaderboard={gof.leaderboard} onSave={gof.saveScore}
          onPlayAgain={playAgain} onExit={onExit}/>
      )}
    </div>
  );
}

// ── Lane Rush 3D ─────────────────────────────────────────────────────────
// A pseudo-3D lane runner: a perspective road drawn on a 2D canvas, with
// obstacles scaling up as they approach — gives a 3D look/feel without
// needing a WebGL/three.js dependency on the page.
function LaneRushGame({defaultName,onExit}){
  const canvasRef=useRef(null);
  const rafRef=useRef(null);
  const stateRef=useRef(null);
  const [score,setScore]=useState(0);
  const [gameOver,setGameOver]=useState(false);
  const gof=useGameOverFlow("lanerush",gameOver,score,defaultName);

  const W=280,H=340;
  const HORIZON_Y=64;
  const LANES=3;
  const ROAD_TOP_W=36, ROAD_BOTTOM_W=250;

  function laneCenterAt(lane,z){
    const roadW=ROAD_TOP_W+(ROAD_BOTTOM_W-ROAD_TOP_W)*z;
    const left=W/2-roadW/2;
    const laneW=roadW/LANES;
    return left+laneW*(lane+0.5);
  }
  function roadYAt(z){ return HORIZON_Y+(H-HORIZON_Y)*z; }

  function reset(){
    stateRef.current={playerLane:1,obstacles:[],speed:0.32,spawnTimer:0.9,running:true,dist:0};
    setScore(0); setGameOver(false);
  }
  function playAgain(){ reset(); gof.resetFlow(); }

  function moveLane(delta){
    const st=stateRef.current; if(!st||!st.running) return;
    st.playerLane=Math.max(0,Math.min(LANES-1,st.playerLane+delta));
  }

  useEffect(()=>{
    reset();
    let last=performance.now();
    function draw(){
      const canvas=canvasRef.current; if(!canvas) return;
      const ctx=canvas.getContext("2d");
      const st=stateRef.current;
      const sky=ctx.createLinearGradient(0,0,0,HORIZON_Y);
      sky.addColorStop(0,"#120a26"); sky.addColorStop(1,"#2a1750");
      ctx.fillStyle=sky; ctx.fillRect(0,0,W,HORIZON_Y);
      ctx.fillStyle="#151522";
      ctx.beginPath();
      ctx.moveTo(W/2-ROAD_TOP_W/2,HORIZON_Y);
      ctx.lineTo(W/2+ROAD_TOP_W/2,HORIZON_Y);
      ctx.lineTo(W/2+ROAD_BOTTOM_W/2,H);
      ctx.lineTo(W/2-ROAD_BOTTOM_W/2,H);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle="rgba(0,207,255,0.35)"; ctx.lineWidth=1;
      for(let l=1;l<LANES;l++){
        ctx.beginPath();
        ctx.moveTo(laneCenterAt(l-0.5,0),HORIZON_Y);
        ctx.lineTo(laneCenterAt(l-0.5,1),H);
        ctx.stroke();
      }
      [...st.obstacles].sort((a,b)=>a.z-b.z).forEach(o=>{
        const cx=laneCenterAt(o.lane,o.z), cy=roadYAt(o.z);
        const size=8+o.z*32;
        ctx.save();
        ctx.fillStyle="#ff2d78"; ctx.shadowColor="#ff2d78"; ctx.shadowBlur=6;
        roundRectPath(ctx,cx-size/2,cy-size/2,size,size,size*0.2); ctx.fill();
        ctx.restore();
      });
      const pcx=laneCenterAt(st.playerLane,1), pcy=H-22;
      ctx.save();
      ctx.fillStyle="#39ff14"; ctx.shadowColor="#39ff14"; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(pcx,pcy,14,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle="#ff2d78";
      ctx.fillRect(pcx-14,pcy-5,28,7);
      ctx.restore();
    }
    function loop(now){
      const dt=Math.min(0.033,(now-last)/1000); last=now;
      const st=stateRef.current;
      if(st.running){
        st.dist+=dt;
        st.speed=0.32+Math.min(0.35,st.dist*0.006);
        st.spawnTimer-=dt;
        if(st.spawnTimer<=0){
          st.obstacles.push({lane:Math.floor(Math.random()*LANES),z:0});
          st.spawnTimer=Math.max(0.45,0.95-Math.min(0.5,st.dist*0.01)+Math.random()*0.35);
        }
        st.obstacles.forEach(o=>{ o.z+=st.speed*dt; });
        for(const o of st.obstacles){
          if(o.z>=0.93 && o.z<1.05 && o.lane===st.playerLane && !o.passed){
            o.passed=true; st.running=false; setGameOver(true);
          }
        }
        st.obstacles.forEach(o=>{
          if(o.z>=1.05 && !o.scored){ o.scored=true; setScore(s=>s+5); }
        });
        st.obstacles=st.obstacles.filter(o=>o.z<1.2);
      }
      draw();
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
    return ()=>cancelAnimationFrame(rafRef.current);
  },[]);

  useEffect(()=>{
    function onKey(e){
      if(e.code==="ArrowLeft"||e.code==="KeyA"){ e.preventDefault(); moveLane(-1); }
      else if(e.code==="ArrowRight"||e.code==="KeyD"){ e.preventDefault(); moveLane(1); }
    }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[]);

  const touchRef=useRef(null);
  function onTouchStart(e){ const t=e.touches[0]; touchRef.current={x:t.clientX}; }
  function onTouchEnd(e){
    const start=touchRef.current; if(!start) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-start.x;
    if(Math.abs(dx)>30) moveLane(dx>0?1:-1);
  }

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {!gameOver?(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.4)"}}>ARROWS / SWIPE TO DODGE</span>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"#39ff14"}}>SCORE <b>{score}</b></span>
          </div>
          <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
            style={{borderRadius:10,overflow:"hidden",border:"1px solid rgba(255,255,255,0.15)",
              background:"rgba(255,255,255,0.03)",touchAction:"none",alignSelf:"center"}}>
            <canvas ref={canvasRef} width={W} height={H} style={{display:"block",width:"min(100%,260px)",height:"auto"}}/>
          </div>
          <div style={{display:"flex",gap:10,justifyContent:"center",margin:"12px 0 4px"}}>
            <button onClick={()=>moveLane(-1)} style={{width:60,height:38,borderRadius:9,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.06)",color:"#39ff14",fontSize:16,cursor:"pointer"}}>◀</button>
            <button onClick={()=>moveLane(1)} style={{width:60,height:38,borderRadius:9,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.06)",color:"#39ff14",fontSize:16,cursor:"pointer"}}>▶</button>
          </div>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.25)",textAlign:"center",marginTop:6}}>
            Switch lanes to dodge incoming blocks — it speeds up the longer you survive!
          </p>
        </>
      ):(
        <GameOverPanel emoji="🛣️💥" scoreLabel={<>Final Score: <b style={{color:"#39ff14"}}>{score}</b></>}
          gameLabel="LANE RUSH 3D"
          name={gof.name} setName={gof.setName} submitting={gof.submitting} submitted={gof.submitted}
          madeIt={gof.madeIt} leaderboard={gof.leaderboard} onSave={gof.saveScore}
          onPlayAgain={playAgain} onExit={onExit}/>
      )}
    </div>
  );
}

function GameModal({gameId,initialMode,defaultName,onClose,isAdmin}){
  // Admins can browse leaderboards/instructions, but can never actually
  // play — if an admin somehow lands on "play" (e.g. stale initialMode),
  // bump them to the leaderboard instead.
  const [mode,setMode]=useState((isAdmin && initialMode==="play")?"leaderboard":initialMode); // 'play' | 'leaderboard' | 'instructions'
  useEffect(()=>{
    function onKey(e){ if(e.key==="Escape") onClose(); }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[]);
  const meta = GAME_META[gameId] || {title:"Game",icon:"🎮",leaderboardId:gameId,steps:[]};
  const goPlay = ()=>{ if(!isAdmin) setMode("play"); };
  return ReactDOM.createPortal(
    <div style={{position:"fixed",inset:0,zIndex:500,background:"rgba(2,2,6,0.85)",backdropFilter:"blur(6px)",
      display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <Glass style={{width:"100%",maxWidth:460,maxHeight:"88vh",padding:"22px",position:"relative",
        display:"flex",flexDirection:"column",animation:"popIn .25s ease",borderColor:"#39ff1433",
        boxShadow:"0 0 60px rgba(57,255,20,0.15),0 20px 60px rgba(0,0,0,0.6)"}}>
        <button onClick={onClose}
          style={{position:"absolute",top:14,right:14,background:"rgba(255,255,255,0.08)",
            border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,color:"#fff",
            width:30,height:30,cursor:"pointer",fontSize:15,zIndex:2}}>✕</button>
        <div style={{marginBottom:16}}>
          <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:15,color:"#fff",margin:0}}>{meta.icon} {meta.title}</h2>
        </div>
        <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column"}}>
          {mode==="leaderboard"
            ?<LeaderboardOnly gameId={meta.leaderboardId} title={meta.title} onPlay={goPlay} canPlay={!isAdmin}/>
            :mode==="instructions"
              ?<InstructionsView icon={meta.icon} title={meta.title} steps={meta.steps||[]} onPlay={goPlay} canPlay={!isAdmin}/>
