                ?(
                  <div style={{display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center",gap:12,padding:"30px 10px"}}>
                    <div style={{fontSize:36}}>🔐</div>
                    <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:15,color:"#ff2d78"}}>Admins can't play the games</h3>
                    <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:13,color:"rgba(255,255,255,0.4)",maxWidth:300}}>
                      You can still check out the leaderboard and instructions from up top.
                    </p>
                  </div>
                )
                :gameId==="dino"
                  ?<DinoGame defaultName={defaultName} onExit={onClose}/>
                  :gameId==="snake"
                    ?<SnakeGame defaultName={defaultName} onExit={onClose}/>
                    :gameId==="minesweeper"
                      ?<MinesweeperGame defaultName={defaultName} onExit={onClose}/>
                      :gameId==="flappy"
                        ?<FlappyGame defaultName={defaultName} onExit={onClose}/>
                        :gameId==="game2048"
                          ?<Game2048 defaultName={defaultName} onExit={onClose}/>
                          :gameId==="whack"
                            ?<WhackAMoleGame defaultName={defaultName} onExit={onClose}/>
                            :gameId==="breakout"
                              ?<BreakoutGame defaultName={defaultName} onExit={onClose}/>
                              :gameId==="lanerush"
                                ?<LaneRushGame defaultName={defaultName} onExit={onClose}/>
                                :<MemoryMatchGame defaultName={defaultName} onExit={onClose}/>
          }
        </div>
      </Glass>
    </div>,
    document.body
  );
}

// ── Game hub ─────────────────────────────────────────────────────────────────
const GAMES_LIST = [
  {id:"memory",name:"Memory Match",icon:"🧠",desc:"Flip cards, find pairs, don't run out of hearts.",active:true},
  {id:"dino",name:"Dino Runner",icon:"🦖",desc:"Jump the cacti in this classic offline runner.",active:true},
  {id:"snake",name:"Snake",icon:"🐍",desc:"Eat apples, grow longer, don't hit the walls or yourself!",active:true},
  {id:"minesweeper",name:"Minesweeper",icon:"💣",desc:"Clear safe tiles for points — one wrong tap ends it instantly!",active:true},
  {id:"flappy",name:"Flappy Ninja",icon:"🥷",desc:"Flap through the gaps — one hit and it's over!",active:true},
  {id:"game2048",name:"2048",icon:"🔢",desc:"Slide and merge tiles to reach 2048 (and beyond).",active:true},
  {id:"whack",name:"Whack-a-Ninja",icon:"🥷",desc:"Tap ninjas the instant they pop up — 30 seconds on the clock!",active:true},
  {id:"breakout",name:"Brick Breaker",icon:"🧱",desc:"Bounce the ball, break every brick, don't lose your lives.",active:true},
  {id:"lanerush",name:"Lane Rush 3D",icon:"🛣️",desc:"Dodge down a 3D perspective road — how far can you go?",active:true},
];

function GamesTab({isAdmin,studentUsername}){
  const [modal,setModal]=useState(null); // {gameId, mode}
  const [breakData,setBreakData]=useState(null);
  const [nowTick,setNowTick]=useState(Date.now());

  // Live-listen for this student's break flag (set from "Start Break" on In The Dojo)
  // so ending it (or it expiring) is reflected instantly.
  useEffect(()=>{
    if(!studentUsername) return;
    const unsubscribe = window.fbGames.watchStudentBreak(studentUsername, setBreakData);
    return unsubscribe;
  },[studentUsername]);

  // Ticks every 5s so a break that hits its duration auto-locks even with no new Firebase write.
  useEffect(()=>{
    const iv=setInterval(()=>setNowTick(Date.now()),5000);
    return ()=>clearInterval(iv);
  },[]);

  const myBreakOn = window.cnIsBreakActive(breakData);
  const locked = !isAdmin && !myBreakOn;
  const remainingMs = (myBreakOn && breakData&&breakData.startedAt) ? Math.max(0,(breakData.startedAt+window.cnBreakDurationMs(breakData))-nowTick) : 0;
  const remainingLabel = remainingMs>0 ? `${Math.floor(remainingMs/60000)}:${String(Math.floor((remainingMs%60000)/1000)).padStart(2,"0")}` : null;

  // If a break ends (manually stopped, or it expires) while a game is open, close it and lock immediately.
  useEffect(()=>{
    if(locked && modal){ setModal(null); }
  },[locked]);

  return(
    <div style={{padding:"clamp(16px,3vw,28px) clamp(14px,3vw,36px)",animation:"fadeUp .4s ease both"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8,flexWrap:"wrap"}}>
        <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:"clamp(15px,2vw,22px)",color:"#fff",margin:0,
          background:"linear-gradient(135deg,#ff2d78,#ffd700)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
          🎮 Break Time Games
        </h2>
        {!isAdmin&&studentUsername&&(
          <div style={{padding:"4px 12px",borderRadius:99,
            background:myBreakOn?"rgba(57,255,20,0.12)":"rgba(255,255,255,0.05)",
            border:`1px solid ${myBreakOn?"#39ff1444":"rgba(255,255,255,0.1)"}`,
            fontFamily:"'Fira Code',monospace",fontSize:9,color:myBreakOn?"#39ff14":"rgba(255,255,255,0.35)"}}>
            {myBreakOn?`🥷 YOUR BREAK IS ON · ${remainingLabel}`:"⏳ WAITING FOR YOUR BREAK"}
          </div>
        )}
      </div>
      <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.35)",marginBottom:20}}>
        {isAdmin
          ? "Admins can browse leaderboards and instructions here, but can't play — games are for ninjas on break!"
          : "Games unlock only during your break — ask your Sensei to start it from \"In The Dojo\"!"}
      </p>

      {locked?(
        <Glass style={{padding:44,textAlign:"center",borderColor:"rgba(255,45,120,0.25)"}}>
          <div style={{fontSize:42,marginBottom:12}}>🔒</div>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:15,color:"#ff2d78",marginBottom:8}}>Games are locked right now</h3>
          <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:13,color:"rgba(255,255,255,0.4)"}}>
            Ask your Sensei to start your break time on "In The Dojo" to unlock the games!
          </p>
        </Glass>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:18}}>
          {GAMES_LIST.map((g,i)=>(
            <Glass key={g.id} style={{padding:20,borderColor:g.active?"rgba(57,255,20,0.2)":"rgba(255,255,255,0.06)",
              opacity:g.active?1:0.75,animation:`fadeUp .35s ease both ${i*.06}s`}}>
              <div style={{fontSize:34,marginBottom:10}}>{g.icon}</div>
              <div style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:15,color:"#fff",marginBottom:6}}>{g.name}</div>
              <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.35)",marginBottom:16,lineHeight:1.5,minHeight:30}}>
                {g.desc}
              </p>
              {g.active?(
                <div style={{display:"flex",gap:6}}>
                  {!isAdmin&&(
                    <button onClick={()=>setModal({gameId:g.id,mode:"play"})}
                      style={{flex:1,padding:"9px 6px",borderRadius:9,border:"none",cursor:"pointer",
                        background:"linear-gradient(135deg,#39ff14,#00cfff)",color:"#000",
                        fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:10.5}}>▶ PLAY</button>
                  )}
                  <button onClick={()=>setModal({gameId:g.id,mode:"leaderboard"})}
                    style={{flex:isAdmin?1:undefined,flexShrink:isAdmin?undefined:0,padding:"9px 10px",borderRadius:9,border:"1px solid #ffd70044",cursor:"pointer",
                      background:"rgba(255,215,0,0.1)",color:"#ffd700",
                      fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>🏆{isAdmin?" Leaderboard":""}</button>
                  <button onClick={()=>setModal({gameId:g.id,mode:"instructions"})}
                    style={{flex:isAdmin?1:undefined,flexShrink:isAdmin?undefined:0,padding:"9px 10px",borderRadius:9,border:"1px solid #00cfff44",cursor:"pointer",
                      background:"rgba(0,207,255,0.1)",color:"#00cfff",
                      fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>📖{isAdmin?" How to Play":""}</button>
                </div>
              ):(
                <button onClick={()=>setModal({gameId:g.id,mode:"play"})}
                  style={{width:"100%",padding:"9px",borderRadius:9,textAlign:"center",background:"rgba(255,255,255,0.05)",
                    border:"1px solid rgba(255,255,255,0.1)",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)"}}>
                  🚧 Coming Soon
                </button>
              )}
            </Glass>
          ))}
        </div>
      )}

      {modal&&(
        <GameModal gameId={modal.gameId} initialMode={modal.mode} defaultName={studentUsername||""} onClose={()=>setModal(null)} isAdmin={isAdmin}/>
      )}
    </div>
  );
}

function GamesApp(){
  const {auth,ready} = window.useCnAuth();
  const isMobile=useIsMobile();

  if(!auth) return <LoadingScreen status="Loading arcade..."/>;
  const isAdmin=auth.role==="admin", isStudent=auth.role==="student";

  return(
    <>
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",
        background:"radial-gradient(ellipse 60% 50% at 80% 20%,rgba(57,255,20,0.06) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(0,207,255,0.07) 0%,transparent 70%),#060609"}}/>
      <div style={{display:"flex",flexDirection:isMobile?"column":"row",minHeight:"100vh",position:"relative",zIndex:1,width:"100%"}}>
        {isMobile
          ?<MobileNav active="games" isAdmin={isAdmin} isStudent={isStudent} studentUsername={auth.username}/>
          :<Sidebar active="games" isAdmin={isAdmin} isStudent={isStudent} studentUsername={auth.username}/>
        }
        <div style={{flex:1,overflowY:"auto",...(isMobile?{}:{height:"100vh"})}}>
          <GamesTab isAdmin={isAdmin} studentUsername={auth.username}/>
        </div>
      </div>
      <TourOverlay/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GamesApp/>);
</script>
</body>
