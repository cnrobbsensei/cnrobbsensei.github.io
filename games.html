<script>
// Games-specific Firebase helpers (per-game leaderboards). Break flags and
// the cnKeySafe/cnIsBreakActive helpers now live in shared.js.
window.fbGames = {
  // Live-watches this student's break flag (set from the "Start Break" button on the
  // In The Dojo page) and fires the callback immediately whenever it changes, so a
  // Sensei ending a break instantly kicks the student out of whatever game they're in.
  watchStudentBreak(username, callback){
    if(!username) return ()=>{};
    const ref = window.cnDb.ref(`games/onBreak/${window.cnKeySafe(username)}`);
    const handler = snap => callback(snap.val());
    ref.on("value", handler);
    return ()=> ref.off("value", handler);
  },
  async getLeaderboard(gameId){
    const snap = await window.cnDb.ref(`games/${gameId}/leaderboard`).once("value");
    const val = snap.val() || {};
    return Object.entries(val).map(([id,e])=>({id,...e})).sort((a,b)=>b.score-a.score).slice(0,5);
  },
  async submitScore(gameId,name,score){
    const ref = window.cnDb.ref(`games/${gameId}/leaderboard`).push();
    const ts = Date.now();
    await ref.set({name,score,ts});
    const snap = await window.cnDb.ref(`games/${gameId}/leaderboard`).once("value");
    const val = snap.val() || {};
    const entries = Object.entries(val).map(([id,e])=>({id,...e})).sort((a,b)=>b.score-a.score);
    if(entries.length>5){
      const toDelete = entries.slice(5);
      await Promise.all(toDelete.map(e=>window.cnDb.ref(`games/${gameId}/leaderboard/${e.id}`).remove()));
    }
    const top5 = entries.slice(0,5);
    const madeIt = top5.some(e=>e.ts===ts && e.name===name && e.score===score);
    return {top5,madeIt};
  }
};
</script>

// ── Memory Match game ────────────────────────────────────────────────────────
const SYMBOL_POOL = ['🥷','🐉','⚡','🔥','🌟','💎','🎯','🚀','🎮','🧩','🏆','⚔️','🛡️','🎲','🔮','👾','🍀','🎧'];
function makeDeck(){
  const shuffledPool = [...SYMBOL_POOL].sort(()=>Math.random()-0.5).slice(0,8);
  const pairs = [...shuffledPool,...shuffledPool];
  const deck = pairs
    .map(sym=>({sym,r:Math.random()}))
    .sort((a,b)=>a.r-b.r)
    .map((c,i)=>({id:i,sym:c.sym,matched:false}));
  return deck;
}

function MemoryMatchGame({defaultName,onExit}){
  const MAX_HEARTS = 5;
  const PREVIEW_MS = 2000;
  const [hearts,setHearts]=useState(MAX_HEARTS);
  const [score,setScore]=useState(0);
  const [round,setRound]=useState(1);
  const [deck,setDeck]=useState(()=>makeDeck());
  const [flipped,setFlipped]=useState([]);
  const [locked,setLocked]=useState(false);
  const [previewing,setPreviewing]=useState(true);
  const [gameOver,setGameOver]=useState(false);
  const [shakeIdx,setShakeIdx]=useState([]);
  const [name,setName]=useState(defaultName||"");
  const [submitting,setSubmitting]=useState(false);
  const [submitted,setSubmitted]=useState(false);
  const [madeIt,setMadeIt]=useState(false);
  const [leaderboard,setLeaderboard]=useState(null);
  const timers=useRef([]);

  useEffect(()=>()=>{ timers.current.forEach(clearTimeout); },[]);

  // Briefly reveal the whole board at the start of every round so ninjas can memorize it,
  // then flip everything face-down and unlock play.
  useEffect(()=>{
    setPreviewing(true);
    setLocked(true);
    const t=setTimeout(()=>{
      setPreviewing(false);
      setLocked(false);
    },PREVIEW_MS);
    timers.current.push(t);
    return ()=>clearTimeout(t);
  },[deck]);

  useEffect(()=>{
    if(deck.length && deck.every(c=>c.matched)){
      const t=setTimeout(()=>{
        setScore(s=>s+200);
        setRound(r=>r+1);
        setDeck(makeDeck());
      },550);
      timers.current.push(t);
    }
  },[deck]);

  useEffect(()=>{
    if(gameOver){
      window.fbGames.getLeaderboard("memoryMatch").then(setLeaderboard).catch(()=>setLeaderboard([]));
    }
  },[gameOver]);

  function handleCardClick(idx){
    if(locked||gameOver) return;
    if(flipped.includes(idx)) return;
    if(deck[idx].matched) return;
    if(flipped.length>=2) return;
    const next=[...flipped,idx];
    setFlipped(next);
    if(next.length===2){
      setLocked(true);
      const [a,b]=next;
      if(deck[a].sym===deck[b].sym){
        const t=setTimeout(()=>{
          setDeck(prev=>prev.map((c,i)=>(i===a||i===b)?{...c,matched:true}:c));
          setScore(s=>s+100);
          setFlipped([]);
          setLocked(false);
        },450);
        timers.current.push(t);
      } else {
        setShakeIdx([a,b]);
        const t=setTimeout(()=>{
          setFlipped([]);
          setLocked(false);
          setShakeIdx([]);
          setHearts(h=>{
            const nh=h-1;
            if(nh<=0) setGameOver(true);
            return nh;
          });
        },700);
        timers.current.push(t);
      }
    }
  }

  async function saveScore(){
    if(!name.trim()||submitting||submitted) return;
    setSubmitting(true);
    try{
      const {top5,madeIt:mi} = await window.fbGames.submitScore("memoryMatch",name.trim(),score);
      setLeaderboard(top5);
      setMadeIt(mi);
      setSubmitted(true);
    } catch(e){ console.warn(e); }
    setSubmitting(false);
  }

  function playAgain(){
    setHearts(MAX_HEARTS);setScore(0);setRound(1);setDeck(makeDeck());
    setFlipped([]);setLocked(false);setGameOver(false);
    setSubmitted(false);setMadeIt(false);setLeaderboard(null);
  }

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {!gameOver?(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}>
            <div style={{display:"flex",gap:5}}>
              {Array.from({length:MAX_HEARTS}).map((_,i)=>(
                <span key={i} style={{fontSize:19,animation:hearts===i+1?"heartLose .3s ease":"none"}}>
                  {i<hearts?"❤️":"🖤"}
                </span>
              ))}
            </div>
            <div style={{display:"flex",gap:14,fontFamily:"'Fira Code',monospace",fontSize:12}}>
              <span style={{color:"rgba(255,255,255,0.4)"}}>ROUND <b style={{color:"#00cfff"}}>{round}</b></span>
              <span style={{color:"rgba(255,255,255,0.4)"}}>SCORE <b style={{color:"#39ff14"}}>{score}</b></span>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,flex:1,alignContent:"center"}}>
            {deck.map((card,idx)=>{
              const isUp = previewing||flipped.includes(idx)||card.matched;
              const isShaking = shakeIdx.includes(idx);
              return(
                <div key={card.id} onClick={()=>handleCardClick(idx)}
                  style={{
                    aspectRatio:"1",borderRadius:10,cursor:(card.matched||previewing)?"default":"pointer",
                    display:"flex",alignItems:"center",justifyContent:"center",fontSize:"clamp(20px,5vw,28px)",
                    userSelect:"none",transition:"transform .15s, background .2s, border-color .2s",
                    animation:isShaking?"shakeCard .4s ease":card.matched?"cardPop .3s ease":"none",
                    background:isUp?(card.matched?"rgba(57,255,20,0.15)":"rgba(0,207,255,0.15)"):"rgba(255,255,255,0.06)",
                    border:`1px solid ${isUp?(card.matched?"#39ff1455":"#00cfff55"):"rgba(255,255,255,0.15)"}`,
                    opacity:card.matched?0.55:1,
                    transform:isUp?"scale(1)":"scale(1)"
                  }}>
                  {isUp?card.sym:"❔"}
                </div>
              );
            })}
          </div>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:previewing?"#ffd700":"rgba(255,255,255,0.25)",textAlign:"center",marginTop:14}}>
            {previewing?"👀 Memorize the board...":"Match all pairs to advance — it never ends until you're out of hearts!"}
          </p>
        </>
      ):(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center",gap:6,overflowY:"auto"}}>
          <div style={{fontSize:40,marginBottom:4}}>💔</div>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:18,color:"#ff2d78"}}>GAME OVER</h3>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:10}}>
            Final Score: <b style={{color:"#39ff14"}}>{score}</b> · Reached Round {round}
          </p>

          {!submitted?(
            <div style={{width:"100%",maxWidth:280,marginBottom:18}}>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>SAVE YOUR SCORE</label>
              <div style={{display:"flex",gap:8}}>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" style={iStyle(false)}/>
                <button onClick={saveScore} disabled={!name.trim()||submitting}
                  style={{flexShrink:0,padding:"10px 16px",borderRadius:10,border:"none",
                    cursor:!name.trim()||submitting?"not-allowed":"pointer",
                    background:!name.trim()||submitting?"rgba(255,255,255,0.08)":"linear-gradient(135deg,#39ff14,#00cfff)",
                    color:!name.trim()||submitting?"rgba(255,255,255,0.3)":"#000",
                    fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
                  {submitting?<Spinner/>:"SAVE"}
                </button>
              </div>
            </div>
          ):(
            <p style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:madeIt?"#ffd700":"#39ff14",marginBottom:14}}>
              {madeIt?"🏆 New Top 5 Leaderboard Entry!":"✅ Score submitted!"}
            </p>
          )}

          <div style={{width:"100%",maxWidth:320}}>
            <h4 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"#ffd700",marginBottom:10,letterSpacing:1}}>🏆 TOP 5 — MEMORY MATCH</h4>
            {leaderboard===null?(
              <div style={{display:"flex",justifyContent:"center",padding:20}}><Spinner/></div>
            ):leaderboard.length===0?(
              <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.35)"}}>No scores yet — you could be first!</p>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {leaderboard.map((e,i)=>{
                  const isMe = submitted && e.name===name.trim() && e.score===score;
                  const medal = i===0?"👑":i===1?"🥈":i===2?"🥉":`#${i+1}`;
                  return(
                    <div key={e.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                      padding:"8px 12px",borderRadius:8,
                      background:isMe?"rgba(255,215,0,0.12)":"rgba(255,255,255,0.04)",
                      border:`1px solid ${isMe?"#ffd70066":"rgba(255,255,255,0.08)"}`}}>
                      <span style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,fontWeight:700,color:isMe?"#ffd700":"#fff"}}>{medal} {e.name}</span>
                      <span style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,fontWeight:700,color:"#39ff14"}}>{e.score}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div style={{display:"flex",gap:10,marginTop:20}}>
            <button onClick={playAgain}
              style={{padding:"10px 20px",borderRadius:10,border:"none",cursor:"pointer",
                background:"linear-gradient(135deg,#39ff14,#00cfff)",color:"#000",
                fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>

// ── Dino Runner game (Chrome offline dino clone) ─────────────────────────────
function DinoGame({defaultName,onExit}){
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  const stateRef = useRef({dinoY:0,velY:0,obstacles:[],speed:220,distance:0,spawnTimer:0,running:true});
  const [score,setScore]=useState(0);
  const [gameOver,setGameOver]=useState(false);
  const [name,setName]=useState(defaultName||"");
  const [submitting,setSubmitting]=useState(false);
  const [submitted,setSubmitted]=useState(false);
  const [madeIt,setMadeIt]=useState(false);
  const [leaderboard,setLeaderboard]=useState(null);

  const W=360,H=180;
  const GROUND_Y=H-30;
  const DINO_SIZE=28;
  const DINO_X=36;
  const GRAVITY=1900;
  const JUMP_V=-620;

  function reset(){
    stateRef.current={dinoY:GROUND_Y-DINO_SIZE,velY:0,obstacles:[],speed:220,distance:0,spawnTimer:0.8,running:true};
    setScore(0);setGameOver(false);setSubmitted(false);setMadeIt(false);setLeaderboard(null);
  }

  function jump(){
    const st=stateRef.current;
    if(!st.running) return;
    if(st.dinoY >= GROUND_Y-DINO_SIZE-1){
      st.velY = JUMP_V;
    }
  }

  useEffect(()=>{
    reset();
    let last = performance.now();
    let acc = 0;
    function draw(){
      const canvas=canvasRef.current; if(!canvas) return;
      const ctx=canvas.getContext("2d");
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle="rgba(255,255,255,0.25)";
      ctx.beginPath();ctx.moveTo(0,GROUND_Y+1);ctx.lineTo(W,GROUND_Y+1);ctx.stroke();
      const st=stateRef.current;
      ctx.fillStyle="#39ff14";
      ctx.shadowColor="#39ff14";ctx.shadowBlur=8;
      ctx.fillRect(DINO_X,st.dinoY,DINO_SIZE,DINO_SIZE);
      ctx.shadowBlur=0;
      ctx.fillStyle="#ff2d78";
      st.obstacles.forEach(o=>{ ctx.fillRect(o.x,GROUND_Y-o.h,o.w,o.h); });
    }
    function loop(now){
      const dt=Math.min(0.033,(now-last)/1000);
      last=now;
      const st=stateRef.current;
      if(st.running){
        st.velY += GRAVITY*dt;
        st.dinoY += st.velY*dt;
        if(st.dinoY > GROUND_Y-DINO_SIZE){ st.dinoY = GROUND_Y-DINO_SIZE; st.velY = 0; }
        st.distance += st.speed*dt;
        st.speed = 220 + Math.min(260, st.distance*0.02);

        st.spawnTimer -= dt;
        if(st.spawnTimer<=0){
          const h = 22+Math.random()*20;
          st.obstacles.push({x:W, w:14+Math.random()*10, h});
          st.spawnTimer = Math.max(0.5, 1.1 - Math.min(0.55, st.distance*0.00006) + Math.random()*0.6);
        }
        st.obstacles.forEach(o=>{ o.x -= st.speed*dt; });
        st.obstacles = st.obstacles.filter(o=>o.x+o.w>-5);

        const dinoRect = {x:DINO_X+4,y:st.dinoY+4,w:DINO_SIZE-8,h:DINO_SIZE-8};
        for(const o of st.obstacles){
          const oRect={x:o.x,y:GROUND_Y-o.h,w:o.w,h:o.h};
          if(dinoRect.x < oRect.x+oRect.w && dinoRect.x+dinoRect.w > oRect.x &&
             dinoRect.y < oRect.y+oRect.h && dinoRect.y+dinoRect.h > oRect.y){
            st.running=false;
            setGameOver(true);
          }
        }
        acc+=dt;
        if(acc>0.1){ acc=0; setScore(Math.floor(st.distance/5)); }
      }
      draw();
      rafRef.current = requestAnimationFrame(loop);
    }
    rafRef.current = requestAnimationFrame(loop);
    return ()=>cancelAnimationFrame(rafRef.current);
  },[]);

  useEffect(()=>{
    function onKey(e){ if(e.code==="Space"||e.code==="ArrowUp"){ e.preventDefault(); jump(); } }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[]);

  useEffect(()=>{
    if(gameOver){
      window.fbGames.getLeaderboard("dino").then(setLeaderboard).catch(()=>setLeaderboard([]));
    }
  },[gameOver]);

  async function saveScore(){
    if(!name.trim()||submitting||submitted) return;
    setSubmitting(true);
    try{
      const {top5,madeIt:mi} = await window.fbGames.submitScore("dino",name.trim(),score);
      setLeaderboard(top5);
      setMadeIt(mi);
      setSubmitted(true);
    } catch(e){ console.warn(e); }
    setSubmitting(false);
  }

  function playAgain(){ reset(); }

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      {!gameOver?(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.4)"}}>TAP / CLICK / SPACE TO JUMP</span>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"#39ff14"}}>SCORE <b>{score}</b></span>
          </div>
          <div onClick={jump} onTouchStart={e=>{e.preventDefault();jump();}}
            style={{borderRadius:10,overflow:"hidden",border:"1px solid rgba(255,255,255,0.15)",
              background:"rgba(255,255,255,0.03)",cursor:"pointer",touchAction:"none"}}>
            <canvas ref={canvasRef} width={W} height={H} style={{display:"block",width:"100%",height:"auto"}}/>
          </div>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.25)",textAlign:"center",marginTop:10}}>
            Jump the cacti — it speeds up the longer you survive!
          </p>
        </>
      ):(
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center",gap:6,overflowY:"auto"}}>
          <div style={{fontSize:40,marginBottom:4}}>🦖💥</div>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:18,color:"#ff2d78"}}>GAME OVER</h3>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"rgba(255,255,255,0.5)",marginBottom:10}}>
            Final Score: <b style={{color:"#39ff14"}}>{score}</b>
          </p>

          {!submitted?(
            <div style={{width:"100%",maxWidth:280,marginBottom:18}}>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:6,letterSpacing:1}}>SAVE YOUR SCORE</label>
              <div style={{display:"flex",gap:8}}>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your name" style={iStyle(false)}/>
                <button onClick={saveScore} disabled={!name.trim()||submitting}
                  style={{flexShrink:0,padding:"10px 16px",borderRadius:10,border:"none",
                    cursor:!name.trim()||submitting?"not-allowed":"pointer",
                    background:!name.trim()||submitting?"rgba(255,255,255,0.08)":"linear-gradient(135deg,#39ff14,#00cfff)",
                    color:!name.trim()||submitting?"rgba(255,255,255,0.3)":"#000",
                    fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
                  {submitting?<Spinner/>:"SAVE"}
                </button>
              </div>
            </div>
          ):(
            <p style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:madeIt?"#ffd700":"#39ff14",marginBottom:14}}>
              {madeIt?"🏆 New Top 5 Leaderboard Entry!":"✅ Score submitted!"}
            </p>
          )}

          <div style={{width:"100%",maxWidth:320}}>
            <h4 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"#ffd700",marginBottom:10,letterSpacing:1}}>🏆 TOP 5 — DINO RUNNER</h4>
            {leaderboard===null?(
              <div style={{display:"flex",justifyContent:"center",padding:20}}><Spinner/></div>
            ):leaderboard.length===0?(
              <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.35)"}}>No scores yet — you could be first!</p>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {leaderboard.map((e,i)=>{
                  const isMe = submitted && e.name===name.trim() && e.score===score;
                  const medal = i===0?"👑":i===1?"🥈":i===2?"🥉":`#${i+1}`;
                  return(
                    <div key={e.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                      padding:"8px 12px",borderRadius:8,
                      background:isMe?"rgba(255,215,0,0.12)":"rgba(255,255,255,0.04)",
                      border:`1px solid ${isMe?"#ffd70066":"rgba(255,255,255,0.08)"}`}}>
                      <span style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,fontWeight:700,color:isMe?"#ffd700":"#fff"}}>{medal} {e.name}</span>
                      <span style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,fontWeight:700,color:"#39ff14"}}>{e.score}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div style={{display:"flex",gap:10,marginTop:20}}>
            <button onClick={playAgain}
              style={{padding:"10px 20px",borderRadius:10,border:"none",cursor:"pointer",
                background:"linear-gradient(135deg,#39ff14,#00cfff)",color:"#000",
                fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
              ↻ PLAY AGAIN
            </button>
            <button onClick={onExit}
              style={{padding:"10px 20px",borderRadius:10,border:"1px solid rgba(255,255,255,0.2)",cursor:"pointer",
                background:"rgba(255,255,255,0.05)",color:"rgba(255,255,255,0.6)",
                fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
              EXIT
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// gameId (used in GAMES_LIST/hub) -> display + leaderboard metadata
const GAME_META = {
  memory: {title:"Memory Match", icon:"🧠", leaderboardId:"memoryMatch"},
  dino:   {title:"Dino Runner",  icon:"🦖", leaderboardId:"dino"},
};

function GameModal({gameId,initialMode,defaultName,onClose}){
  const [mode,setMode]=useState(initialMode); // 'play' | 'leaderboard'
  useEffect(()=>{
    function onKey(e){ if(e.key==="Escape") onClose(); }
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[]);
  const meta = GAME_META[gameId] || {title:"Game",icon:"🎮",leaderboardId:gameId};
  return ReactDOM.createPortal(
    <div style={{position:"fixed",inset:0,zIndex:500,background:"rgba(2,2,6,0.85)",backdropFilter:"blur(6px)",
      display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <Glass style={{width:"100%",maxWidth:460,maxHeight:"88vh",padding:"22px",position:"relative",
        display:"flex",flexDirection:"column",animation:"popIn .25s ease",borderColor:"#39ff1433",
        boxShadow:"0 0 60px rgba(57,255,20,0.15),0 20px 60px rgba(0,0,0,0.6)"}}>
        <button onClick={onClose}
          style={{position:"absolute",top:14,right:14,background:"rgba(255,255,255,0.08)",

        <div style={{marginBottom:16}}>
          <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:15,color:"#fff",margin:0}}>{meta.icon} {meta.title}</h2>
        </div>
        <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column"}}>
          {mode==="leaderboard"
            ?<LeaderboardOnly gameId={meta.leaderboardId} title={meta.title} onPlay={()=>setMode("play")}/>
            :gameId==="dino"
              ?<DinoGame defaultName={defaultName} onExit={onClose}/>
              :<MemoryMatchGame defaultName={defaultName} onExit={onClose}/>
          }
        </div>
      </Glass>
    </div>,
    document.body
  );
}

// ── Game hub ─────────────────────────────────────────────────────────────────
const GAMES_LIST = [
  {id:"memory",name:"Memory Match",icon:"🧠",desc:"Flip cards, find pairs, don't run out of hearts.",active:true},
  {id:"dino",name:"Dino Runner",icon:"🦖",desc:"Jump the cacti in this classic offline runner.",active:true},
  {id:"comingsoon",name:"Coming Soon",icon:"🚧",desc:"A new game is on the way — stay tuned!",active:false},
];

function GamesTab({isAdmin,studentUsername}){
  const [modal,setModal]=useState(null); // {gameId, mode}
  const [breakData,setBreakData]=useState(null);
  const [nowTick,setNowTick]=useState(Date.now());

  // Live-listen for this student's break flag (set from "Start Break" on In The Dojo)
  // so ending it (or it expiring) is reflected instantly.
  useEffect(()=>{
    if(!studentUsername) return;
    const unsubscribe = window.fbGames.watchStudentBreak(studentUsername, setBreakData);
    return unsubscribe;
  },[studentUsername]);

  // Ticks every 5s so a break that hits the 10-minute mark auto-locks even with no new Firebase write.
  useEffect(()=>{
    const iv=setInterval(()=>setNowTick(Date.now()),5000);
    return ()=>clearInterval(iv);
  },[]);

  const myBreakOn = window.cnIsBreakActive(breakData);
  const locked = !isAdmin && !myBreakOn;
  const remainingMs = (myBreakOn && breakData&&breakData.startedAt) ? Math.max(0,(breakData.startedAt+window.BREAK_DURATION_MS)-nowTick) : 0;
  const remainingLabel = remainingMs>0 ? `${Math.floor(remainingMs/60000)}:${String(Math.floor((remainingMs%60000)/1000)).padStart(2,"0")}` : null;

  // If a break ends (manually stopped, or it expires) while a game is open, close it and lock immediately.
  useEffect(()=>{
    if(locked && modal){ setModal(null); }
  },[locked]);

  return(
    <div style={{padding:"clamp(16px,3vw,28px) clamp(14px,3vw,36px)",animation:"fadeUp .4s ease both"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8,flexWrap:"wrap"}}>
        <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:"clamp(15px,2vw,22px)",color:"#fff",margin:0,
          background:"linear-gradient(135deg,#ff2d78,#ffd700)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
          🎮 Break Time Games
        </h2>
        {!isAdmin&&studentUsername&&(
          <div style={{padding:"4px 12px",borderRadius:99,
            background:myBreakOn?"rgba(57,255,20,0.12)":"rgba(255,255,255,0.05)",
            border:`1px solid ${myBreakOn?"#39ff1444":"rgba(255,255,255,0.1)"}`,
            fontFamily:"'Fira Code',monospace",fontSize:9,color:myBreakOn?"#39ff14":"rgba(255,255,255,0.35)"}}>
            {myBreakOn?`🥷 YOUR BREAK IS ON · ${remainingLabel}`:"⏳ WAITING FOR YOUR BREAK"}
          </div>
        )}
      </div>
      <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.35)",marginBottom:20}}>
        Games unlock only during your break — ask your Sensei to start it from "In The Dojo"!
      </p>

      {locked?(
        <Glass style={{padding:44,textAlign:"center",borderColor:"rgba(255,45,120,0.25)"}}>
          <div style={{fontSize:42,marginBottom:12}}>🔒</div>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:15,color:"#ff2d78",marginBottom:8}}>Games are locked right now</h3>
          <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:13,color:"rgba(255,255,255,0.4)"}}>
            Ask your Sensei to start your break time on "In The Dojo" to unlock the games!
          </p>
        </Glass>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:18}}>
          {GAMES_LIST.map((g,i)=>(
            <Glass key={g.id} style={{padding:20,borderColor:g.active?"rgba(57,255,20,0.2)":"rgba(255,255,255,0.06)",
              opacity:g.active?1:0.75,animation:`fadeUp .35s ease both ${i*.06}s`}}>
              <div style={{fontSize:34,marginBottom:10}}>{g.icon}</div>
              <div style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:15,color:"#fff",marginBottom:6}}>{g.name}</div>
              <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.35)",marginBottom:16,lineHeight:1.5,minHeight:30}}>
                {g.desc}
              </p>
              {g.active?(
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>setModal({gameId:g.id,mode:"play"})}
                    style={{flex:1,padding:"9px",borderRadius:9,border:"none",cursor:"pointer",
                      background:"linear-gradient(135deg,#39ff14,#00cfff)",color:"#000",
                      fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>▶ PLAY</button>
                  <button onClick={()=>setModal({gameId:g.id,mode:"leaderboard"})}
                    style={{flex:1,padding:"9px",borderRadius:9,border:"1px solid #ffd70044",cursor:"pointer",
                      background:"rgba(255,215,0,0.1)",color:"#ffd700",
                      fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>🏆</button>
                </div>
              ):(
                <button onClick={()=>setModal({gameId:g.id,mode:"play"})}
                  style={{width:"100%",padding:"9px",borderRadius:9,textAlign:"center",background:"rgba(255,255,255,0.05)",
                    border:"1px solid rgba(255,255,255,0.1)",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)"}}>
                  🚧 Coming Soon
                </button>
              )}
            </Glass>
          ))}
        </div>
      )}

      {modal&&(
        modal.gameId==="comingsoon"
          ?ReactDOM.createPortal(
              <div style={{position:"fixed",inset:0,zIndex:500,background:"rgba(2,2,6,0.85)",backdropFilter:"blur(6px)",
                display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
                <Glass style={{width:"100%",maxWidth:400,padding:"26px",position:"relative",borderColor:"#ffd70033"}}>
                  <button onClick={()=>setModal(null)}
                    style={{position:"absolute",top:14,right:14,background:"rgba(255,255,255,0.08)",
                      border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,color:"#fff",
                      width:30,height:30,cursor:"pointer",fontSize:15}}>✕</button>
                  <ComingSoonBoard/>
                </Glass>
              </div>,
              document.body
            )
          :<GameModal gameId={modal.gameId} initialMode={modal.mode} defaultName={studentUsername||""} onClose={()=>setModal(null)}/>
      )}
    </div>
  );
}

function GamesApp(){
  const {auth,ready} = window.useCnAuth();
  const isMobile=useIsMobile();

  if(!auth) return <LoadingScreen status="Loading arcade..."/>;
  const isAdmin=auth.role==="admin", isStudent=auth.role==="student";

  return(
    <>
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",
        background:"radial-gradient(ellipse 60% 50% at 80% 20%,rgba(57,255,20,0.06) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(0,207,255,0.07) 0%,transparent 70%),#060609"}}/>
      <div style={{display:"flex",flexDirection:isMobile?"column":"row",minHeight:"100vh",position:"relative",zIndex:1,width:"100%"}}>
        {isMobile
          ?<MobileNav active="games" isAdmin={isAdmin} isStudent={isStudent} studentUsername={auth.username}/>
          :<Sidebar active="games" isAdmin={isAdmin} isStudent={isStudent} studentUsername={auth.username}/>
        }
        <div style={{flex:1,overflowY:"auto",...(isMobile?{}:{height:"100vh"})}}>
          <GamesTab isAdmin={isAdmin} studentUsername={auth.username}/>
        </div>
      </div>
      <TourOverlay/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GamesApp/>);
