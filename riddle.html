firebase.initializeApp(firebaseConfig);
const db = firebase.database();

window.fbRiddles = {
  async getAll(){
    const snap = await db.ref("riddles").once("value");
    const val = snap.val() || {};
    const map = {};
    for(const weekKey of Object.keys(val)){
      const wNum = parseInt(weekKey.replace("week_",""));
      const wData = val[weekKey];
      const entries = [];
      const subs = wData.submissions || {};
      for(const [id,sub] of Object.entries(subs)){
        entries.push({id,...sub});
      }
      map[wNum] = {text:wData.text||"",answer:wData.answer||"",revealed:wData.revealed||false,winner:wData.winner||null,locked:wData.locked||false,entries};
    }
    return map;
  },
  async setRiddle(week,text,answer){
    await db.ref(`riddles/week_${week}`).update({text,answer});
  },
  async addSubmission(week,name,answer,ts){
    const snap = await db.ref(`riddles/week_${week}/submissions`).orderByChild("name").equalTo(name).once("value");
    const val = snap.val();
    if(val){
      const existingKey = Object.keys(val)[0];
      await db.ref(`riddles/week_${week}/submissions/${existingKey}`).update({answer,ts});
      return {id:existingKey};
    } else {
      const ref = db.ref(`riddles/week_${week}/submissions`).push();
      await ref.set({name,answer,ts});
      return {id:ref.key};
    }
  },
  async deleteSubmission(week,submissionId){
    await db.ref(`riddles/week_${week}/submissions/${submissionId}`).remove();
  },
  async setWinner(week,name){
    await db.ref(`riddles/week_${week}`).update({winner:name,locked:true});
  }
};
</script>
<script type="text/babel">
const {useState,useEffect} = React;

const WEEK_START = new Date("2026-05-14T00:00:00");
function getCurrentWeek(){
  const diff = new Date() - WEEK_START;
  return diff < 0 ? 1 : Math.floor(diff/(7*24*60*60*1000))+1;
}
function getWeekLabel(n){
  const s = new Date(WEEK_START.getTime()+(n-1)*7*24*60*60*1000);
  const e = new Date(s.getTime()+6*24*60*60*1000);
  const fmt = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  return `Week ${n} (${fmt(s)} – ${fmt(e)})`;
}

function RiddleTab({setToast,isAdmin,isStudent,studentUsername,riddleMap,setRiddleMap}){
  const cw = getCurrentWeek();
  const totalWeeks = getCurrentWeek()+1;
  const [week,setWeek] = useState(cw);
  const [sName,setSName] = useState(studentUsername||"");
  const [sAnswer,setSAnswer] = useState("");
  useEffect(()=>{if(studentUsername) setSName(studentUsername);},[studentUsername]);
  const [newRiddleText,setNewRiddleText] = useState("");
  const [editMode,setEditMode] = useState(false);
  const [revealMode,setRevealMode] = useState(false);
  const [revealAnswer,setRevealAnswer] = useState("");
  const [gradeMode,setGradeMode] = useState(false);
  const [selectedWinner,setSelectedWinner] = useState(null);
  const [errors,setErrors] = useState({});
  const [saving,setSaving] = useState(false);

  const isPastWeek = week < cw;
  const isCurrentWeek = week === cw;
  const weekData = riddleMap[week] || {text:"No riddle set yet — check back soon!",answer:"",revealed:false,winner:null,locked:false,entries:[]};
  const gradingActive = weekData.revealed && !!weekData.answer;
  const isLocked = weekData.locked;
  const canSubmit = isCurrentWeek && (isAdmin || isStudent);

  function isCorrect(submitted, official){
    if(!official || !gradingActive) return false;
    return submitted.trim().toLowerCase().includes(official.trim().toLowerCase());
  }

  function getSortedEntries(entries){
    const latest = {};
    for(const e of entries){
      if(!latest[e.name] || e.ts > latest[e.name].ts) latest[e.name] = e;
    }
    const unique = Object.values(latest);
    if(gradingActive){
      const correct = unique.filter(e=>isCorrect(e.answer,weekData.answer)).sort((a,b)=>a.ts-b.ts);
      const wrong   = unique.filter(e=>!isCorrect(e.answer,weekData.answer)).sort((a,b)=>a.ts-b.ts);
      return {sorted:[...correct,...wrong], firstCorrect:correct[0]||null};
    }
    return {sorted:unique.sort((a,b)=>a.ts-b.ts), firstCorrect:null};
  }
  const {sorted:allSorted, firstCorrect} = getSortedEntries(weekData.entries||[]);

  async function submitAnswer(){
    const errs={};
    if(!sName.trim()) errs.name="Name required";
    if(!sAnswer.trim()) errs.answer="Answer required";
    if(Object.keys(errs).length){setErrors(errs);return;}
    setErrors({});setSaving(true);
    try{
      const ts = Date.now();
      const result = await window.fbRiddles.addSubmission(week,sName.trim(),sAnswer.trim(),ts);
      const existing = (weekData.entries||[]).filter(e=>e.name!==sName.trim());
      const newEntry = {id:result.id,name:sName.trim(),answer:sAnswer.trim(),ts};
      setRiddleMap(prev=>({...prev,[week]:{...weekData,entries:[...existing,newEntry]}}));
      setSName("");setSAnswer("");
      setToast({msg:`${sName.trim()} submitted! ✅`,color:"#39ff14"});
    } catch(e){setToast({msg:`Save failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  async function saveRiddle(){
    if(!newRiddleText.trim()) return;
    setSaving(true);
    try{
      await window.fbRiddles.setRiddle(week,newRiddleText.trim(),"");
      setRiddleMap(prev=>({...prev,[week]:{...weekData,text:newRiddleText.trim(),answer:"",revealed:false}}));
      setEditMode(false);
      setToast({msg:"Riddle saved! Reveal the answer at end of week. ✏️",color:"#39ff14"});
    } catch(e){setToast({msg:`Save failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  async function revealCorrectAnswer(){
    if(!revealAnswer.trim()) return;
    setSaving(true);
    try{
      await window.fbRiddles.setRiddle(week,weekData.text,revealAnswer.trim().toLowerCase());
      await db.ref(`riddles/week_${week}`).update({revealed:true});
      setRiddleMap(prev=>({...prev,[week]:{...weekData,answer:revealAnswer.trim().toLowerCase(),revealed:true}}));
      setRevealMode(false);setRevealAnswer("");
      setToast({msg:"Answer revealed! Grading is now active. 🎉",color:"#ffd700"});
    } catch(e){setToast({msg:`Save failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  async function lockWinner(){
    if(!selectedWinner) return;
    setSaving(true);
    try{
      await window.fbRiddles.setWinner(week,selectedWinner);
      setRiddleMap(prev=>({...prev,[week]:{...weekData,winner:selectedWinner,locked:true}}));
      setGradeMode(false);setSelectedWinner(null);
      setToast({msg:`🏆 ${selectedWinner} locked in as winner for Week ${week}!`,color:"#ffd700"});
    } catch(e){setToast({msg:`Lock failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  async function deleteSubmission(entry){
    setSaving(true);
    try{
      const live = weekData.entries.find(e=>e.name===entry.name);
      if(live&&live.id) await window.fbRiddles.deleteSubmission(week,live.id);
      setRiddleMap(prev=>({...prev,[week]:{...weekData,entries:weekData.entries.filter(e=>e.name!==entry.name)}}));
      setToast({msg:`Removed ${entry.name}'s answer.`,color:"#ff2d78"});
    } catch(e){setToast({msg:`Delete failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  return(
    <div style={{padding:"clamp(16px,3vw,28px) clamp(14px,3vw,36px)",animation:"fadeUp .4s ease both"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24,flexWrap:"wrap"}}>
        <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:"clamp(14px,2vw,20px)",color:"#fff",margin:0}}>🧩 Riddle of the Week</h2>
        <select value={week} onChange={e=>{setWeek(Number(e.target.value));setGradeMode(false);setEditMode(false);setRevealMode(false);}}
          style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:"#fff",padding:"7px 12px",fontFamily:"'Fira Code',monospace",fontSize:11,cursor:"pointer"}}>
          {Array.from({length:totalWeeks},(_,i)=>i+1).map(w=>(
            <option key={w} value={w} style={{background:"#0a0a0f"}}>{getWeekLabel(w)}{w===cw?" ← Current":""}</option>
          ))}
        </select>
        {isLocked?(
          <div style={{padding:"4px 12px",borderRadius:99,background:"rgba(255,215,0,0.15)",border:"1px solid #ffd70055",fontFamily:"'Fira Code',monospace",fontSize:9,color:"#ffd700"}}>🏆 LOCKED — winner: {weekData.winner}</div>
        ):gradingActive?(
          <div style={{padding:"4px 12px",borderRadius:99,background:"rgba(57,255,20,0.1)",border:"1px solid #39ff1433",fontFamily:"'Fira Code',monospace",fontSize:9,color:"#39ff14"}}>✅ ANSWER REVEALED — grading active</div>
        ):(
          <div style={{padding:"4px 12px",borderRadius:99,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.35)"}}>{isPastWeek?"📅 PAST WEEK":"🔒 ANSWER HIDDEN — submissions open"}</div>
        )}
      </div>

      {isPastWeek&&(
        <Glass style={{padding:"14px 20px",marginBottom:20,borderColor:"rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.03)"}}>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.4)",margin:0,textAlign:"center"}}>📅 This week has ended — submissions are closed.</p>
        </Glass>
      )}

      {isLocked&&(
        <Glass style={{padding:"18px 24px",marginBottom:24,borderColor:"#ffd70044",background:"rgba(255,215,0,0.06)",boxShadow:"0 0 30px #ffd70022"}}>
          <div style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
            <span style={{fontSize:32}}>👑</span>
            <div>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:14,fontWeight:700,color:"#ffd700",marginBottom:3}}>Week {week} Winner</div>
              <div style={{fontFamily:"'Exo 2',sans-serif",fontSize:18,fontWeight:700,color:"#fff"}}>{weekData.winner}</div>
              <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,215,0,0.5)",marginTop:2}}>🔒 Result locked — cannot be changed</div>
            </div>
          </div>
        </Glass>
      )}

      {isAdmin&&isPastWeek&&gradingActive&&!isLocked&&(
        <Glass style={{padding:"20px 24px",marginBottom:24,borderColor:"#ffd70044",background:"rgba(255,215,0,0.06)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:13,color:"#ffd700",marginBottom:4}}>🏆 SELECT THIS WEEK'S WINNER</div>
              <div style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.35)"}}>Choose one ninja — this cannot be undone after locking.</div>
            </div>
            <button onClick={()=>setGradeMode(!gradeMode)}
              style={{background:gradeMode?"rgba(255,45,120,0.1)":"rgba(255,215,0,0.12)",
                border:`1px solid ${gradeMode?"#ff2d7844":"#ffd70044"}`,borderRadius:8,
                color:gradeMode?"#ff2d78":"#ffd700",padding:"7px 16px",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:11}}>
              {gradeMode?"✕ Cancel":"Choose Winner"}
            </button>
          </div>
          {gradeMode&&(
            <>
              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16,maxHeight:280,overflowY:"auto"}}>
                {allSorted.map((a,i)=>{
                  const corr = isCorrect(a.answer,weekData.answer);
                  const selected = selectedWinner===a.name;
                  return(
                    <div key={i} onClick={()=>setSelectedWinner(selected?null:a.name)}
                      style={{display:"flex",alignItems:"flex-start",gap:12,padding:"12px 14px",borderRadius:12,cursor:"pointer",
                        background:selected?"rgba(255,215,0,0.12)":"rgba(255,255,255,0.04)",
                        border:`2px solid ${selected?"#ffd700":corr?"#39ff1433":"rgba(255,255,255,0.08)"}`,transition:"all .15s"}}>
                      <div style={{width:20,height:20,borderRadius:"50%",flexShrink:0,marginTop:1,
                        background:selected?"#ffd700":"transparent",border:`2px solid ${selected?"#ffd700":"rgba(255,255,255,0.3)"}`,
                        display:"flex",alignItems:"center",justifyContent:"center",transition:"all .15s"}}>
                        {selected&&<div style={{width:8,height:8,borderRadius:"50%",background:"#000"}}/>}
                      </div>
                      <div style={{flex:1}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
                          <span style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:13,color:selected?"#ffd700":corr?"#39ff14":"#fff"}}>{a.name}</span>
                          {corr&&<span style={{background:"rgba(57,255,20,0.1)",border:"1px solid #39ff1433",borderRadius:4,padding:"1px 6px",fontFamily:"'Fira Code',monospace",fontSize:8,color:"#39ff14"}}>✓ CORRECT</span>}
                        </div>
                        <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.6)",margin:0,fontStyle:"italic"}}>"{a.answer}"</p>
                      </div>
                    </div>
                  );
                })}
              </div>
              <button onClick={lockWinner} disabled={!selectedWinner||saving}
                style={{width:"100%",padding:"12px",borderRadius:10,border:"none",
                  cursor:!selectedWinner||saving?"not-allowed":"pointer",
                  background:!selectedWinner||saving?"rgba(255,255,255,0.08)":"linear-gradient(135deg,#ffd700,#ff8c00)",
                  color:!selectedWinner||saving?"rgba(255,255,255,0.3)":"#000",
                  fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:12,letterSpacing:1,
                  display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
                {saving?<><Spinner/> Locking...</>:selectedWinner?`🔒 LOCK IN ${selectedWinner} AS WINNER`:"← Select a ninja above"}
              </button>
            </>
          )}
        </Glass>
      )}

      {isAdmin&&isPastWeek&&!gradingActive&&!isLocked&&(
        <Glass style={{padding:"16px 20px",marginBottom:24,borderColor:"#ffd70033",background:"rgba(255,215,0,0.05)"}}>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"#ffd700",margin:0,lineHeight:1.7}}>📋 This week has ended. Reveal the correct answer to begin grading, then select a winner.</p>
        </Glass>
      )}

      <Glass style={{padding:24,marginBottom:24,borderColor:"#ff2d7833",boxShadow:"0 0 40px #ff2d7822,0 8px 32px rgba(0,0,0,0.4)",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:"linear-gradient(90deg,#ff2d78,#00cfff,#39ff14)"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,gap:8,flexWrap:"wrap"}}>
          <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)",letterSpacing:2}}>RIDDLE #{week}</span>
          {isAdmin&&!isLocked&&(
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button onClick={()=>{setEditMode(!editMode);setRevealMode(false);setNewRiddleText(weekData.text);}}
                style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,color:"rgba(255,255,255,0.5)",padding:"5px 12px",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:11}}>
                {editMode?"✕ Cancel":"✏️ Edit Riddle"}
              </button>
              {!gradingActive&&(
                <button onClick={()=>{setRevealMode(!revealMode);setEditMode(false);setRevealAnswer(weekData.answer||"");}}
                  style={{background:revealMode?"rgba(255,45,120,0.1)":"rgba(255,215,0,0.1)",
                    border:`1px solid ${revealMode?"#ff2d7844":"#ffd70044"}`,borderRadius:8,
                    color:revealMode?"#ff2d78":"#ffd700",padding:"5px 12px",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:11}}>
                  {revealMode?"✕ Cancel":"🔓 Reveal Answer"}
                </button>
              )}
            </div>
          )}
        </div>

        {editMode&&isAdmin&&!isLocked?(
          <div>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:7,letterSpacing:1}}>RIDDLE TEXT</label>
            <textarea value={newRiddleText} onChange={e=>setNewRiddleText(e.target.value)}
              style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid #00cfff44",borderRadius:10,padding:"12px 14px",color:"#fff",fontFamily:"'Exo 2',sans-serif",fontSize:14,lineHeight:1.6,outline:"none",resize:"vertical",minHeight:75,boxSizing:"border-box",marginBottom:12}}/>
            <div style={{background:"rgba(255,207,0,0.06)",border:"1px solid #ffd70033",borderRadius:8,padding:"10px 14px",marginBottom:12}}>
              <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"#ffd700",margin:0,lineHeight:1.6}}>💡 Set the correct answer separately via "Reveal Answer" at end of week.</p>
            </div>
            <button onClick={saveRiddle} disabled={saving}
              style={{padding:"9px 22px",borderRadius:8,border:"none",cursor:"pointer",background:"linear-gradient(135deg,#ff2d78,#00cfff)",color:"#000",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11,display:"flex",alignItems:"center",gap:8}}>
              {saving?<><Spinner/> Saving...</>:"SAVE RIDDLE ✓"}
            </button>
          </div>
        ):revealMode&&isAdmin&&!isLocked?(
          <div style={{background:"rgba(255,215,0,0.06)",border:"1px solid #ffd70033",borderRadius:12,padding:"16px 18px"}}>
            <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"#ffd700",marginBottom:14,lineHeight:1.6}}>🔓 Enter the correct answer. Once saved, answers will be graded and you can select a winner.</p>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:7,letterSpacing:1}}>CORRECT ANSWER</label>
            <input value={revealAnswer} onChange={e=>setRevealAnswer(e.target.value)}
              placeholder="e.g. echo" style={{...iStyle(false),marginBottom:12}}
              onFocus={e=>e.target.style.borderColor="#ffd700"}
              onBlur={e=>e.target.style.borderColor="rgba(255,255,255,0.15)"}/>
            <button onClick={revealCorrectAnswer} disabled={saving||!revealAnswer.trim()}
              style={{padding:"10px 24px",borderRadius:8,border:"none",cursor:saving||!revealAnswer.trim()?"not-allowed":"pointer",
                background:saving?"rgba(255,255,255,0.1)":"linear-gradient(135deg,#ffd700,#ff8c00)",
                color:"#000",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11,display:"flex",alignItems:"center",gap:8}}>
              {saving?<><Spinner/> Saving...</>:"🔓 REVEAL & GRADE ANSWERS"}
            </button>
          </div>
        ):(
          <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:"clamp(13px,1.5vw,18px)",color:"#fff",lineHeight:1.7,margin:0,fontStyle:"italic"}}>"{weekData.text}"</p>
        )}
      </Glass>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:24}}>
        {isCurrentWeek && (isAdmin || isStudent)?(
          <Glass style={{padding:22}}>
            <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"#ff2d78",marginBottom:14,letterSpacing:1}}>SUBMIT YOUR ANSWER</h3>
            <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)",marginBottom:14,lineHeight:1.6}}>Already answered? Submit again to update.</p>
            <div style={{marginBottom:12}}>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>STUDENT NAME</label>
              <input value={sName}
                onChange={e=>{if(!studentUsername) setSName(e.target.value);}}
                readOnly={!!studentUsername}
                placeholder="Your ninja name"
                style={{...iStyle(errors.name),
                  cursor:studentUsername?"default":"text",
                  opacity:studentUsername?0.75:1,
                  background:studentUsername?"rgba(57,255,20,0.06)":"rgba(255,255,255,0.06)",
                  borderColor:studentUsername?"#39ff1444":undefined
                }}/>
              {studentUsername&&<p style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"#39ff14",marginTop:3}}>🔐 Locked to your username</p>}
              {errors.name&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.name}</p>}
            </div>
            <div style={{marginBottom:16}}>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>YOUR ANSWER</label>
              <textarea value={sAnswer} onChange={e=>setSAnswer(e.target.value)} placeholder="Type your answer here..."
                style={{...iStyle(errors.answer),resize:"vertical",minHeight:70}}/>
              {errors.answer&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.answer}</p>}
            </div>
            <button onClick={submitAnswer} disabled={saving}
              style={{width:"100%",padding:11,borderRadius:10,border:"none",cursor:saving?"not-allowed":"pointer",
                background:saving?"rgba(255,255,255,0.1)":"linear-gradient(135deg,#ff2d78,#00cfff)",
                color:saving?"rgba(255,255,255,0.4)":"#000",fontFamily:"'Orbitron',sans-serif",
                fontWeight:700,fontSize:11,letterSpacing:1,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              {saving?<><Spinner/> Saving...</>:"SUBMIT ANSWER 🧩"}
            </button>
          </Glass>
        ):(
          <Glass style={{padding:22,borderColor:"rgba(255,255,255,0.06)",opacity:.65}}>
            <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:14,letterSpacing:1}}>SUBMIT YOUR ANSWER</h3>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:120,gap:10}}>
              <span style={{fontSize:28}}>{!isAdmin&&!isStudent?"🔒":"📅"}</span>
              <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.3)",textAlign:"center",lineHeight:1.6}}>
                {!isAdmin&&!isStudent?<>Guest access.<br/>Log in with your username to submit.</>:<>This week has ended.<br/>Submissions are closed.</>}
              </p>
            </div>
          </Glass>
        )}

        <div>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"#00cfff",marginBottom:12,letterSpacing:1}}>STUDENT ANSWERS ({allSorted.length})</h3>
          <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:420,overflowY:"auto"}}>
            {allSorted.length===0?(
              <Glass style={{padding:22,textAlign:"center"}}>
                <p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.35)",fontSize:13}}>No answers yet — be the first! 🧠</p>
              </Glass>
            ):allSorted.map((a,i)=>{
              const isWinner = isLocked && weekData.winner===a.name;
              const isFirst  = !isLocked && firstCorrect && a.name===firstCorrect.name;
              const corr     = gradingActive && isCorrect(a.answer,weekData.answer);
              const borderCol= isWinner?"#ffd700":isFirst?"#ffd700":corr?"#39ff14":"rgba(255,255,255,0.08)";
              return(
                <Glass key={i} style={{padding:"11px 14px",borderColor:borderCol,animation:`fadeUp .3s ease both ${i*.05}s`,boxShadow:isWinner?"0 0 20px #ffd70033":undefined}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                    <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                      {(isWinner||isFirst)&&<span style={{fontSize:14}}>👑</span>}
                      <span style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:12,color:isWinner?"#ffd700":corr?"#39ff14":"#00cfff"}}>{a.name}</span>
                      {isWinner&&(<span style={{background:"rgba(255,215,0,0.15)",border:"1px solid #ffd70044",borderRadius:4,padding:"1px 6px",fontFamily:"'Fira Code',monospace",fontSize:8,color:"#ffd700"}}>🏆 WINNER</span>)}
                      {!isWinner&&corr&&!isFirst&&(<span style={{background:"rgba(57,255,20,0.1)",border:"1px solid #39ff1433",borderRadius:4,padding:"1px 5px",fontFamily:"'Fira Code',monospace",fontSize:8,color:"#39ff14"}}>✓ CORRECT</span>)}
                      {!isWinner&&isFirst&&gradingActive&&(<span style={{background:"rgba(255,215,0,0.15)",border:"1px solid #ffd70044",borderRadius:4,padding:"1px 5px",fontFamily:"'Fira Code',monospace",fontSize:8,color:"#ffd700"}}>FIRST CORRECT</span>)}
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                      <span style={{fontFamily:"'Fira Code',monospace",fontSize:8,color:"rgba(255,255,255,0.3)"}}>{new Date(a.ts).toLocaleDateString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span>
                      {isAdmin&&!isLocked&&(
                        <button onClick={()=>deleteSubmission(a)} disabled={saving}
                          style={{background:"rgba(255,45,120,0.1)",border:"1px solid #ff2d7844",borderRadius:6,color:"#ff2d78",padding:"1px 6px",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:10}}>✕</button>
                      )}
                    </div>
                  </div>
                  <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.75)",margin:0}}>{a.answer}</p>
                </Glass>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

function RiddleApp(){
  const [auth,setAuth]=useState(null);
  const [riddleMap,setRiddleMap]=useState({});
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState(null);
  const isMobile=useIsMobile();

  useEffect(()=>{
    const role = localStorage.getItem("cn_role");
    if(!role){ window.location.href="index.html"; return; }
    setAuth({role,username:localStorage.getItem("cn_username")});
    (async()=>{
      try{ setRiddleMap(await window.fbRiddles.getAll()); }catch(e){console.warn(e);}
      setLoading(false);
    })();
  },[]);

  if(!auth||loading) return <LoadingScreen status="Loading riddle..."/>;
  const isAdmin=auth.role==="admin", isStudent=auth.role==="student";

  return(
    <>
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",
        background:"radial-gradient(ellipse 60% 50% at 80% 20%,rgba(57,255,20,0.06) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(0,207,255,0.07) 0%,transparent 70%),#060609"}}/>
      <div style={{display:"flex",flexDirection:isMobile?"column":"row",minHeight:"100vh",position:"relative",zIndex:1,width:"100%"}}>
        {isMobile
          ?<MobileNav active="riddle" isAdmin={isAdmin} isStudent={isStudent} studentUsername={auth.username}/>
          :<Sidebar active="riddle" isAdmin={isAdmin} isStudent={isStudent} studentUsername={auth.username}/>
        }
        <div style={{flex:1,overflowY:"auto",...(isMobile?{}:{height:"100vh"})}}>
          <RiddleTab setToast={setToast} isAdmin={isAdmin} isStudent={isStudent} studentUsername={auth.username} riddleMap={riddleMap} setRiddleMap={setRiddleMap}/>
        </div>
      </div>
      {toast&&<Toast msg={toast.msg} color={toast.color||"#39ff14"} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<RiddleApp/>);
</script>
</body>
</html>
