<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Code Ninjas – Tutorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@400;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#060609;color:#fff;}
#root{min-height:100vh;display:flex;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(57,255,20,0.3);border-radius:99px;}
select option{background:#0a0a0f;color:#fff;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:768px){#root{flex-direction:column;}}
</style>
</head>
<body>
<div id="root"></div>
<script src="shared.js"></script>
<script type="text/babel">
const {useState,useEffect} = React;

function Glass({children,style={},onClick,onMouseEnter,onMouseLeave}){
  return(
    <div onClick={onClick} onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave} style={{
      background:"rgba(255,255,255,0.06)",backdropFilter:"blur(18px)",WebkitBackdropFilter:"blur(18px)",
      border:"1px solid rgba(255,255,255,0.12)",borderRadius:16,
      boxShadow:"0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08)",...style
    }}>{children}</div>
  );
}
function LoadingScreen({status}){
  return(
    <div style={{position:"fixed",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#060609",zIndex:200,gap:16,padding:16}}>
      <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:13,color:"#39ff14",letterSpacing:2}}>LOADING DOJO...</div>
      <div style={{width:36,height:36,border:"3px solid rgba(57,255,20,0.2)",borderTop:"3px solid #39ff14",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <div style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.3)"}}>{status}</div>
    </div>
  );
}
function useIsMobile(){
  const [mobile,setMobile]=useState(window.innerWidth<=768);
  useEffect(()=>{const h=()=>setMobile(window.innerWidth<=768);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);
  return mobile;
}
const NAV = window.CN_NAV;
function doLogout(){ window.cnSession.logout(); }

function MobileNav({active,isAdmin,isStudent,studentUsername}){
  const [open,setOpen]=useState(false);
  return(
    <div style={{position:"sticky",top:0,zIndex:50,background:"rgba(6,6,9,0.95)",backdropFilter:"blur(16px)",borderBottom:"1px solid rgba(255,255,255,0.08)",padding:"10px 16px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:900,fontSize:11,color:"#39ff14",letterSpacing:1}}>CODE NINJAS <span style={{fontFamily:"'Fira Code',monospace",fontSize:8,color:"rgba(255,255,255,0.3)",letterSpacing:2}}>ROBBINSVILLE</span></div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{padding:"3px 8px",borderRadius:99,
            background:isAdmin?"rgba(57,255,20,0.12)":isStudent?"rgba(255,215,0,0.1)":"rgba(0,207,255,0.1)",
            border:`1px solid ${isAdmin?"#39ff1444":isStudent?"#ffd70044":"#00cfff44"}`,
            fontFamily:"'Fira Code',monospace",fontSize:9,
            color:isAdmin?"#39ff14":isStudent?"#ffd700":"#00cfff",
            maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
            {isAdmin?"🔐 ADMIN":isStudent?`🥷 ${studentUsername}`:"👀 GUEST"}
          </div>
          <button onClick={()=>setOpen(!open)} style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,color:"#fff",padding:"6px 10px",cursor:"pointer",fontSize:16}}>{open?"✕":"☰"}</button>
        </div>
      </div>
      {open&&(
        <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:4}}>
          {NAV.map(item=>(
            <button key={item.id} onClick={()=>{window.location.href=item.href;}} style={{
              display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:10,border:"none",cursor:"pointer",
              fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:13,textAlign:"left",
              background:active===item.id?"linear-gradient(135deg,rgba(57,255,20,0.18),rgba(0,207,255,0.12))":"rgba(255,255,255,0.04)",
              color:active===item.id?"#fff":"rgba(255,255,255,0.6)"}}>
              <span style={{fontSize:18}}>{item.icon}</span>{item.label}
            </button>
          ))}
          <button onClick={doLogout} style={{padding:"9px 14px",borderRadius:10,border:"1px solid rgba(255,45,120,0.3)",background:"rgba(255,45,120,0.08)",color:"#ff2d78",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:10,letterSpacing:1}}>← LOG OUT</button>
        </div>
      )}
    </div>
  );
}
function Sidebar({active,isAdmin,isStudent,studentUsername}){
  return(
    <div style={{width:210,flexShrink:0,height:"100vh",display:"flex",flexDirection:"column",padding:"22px 14px",gap:6,
      background:"rgba(0,0,0,0.35)",backdropFilter:"blur(24px)",WebkitBackdropFilter:"blur(24px)",
      borderRight:"1px solid rgba(255,255,255,0.06)",zIndex:10,position:"sticky",top:0}}>
      <div style={{padding:"10px 10px 20px",textAlign:"center"}}>
        <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:900,fontSize:11,letterSpacing:1.5,color:"#39ff14",lineHeight:1.4}}>CODE NINJAS</div>
        <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)",letterSpacing:2,marginTop:2}}>ROBBINSVILLE</div>
        <div style={{width:36,height:2,background:"linear-gradient(90deg,#39ff14,#00cfff)",margin:"10px auto 8px",borderRadius:99}}/>
        <div style={{display:"inline-flex",alignItems:"center",gap:5,
          background:isAdmin?"rgba(57,255,20,0.12)":isStudent?"rgba(255,215,0,0.1)":"rgba(0,207,255,0.1)",
          border:`1px solid ${isAdmin?"#39ff1444":isStudent?"#ffd70044":"#00cfff44"}`,borderRadius:99,padding:"4px 10px"}}>
          <span style={{fontSize:10}}>{isAdmin?"🔐":isStudent?"🥷":"👀"}</span>
          <span style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:isAdmin?"#39ff14":isStudent?"#ffd700":"#00cfff",letterSpacing:1,maxWidth:90,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
            {isAdmin?"ADMIN":isStudent?studentUsername:"GUEST"}
          </span>
        </div>
      </div>
      {NAV.map(item=>(
        <button key={item.id} onClick={()=>{window.location.href=item.href;}} style={{
          display:"flex",alignItems:"center",gap:10,padding:"11px 14px",borderRadius:11,border:"none",cursor:"pointer",
          fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:12,transition:"all .2s",textAlign:"left",
          background:active===item.id?"linear-gradient(135deg,rgba(57,255,20,0.18),rgba(0,207,255,0.12))":"transparent",
          color:active===item.id?"#fff":"rgba(255,255,255,0.4)",
          boxShadow:active===item.id?"inset 0 0 0 1px rgba(57,255,20,0.3),0 0 16px rgba(57,255,20,0.1)":"none"}}
          onMouseEnter={e=>{if(active!==item.id){e.currentTarget.style.background="rgba(255,255,255,0.05)";e.currentTarget.style.color="#fff";}}}
          onMouseLeave={e=>{if(active!==item.id){e.currentTarget.style.background="transparent";e.currentTarget.style.color="rgba(255,255,255,0.4)";}}}>
          <span style={{fontSize:17}}>{item.icon}</span>{item.label}
        </button>
      ))}
      <div style={{marginTop:"auto",padding:"0 0 4px"}}>
        <Glass style={{padding:"11px 14px",marginBottom:8}}>
          <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)",letterSpacing:1,marginBottom:3}}>CURRENT</div>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:12,color:"#39ff14"}}>WEEK {window.getCurrentWeek()}</div>
        </Glass>
        <button onClick={doLogout} style={{width:"100%",padding:"9px",borderRadius:9,border:"1px solid rgba(255,255,255,0.1)",
          background:"rgba(255,255,255,0.03)",color:"rgba(255,255,255,0.35)",cursor:"pointer",
          fontFamily:"'Fira Code',monospace",fontSize:10,letterSpacing:1,transition:"all .2s"}}
          onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,45,120,0.1)";e.currentTarget.style.borderColor="#ff2d7844";e.currentTarget.style.color="#ff2d78";}}
          onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.03)";e.currentTarget.style.borderColor="rgba(255,255,255,0.1)";e.currentTarget.style.color="rgba(255,255,255,0.35)";}}>
          ← LOG OUT
        </button>
      </div>
    </div>
  );
}

// -------------------------------------------------------------------------
// Walkthrough content — short, punchy steps shown one at a time in a popup,
// not a long scrolling document. Content differs for Sensei vs Ninja.
// -------------------------------------------------------------------------
const NINJA_STEPS = [
  {icon:"🔑",title:"Logging in",color:"#ffd700",
    body:<>Ask your Sensei to enter you into <b style={{color:"#ffd700"}}>Points</b> for the day. Then go to the login screen and type your <b>username</b> (like <code style={{color:"#00cfff"}}>first.last</code>) — no password needed as a ninja.</>},
  {icon:"⏳",title:"Your 2-hour access window",color:"#ffd700",
    body:<>You can only log in if you've been entered into Points <b>today</b>, and only for <b>2 hours</b> after that entry. After that (or after closing your tab), you'll be signed out — just ask your Sensei to enter you again.</>},
  {icon:"📱",title:"One device at a time",color:"#ffd700",
    body:<>Only one device can be logged into your account at once. If you try to log in somewhere else while already signed in, it'll be blocked — log out on your old device first.</>},
  {icon:"🏆",title:"Points",color:"#39ff14",
    body:<>See the weekly leaderboard, ranked by points earned each day. Your Sensei adds your daily score — check back to see how you and your friends rank!</>},
  {icon:"🧩",title:"Riddle of the Week",color:"#39ff14",
    body:<>Submit your best guess to the weekly riddle. Your Sensei locks in a winner once the week ends — sometimes nobody gets it right, and that's okay too!</>},
  {icon:"⭐",title:"Ninja of the Month",color:"#39ff14",
    body:<>A monthly hall of fame showing the top-scoring ninja each month, plus an all-time "best month ever" leaderboard.</>},
  {icon:"📊",title:"Polls",color:"#39ff14",
    body:<>Vote in polls your Sensei creates. Your voice helps decide dojo activities, game nights, and more!</>},
  {icon:"📍",title:"In The Dojo",color:"#39ff14",
    body:<>See which ninjas are currently checked in — a live view of who's in the dojo right now.</>},
  {icon:"🎮",title:"Games",color:"#39ff14",
    body:<>Games unlock only when your Sensei starts your break time from "In The Dojo." Once it's on, enjoy Memory Match or Dino Runner until your break ends!</>},
  {icon:"💬",title:"Ninja Chat",color:"#39ff14",
    body:<>Chat with other ninjas in a friendly, moderated space. Inappropriate language is automatically blocked, and Senseis can remove any message.</>},
];

const ADMIN_STEPS = [
  {icon:"🔐",title:"Logging in as Sensei",color:"#39ff14",
    body:<>On the login screen, enter the shared <b style={{color:"#39ff14"}}>Sensei password</b> instead of a username. Multiple Senseis can be signed in on their own devices at the same time.</>},
  {icon:"🏆",title:"Adding ninjas to Points",color:"#39ff14",
    body:<>Go to <b>Points</b> and use "+ Add Entry" to log a ninja's first name and their score for today. This is also what unlocks that ninja's 2-hour login window.</>},
  {icon:"🧩",title:"Managing the Riddle",color:"#39ff14",
    body:<>Set the weekly riddle text and answer, review submissions, and lock in a winner. If nobody solves it, choose <b>"No One"</b> instead of picking a name.</>},
  {icon:"⭐",title:"Ninja of the Month",color:"#39ff14",
    body:<>Add or remove monthly point totals per ninja. The highest score each month wins, and the all-time "Hall of Fame" tracks each ninja's best month ever.</>},
  {icon:"📊",title:"Polls",color:"#39ff14",
    body:<>Create new polls, watch votes roll in live, and archive or delete old polls once they're no longer needed.</>},
  {icon:"📍",title:"In The Dojo & Break Time",color:"#39ff14",
    body:<>See every ninja currently within their 2-hour window. From here, start or end a ninja's break — starting a break unlocks Games for that student, for up to 10 minutes.</>},
  {icon:"💬",title:"Moderating Ninja Chat",color:"#39ff14",
    body:<>As Sensei, you can delete any message in Ninja Chat by hovering over it and clicking "✕ delete." The filter blocks most inappropriate language automatically, but you're always the final backstop.</>},
  {icon:"🖥️",title:"Session rules",color:"#39ff14",
    body:<>Closing your tab signs you out immediately. Unlike ninjas, Senseis can be signed in on more than one device at once.</>},
];

// -------------------------------------------------------------------------
// Popup walkthrough — one step at a time, not a long written page.
// -------------------------------------------------------------------------
function WalkthroughModal({steps, roleLabel, roleIcon, roleColor, onClose}){
  const [i,setI]=useState(0);
  const step = steps[i];
  const last = i===steps.length-1;
  return(
    <div style={{position:"fixed",inset:0,zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",
      background:"rgba(0,0,0,0.72)",backdropFilter:"blur(6px)",WebkitBackdropFilter:"blur(6px)",padding:16}}
      onClick={onClose}>
      <Glass style={{width:"100%",maxWidth:440,padding:"26px 26px 22px",position:"relative",borderColor:`${roleColor}44`,
        boxShadow:`0 8px 40px rgba(0,0,0,0.55),0 0 30px ${roleColor}22`,animation:"fadeUp .35s ease both"}}
        onClick={e=>e.stopPropagation()}>
        <button onClick={onClose} style={{position:"absolute",top:14,right:14,background:"rgba(255,255,255,0.08)",
          border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,color:"rgba(255,255,255,0.6)",width:28,height:28,
          cursor:"pointer",fontSize:13}}>✕</button>

        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:18}}>
          <span style={{fontSize:16}}>{roleIcon}</span>
          <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,letterSpacing:1.5,color:roleColor}}>{roleLabel} WALKTHROUGH</span>
        </div>

        <div key={i} style={{animation:"fadeUp .3s ease both",minHeight:150}}>
          <div style={{fontSize:34,marginBottom:10}}>{step.icon}</div>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:16,color:"#fff",marginBottom:10,letterSpacing:.5}}>{step.title}</h3>
          <div style={{fontFamily:"'Exo 2',sans-serif",fontSize:13.5,color:"rgba(255,255,255,0.65)",lineHeight:1.65}}>{step.body}</div>
        </div>

        <div style={{display:"flex",justifyContent:"center",gap:6,margin:"20px 0 18px"}}>
          {steps.map((s,idx)=>(
            <div key={idx} onClick={()=>setI(idx)} style={{width:idx===i?18:6,height:6,borderRadius:99,cursor:"pointer",
              background:idx===i?roleColor:"rgba(255,255,255,0.18)",transition:"all .2s"}}/>
          ))}
        </div>

        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setI(Math.max(0,i-1))} disabled={i===0} style={{flex:1,padding:"11px",borderRadius:10,
            border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.04)",
            color:i===0?"rgba(255,255,255,0.2)":"rgba(255,255,255,0.7)",cursor:i===0?"not-allowed":"pointer",
            fontFamily:"'Fira Code',monospace",fontSize:11,letterSpacing:1}}>← BACK</button>
          <button onClick={()=>last?onClose():setI(i+1)} style={{flex:1,padding:"11px",borderRadius:10,border:"none",
            background:`linear-gradient(135deg,${roleColor},#00cfff)`,color:"#000",cursor:"pointer",
            fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11,letterSpacing:1}}>
            {last?"FINISH ✓":"NEXT →"}
          </button>
        </div>
        <div style={{textAlign:"center",marginTop:12,fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.25)"}}>
          Step {i+1} of {steps.length}
        </div>
      </Glass>
    </div>
  );
}

function TutorialLauncher({isAdmin,onOpen}){
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <Glass style={{padding:"clamp(28px,4vw,44px)",maxWidth:460,textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:14}}>{isAdmin?"🔐":"🥷"}</div>
        <h1 style={{fontFamily:"'Orbitron',sans-serif",fontSize:"clamp(18px,2.4vw,24px)",fontWeight:900,marginBottom:10}}>
          {isAdmin?"Sensei Walkthrough":"Ninja Walkthrough"}
        </h1>
        <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:13,color:"rgba(255,255,255,0.5)",lineHeight:1.6,marginBottom:22}}>
          A quick guided tour of the dashboard, made for {isAdmin?"Senseis":"ninjas"} like you.
        </p>
        <button onClick={onOpen} style={{padding:"12px 28px",borderRadius:99,border:"none",cursor:"pointer",
          background:"linear-gradient(135deg,#39ff14,#00cfff)",color:"#000",
          fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:12,letterSpacing:1}}>
          ▶ START WALKTHROUGH
        </button>
        <div style={{marginTop:16}}>
          <button onClick={()=>window.location.href="home.html"} style={{padding:"9px 18px",borderRadius:10,
            border:"1px solid rgba(255,255,255,0.12)",background:"transparent",color:"rgba(255,255,255,0.4)",
            cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:10,letterSpacing:1}}>
            ← Back to Dashboard
          </button>
        </div>
      </Glass>
    </div>
  );
}

function TutorialApp(){
  const [checked,setChecked]=useState(false);
  const [session,setSession]=useState(null);
  const [open,setOpen]=useState(true);
  const isMobile=useIsMobile();

  useEffect(()=>{
    // Tutorial requires an active Sensei or Ninja login — guests and signed-out
    // visitors are redirected, since the walkthrough only makes sense once
    // someone knows which role they're using.
    const s = window.cnSession.getSession();
    if(!s || window.cnSession.isExpired(s)){ window.location.href = "index.html"; return; }
    if(s.role === "guest"){ window.location.href = "home.html"; return; }
    window.cnSession.resumeHeartbeat();
    setSession(s);
    setChecked(true);
  },[]);

  if(!checked || !session) return <LoadingScreen status="Loading walkthrough..."/>;

  const isAdmin = session.role==="admin";
  const isStudent = session.role==="student";
  const steps = isAdmin ? ADMIN_STEPS : NINJA_STEPS;

  return(
    <>
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",
        background:"radial-gradient(ellipse 60% 50% at 80% 20%,rgba(57,255,20,0.06) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(0,207,255,0.07) 0%,transparent 70%),#060609"}}/>
      <div style={{display:"flex",flexDirection:isMobile?"column":"row",minHeight:"100vh",position:"relative",zIndex:1,width:"100%"}}>
        {isMobile
          ?<MobileNav active="tutorial" isAdmin={isAdmin} isStudent={isStudent} studentUsername={session.username}/>
          :<Sidebar active="tutorial" isAdmin={isAdmin} isStudent={isStudent} studentUsername={session.username}/>
        }
        <div style={{flex:1,overflowY:"auto",...(isMobile?{}:{height:"100vh"})}}>
          <TutorialLauncher isAdmin={isAdmin} onOpen={()=>setOpen(true)}/>
        </div>
      </div>
      {open && <WalkthroughModal steps={steps} roleLabel={isAdmin?"SENSEI":"NINJA"} roleIcon={isAdmin?"🔐":"🥷"}
        roleColor={isAdmin?"#39ff14":"#ffd700"} onClose={()=>setOpen(false)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TutorialApp/>);
</script>
</body>
</html>
