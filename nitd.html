// Matches a Points first name (e.g. "Adam") to a registered username
// (e.g. "adam.dodo") by comparing first names only.
function findLinkedAccount(firstName, usernames){
  const target = String(firstName).trim().toLowerCase();
  if(!target) return null;
  let match = usernames.find(u=>{
    const seg = u.split(".")[0];
    return seg && seg.toLowerCase()===target;
  });
  if(match) return match;
  match = usernames.find(u=>u.toLowerCase()===target);
  return match || null;
}

// Drops any break flags that have passed their duration, and best-effort
// clears them out of Firebase so other admins see "Start Break" again.
function cleanExpiredBreaks(breaks){
  const cleaned = {};
  Object.entries(breaks).forEach(([key,entry])=>{
    if(window.cnIsBreakActive(entry)) cleaned[key]=entry;
    else if(entry) window.fbBreak.setBreak(key,false).catch(()=>{});
  });
  return cleaned;
}

function todayLabel(){
  return new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});

// Opens the standalone Kiosk display in its own popup window — meant to be
// dragged onto a second HDMI monitor and left open. It reads goals/breaks
// live from Firebase, so nothing further is needed from this tab to keep it
// in sync.
function openKioskDisplay(){
  const w = 1280, h = 800;
  window.open("kiosk.html","cnKioskDisplay",
    `width=${w},height=${h},menubar=no,toolbar=no,location=no,status=no,resizable=yes,scrollbars=yes`);
}

// Inline per-ninja goal assignment: a section dropdown + short goal text,
// saved straight to Firebase. Every open Kiosk window (and every other
// Sensei's "In The Dojo" tab) picks the change up immediately via
// window.fbGoals.listen — no refresh needed anywhere.
function GoalEditor({account,current}){
  const [editing,setEditing]=useState(false);
  const [section,setSection]=useState((current&&current.section)||window.CN_SECTIONS[0]);
  const [goal,setGoal]=useState((current&&current.goal)||"");
  const [saving,setSaving]=useState(false);

  useEffect(()=>{
    if(!editing){
      setSection((current&&current.section)||window.CN_SECTIONS[0]);
      setGoal((current&&current.goal)||"");
    }
  },[current,editing]);

  async function save(){
    if(!account||saving) return;
    setSaving(true);
    try{
      await window.fbGoals.setGoal(window.cnKeySafe(account), account, section, goal.trim());
      setEditing(false);
    }catch(e){ console.warn(e); alert("Couldn't save the goal. Please try again."); }
    setSaving(false);
  }
  async function clear(){
    if(!account||saving) return;
    setSaving(true);
    try{ await window.fbGoals.clearGoal(window.cnKeySafe(account)); setEditing(false); }
    catch(e){ console.warn(e); }
    setSaving(false);
  }

  if(!editing){
    return(
      <div style={{marginTop:8,padding:"8px 10px",borderRadius:8,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:6}}>
          <div style={{overflow:"hidden"}}>
            {current&&current.goal?(
              <>
                <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"#00cfff",letterSpacing:.5}}>{current.section||"—"}</div>
                <div style={{fontFamily:"'Exo 2',sans-serif",fontSize:11.5,color:"rgba(255,255,255,0.8)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  🎯 {current.goal}
                </div>
              </>
            ):(
              <div style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)"}}>No goal set yet</div>
            )}
          </div>
          {account&&(
            <button onClick={()=>setEditing(true)} style={{flexShrink:0,background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",
              borderRadius:7,color:"rgba(255,255,255,0.7)",padding:"5px 9px",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:9}}>
              ✏ {current&&current.goal?"Edit":"Assign"}
            </button>
          )}
        </div>
      </div>
    );
  }

  return(
    <div style={{marginTop:8,padding:"10px",borderRadius:8,background:"rgba(0,207,255,0.06)",border:"1px solid #00cfff33"}}>
      <select value={section} onChange={e=>setSection(e.target.value)} style={{width:"100%",marginBottom:6,padding:"6px 8px",borderRadius:6,
        background:"rgba(0,0,0,0.4)",border:"1px solid rgba(255,255,255,0.15)",color:"#fff",fontFamily:"'Fira Code',monospace",fontSize:10}}>
        {window.CN_SECTIONS.map(s=><option key={s} value={s}>{s}</option>)}
      </select>
      <input value={goal} onChange={e=>setGoal(e.target.value)} placeholder="Project goal (e.g. Finish the maze level)"
        style={{width:"100%",marginBottom:8,padding:"6px 8px",borderRadius:6,background:"rgba(0,0,0,0.4)",
          border:"1px solid rgba(255,255,255,0.15)",color:"#fff",fontFamily:"'Exo 2',sans-serif",fontSize:11}}/>
      <div style={{display:"flex",gap:6}}>
        <button onClick={save} disabled={saving} style={{flex:1,padding:"7px",borderRadius:7,border:"none",cursor:saving?"not-allowed":"pointer",
          background:"linear-gradient(135deg,#39ff14,#00cfff)",color:"#000",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:9,letterSpacing:.5}}>
          {saving?"...":"💾 Save"}
        </button>
        {current&&current.goal&&(
          <button onClick={clear} disabled={saving} style={{padding:"7px 10px",borderRadius:7,border:"1px solid rgba(255,45,120,0.4)",
            cursor:saving?"not-allowed":"pointer",background:"rgba(255,45,120,0.1)",color:"#ff2d78",fontFamily:"'Fira Code',monospace",fontSize:9}}>
            Clear
          </button>
        )}
        <button onClick={()=>setEditing(false)} disabled={saving} style={{padding:"7px 10px",borderRadius:7,border:"1px solid rgba(255,255,255,0.15)",
          cursor:saving?"not-allowed":"pointer",background:"rgba(255,255,255,0.05)",color:"rgba(255,255,255,0.6)",fontFamily:"'Fira Code',monospace",fontSize:9}}>
          Cancel
        </button>
      </div>
    </div>
  );
}

function NITDTab({allEntries,usernames,breakStatuses,goals,locks,isAdmin,onRefresh,refreshing,onBreakChanged}){
  const today = window.todayStr();
  const todayEntries = allEntries.filter(e=>e.date===today);
  const [togglingAccount,setTogglingAccount]=useState(null);
  const [nowTick,setNowTick]=useState(Date.now());

  useEffect(()=>{
    const iv=setInterval(()=>setNowTick(Date.now()),15000);
    return ()=>clearInterval(iv);
  },[]);

  // Group by ninja name -> total points today, attempt count, and the most
  // recent createdAt timestamp. A ninja only shows as "checked in" here while
  // that timestamp is within the last SESSION_HOURS — this mirrors the exact
  // window that controls whether their login still works, so "In The Dojo"
  // always reflects who can currently sign in.
  const map = {};
  todayEntries.forEach(e=>{
    if(!e||!e.name) return; // skip malformed entries instead of crashing
    const key = e.name.trim().toLowerCase();
    if(!map[key]) map[key]={name:e.name.trim(),points:0,attempts:0,lastSeen:0};
    map[key].name = e.name.trim(); // keep most-recent casing for display
    map[key].points += e.points;
    map[key].attempts += 1;
    map[key].lastSeen = Math.max(map[key].lastSeen, e.createdAt||0);
  });
  const allToday = Object.values(map);
  const present = allToday
    .filter(p => p.lastSeen && (nowTick - p.lastSeen <= window.SESSION_MS))
    .sort((a,b)=>b.lastSeen-a.lastSeen);
  const expiredCount = allToday.length - present.length;

  // Per-ninja selected break length (minutes), used only when starting a break.
  // Defaults to the last preset picked; a custom number can override it too.
  const [breakMinutes,setBreakMinutes]=useState({}); // {account: minutes}
  const [customBreakInput,setCustomBreakInput]=useState({}); // {account: raw text typed into the custom box}
  function getBreakMinutes(account){ return breakMinutes[account] || 10; }
  function setBreakMinutesFor(account, minutes){ setBreakMinutes(prev=>({...prev,[account]:minutes})); }
  function setCustomBreakInputFor(account, raw){
    setCustomBreakInput(prev=>({...prev,[account]:raw}));
    const n = parseInt(raw,10);
    if(Number.isFinite(n) && n>0) setBreakMinutesFor(account, Math.min(240,n));
  }

  async function handleBreakToggle(account, currentlyOn){
    if(!account || togglingAccount) return;
    const durationMin = currentlyOn ? null : getBreakMinutes(account);
    const pw = window.prompt(`Enter Sensei password to ${currentlyOn?"end":`start a ${durationMin}-minute`} break for ${account}:`);
    if(pw===null) return;
    if(pw!==window.CN_ADMIN_PASS){ alert("Incorrect password."); return; }
    setTogglingAccount(account);
    try{
      await window.fbBreak.setBreak(window.cnKeySafe(account), !currentlyOn, currentlyOn ? undefined : durationMin*60*1000);
      if(!currentlyOn) setCustomBreakInputFor(account,"");
      await onBreakChanged();
    } catch(e){ console.warn(e); alert("Something went wrong updating break status. Please try again."); }
    setTogglingAccount(null);
  }

  const [endingAccount,setEndingAccount]=useState(null);
  async function handleEndSession(account){
    if(!account || endingAccount) return;
    if(!window.cnSession || typeof window.cnSession.endSession !== "function"){
      alert("This site's shared.js is out of date and doesn't have the End Session feature yet — please update shared.js (and reload) and try again.");
      return;
    }
    if(!window.confirm(`End ${account}'s session immediately? They'll be signed out right away (even mid-page) and won't be able to log back in until you press "Unlock Session".`)) return;
    const pw = window.prompt(`Enter Sensei password to end the session for ${account}:`);
    if(pw===null) return;
    if(pw!==window.CN_ADMIN_PASS){ alert("Incorrect password."); return; }
    setEndingAccount(account);
    try{
      await window.cnSession.endSession(window.cnKeySafe(account));
      await onRefresh();
    } catch(e){ console.warn(e); alert("Something went wrong ending the session: "+(e&&e.message?e.message:e)); }
    setEndingAccount(null);
  }

  const [unlockingAccount,setUnlockingAccount]=useState(null);
  async function handleUnlockSession(account){
    if(!account || unlockingAccount) return;
    if(!window.cnSession || typeof window.cnSession.unlockSession !== "function"){
      alert("This site's shared.js is out of date and doesn't have the Unlock Session feature yet — please update shared.js (and reload) and try again.");
      return;
    }
    const pw = window.prompt(`Enter Sensei password to unlock ${account}'s account:`);
    if(pw===null) return;
    if(pw!==window.CN_ADMIN_PASS){ alert("Incorrect password."); return; }
    setUnlockingAccount(account);
    try{
      await window.cnSession.unlockSession(window.cnKeySafe(account));
      await onRefresh();
    } catch(e){ console.warn(e); alert("Something went wrong unlocking the session: "+(e&&e.message?e.message:e)); }
    setUnlockingAccount(null);
  }

  return(
    <div style={{padding:"clamp(16px,3vw,28px) clamp(14px,3vw,36px)",animation:"fadeUp .4s ease both"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8,flexWrap:"wrap"}}>
        <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:"clamp(15px,2vw,22px)",color:"#fff",margin:0,
          background:"linear-gradient(135deg,#00cfff,#39ff14)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
          📍 Ninjas In The Dojo
        </h2>
        <div style={{display:"flex",alignItems:"center",gap:6,padding:"4px 12px",borderRadius:99,
          background:"rgba(57,255,20,0.1)",border:"1px solid #39ff1444"}}>
          <span style={{width:7,height:7,borderRadius:"50%",background:"#39ff14",animation:"pulseDot 1.6s ease-in-out infinite"}}/>
          <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"#39ff14"}}>LIVE</span>
        </div>
        {isAdmin&&(
          <button onClick={openKioskDisplay}
            style={{marginLeft:"auto",background:"rgba(57,255,20,0.1)",border:"1px solid #39ff1444",
              borderRadius:8,color:"#39ff14",padding:"6px 14px",cursor:"pointer",
              fontFamily:"'Fira Code',monospace",fontSize:11}}>
            🖥️ Open Kiosk Display
          </button>
        )}
        <button onClick={onRefresh} disabled={refreshing}
          style={{marginLeft:isAdmin?0:"auto",background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",
            borderRadius:8,color:"rgba(255,255,255,0.6)",padding:"6px 14px",cursor:refreshing?"not-allowed":"pointer",
            fontFamily:"'Fira Code',monospace",fontSize:11}}>
          {refreshing?"↻ Refreshing...":"↻ Refresh"}
        </button>
      </div>
      <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.35)",marginBottom:24}}>
        {todayLabel()} · Ninjas with a Points entry logged in the last {window.SESSION_HOURS} hours
        {expiredCount>0?` · ${expiredCount} more checked in earlier today but their ${window.SESSION_HOURS}h window has closed`:""}
      </p>

      <Glass style={{padding:"16px 20px",marginBottom:24,borderColor:"#00cfff33",background:"rgba(0,207,255,0.05)"}}>
        <div style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
          <div style={{fontSize:30}}>🥷</div>
          <div>
            <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:20,color:"#00cfff"}}>{present.length}</div>
            <div style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)"}}>ninja{present.length!==1?"s":""} currently in the dojo</div>
          </div>
        </div>
      </Glass>

      {present.length===0?(
        <Glass style={{padding:40,textAlign:"center"}}>
          <p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.4)",fontSize:15}}>
            No ninjas currently checked in. Once a Sensei enters someone into Points, they'll show up here for {window.SESSION_HOURS} hours! 🥷
          </p>
        </Glass>
      ):(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:14}}>
          {present.map((p,i)=>{
            const account = findLinkedAccount(p.name, usernames);
            const breakEntry = account ? breakStatuses[window.cnKeySafe(account)] : null;
            const onBreak = window.cnIsBreakActive(breakEntry);
            const remainingMin = onBreak ? Math.max(1,Math.ceil((breakEntry.startedAt+window.cnBreakDurationMs(breakEntry)-nowTick)/60000)) : 0;
            const accessRemainingMs = Math.max(0,(p.lastSeen+window.SESSION_MS)-nowTick);
            const accessRemainingMin = Math.ceil(accessRemainingMs/60000);
            const locked = account ? !!(locks && locks[window.cnKeySafe(account)]) : false;
            return(
              <Glass key={p.name} style={{padding:"16px 18px",borderColor:"rgba(57,255,20,0.2)",
                animation:`fadeUp .35s ease both ${i*.04}s`}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                  <div style={{width:36,height:36,borderRadius:"50%",background:"linear-gradient(135deg,#39ff14,#00cfff)",
                    display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>🥷</div>
                  <div style={{overflow:"hidden"}}>
                    <div style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:14,color:"#fff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {p.name}
                    </div>
                    {account?(
                      <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"#00cfff",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                        🔗 {account}
                      </div>
                    ):(
                      <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)"}}>
                        ⚠ no linked account
                      </div>
                    )}
                  </div>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",fontFamily:"'Fira Code',monospace",fontSize:10,marginBottom:6}}>
                  <span style={{color:"rgba(255,255,255,0.35)"}}>{p.attempts} attempt{p.attempts!==1?"s":""} today</span>
                  <span style={{color:"#39ff14",fontWeight:700}}>{p.points.toLocaleString()} pts</span>
                </div>
                <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:accessRemainingMin<=15?"#ff2d78":"rgba(255,255,255,0.3)"}}>
                  🔑 login access: {accessRemainingMin}m left
                </div>
                {locked&&(
                  <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"#ff2d78",fontWeight:700,marginTop:2}}>
                    🔒 locked by Sensei — can't log back in
                  </div>
                )}
                {isAdmin?(
                  <GoalEditor account={account} current={account?goals[window.cnKeySafe(account)]:null}/>
                ):(account && goals[window.cnKeySafe(account)] && goals[window.cnKeySafe(account)].goal)?(
                  <div style={{marginTop:8,padding:"8px 10px",borderRadius:8,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)"}}>
                    <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"#00cfff",letterSpacing:.5}}>{goals[window.cnKeySafe(account)].section||"—"}</div>
                    <div style={{fontFamily:"'Exo 2',sans-serif",fontSize:11.5,color:"rgba(255,255,255,0.8)"}}>
                      🎯 {goals[window.cnKeySafe(account)].goal}
                    </div>
                  </div>
                ):null}
                <div style={{marginTop:isAdmin?8:0}}/>
                {isAdmin&&(
                  <>
                    {!onBreak&&account&&(
                      <div style={{marginBottom:6}}>
                        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:5}}>
                          {window.BREAK_DURATION_OPTIONS_MIN.map(min=>(
                            <button key={min} type="button" onClick={()=>{setBreakMinutesFor(account,min);setCustomBreakInputFor(account,"");}}
                              style={{flex:"1 0 auto",padding:"4px 7px",borderRadius:6,cursor:"pointer",
                                border:`1px solid ${getBreakMinutes(account)===min&&!customBreakInput[account]?"#39ff14":"rgba(255,255,255,0.15)"}`,
                                background:getBreakMinutes(account)===min&&!customBreakInput[account]?"rgba(57,255,20,0.14)":"rgba(255,255,255,0.04)",
                                color:getBreakMinutes(account)===min&&!customBreakInput[account]?"#39ff14":"rgba(255,255,255,0.5)",
                                fontFamily:"'Fira Code',monospace",fontSize:9,fontWeight:700}}>
                              {min}m
                            </button>
                          ))}
                        </div>
                        <div style={{display:"flex",alignItems:"center",gap:6}}>
                          <input type="number" min="1" max="240" placeholder="Custom min"
                            value={customBreakInput[account]||""}
                            onChange={e=>setCustomBreakInputFor(account,e.target.value)}
                            onClick={e=>e.stopPropagation()}
                            style={{width:"100%",padding:"5px 8px",borderRadius:6,
                              border:`1px solid ${customBreakInput[account]?"#39ff14":"rgba(255,255,255,0.15)"}`,
                              background:"rgba(255,255,255,0.04)",color:"#fff",
                              fontFamily:"'Fira Code',monospace",fontSize:10,outline:"none"}}/>
                          <span style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.35)",flexShrink:0}}>min</span>
                        </div>
                      </div>
                    )}
                    <button onClick={()=>handleBreakToggle(account,onBreak)}
                      disabled={!account||togglingAccount===account}
                      style={{width:"100%",padding:"8px",borderRadius:8,border:"none",
                        cursor:(!account||togglingAccount===account)?"not-allowed":"pointer",
                        background:!account?"rgba(255,255,255,0.06)":onBreak?"linear-gradient(135deg,#ff2d78,#ff8c00)":"linear-gradient(135deg,#39ff14,#00cfff)",
                        color:!account?"rgba(255,255,255,0.3)":"#000",
                        fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:10,letterSpacing:.5,marginBottom:8}}>
                      {togglingAccount===account?"...":!account?"🔒 No Account Linked":onBreak?`⏹ End Break (${remainingMin}m left)`:`▶ Start Break (${getBreakMinutes(account)}m)`}
                    </button>
                    {locked?(
                      <button onClick={()=>handleUnlockSession(account)}
                        disabled={!account||unlockingAccount===account}
                        style={{width:"100%",padding:"8px",borderRadius:8,
                          border:"1px solid rgba(57,255,20,0.4)",
                          cursor:(!account||unlockingAccount===account)?"not-allowed":"pointer",
                          background:"rgba(57,255,20,0.12)",
                          color:"#39ff14",
                          fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:10,letterSpacing:.5}}>
                        {unlockingAccount===account?"...":"🔓 Unlock Session"}
                      </button>
                    ):(
                      <button onClick={()=>handleEndSession(account)}
                        disabled={!account||endingAccount===account}
                        style={{width:"100%",padding:"8px",borderRadius:8,
                          border:!account?"1px solid rgba(255,255,255,0.1)":"1px solid rgba(255,45,120,0.4)",
                          cursor:(!account||endingAccount===account)?"not-allowed":"pointer",
                          background:!account?"rgba(255,255,255,0.03)":"rgba(255,45,120,0.1)",
                          color:!account?"rgba(255,255,255,0.25)":"#ff2d78",
                          fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:10,letterSpacing:.5}}>
                        {endingAccount===account?"...":!account?"⛔ No Account Linked":"⛔ End Session"}
                      </button>
                    )}
                  </>
                )}
              </Glass>
            );
          })}
        </div>
      )}
    </div>
  );
}

function NITDApp(){
  const {auth,ready} = window.useCnAuth();
  const [allEntries,setAllEntries]=useState([]);
  const [usernames,setUsernames]=useState([]);
  const [breakStatuses,setBreakStatuses]=useState({});
  const [goals,setGoals]=useState({});
  const [locks,setLocks]=useState({});
  const [loading,setLoading]=useState(true);
  const [refreshing,setRefreshing]=useState(false);
  const isMobile=useIsMobile();

  async function load(showSpinner){
    if(showSpinner) setRefreshing(true);
    try{
      const [entries,unames,breaks] = await Promise.all([
        window.fbLeaderboard.getAll(),
        window.fbUsernames.getAll(),
        window.fbBreak.getAll()
      ]);
      setAllEntries(entries);
      setUsernames(unames);
      setBreakStatuses(cleanExpiredBreaks(breaks));
    }catch(e){console.warn(e);}
    if(showSpinner) setRefreshing(false);
  }

  async function reloadBreakStatuses(){
    try{ setBreakStatuses(cleanExpiredBreaks(await window.fbBreak.getAll())); }catch(e){console.warn(e);}
  }

  useEffect(()=>{
    if(!ready) return;
    (async()=>{ await load(false); setLoading(false); })();
  },[ready]);

  useEffect(()=>{
    if(!auth) return;
    const iv=setInterval(()=>load(false),30000);
    return ()=>clearInterval(iv);
  },[auth]);

  // Goals are kept live (not polled) so an edit made here shows up on the
  // Kiosk popup — and on any other open Sensei tab — right away.
  useEffect(()=>{
    if(!auth) return;
    const unsub = window.fbGoals.listen(setGoals);
    return unsub;
  },[auth]);

  // Session locks are also kept live so a card flips to "Unlock Session"
  // immediately after End Session is pressed (from this tab or another).
  useEffect(()=>{
    if(!auth) return;
    if(!window.fbSessionLock || typeof window.fbSessionLock.listen !== "function") return;
    const unsub = window.fbSessionLock.listen(setLocks);
    return unsub;
  },[auth]);

  if(!auth||loading) return <LoadingScreen status="Checking the dojo..."/>;
  const isAdmin=auth.role==="admin", isStudent=auth.role==="student";

  return(
    <>
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",
        background:"radial-gradient(ellipse 60% 50% at 80% 20%,rgba(57,255,20,0.06) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(0,207,255,0.07) 0%,transparent 70%),#060609"}}/>
      <div style={{display:"flex",flexDirection:isMobile?"column":"row",minHeight:"100vh",position:"relative",zIndex:1,width:"100%"}}>
        {isMobile
          ?<MobileNav active="nitd" isAdmin={isAdmin} isStudent={isStudent} studentUsername={auth.username}/>
          :<Sidebar active="nitd" isAdmin={isAdmin} isStudent={isStudent} studentUsername={auth.username}/>
        }
        <div style={{flex:1,overflowY:"auto",...(isMobile?{}:{height:"100vh"})}}>
          <NITDTab allEntries={allEntries} usernames={usernames} breakStatuses={breakStatuses} goals={goals} locks={locks}
            isAdmin={isAdmin} onRefresh={()=>load(true)} refreshing={refreshing} onBreakChanged={reloadBreakStatuses}/>
        </div>
      </div>
      <TourOverlay/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NITDApp/>);
</script>
</body>
</html>
