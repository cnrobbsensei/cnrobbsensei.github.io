window.fbRiddles = {

    const val = snap.val() || {};

    for(const weekKey of Object.keys(val)){
      const wNum = parseInt(weekKey.replace("week_",""));
      const wData = val[weekKey];

      const subs = wData.submissions || {};

<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

const ADMIN_PASS = "Senseis";
const MAX_ATTEMPTS_PER_DAY = 3;

// ── Week utils ──────────────────────────────────────────────────────────────
const WEEK_START = new Date("2026-05-13T00:00:00");
function getCurrentWeek(){
  const diff = new Date() - WEEK_START;
  return diff < 0 ? 1 : Math.floor(diff/(7*24*60*60*1000))+1;
}
function getWeekLabel(n){
  const s = new Date(WEEK_START.getTime()+(n-1)*7*24*60*60*1000);
  const e = new Date(s.getTime()+6*24*60*60*1000);
  const fmt = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  return `Week ${n} (${fmt(s)} – ${fmt(e)})`;
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

// ── Input window check ──────────────────────────────────────────────────────
function isInputWindowOpen(){
  const now = new Date();
  const day = now.getDay();
  const totalMin = now.getHours()*60+now.getMinutes();
  const isTueThuRange = (day>=2 && day<=4);
  const isWeekend = (day===0||day===6);
  const isTueThuTime = totalMin >= 16*60+30 && totalMin < 19*60;
  const isWeekendTime = totalMin >= 11*60 && totalMin < 14*60;
  return (isTueThuRange && isTueThuTime) || (isWeekend && isWeekendTime);
}

// ── Leaderboard logic ───────────────────────────────────────────────────────
// Groups raw Firebase entries by week|name|date.
// Each group = one "day entry" with accumulated points + attempt count.
function groupEntries(entries){
  const map = {};
  for(const e of entries){
    const key = `${e.week}|${e.name}|${e.date}`;
    if(!map[key]) map[key]={week:e.week,name:e.name,date:e.date,points:0,ids:[],attempts:0};
    map[key].points += e.points;
    map[key].attempts += 1;
    map[key].ids.push(e.id);
  }
  return Object.values(map);
}
// Count raw individual attempts for a ninja on a specific day (for the limit check)
function getAttemptsToday(allEntries, name, week, date){
  return allEntries.filter(e =>
    e.week === week &&
    e.name.toLowerCase() === name.trim().toLowerCase() &&
    e.date === date
  ).length;
}
// Build ranked leaderboard from grouped day-entries
function calcBoard(groupedForWeek){
  const map = {};
  for(const e of groupedForWeek){
    if(!map[e.name]) map[e.name]={name:e.name,total:0,days:[]};
    map[e.name].total += e.points;
    map[e.name].days.push({date:e.date,points:e.points,attempts:e.attempts,ids:e.ids});
  }
  return Object.values(map).sort((a,b)=>b.total-a.total);
}
function countUniqueNinjas(allEntries){
  const names = new Set(allEntries.map(e=>e.name.trim().toLowerCase()));
  return names.size;
}

// ── UI primitives ───────────────────────────────────────────────────────────
function Particles(){
  const ref=useRef();
  useEffect(()=>{
    const c=ref.current; if(!c) return;
    const ctx=c.getContext("2d");
    c.width=c.offsetWidth; c.height=c.offsetHeight;
    const ps=Array.from({length:40},()=>({
      x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*1.8+0.4,dx:(Math.random()-.5)*.35,dy:(Math.random()-.5)*.35,
      color:["#39ff14","#00cfff","#ff2d78"][Math.floor(Math.random()*3)],a:Math.random()*.5+.15
    }));
    let raf;
    function draw(){
      ctx.clearRect(0,0,c.width,c.height);
      ps.forEach(p=>{
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=p.color;ctx.globalAlpha=p.a;ctx.shadowBlur=8;ctx.shadowColor=p.color;ctx.fill();
        p.x+=p.dx;p.y+=p.dy;
        if(p.x<0||p.x>c.width)p.dx*=-1;if(p.y<0||p.y>c.height)p.dy*=-1;
      });
      ctx.globalAlpha=1;raf=requestAnimationFrame(draw);
    }
    draw();return()=>cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={ref} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}}/>;
}

const CODE_LINES=["const ninja = new Coder();","while(learning) { level++; }","function achieve(goal) {","  return skill * effort;","}","if (rank === 1) celebrate();","ninja.train(['python','js']);","const points = score * combo;","export default Ninja;","// keep coding! 🥷"];

}

                  <div style={{fontSize:26,marginBottom:6}}>{card.icon}</div>
                  <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.4)",marginBottom:4,letterSpacing:1}}>{card.label.toUpperCase()}</div>
                  <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:16,color:card.color,wordBreak:"break-word"}}>{card.val}</div>
                </Glass>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Enter Scores (Admin only) ───────────────────────────────────────────────
function EnterScores({allEntries,setAllEntries,setToast}){
  const [name,setName]=useState("");
  const [pts,setPts]=useState("");
  const [errors,setErrors]=useState({});
  const [saving,setSaving]=useState(false);
  const [deleting,setDeleting]=useState(null);
  const inputOpen=isInputWindowOpen();
  const cw=getCurrentWeek();
  const today=todayStr();

  const weekEntries=allEntries.filter(e=>e.week===cw);
  const grouped=groupEntries(weekEntries);
  const board=calcBoard(grouped);
  const ninjaGrouped=name.trim()?grouped.filter(e=>e.name.toLowerCase()===name.trim().toLowerCase()):[];
  const ninjaSummary=board.find(n=>n.name.toLowerCase()===name.trim().toLowerCase());
  const ninjaRank=board.findIndex(n=>n.name.toLowerCase()===name.trim().toLowerCase())+1;

  // Raw attempt count for this ninja today (for the 3-attempt cap)
  const attemptsToday=name.trim()?getAttemptsToday(allEntries,name.trim(),cw,today):0;
  const attemptsLeft=Math.max(0,MAX_ATTEMPTS_PER_DAY-attemptsToday);
  const maxedOut=attemptsToday>=MAX_ATTEMPTS_PER_DAY;
  const barColor=attemptsLeft===0?"#ff2d78":attemptsLeft===1?"#ffd700":"#39ff14";

  async function submit(){
    if(!inputOpen||maxedOut) return;
    const errs={};
    if(!name.trim()) errs.name="Name is required";
    const p=Number(pts);
    if(!pts||isNaN(p)) errs.pts="Must be a number";
    else if(p<0) errs.pts="No negative points!";
    if(Object.keys(errs).length){setErrors(errs);return;}
    setErrors({});setSaving(true);
    try{
      const result=await window.fbLeaderboard.addEntry(cw,name.trim(),p,today);
      const newEntry={id:result.id,week:cw,name:name.trim(),points:p,date:today};
      setAllEntries(prev=>[...prev,newEntry]);
      setPts(""); // keep name for quick multi-entry
      const rem=MAX_ATTEMPTS_PER_DAY-(attemptsToday+1);
      setToast({msg:rem>0?`${name.trim()} +${p} pts! (${rem} attempt${rem!==1?"s":""} left today) ✅`:`${name.trim()} +${p} pts! No more attempts today. ✅`,color:"#39ff14"});
    } catch(e){setToast({msg:`Save failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  async function deleteEntry(entry){
    setDeleting(entry.date+entry.name);
    try{
      const rawMatches=allEntries.filter(e=>e.week===cw&&e.name.toLowerCase()===entry.name.toLowerCase()&&e.date===entry.date);
      await Promise.all(rawMatches.map(e=>window.fbLeaderboard.deleteEntry(cw,e.id)));
      setAllEntries(prev=>prev.filter(e=>!(e.week===cw&&e.name.toLowerCase()===entry.name.toLowerCase()&&e.date===entry.date)));
      setToast({msg:`Deleted all of ${entry.name}'s entries for ${entry.date}.`,color:"#ff2d78"});
    } catch(e){setToast({msg:`Delete failed: ${e.message}`,color:"#ff2d78"});}
    setDeleting(null);
  }

  return(
    <div style={{padding:"clamp(16px,3vw,28px) clamp(14px,3vw,36px)",animation:"fadeUp .4s ease both"}}>
      <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:"clamp(14px,2vw,20px)",color:"#fff",marginBottom:6}}>📝 Enter Scores</h2>
      <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.35)",marginBottom:24}}>{getWeekLabel(cw)}</p>

      {!inputOpen&&(
        <Glass style={{padding:"20px 24px",marginBottom:24,borderColor:"#ff2d7844",background:"rgba(255,45,120,0.08)"}}>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"#ff2d78",textAlign:"center",lineHeight:1.7}}>
            🔒 Score entry is currently unavailable.<br/>
            <span style={{color:"rgba(255,255,255,0.4)",fontSize:11}}>Scores can only be entered during session hours.</span>
          </p>
        </Glass>
      )}

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:24}}>
        {/* ── Input form ── */}
        <Glass style={{padding:22,opacity:inputOpen?1:0.5,pointerEvents:inputOpen?"auto":"none"}}>
          {/* Name */}
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>NINJA NAME</label>
            <input value={name} onChange={e=>{setName(e.target.value);setErrors({});}} placeholder="e.g. ShadowByte" style={iStyle(errors.name)}
              onFocus={e=>e.target.style.borderColor="#00cfff"}
              onBlur={e=>e.target.style.borderColor=errors.name?"#ff2d78":"rgba(255,255,255,0.15)"}/>
            {errors.name&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.name}</p>}
          </div>

          {/* Attempt counter — only shown once name is typed */}
          {name.trim()&&(
            <div style={{marginBottom:16,borderRadius:10,padding:"11px 14px",
              background:maxedOut?"rgba(255,45,120,0.1)":"rgba(57,255,20,0.06)",
              border:`1px solid ${barColor}33`,transition:"all .3s"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.4)",letterSpacing:1}}>TODAY'S ATTEMPTS</span>
                <span style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,fontWeight:700,color:barColor}}>{attemptsToday} / {MAX_ATTEMPTS_PER_DAY}</span>
              </div>
              {/* Pip bar */}
              <div style={{display:"flex",gap:6,marginBottom:maxedOut||attemptsToday>0?8:0}}>
                {Array.from({length:MAX_ATTEMPTS_PER_DAY},(_,i)=>(
                  <div key={i} style={{flex:1,height:7,borderRadius:99,
                    background:i<attemptsToday?barColor:"rgba(255,255,255,0.1)",
                    boxShadow:i<attemptsToday?`0 0 8px ${barColor}88`:"none",transition:"background .3s"}}/>
                ))}
              </div>
              {maxedOut&&<p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"#ff2d78",textAlign:"center",margin:0}}>🚫 Max attempts reached — come back tomorrow!</p>}
              {!maxedOut&&attemptsToday>0&&<p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.35)",margin:0}}>{attemptsLeft} attempt{attemptsLeft!==1?"s":""} remaining today</p>}
            </div>
          )}

          {/* Points */}
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>POINTS THIS ATTEMPT</label>
            <input value={pts} onChange={e=>setPts(e.target.value)} placeholder="e.g. 850" type="number" min="0"
              disabled={maxedOut}
              style={{...iStyle(errors.pts),fontFamily:"'Fira Code',monospace",fontSize:16,opacity:maxedOut?.4:1,cursor:maxedOut?"not-allowed":"text"}}
              onFocus={e=>{if(!maxedOut)e.target.style.borderColor="#39ff14";}}
              onBlur={e=>e.target.style.borderColor=errors.pts?"#ff2d78":"rgba(255,255,255,0.15)"}
              onKeyDown={e=>e.key==="Enter"&&!saving&&!maxedOut&&submit()}/>
            {errors.pts&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.pts}</p>}
          </div>

          {/* Date badge */}
          <div style={{marginBottom:14,background:"rgba(57,255,20,0.06)",borderRadius:8,padding:"8px 12px",border:"1px solid #39ff1422"}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)"}}>TODAY: </span>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"#39ff14"}}>{today}</span>
          </div>

          {/* Submit button */}
          <button onClick={submit} disabled={saving||!inputOpen||maxedOut} style={{width:"100%",padding:12,borderRadius:10,border:"none",
            cursor:saving||!inputOpen||maxedOut?"not-allowed":"pointer",
            background:saving||maxedOut?"rgba(255,255,255,0.08)":"linear-gradient(135deg,#39ff14,#00cfff)",
            color:saving||maxedOut?"rgba(255,255,255,0.3)":"#000",
            fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:12,letterSpacing:1,
            display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
            {saving?<><Spinner/> SAVING...</>:maxedOut?"🚫 MAX ATTEMPTS REACHED":"SUBMIT SCORE ⚡"}
          </button>
        </Glass>

        {/* ── Live preview ── */}
        <Glass style={{padding:22,borderColor:ninjaSummary?"#39ff1433":"rgba(255,255,255,0.08)"}}>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"#39ff14",marginBottom:16,letterSpacing:1}}>LIVE PREVIEW</h3>
          {ninjaSummary?(
            <>
              <div style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:16,color:"#fff",marginBottom:2}}>{ninjaSummary.name}</div>
              <div style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.35)",marginBottom:14}}>
                Rank #{ninjaRank} this week · {ninjaSummary.total} pts total
              </div>
              <div style={{background:"rgba(255,255,255,0.04)",borderRadius:8,padding:"10px 12px",marginBottom:10}}>
                <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)",marginBottom:8,letterSpacing:1}}>
                  DAILY TOTALS — ✕ deletes all attempts for that day
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {ninjaGrouped.sort((a,b)=>a.date.localeCompare(b.date)).map((e,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                      background:"rgba(57,255,20,0.08)",border:"1px solid #39ff1433",borderRadius:6,padding:"6px 10px"}}>
                      <div>
                        <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"#39ff14"}}>{e.date.slice(5)} → {e.points} pts</span>
                        <span style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.35)",marginLeft:8}}>
                          ({e.attempts}/{MAX_ATTEMPTS_PER_DAY} attempt{e.attempts!==1?"s":""})
                        </span>
                      </div>
                      <button onClick={()=>deleteEntry(e)} disabled={!!deleting}
                        style={{background:"rgba(255,45,120,0.15)",border:"1px solid #ff2d7844",borderRadius:5,
                          color:"#ff2d78",padding:"2px 7px",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:11}}>
                        {deleting===e.date+e.name?<Spinner/>:"✕"}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div style={{background:"rgba(57,255,20,0.08)",border:"1px solid #39ff1433",borderRadius:8,padding:"10px 12px"}}>
                  <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)",marginBottom:3}}>WEEKLY TOTAL</div>
                  <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:18,color:"#39ff14"}}>{ninjaSummary.total}</div>
                </div>
                <div style={{background:"rgba(0,207,255,0.08)",border:"1px solid #00cfff33",borderRadius:8,padding:"10px 12px"}}>
                  <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)",marginBottom:3}}>DAYS PLAYED</div>
                  <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:18,color:"#00cfff"}}>{ninjaSummary.days.length}</div>
                </div>
              </div>
            </>
          ):(
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:180,gap:10}}>
              <div style={{fontSize:32}}>🥷</div>
              <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.3)",textAlign:"center"}}>Enter a ninja name to see their stats</p>
            </div>
          )}
        </Glass>
      </div>
    </div>
  );
}

// ── Riddle Tab ──────────────────────────────────────────────────────────────
function RiddleTab({setToast,isAdmin,riddleMap,setRiddleMap}){
  const totalWeeks=getCurrentWeek()+1;
  const [week,setWeek]=useState(getCurrentWeek());
  const [sName,setSName]=useState("");
  const [sAnswer,setSAnswer]=useState("");
  const [newRiddleText,setNewRiddleText]=useState("");
  const [newAnswer,setNewAnswer]=useState("");
  const [editMode,setEditMode]=useState(false);
  const [errors,setErrors]=useState({});
  const [saving,setSaving]=useState(false);
  const inputOpen=isInputWindowOpen();
  const weekData=riddleMap[week]||{text:"No riddle set yet — check back soon!",answer:"",entries:[]};

  function isCorrect(submitted,official){
    if(!official) return false;
    return submitted.trim().toLowerCase().includes(official.trim().toLowerCase());
  }
  function getSortedEntries(entries,answer){
    const latest={};
    for(const e of entries){if(!latest[e.name]||e.ts>latest[e.name].ts) latest[e.name]=e;}
    const unique=Object.values(latest);
    const correct=unique.filter(e=>isCorrect(e.answer,answer)).sort((a,b)=>a.ts-b.ts);
    const wrong=unique.filter(e=>!isCorrect(e.answer,answer)).sort((a,b)=>a.ts-b.ts);
    return{correct,wrong,firstCorrect:correct[0]||null};
  }
  const{correct,wrong,firstCorrect}=getSortedEntries(weekData.entries,weekData.answer);
  const allSorted=[...correct,...wrong];

  async function submitAnswer(){
    if(!inputOpen) return;
    const errs={};
    if(!sName.trim()) errs.name="Name required";
    if(!sAnswer.trim()) errs.answer="Answer required";
    if(Object.keys(errs).length){setErrors(errs);return;}
    setErrors({});setSaving(true);
    try{
      const ts=Date.now();
      const result=await window.fbRiddles.addSubmission(week,sName.trim(),sAnswer.trim(),ts);
      const existingEntries=(weekData.entries||[]).filter(e=>e.name!==sName.trim());
      const newEntry={id:result.id,name:sName.trim(),answer:sAnswer.trim(),ts};
      setRiddleMap(prev=>({...prev,[week]:{...weekData,entries:[...existingEntries,newEntry]}}));
      setSName("");setSAnswer("");
      const c=isCorrect(sAnswer.trim(),weekData.answer);
      setToast({msg:c?`${sName.trim()} got it right! 🎉`:`${sName.trim()} submitted! ✅`,color:c?"#ffd700":"#39ff14"});
    } catch(e){setToast({msg:`Save failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }
  async function saveRiddle(){
    if(!newRiddleText.trim()) return;
    setSaving(true);
    try{
      await window.fbRiddles.setRiddle(week,newRiddleText.trim(),newAnswer.trim().toLowerCase());
      setRiddleMap(prev=>({...prev,[week]:{...weekData,text:newRiddleText.trim(),answer:newAnswer.trim().toLowerCase()}}));
      setEditMode(false);setToast({msg:"Riddle & answer saved! ✏️",color:"#39ff14"});
    } catch(e){setToast({msg:`Save failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }
  async function deleteSubmission(entry){
    setSaving(true);
    try{
      const liveEntry=weekData.entries.find(e=>e.name===entry.name);
      if(liveEntry&&liveEntry.id) await window.fbRiddles.deleteSubmission(week,liveEntry.id);
      setRiddleMap(prev=>({...prev,[week]:{...weekData,entries:weekData.entries.filter(e=>e.name!==entry.name)}}));
      setToast({msg:`Removed ${entry.name}'s answer.`,color:"#ff2d78"});
    } catch(e){setToast({msg:`Delete failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  return(
    <div style={{padding:"clamp(16px,3vw,28px) clamp(14px,3vw,36px)",animation:"fadeUp .4s ease both"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24,flexWrap:"wrap"}}>
        <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:"clamp(14px,2vw,20px)",color:"#fff",margin:0}}>🧩 Riddle of the Week</h2>
        <select value={week} onChange={e=>setWeek(Number(e.target.value))}
          style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:"#fff",padding:"7px 12px",fontFamily:"'Fira Code',monospace",fontSize:11,cursor:"pointer"}}>
          {Array.from({length:totalWeeks},(_,i)=>i+1).map(w=>(
            <option key={w} value={w} style={{background:"#0a0a0f"}}>{getWeekLabel(w)}{w===getCurrentWeek()?" ← Current":""}</option>
          ))}
        </select>
      </div>
      <Glass style={{padding:24,marginBottom:24,borderColor:"#ff2d7833",boxShadow:"0 0 40px #ff2d7822,0 8px 32px rgba(0,0,0,0.4)",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:"linear-gradient(90deg,#ff2d78,#00cfff,#39ff14)"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
          <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)",letterSpacing:2}}>RIDDLE #{week}</span>
          {isAdmin&&(
            <button onClick={()=>{setEditMode(!editMode);setNewRiddleText(weekData.text);setNewAnswer(weekData.answer||"");}}
              style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,color:"rgba(255,255,255,0.5)",padding:"5px 12px",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:11}}>
              {editMode?"✕ Cancel":"✏️ Edit Riddle"}
            </button>
          )}
        </div>
        {editMode&&isAdmin?(
          <div>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:7,letterSpacing:1}}>RIDDLE TEXT</label>
            <textarea value={newRiddleText} onChange={e=>setNewRiddleText(e.target.value)}
              style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid #00cfff44",borderRadius:10,padding:"12px 14px",color:"#fff",fontFamily:"'Exo 2',sans-serif",fontSize:14,lineHeight:1.6,outline:"none",resize:"vertical",minHeight:75,boxSizing:"border-box",marginBottom:12}}/>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:7,letterSpacing:1}}>CORRECT ANSWER (admin only)</label>
            <input value={newAnswer} onChange={e=>setNewAnswer(e.target.value)} placeholder="e.g. echo" style={{...iStyle(false),marginBottom:12}}/>
            <button onClick={saveRiddle} disabled={saving} style={{padding:"9px 22px",borderRadius:8,border:"none",cursor:"pointer",background:"linear-gradient(135deg,#ff2d78,#00cfff)",color:"#000",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11,display:"flex",alignItems:"center",gap:8}}>
              {saving?<><Spinner/> Saving...</>:"SAVE RIDDLE ✓"}
            </button>
          </div>
        ):(
          <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:"clamp(13px,1.5vw,18px)",color:"#fff",lineHeight:1.7,margin:0,fontStyle:"italic"}}>"{weekData.text}"</p>
        )}
      </Glass>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:24}}>
        <Glass style={{padding:22}}>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"#ff2d78",marginBottom:14,letterSpacing:1}}>SUBMIT YOUR ANSWER</h3>
          {!inputOpen?(
            <div style={{padding:"16px",background:"rgba(255,45,120,0.08)",border:"1px solid #ff2d7844",borderRadius:10}}>
              <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"#ff2d78",textAlign:"center",lineHeight:1.6}}>
                🔒 Submissions unavailable.<br/><span style={{color:"rgba(255,255,255,0.35)",fontSize:10}}>Check back during session hours.</span>
              </p>
            </div>
          ):(
            <>
              <div style={{marginBottom:12}}>
                <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>STUDENT NAME</label>
                <input value={sName} onChange={e=>setSName(e.target.value)} placeholder="Your ninja name" style={iStyle(errors.name)}/>
                {errors.name&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.name}</p>}
              </div>
              <div style={{marginBottom:16}}>
                <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>YOUR ANSWER</label>
                <textarea value={sAnswer} onChange={e=>setSAnswer(e.target.value)} placeholder="Type your answer here..."
                  style={{...iStyle(errors.answer),resize:"vertical",minHeight:70}}/>
                {errors.answer&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.answer}</p>}
              </div>
              <button onClick={submitAnswer} disabled={saving} style={{width:"100%",padding:11,borderRadius:10,border:"none",cursor:saving?"not-allowed":"pointer",
                background:saving?"rgba(255,255,255,0.1)":"linear-gradient(135deg,#ff2d78,#00cfff)",
                color:saving?"rgba(255,255,255,0.4)":"#000",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11,letterSpacing:1,
                display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                {saving?<><Spinner/> Saving...</>:"SUBMIT ANSWER 🧩"}
              </button>
            </>
          )}
        </Glass>
        <div>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"#00cfff",marginBottom:12,letterSpacing:1}}>STUDENT ANSWERS ({allSorted.length})</h3>
          <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:380,overflowY:"auto"}}>
            {allSorted.length===0?(
              <Glass style={{padding:22,textAlign:"center"}}><p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.35)",fontSize:13}}>No answers yet — be the first! 🧠</p></Glass>
            ):allSorted.map((a,i)=>{
              const isFirst=firstCorrect&&a.name===firstCorrect.name;
              const corr=isCorrect(a.answer,weekData.answer);
              return(
                <Glass key={i} style={{padding:"11px 14px",borderColor:isFirst?"#ffd700":corr?"#39ff14":"rgba(255,255,255,0.08)",animation:`fadeUp .3s ease both ${i*.05}s`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                    <div style={{display:"flex",alignItems:"center",gap:7}}>
                      {isFirst&&<span style={{fontSize:14}}>👑</span>}
                      <span style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:12,color:isFirst?"#ffd700":corr?"#39ff14":"#00cfff"}}>{a.name}</span>
                      {isFirst&&<span style={{background:"rgba(255,215,0,0.15)",border:"1px solid #ffd70044",borderRadius:4,padding:"1px 5px",fontFamily:"'Fira Code',monospace",fontSize:8,color:"#ffd700"}}>FIRST CORRECT</span>}
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <span style={{fontFamily:"'Fira Code',monospace",fontSize:8,color:"rgba(255,255,255,0.3)"}}>{new Date(a.ts).toLocaleDateString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span>
                      {isAdmin&&<button onClick={()=>deleteSubmission(a)} disabled={saving} style={{background:"rgba(255,45,120,0.1)",border:"1px solid #ff2d7844",borderRadius:6,color:"#ff2d78",padding:"1px 6px",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:10}}>✕</button>}
                    </div>
                  </div>
                  <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.75)",margin:0}}>{a.answer}</p>
                </Glass>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Login Screen ────────────────────────────────────────────────────────────
function LoginScreen({onLogin}){
  const [pw,setPw]=useState("");
  const [show,setShow]=useState(false);
  const [shake,setShake]=useState(false);
  const [hint,setHint]=useState("");
  function attempt(){
    if(pw===ADMIN_PASS){onLogin("admin");}
    else if(pw.trim()===""){setHint("Enter the admin password or use Guest below.");setShake(true);setTimeout(()=>setShake(false),500);}
    else{onLogin("guest");}
  }
  return(
    <div style={{position:"fixed",inset:0,display:"flex",alignItems:"center",justifyContent:"center",
      background:"radial-gradient(ellipse 70% 60% at 50% 40%,rgba(57,255,20,0.07) 0%,transparent 70%),#060609",zIndex:100,padding:"16px",overflow:"auto"}}>
      <Particles/><FloatingCode/>
      <div style={{position:"relative",zIndex:2,width:"100%",maxWidth:400,animation:"fadeUp .6s ease both"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:900,fontSize:20,letterSpacing:2,color:"#39ff14",marginBottom:3}}>CODE NINJAS</div>
          <div style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)",letterSpacing:3}}>ROBBINSVILLE</div>
          <div style={{width:60,height:2,background:"linear-gradient(90deg,#39ff14,#00cfff)",margin:"12px auto 0",borderRadius:99}}/>
        </div>
        <Glass style={{padding:"clamp(20px,4vw,32px)",borderColor:"rgba(57,255,20,0.15)",animation:shake?"shakeCard .5s ease":"none"}}>
          <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:15,color:"#fff",textAlign:"center",marginBottom:5,letterSpacing:1}}>WELCOME BACK</h2>
          <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.4)",textAlign:"center",marginBottom:24}}>Admin password for full access, or continue as guest</p>
          <div style={{marginBottom:8}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:7,letterSpacing:1.5}}>PASSWORD</label>
            <div style={{position:"relative"}}>
              <input value={pw} onChange={e=>{setPw(e.target.value);setHint("");}} onKeyDown={e=>e.key==="Enter"&&attempt()}
                type={show?"text":"password"} placeholder="Enter admin password..."
                style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,
                  padding:"12px 42px 12px 14px",color:"#fff",fontFamily:"'Fira Code',monospace",fontSize:14,outline:"none",boxSizing:"border-box",letterSpacing:pw&&!show?3:1}}
                onFocus={e=>e.target.style.borderColor="#39ff14"}
                onBlur={e=>e.target.style.borderColor="rgba(255,255,255,0.15)"}/>
              <button onClick={()=>setShow(!show)} style={{position:"absolute",right:11,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.4)",fontSize:15,padding:0}}>{show?"🙈":"👁️"}</button>
            </div>
            {hint&&<p style={{color:"#ff2d78",fontSize:11,marginTop:5,fontFamily:"'Fira Code',monospace"}}>{hint}</p>}
          </div>
          <button onClick={attempt} style={{width:"100%",padding:"12px",borderRadius:10,border:"none",cursor:"pointer",
            background:"linear-gradient(135deg,#39ff14,#00cfff)",color:"#000",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:13,letterSpacing:1.5,marginTop:16,transition:"transform .2s,opacity .2s"}}
            onMouseEnter={e=>{e.target.style.transform="scale(1.02)";e.target.style.opacity=".92";}}
            onMouseLeave={e=>{e.target.style.transform="none";e.target.style.opacity="1";}}>
            ENTER DOJO ⚡
          </button>
          <div style={{display:"flex",alignItems:"center",gap:10,margin:"18px 0"}}>
            <div style={{flex:1,height:1,background:"rgba(255,255,255,0.08)"}}/>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.25)"}}>OR</span>
            <div style={{flex:1,height:1,background:"rgba(255,255,255,0.08)"}}/>
          </div>
          <button onClick={()=>onLogin("guest")} style={{width:"100%",padding:"11px",borderRadius:10,border:"1px solid rgba(255,255,255,0.15)",cursor:"pointer",background:"rgba(255,255,255,0.04)",color:"rgba(255,255,255,0.6)",fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:13,transition:"all .2s"}}
            onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,255,255,0.09)";e.currentTarget.style.color="#fff";}}
            onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.04)";e.currentTarget.style.color="rgba(255,255,255,0.6)";}}>
            👀 Continue as Guest (View Only)
          </button>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.2)",textAlign:"center",marginTop:16,lineHeight:1.6}}>
            Guests can view leaderboards &amp; riddles.<br/>Admin required to enter scores.
          </p>
        </Glass>
      </div>
    </div>
  );
}

// ── Loading Screen ──────────────────────────────────────────────────────────
function LoadingScreen({status}){
  return(
    <div style={{position:"fixed",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#060609",zIndex:200,gap:16,padding:16}}>
      <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:13,color:"#39ff14",letterSpacing:2}}>LOADING DOJO...</div>
      <div style={{width:36,height:36,border:"3px solid rgba(57,255,20,0.2)",borderTop:"3px solid #39ff14",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <div style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.3)"}}>{status}</div>
    </div>
  );
}

// ── useIsMobile ─────────────────────────────────────────────────────────────
function useIsMobile(){
  const [mobile,setMobile]=useState(window.innerWidth<=768);
  useEffect(()=>{const h=()=>setMobile(window.innerWidth<=768);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);
  return mobile;
}

// ── App Root ────────────────────────────────────────────────────────────────
function App(){
  const [role,setRole]=useState(null);
  const [tab,setTab]=useState("home");
  const [allEntries,setAllEntries]=useState([]);
  const [riddleMap,setRiddleMap]=useState({});
  const [toast,setToast]=useState(null);
  const [loading,setLoading]=useState(true);
  const [loadStatus,setLoadStatus]=useState("Connecting to Firebase...");
  const isAdmin=role==="admin";
  const isMobile=useIsMobile();

  async function loadData(){
    setLoadStatus("Loading leaderboard...");
    try{const entries=await window.fbLeaderboard.getAll();setAllEntries(entries);}catch(e){console.warn(e);}
    setLoadStatus("Loading riddles...");
    try{const map=await window.fbRiddles.getAll();setRiddleMap(map);}catch(e){console.warn(e);}
    setLoading(false);
  }

  useEffect(()=>{loadData();},[]);
  useEffect(()=>{
    if(!role) return;
    const iv=setInterval(loadData,60000);
    return()=>clearInterval(iv);
  },[role]);

  if(loading) return <LoadingScreen status={loadStatus}/>;
  if(!role) return <LoginScreen onLogin={r=>setRole(r)}/>;

  return(
    <>
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",
        background:"radial-gradient(ellipse 60% 50% at 80% 20%,rgba(57,255,20,0.06) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(0,207,255,0.07) 0%,transparent 70%),#060609"}}/>
      <div style={{display:"flex",flexDirection:isMobile?"column":"row",minHeight:"100vh",position:"relative",zIndex:1}}>
        {isMobile
          ?<MobileNav active={tab} onNav={setTab} isAdmin={isAdmin} onLogout={()=>setRole(null)}/>
          :<Sidebar active={tab} onNav={setTab} isAdmin={isAdmin} onLogout={()=>setRole(null)}/>
        }
        <div key={tab} style={{flex:1,overflowY:"auto",animation:"fadeUp .35s ease both",...(isMobile?{}:{height:"100vh"})}}>
          {tab==="home"&&<HomeTab onNav={setTab} allEntries={allEntries}/>}
          {tab==="leaderboards"&&<LeaderboardsTab allEntries={allEntries} setAllEntries={setAllEntries} setToast={setToast} isAdmin={isAdmin}/>}
          {tab==="riddle"&&<RiddleTab setToast={setToast} isAdmin={isAdmin} riddleMap={riddleMap} setRiddleMap={setRiddleMap}/>}
        </div>
      </div>
      {toast&&<Toast msg={toast.msg} color={toast.color||"#39ff14"} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
