firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ══════════════════════════════════════════════════════════════════
//  REALTIME DATABASE HELPERS
//
//  DATA SHAPE:
//
//  leaderboards/
//    week_1/
//      entries/
//        {pushId}: { name, points, date, week }
//
//  riddles/
//    week_1/
//      text: "..."
//      answer: "..."
//      submissions/
//        {pushId}: { name, answer, ts }
//
// ══════════════════════════════════════════════════════════════════

window.fbLeaderboard = {
  // Returns array of {id, name, points, date, week}
  async getAll() {
    const snap = await db.ref("leaderboards").once("value");
    const val = snap.val() || {};
    const all = [];
    for (const weekKey of Object.keys(val)) {
      const week = parseInt(weekKey.replace("week_", ""));
      const entries = val[weekKey].entries || {};
      for (const [id, entry] of Object.entries(entries)) {
        all.push({ id, week, ...entry });
      }
    }
    return all;
  },

  async addEntry(week, name, points, date) {
    const ref = db.ref(`leaderboards/week_${week}/entries`).push();
    await ref.set({ week, name, points, date });
    return { id: ref.key };
  },

  async deleteEntry(week, entryId) {
    await db.ref(`leaderboards/week_${week}/entries/${entryId}`).remove();
  }
};

window.fbRiddles = {
  // Returns { 1: {text, answer, entries:[{id,name,answer,ts}]}, ... }
  async getAll() {
    const snap = await db.ref("riddles").once("value");
    const val = snap.val() || {};
    const map = {};
    for (const weekKey of Object.keys(val)) {
      const wNum = parseInt(weekKey.replace("week_", ""));
      const wData = val[weekKey];
      const entries = [];
      const subs = wData.submissions || {};
      for (const [id, sub] of Object.entries(subs)) {
        entries.push({ id, ...sub });
      }
      map[wNum] = {
        text: wData.text || "",
        answer: wData.answer || "",
        entries
      };
    }
    return map;
  },

  async setRiddle(week, text, answer) {
    await db.ref(`riddles/week_${week}`).update({ text, answer });
  },

  async addSubmission(week, name, answer, ts) {
    // One submission per name per week — overwrite if exists
    const snap = await db.ref(`riddles/week_${week}/submissions`)
      .orderByChild("name").equalTo(name).once("value");
    const val = snap.val();
    if (val) {
      const existingKey = Object.keys(val)[0];
      await db.ref(`riddles/week_${week}/submissions/${existingKey}`).update({ answer, ts });
      return { id: existingKey };
    } else {
      const ref = db.ref(`riddles/week_${week}/submissions`).push();
      await ref.set({ name, answer, ts });
      return { id: ref.key };
    }
  },

  async deleteSubmission(week, submissionId) {
    await db.ref(`riddles/week_${week}/submissions/${submissionId}`).remove();
  }
};
</script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ══════════════════════════════════════════════════════════════════
//  ⚙️  CONFIG
// ══════════════════════════════════════════════════════════════════
const ADMIN_PASS = "Robbinsvillle";

// ══════════════════════════════════════════════════════════════════
//  📅  WEEK UTILS
// ══════════════════════════════════════════════════════════════════
const WEEK_START = new Date("2026-05-13T00:00:00");
function getCurrentWeek(){
  const diff = new Date() - WEEK_START;
  return diff < 0 ? 1 : Math.floor(diff / (7*24*60*60*1000)) + 1;
}
function getWeekLabel(n){
  const s = new Date(WEEK_START.getTime() + (n-1)*7*24*60*60*1000);
  const e = new Date(s.getTime() + 6*24*60*60*1000);
  const fmt = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  return `Week ${n} (${fmt(s)} – ${fmt(e)})`;
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

// ══════════════════════════════════════════════════════════════════
//  📊  LEADERBOARD LOGIC
// ══════════════════════════════════════════════════════════════════
function groupEntries(entries){
  const map = {};
  for(const e of entries){
    const key = `${e.week}|${e.name}|${e.date}`;
    if(!map[key]) map[key] = { week:e.week, name:e.name, date:e.date, points:0, ids:[] };
    map[key].points += e.points;
    map[key].ids.push(e.id);
  }
  return Object.values(map);
}
function calcBoard(groupedForWeek){
  const map = {};
  for(const e of groupedForWeek){
    if(!map[e.name]) map[e.name] = { name:e.name, total:0, days:[] };
    map[e.name].total += e.points;
    map[e.name].days.push({ date:e.date, points:e.points, ids:e.ids });
  }
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

// ══════════════════════════════════════════════════════════════════
//  🎨  UI PRIMITIVES
// ══════════════════════════════════════════════════════════════════
function Particles(){
  const ref = useRef();
  useEffect(()=>{
    const c = ref.current; if(!c) return;
    const ctx = c.getContext("2d");
    const resize = () => { c.width = c.offsetWidth; c.height = c.offsetHeight; };
    resize();
    const ps = Array.from({length:55},()=>({
      x:Math.random()*c.width, y:Math.random()*c.height,
      r:Math.random()*1.8+0.4,
      dx:(Math.random()-.5)*.35, dy:(Math.random()-.5)*.35,
      color:["#39ff14","#00cfff","#ff2d78"][Math.floor(Math.random()*3)],
      a:Math.random()*.5+.15
    }));
    let raf;
    function draw(){
      ctx.clearRect(0,0,c.width,c.height);
      ps.forEach(p=>{
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle = p.color; ctx.globalAlpha = p.a;
        ctx.shadowBlur = 8; ctx.shadowColor = p.color; ctx.fill();
        p.x += p.dx; p.y += p.dy;
        if(p.x<0||p.x>c.width) p.dx*=-1;
        if(p.y<0||p.y>c.height) p.dy*=-1;
      });
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(draw);
    }
    draw();
    return () => cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={ref} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}}/>;
}

const CODE_LINES = [
  "const ninja = new Coder();","while(learning) { level++; }",
  "function achieve(goal) {","  return skill * effort;","}",
  "if (rank === 1) celebrate();","ninja.train(['python','js']);",
  "const points = score * combo;","export default Ninja;","// keep coding! 🥷"
];
function FloatingCode(){
  return(
    <div style={{position:"absolute",inset:0,overflow:"hidden",pointerEvents:"none"}}>
      {CODE_LINES.map((line,i)=>(
        <div key={i} style={{
          position:"absolute",left:`${8+i*8}%`,bottom:"-2em",
          fontFamily:"'Fira Code',monospace",fontSize:"11px",
          color:i%3===0?"#39ff14":i%3===1?"#00cfff":"#ff2d78",
          opacity:.10+(i%4)*.05,
          animation:`floatUp ${9+i*.8}s linear infinite`,
          animationDelay:`${i*1.1}s`,whiteSpace:"nowrap"
        }}>{line}</div>
      ))}
    </div>
  );
}

function Glass({children,style={},onMouseEnter,onMouseLeave}){
  return(
    <div onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave} style={{
      background:"rgba(255,255,255,0.06)",
      backdropFilter:"blur(18px)",WebkitBackdropFilter:"blur(18px)",
      border:"1px solid rgba(255,255,255,0.12)",borderRadius:16,
      boxShadow:"0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08)",
      ...style
    }}>{children}</div>
  );
}

function RankBadge({rank}){
  const cfg = {
    1:{bg:"linear-gradient(135deg,#ffd700,#ff8c00)",e:"👑"},
    2:{bg:"linear-gradient(135deg,#c0c0c0,#808080)",e:"🥈"},
    3:{bg:"linear-gradient(135deg,#cd7f32,#8b4513)",e:"🥉"}
  };
  const c = cfg[rank]||{bg:"rgba(255,255,255,0.1)",e:null};
  return(
    <div style={{width:36,height:36,borderRadius:"50%",background:c.bg,flexShrink:0,
      display:"flex",alignItems:"center",justifyContent:"center",
      fontWeight:700,fontSize:rank<=3?15:12,color:rank<=3?"#000":"#999"}}>
      {c.e||`#${rank}`}
    </div>
  );
}

function Toast({msg,color="#39ff14",onDone}){
  useEffect(()=>{ const t = setTimeout(onDone,3500); return()=>clearTimeout(t); },[]);
  return(
    <div style={{position:"fixed",bottom:32,right:32,zIndex:9999,
      background:"rgba(10,10,20,0.96)",border:`1px solid ${color}`,borderRadius:12,
      padding:"14px 24px",color,fontFamily:"'Fira Code',monospace",
      fontWeight:600,fontSize:14,boxShadow:`0 0 24px ${color}55`,
      animation:"slideIn .3s ease",maxWidth:340}}>{msg}</div>
  );
}

function Spinner(){
  return <div style={{width:18,height:18,border:"2px solid rgba(255,255,255,0.2)",
    borderTop:"2px solid #39ff14",borderRadius:"50%",
    animation:"spin .8s linear infinite",display:"inline-block"}}/>;
}

function inputStyle(err){
  return {
    width:"100%",background:"rgba(255,255,255,0.06)",
    border:`1px solid ${err?"#ff2d78":"rgba(255,255,255,0.15)"}`,borderRadius:10,
    padding:"12px 16px",color:"#fff",fontFamily:"'Exo 2',sans-serif",fontSize:14,
    outline:"none",boxSizing:"border-box",transition:"border-color .2s"
  };
}

// ══════════════════════════════════════════════════════════════════
//  🏠  HOME TAB
// ══════════════════════════════════════════════════════════════════
function HomeTab({onNav, allEntries}){
  const cw = getCurrentWeek();
  const grouped = groupEntries(allEntries);
  const weekGrouped = grouped.filter(e=>e.week===cw);
  const board = calcBoard(weekGrouped);
  const topNinja = board[0];
  const allNinjas = new Set(allEntries.map(e=>e.name));
  const topScore = grouped.reduce((m,e)=>e.points>m?e.points:m,0);

  const statCards = [
    {icon:"🥷",label:"Active Ninjas",val:String(allNinjas.size||0),color:"#39ff14"},
    {icon:"🏅",label:"This Week's #1",val:topNinja?topNinja.name:"—",color:"#ffd700"},
    {icon:"💻",label:"Daily Entries",val:String(grouped.length),color:"#00cfff"},
    {icon:"🔥",label:"Top Day Score",val:topScore>0?`${topScore.toLocaleString()} pts`:"—",color:"#ff2d78"},
  ];

  return(
    <div style={{position:"relative",height:"100vh",display:"flex",alignItems:"center",overflow:"hidden"}}>
      <Particles/><FloatingCode/>
      <div style={{position:"relative",zIndex:2,display:"grid",gridTemplateColumns:"1fr 1fr",
        gap:48,padding:"48px",width:"100%",alignItems:"center"}}>
        {/* LEFT */}
        <div style={{animation:"fadeSlideLeft .7s ease both"}}>
          <div style={{display:"inline-block",background:"rgba(57,255,20,0.1)",
            border:"1px solid #39ff1444",borderRadius:99,padding:"6px 16px",marginBottom:24}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"#39ff14",letterSpacing:2}}>
              ⚡ LIVE COMPETITION DASHBOARD
            </span>
          </div>
          <h1 style={{fontFamily:"'Orbitron',sans-serif",fontSize:"clamp(26px,3.2vw,50px)",fontWeight:900,lineHeight:1.15,marginBottom:16,
            background:"linear-gradient(135deg,#fff 0%,#00cfff 50%,#39ff14 100%)",
            WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Hi Ninjas! 👋</h1>
          <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:"clamp(13px,1.4vw,18px)",color:"rgba(255,255,255,0.7)",marginBottom:32,lineHeight:1.6}}>
            Official <span style={{color:"#39ff14",fontWeight:700}}>Code Ninjas – Robbinsville</span> dashboard — live leaderboards, weekly riddles, and ninja rankings.
          </p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:40}}>
            {["🏆 Weekly competitions","🎖️ Ninja rankings","🧩 Riddle challenges","⭐ Student achievements"].map((item,i)=>(
              <Glass key={i} style={{padding:"12px 16px"}}>
                <span style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.8)"}}>{item}</span>
              </Glass>

          </div>
          <button onClick={()=>onNav("leaderboards")} style={{

            animation:"pulse 2s ease-in-out infinite",transition:"transform .2s"}}
            onMouseEnter={e=>e.target.style.transform="scale(1.06)"}

            VIEW LEADERBOARDS →
          </button>
        </div>
        {/* RIGHT */}
        <div style={{animation:"fadeSlideRight .7s ease both"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>

          <div style={{display:"flex",justifyContent:"center",marginTop:18}}>

// ══════════════════════════════════════════════════════════════════
//  🏆  LEADERBOARD VIEW
// ══════════════════════════════════════════════════════════════════
function LeaderboardView({allEntries}){
  const totalWeeks = getCurrentWeek() + 1;
  const [week, setWeek] = useState(getCurrentWeek());
  const grouped = groupEntries(allEntries.filter(e=>e.week===week));
  const board = calcBoard(grouped);

  return(
    <div style={{padding:"28px 36px",animation:"fadeUp .4s ease both"}}>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:28,flexWrap:"wrap"}}>
        <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:20,color:"#fff",margin:0}}>🏆 Weekly Leaderboard</h2>
        <select value={week} onChange={e=>setWeek(Number(e.target.value))}
          style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.2)",
            borderRadius:8,color:"#fff",padding:"8px 14px",fontFamily:"'Fira Code',monospace",fontSize:12,cursor:"pointer"}}>
          {Array.from({length:totalWeeks},(_,i)=>i+1).map(w=>(
            <option key={w} value={w} style={{background:"#0a0a0f"}}>
              {getWeekLabel(w)}{w===getCurrentWeek()?" ← Current":""}
            </option>
          ))}
        </select>
      </div>
      {board.length===0?(
        <Glass style={{padding:40,textAlign:"center"}}>
          <p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.4)",fontSize:15}}>
            No scores yet for this week. Be the first! 🥷
          </p>
        </Glass>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:9}}>
          <div style={{display:"grid",gridTemplateColumns:"50px 1fr 120px 1fr",gap:14,
            padding:"6px 18px",fontFamily:"'Fira Code',monospace",fontSize:10,
            color:"rgba(255,255,255,0.3)",letterSpacing:1.5}}>
            <span>RANK</span><span>NINJA</span><span style={{textAlign:"right"}}>TOTAL</span><span style={{paddingLeft:16}}>DAILY BREAKDOWN</span>
          </div>
          {board.map((ninja,i)=>{
            const rank = i+1;
            const gc = rank===1?"#ffd700":rank===2?"#c0c0c0":rank===3?"#cd7f32":"transparent";
            return(
              <Glass key={ninja.name} style={{padding:"14px 18px",
                borderColor:rank<=3?`${gc}44`:"rgba(255,255,255,0.08)",
                boxShadow:rank<=3?`0 0 20px ${gc}22,0 8px 24px rgba(0,0,0,0.4)`:"0 4px 16px rgba(0,0,0,0.3)",
                animation:`fadeUp .4s ease both ${i*.06}s`,transition:"transform .2s"}}
                onMouseEnter={e=>e.currentTarget.style.transform="translateX(4px)"}
                onMouseLeave={e=>e.currentTarget.style.transform="none"}>
                <div style={{display:"grid",gridTemplateColumns:"50px 1fr 120px 1fr",gap:14,alignItems:"center"}}>
                  <RankBadge rank={rank}/>
                  <div>
                    <div style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:14,color:"#fff"}}>{ninja.name}</div>
                    <div style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)",marginTop:2}}>
                      {ninja.days.length} day{ninja.days.length!==1?"s":""} played
                    </div>
                  </div>
                  <div style={{textAlign:"right",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:17,
                    color:rank<=3?gc:"#39ff14"}}>
                    {ninja.total.toLocaleString()}
                  </div>
                  <div style={{paddingLeft:16,display:"flex",flexWrap:"wrap",gap:6}}>
                    {ninja.days.sort((a,b)=>a.date.localeCompare(b.date)).map((d,di)=>(
                      <span key={di} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.1)",
                        borderRadius:6,padding:"3px 9px",fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.6)"}}>
                        {d.date.slice(5)} → {d.points}
                      </span>
                    ))}
                  </div>
                </div>
              </Glass>
            );
          })}
        </div>
      )}
    </div>
  );
}

//  📝  ENTER SCORES (admin only)
// ══════════════════════════════════════════════════════════════════
function EnterScores({allEntries, setAllEntries, setToast}){
  const [name, setName] = useState("");
  const [pts, setPts] = useState("");
  const [errors, setErrors] = useState({});
  const [saving, setSaving] = useState(false);
  const [deleting, setDeleting] = useState(null);
  const cw = getCurrentWeek();
  const today = todayStr();

  const weekEntries = allEntries.filter(e=>e.week===cw);
  const grouped = groupEntries(weekEntries);
  const board = calcBoard(grouped);
  const ninjaGrouped = name.trim() ? grouped.filter(e=>e.name.toLowerCase()===name.trim().toLowerCase()) : [];
  const ninjaSummary = board.find(n=>n.name.toLowerCase()===name.trim().toLowerCase());
  const ninjaRank = board.findIndex(n=>n.name.toLowerCase()===name.trim().toLowerCase())+1;

  async function submit(){
    const errs = {};
    if(!name.trim()) errs.name = "Name is required";
    const p = Number(pts);
    if(!pts||isNaN(p)) errs.pts = "Must be a number";
    else if(p<0) errs.pts = "No negative points!";
    if(Object.keys(errs).length){ setErrors(errs); return; }
    setErrors({});
    setSaving(true);
    try{
      const result = await window.fbLeaderboard.addEntry(cw, name.trim(), p, today);
      const newEntry = { id: result.id, week:cw, name:name.trim(), points:p, date:today };
      setAllEntries(prev => [...prev, newEntry]);
      setPts("");
      setToast({ msg:`${name.trim()} scored ${p} pts! Saved ✅`, color:"#39ff14" });
    } catch(e){
      setToast({ msg:`Save failed: ${e.message}`, color:"#ff2d78" });
    }
    setSaving(false);
  }

  async function deleteEntry(entry){
    setDeleting(entry.date);
    try{
      const rawMatches = allEntries.filter(e =>
        e.week===cw && e.name.toLowerCase()===entry.name.toLowerCase() && e.date===entry.date
      );
      await Promise.all(rawMatches.map(e => window.fbLeaderboard.deleteEntry(cw, e.id)));
      setAllEntries(prev => prev.filter(e =>
        !(e.week===cw && e.name.toLowerCase()===entry.name.toLowerCase() && e.date===entry.date)
      ));
      setToast({ msg:`Deleted ${entry.name}'s ${entry.date} entry.`, color:"#ff2d78" });
    } catch(e){
      setToast({ msg:`Delete failed: ${e.message}`, color:"#ff2d78" });
    }
    setDeleting(null);
  }

  return(
    <div style={{padding:"28px 36px",animation:"fadeUp .4s ease both"}}>
      <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:20,color:"#fff",marginBottom:6}}>📝 Enter Scores</h2>
      <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.35)",marginBottom:6}}>{getWeekLabel(cw)}</p>
      <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(57,255,20,0.5)",marginBottom:28}}>
        Same ninja + same day = points accumulate. Different day = separate entry.
      </p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:28}}>
        {/* Input */}
        <Glass style={{padding:26}}>
          <div style={{marginBottom:18}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:8,letterSpacing:1}}>NINJA NAME</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. ShadowByte" style={inputStyle(errors.name)}
              onFocus={e=>e.target.style.borderColor="#00cfff"}
              onBlur={e=>e.target.style.borderColor=errors.name?"#ff2d78":"rgba(255,255,255,0.15)"}/>
            {errors.name&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.name}</p>}
          </div>
          <div style={{marginBottom:24}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:8,letterSpacing:1}}>POINTS SCORED TODAY</label>
            <input value={pts} onChange={e=>setPts(e.target.value)} placeholder="e.g. 850" type="number" min="0"
              style={{...inputStyle(errors.pts),fontFamily:"'Fira Code',monospace",fontSize:16}}
              onFocus={e=>e.target.style.borderColor="#39ff14"}
              onBlur={e=>e.target.style.borderColor=errors.pts?"#ff2d78":"rgba(255,255,255,0.15)"}
              onKeyDown={e=>e.key==="Enter"&&!saving&&submit()}/>
            {errors.pts&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.pts}</p>}
          </div>
          <div style={{marginBottom:14,background:"rgba(57,255,20,0.06)",borderRadius:8,padding:"10px 14px",border:"1px solid #39ff1422"}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)"}}>TODAY: </span>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"#39ff14"}}>{today}</span>
          </div>
          <button onClick={submit} disabled={saving} style={{width:"100%",padding:13,borderRadius:10,border:"none",
            cursor:saving?"not-allowed":"pointer",
            background:saving?"rgba(255,255,255,0.1)":"linear-gradient(135deg,#39ff14,#00cfff)",
            color:saving?"rgba(255,255,255,0.4)":"#000",
            fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:12,letterSpacing:1,
            display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
            {saving?<><Spinner/> SAVING...</>:"SUBMIT SCORE ⚡"}
          </button>
        </Glass>

        {/* Preview */}
        <Glass style={{padding:26,borderColor:ninjaSummary?"#39ff1433":"rgba(255,255,255,0.08)"}}>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,color:"#39ff14",marginBottom:18,letterSpacing:1}}>LIVE PREVIEW</h3>
          {ninjaSummary?(
            <>
              <div style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:17,color:"#fff",marginBottom:2}}>{ninjaSummary.name}</div>
              <div style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.35)",marginBottom:18}}>
                Rank #{ninjaRank} this week · Total: {ninjaSummary.total} pts
              </div>
              <div style={{background:"rgba(255,255,255,0.04)",borderRadius:8,padding:"12px 14px",marginBottom:10}}>
                <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)",marginBottom:8,letterSpacing:1}}>DAILY ENTRIES — click ✕ to delete</div>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {ninjaGrouped.sort((a,b)=>a.date.localeCompare(b.date)).map((e,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                      background:"rgba(57,255,20,0.08)",border:"1px solid #39ff1433",borderRadius:6,padding:"6px 10px"}}>
                      <span style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"#39ff14"}}>{e.date} → {e.points} pts</span>
                      <button onClick={()=>deleteEntry(e)} disabled={!!deleting}
                        style={{background:"rgba(255,45,120,0.15)",border:"1px solid #ff2d7844",borderRadius:5,
                          color:"#ff2d78",padding:"2px 8px",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:11}}>
                        {deleting===e.date?<Spinner/>:"✕"}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div style={{background:"rgba(57,255,20,0.08)",border:"1px solid #39ff1433",borderRadius:8,padding:"12px 14px"}}>
                  <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)",marginBottom:4}}>WEEKLY TOTAL</div>
                  <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:20,color:"#39ff14"}}>{ninjaSummary.total}</div>
                </div>
                <div style={{background:"rgba(0,207,255,0.08)",border:"1px solid #00cfff33",borderRadius:8,padding:"12px 14px"}}>
                  <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)",marginBottom:4}}>DAYS PLAYED</div>
                  <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:20,color:"#00cfff"}}>{ninjaSummary.days.length}</div>
                </div>
              </div>
            </>
          ):(
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:200,gap:10}}>
              <div style={{fontSize:38}}>🥷</div>
              <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:13,color:"rgba(255,255,255,0.3)",textAlign:"center"}}>
                Enter a ninja name to see their stats
              </p>
            </div>
          )}
        </Glass>
      </div>
    </div>
  );
}

//  🧩  RIDDLE TAB
// ══════════════════════════════════════════════════════════════════
function RiddleTab({setToast, isAdmin, riddleMap, setRiddleMap}){
  const totalWeeks = getCurrentWeek() + 1;
  const [week, setWeek] = useState(getCurrentWeek());
  const [sName, setSName] = useState("");
  const [sAnswer, setSAnswer] = useState("");
  const [newRiddleText, setNewRiddleText] = useState("");
  const [newAnswer, setNewAnswer] = useState("");
  const [editMode, setEditMode] = useState(false);
  const [errors, setErrors] = useState({});
  const [saving, setSaving] = useState(false);

  const weekData = riddleMap[week] || { text:"No riddle set yet — check back soon!", answer:"", entries:[] };

  function isCorrect(submitted, official){
    if(!official) return false;
    return submitted.trim().toLowerCase().includes(official.trim().toLowerCase());
  }

  function getSortedEntries(entries, answer){
    const latest = {};
    for(const e of entries){
      if(!latest[e.name]||e.ts>latest[e.name].ts) latest[e.name]=e;
    }
    const unique = Object.values(latest);
    const correct = unique.filter(e=>isCorrect(e.answer,answer)).sort((a,b)=>a.ts-b.ts);
    const wrong   = unique.filter(e=>!isCorrect(e.answer,answer)).sort((a,b)=>a.ts-b.ts);
    return { correct, wrong, firstCorrect:correct[0]||null };
  }

  const { correct, wrong, firstCorrect } = getSortedEntries(weekData.entries, weekData.answer);
  const allSorted = [...correct, ...wrong];

  async function submitAnswer(){
    const errs = {};
    if(!sName.trim()) errs.name = "Name required";
    if(!sAnswer.trim()) errs.answer = "Answer required";
    if(Object.keys(errs).length){ setErrors(errs); return; }
    setErrors({});
    setSaving(true);
    try{
      const ts = Date.now();
      const result = await window.fbRiddles.addSubmission(week, sName.trim(), sAnswer.trim(), ts);
      const existingEntries = (weekData.entries||[]).filter(e=>e.name!==sName.trim());
      const newEntry = { id: result.id, name:sName.trim(), answer:sAnswer.trim(), ts };
      setRiddleMap(prev=>({ ...prev, [week]:{ ...weekData, entries:[...existingEntries, newEntry] } }));
      setSName(""); setSAnswer("");
      const c = isCorrect(sAnswer.trim(), weekData.answer);
      setToast({ msg: c?`${sName.trim()} got it right! 🎉`:`${sName.trim()} submitted! ✅`, color:c?"#ffd700":"#39ff14" });
    } catch(e){
      setToast({ msg:`Save failed: ${e.message}`, color:"#ff2d78" });
    }
    setSaving(false);
  }

  async function saveRiddle(){
    if(!newRiddleText.trim()) return;
    setSaving(true);
    try{
      await window.fbRiddles.setRiddle(week, newRiddleText.trim(), newAnswer.trim().toLowerCase());
      setRiddleMap(prev=>({ ...prev, [week]:{ ...weekData, text:newRiddleText.trim(), answer:newAnswer.trim().toLowerCase() } }));
      setEditMode(false);
      setToast({ msg:"Riddle & answer saved! ✏️", color:"#39ff14" });
    } catch(e){
      setToast({ msg:`Save failed: ${e.message}`, color:"#ff2d78" });
    }
    setSaving(false);
  }

  async function deleteSubmission(entry){
    setSaving(true);
    try{
      const liveEntry = weekData.entries.find(e=>e.name===entry.name);
      if(liveEntry && liveEntry.id){
        await window.fbRiddles.deleteSubmission(week, liveEntry.id);
      }
      setRiddleMap(prev=>({ ...prev, [week]:{ ...weekData, entries:weekData.entries.filter(e=>e.name!==entry.name) } }));
      setToast({ msg:`Removed ${entry.name}'s answer.`, color:"#ff2d78" });
    } catch(e){
      setToast({ msg:`Delete failed: ${e.message}`, color:"#ff2d78" });
    }
    setSaving(false);
  }

  return(
    <div style={{padding:"28px 36px",animation:"fadeUp .4s ease both"}}>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:28,flexWrap:"wrap"}}>
        <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:20,color:"#fff",margin:0}}>🧩 Riddle of the Week</h2>
        <select value={week} onChange={e=>setWeek(Number(e.target.value))}
          style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.2)",
            borderRadius:8,color:"#fff",padding:"8px 14px",fontFamily:"'Fira Code',monospace",fontSize:12,cursor:"pointer"}}>
          {Array.from({length:totalWeeks},(_,i)=>i+1).map(w=>(
            <option key={w} value={w} style={{background:"#0a0a0f"}}>
              {getWeekLabel(w)}{w===getCurrentWeek()?" ← Current":""}
            </option>
          ))}
        </select>
      </div>

      {/* Riddle card */}
      <Glass style={{padding:28,marginBottom:28,borderColor:"#ff2d7833",
        boxShadow:"0 0 40px #ff2d7822,0 8px 32px rgba(0,0,0,0.4)",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:0,left:0,right:0,height:3,
          background:"linear-gradient(90deg,#ff2d78,#00cfff,#39ff14)"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
          <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)",letterSpacing:2}}>RIDDLE #{week}</span>
          {isAdmin&&(
            <button onClick={()=>{setEditMode(!editMode);setNewRiddleText(weekData.text);setNewAnswer(weekData.answer||"");}}
              style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,
                color:"rgba(255,255,255,0.5)",padding:"5px 12px",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:11}}>
              {editMode?"✕ Cancel":"✏️ Edit Riddle"}
            </button>
          )}
        </div>
        {editMode&&isAdmin?(
          <div>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:8,letterSpacing:1}}>RIDDLE TEXT</label>
            <textarea value={newRiddleText} onChange={e=>setNewRiddleText(e.target.value)}
              style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid #00cfff44",borderRadius:10,
                padding:"14px 16px",color:"#fff",fontFamily:"'Exo 2',sans-serif",fontSize:15,lineHeight:1.6,
                outline:"none",resize:"vertical",minHeight:80,boxSizing:"border-box",marginBottom:14}}/>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:8,letterSpacing:1}}>
              CORRECT ANSWER (admin only — hidden from students)
            </label>
            <input value={newAnswer} onChange={e=>setNewAnswer(e.target.value)}
              placeholder="e.g. echo" style={{...inputStyle(false),marginBottom:14}}/>
            <button onClick={saveRiddle} disabled={saving} style={{padding:"10px 24px",borderRadius:8,border:"none",cursor:"pointer",
              background:"linear-gradient(135deg,#ff2d78,#00cfff)",color:"#000",
              fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11,
              display:"flex",alignItems:"center",gap:8}}>
              {saving?<><Spinner/> Saving...</>:"SAVE RIDDLE ✓"}
            </button>
          </div>
        ):(
          <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:"clamp(14px,1.6vw,19px)",color:"#fff",lineHeight:1.7,margin:0,fontStyle:"italic"}}>
            "{weekData.text}"
          </p>
        )}
      </Glass>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:28}}>
        {/* Submit answer */}
        <Glass style={{padding:24}}>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,color:"#ff2d78",marginBottom:18,letterSpacing:1}}>SUBMIT YOUR ANSWER</h3>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)",marginBottom:16,lineHeight:1.6}}>
            Already answered? Submit again to update — your latest answer replaces the old one.
          </p>
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:8,letterSpacing:1}}>STUDENT NAME</label>
            <input value={sName} onChange={e=>setSName(e.target.value)} placeholder="Your ninja name" style={inputStyle(errors.name)}/>
            {errors.name&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.name}</p>}
          </div>
          <div style={{marginBottom:18}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:8,letterSpacing:1}}>YOUR ANSWER</label>
            <textarea value={sAnswer} onChange={e=>setSAnswer(e.target.value)} placeholder="Type your answer here..."
              style={{...inputStyle(errors.answer),resize:"vertical",minHeight:75}}/>
            {errors.answer&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.answer}</p>}
          </div>
          <button onClick={submitAnswer} disabled={saving} style={{width:"100%",padding:12,borderRadius:10,border:"none",
            cursor:saving?"not-allowed":"pointer",
            background:saving?"rgba(255,255,255,0.1)":"linear-gradient(135deg,#ff2d78,#00cfff)",
            color:saving?"rgba(255,255,255,0.4)":"#000",
            fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:12,letterSpacing:1,
            display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            {saving?<><Spinner/> Saving...</>:"SUBMIT ANSWER 🧩"}
          </button>
        </Glass>

        {/* Answers list */}
        <div>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,color:"#00cfff",marginBottom:14,letterSpacing:1}}>
            STUDENT ANSWERS ({allSorted.length})
          </h3>
          <div style={{display:"flex",flexDirection:"column",gap:9,maxHeight:380,overflowY:"auto"}}>
            {allSorted.length===0?(
              <Glass style={{padding:24,textAlign:"center"}}>
                <p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.35)",fontSize:13}}>No answers yet — be the first! 🧠</p>
              </Glass>
            ):allSorted.map((a,i)=>{
              const isFirst = firstCorrect && a.name===firstCorrect.name;
              const correct_ = isCorrect(a.answer, weekData.answer);
              const borderColor = isFirst?"#ffd700":correct_?"#39ff14":"rgba(255,255,255,0.08)";
              const glow = isFirst?"0 0 24px #ffd70044,0 4px 16px rgba(0,0,0,0.4)":"0 4px 16px rgba(0,0,0,0.3)";
              return(
                <Glass key={i} style={{padding:"13px 16px",borderColor,boxShadow:glow,
                  animation:`fadeUp .3s ease both ${i*.05}s`,transition:"transform .2s",position:"relative"}}
                  onMouseEnter={e=>e.currentTarget.style.transform="translateX(4px)"}
                  onMouseLeave={e=>e.currentTarget.style.transform="none"}>
                  {isFirst&&(
                    <div style={{position:"absolute",top:-1,left:-1,right:-1,bottom:-1,
                      border:"2px solid #ffd70066",borderRadius:16,pointerEvents:"none"}}/>
                  )}
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:5}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      {isFirst&&<span style={{fontSize:16}}>👑</span>}
                      <span style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:13,
                        color:isFirst?"#ffd700":correct_?"#39ff14":"#00cfff"}}>{a.name}</span>
                      {isFirst&&<span style={{background:"rgba(255,215,0,0.15)",border:"1px solid #ffd70044",borderRadius:4,
                        padding:"1px 6px",fontFamily:"'Fira Code',monospace",fontSize:9,color:"#ffd700"}}>FIRST CORRECT</span>}
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)"}}>
                        {new Date(a.ts).toLocaleDateString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}
                      </span>
                      {isAdmin&&(
                        <button onClick={()=>deleteSubmission(a)} disabled={saving}
                          style={{background:"rgba(255,45,120,0.1)",border:"1px solid #ff2d7844",borderRadius:6,
                            color:"#ff2d78",padding:"2px 7px",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:10}}>✕</button>
                      )}
                    </div>
                  </div>
                  <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:13,color:"rgba(255,255,255,0.75)",margin:0}}>{a.answer}</p>
                </Glass>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

//  🔲  LEADERBOARDS TAB WRAPPER
// ══════════════════════════════════════════════════════════════════
function LeaderboardsTab({allEntries, setAllEntries, setToast, isAdmin}){
  const [sub, setSub] = useState("view");
  const tabs = [{id:"view",label:"🏆 Weekly Leaderboard"}];
  if(isAdmin) tabs.push({id:"enter",label:"📝 Enter Scores"});
  return(
    <div style={{minHeight:"100%"}}>
      <div style={{padding:"28px 36px 0",display:"flex",gap:8,alignItems:"center"}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setSub(t.id)} style={{padding:"10px 20px",borderRadius:99,border:"none",cursor:"pointer",
            fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:12,transition:"all .2s",
            background:sub===t.id?"linear-gradient(135deg,#39ff14,#00cfff)":"rgba(255,255,255,0.07)",
            color:sub===t.id?"#000":"rgba(255,255,255,0.6)",
            boxShadow:sub===t.id?"0 0 20px #39ff1444":"none"}}>{t.label}</button>
        ))}
        {!isAdmin&&(
          <div style={{display:"flex",alignItems:"center",padding:"8px 16px",borderRadius:99,
            background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)"}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.35)"}}>👀 Guest — view only</span>
          </div>
        )}
      </div>
      {sub==="view"&&<LeaderboardView allEntries={allEntries}/>}
      {sub==="enter"&&isAdmin&&<EnterScores allEntries={allEntries} setAllEntries={setAllEntries} setToast={setToast}/>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  🗂️  SIDEBAR
// ══════════════════════════════════════════════════════════════════
const NAV = [
  {id:"home",    icon:"🏠",label:"Home"},
  {id:"leaderboards",icon:"🏆",label:"Leaderboards"},
  {id:"riddle",  icon:"🧩",label:"Riddle of the Week"}
];
function Sidebar({active, onNav, isAdmin, onLogout}){
  return(
    <div style={{width:210,flexShrink:0,height:"100vh",display:"flex",flexDirection:"column",
      padding:"22px 14px",gap:6,background:"rgba(0,0,0,0.35)",
      backdropFilter:"blur(24px)",WebkitBackdropFilter:"blur(24px)",
      borderRight:"1px solid rgba(255,255,255,0.06)",zIndex:10}}>
      <div style={{padding:"14px 10px 20px",textAlign:"center"}}>
        <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:900,fontSize:12,letterSpacing:1.5,color:"#39ff14",lineHeight:1.4}}>CODE NINJAS</div>
        <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)",letterSpacing:2,marginTop:2}}>ROBBINSVILLE</div>
        <div style={{width:36,height:2,background:"linear-gradient(90deg,#39ff14,#00cfff)",margin:"10px auto 8px",borderRadius:99}}/>
        <div style={{display:"inline-flex",alignItems:"center",gap:5,
          background:isAdmin?"rgba(57,255,20,0.12)":"rgba(0,207,255,0.1)",
          border:`1px solid ${isAdmin?"#39ff1444":"#00cfff44"}`,borderRadius:99,padding:"4px 10px"}}>
          <span style={{fontSize:10}}>{isAdmin?"🔐":"👀"}</span>
          <span style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:isAdmin?"#39ff14":"#00cfff",letterSpacing:1}}>
            {isAdmin?"ADMIN":"GUEST"}
          </span>
        </div>
      </div>
      {NAV.map(item=>(
        <button key={item.id} onClick={()=>onNav(item.id)} style={{
          display:"flex",alignItems:"center",gap:10,padding:"11px 14px",borderRadius:11,border:"none",cursor:"pointer",
          fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:12,transition:"all .2s",textAlign:"left",
          background:active===item.id?"linear-gradient(135deg,rgba(57,255,20,0.18),rgba(0,207,255,0.12))":"transparent",
          color:active===item.id?"#fff":"rgba(255,255,255,0.4)",
          boxShadow:active===item.id?"inset 0 0 0 1px rgba(57,255,20,0.3),0 0 16px rgba(57,255,20,0.1)":"none"}}
          onMouseEnter={e=>{if(active!==item.id){e.currentTarget.style.background="rgba(255,255,255,0.05)";e.currentTarget.style.color="#fff";}}}
          onMouseLeave={e=>{if(active!==item.id){e.currentTarget.style.background="transparent";e.currentTarget.style.color="rgba(255,255,255,0.4)";}}}> 
          <span style={{fontSize:17}}>{item.icon}</span>{item.label}
        </button>
      ))}
      <div style={{marginTop:"auto",padding:"0 0 4px"}}>
        <Glass style={{padding:"11px 14px",marginBottom:8}}>
          <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)",letterSpacing:1,marginBottom:3}}>CURRENT</div>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:12,color:"#39ff14"}}>WEEK {getCurrentWeek()}</div>
        </Glass>
        <button onClick={onLogout} style={{width:"100%",padding:"9px",borderRadius:9,border:"1px solid rgba(255,255,255,0.1)",
          background:"rgba(255,255,255,0.03)",color:"rgba(255,255,255,0.35)",cursor:"pointer",
          fontFamily:"'Fira Code',monospace",fontSize:10,letterSpacing:1,transition:"all .2s"}}
          onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,45,120,0.1)";e.currentTarget.style.borderColor="#ff2d7844";e.currentTarget.style.color="#ff2d78";}}
          onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.03)";e.currentTarget.style.borderColor="rgba(255,255,255,0.1)";e.currentTarget.style.color="rgba(255,255,255,0.35)";}}>
          ← LOG OUT
        </button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  🔑  LOGIN SCREEN
// ══════════════════════════════════════════════════════════════════
function LoginScreen({onLogin}){
  const [pw,setPw] = useState("");
  const [show,setShow] = useState(false);
  const [shake,setShake] = useState(false);
  const [hint,setHint] = useState("");

  function attempt(){
    if(pw===ADMIN_PASS){ onLogin("admin"); }
    else if(pw.trim()===""){ setHint("Enter the admin password or use Guest below."); setShake(true); setTimeout(()=>setShake(false),500); }
    else { onLogin("guest"); }
  }

  return(
    <div style={{position:"fixed",inset:0,display:"flex",alignItems:"center",justifyContent:"center",
      background:"radial-gradient(ellipse 70% 60% at 50% 40%,rgba(57,255,20,0.07) 0%,transparent 70%),#060609",zIndex:100}}>
      <Particles/><FloatingCode/>
      <div style={{position:"relative",zIndex:2,width:"100%",maxWidth:420,padding:"0 24px",animation:"fadeUp .6s ease both"}}>
        <div style={{textAlign:"center",marginBottom:40}}>
          <div style={{display:"inline-flex",alignItems:"center",justifyContent:"center",
            width:72,height:72,borderRadius:"50%",marginBottom:16,
            background:"rgba(57,255,20,0.08)",border:"2px solid #39ff1444"}}>
            <span style={{fontSize:36}}>🥷</span>
          </div>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:900,fontSize:22,letterSpacing:2,color:"#39ff14",marginBottom:4}}>CODE NINJAS</div>
          <div style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.3)",letterSpacing:3}}>ROBBINSVILLE</div>
          <div style={{width:60,height:2,background:"linear-gradient(90deg,#39ff14,#00cfff)",margin:"14px auto 0",borderRadius:99}}/>
        </div>
        <Glass style={{padding:32,borderColor:"rgba(57,255,20,0.15)",animation:shake?"shakeCard .5s ease":"none"}}>
          <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:16,color:"#fff",textAlign:"center",marginBottom:6,letterSpacing:1}}>WELCOME BACK</h2>
          <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:13,color:"rgba(255,255,255,0.4)",textAlign:"center",marginBottom:28}}>Admin password for full access, or continue as guest</p>
          <div style={{marginBottom:8}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:8,letterSpacing:1.5}}>PASSWORD</label>
            <div style={{position:"relative"}}>
              <input value={pw} onChange={e=>{setPw(e.target.value);setHint("");}} onKeyDown={e=>e.key==="Enter"&&attempt()}
                type={show?"text":"password"} placeholder="Enter admin password..."
                style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,
                  padding:"13px 44px 13px 16px",color:"#fff",fontFamily:"'Fira Code',monospace",fontSize:14,
                  outline:"none",boxSizing:"border-box",letterSpacing:pw&&!show?3:1}}
                onFocus={e=>e.target.style.borderColor="#39ff14"}
                onBlur={e=>e.target.style.borderColor="rgba(255,255,255,0.15)"}/>
              <button onClick={()=>setShow(!show)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",
                background:"none",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.4)",fontSize:16,padding:0}}>
                {show?"🙈":"👁️"}
              </button>
            </div>
            {hint&&<p style={{color:"#ff2d78",fontSize:11,marginTop:6,fontFamily:"'Fira Code',monospace"}}>{hint}</p>}
          </div>
          <button onClick={attempt} style={{width:"100%",padding:"13px",borderRadius:10,border:"none",cursor:"pointer",
            background:"linear-gradient(135deg,#39ff14,#00cfff)",color:"#000",fontFamily:"'Orbitron',sans-serif",
            fontWeight:700,fontSize:13,letterSpacing:1.5,marginTop:18,transition:"transform .2s,opacity .2s"}}
            onMouseEnter={e=>{e.target.style.transform="scale(1.02)";e.target.style.opacity=".92";}}
            onMouseLeave={e=>{e.target.style.transform="none";e.target.style.opacity="1";}}>
            ENTER DOJO ⚡
          </button>
          <div style={{display:"flex",alignItems:"center",gap:12,margin:"20px 0"}}>
            <div style={{flex:1,height:1,background:"rgba(255,255,255,0.08)"}}/>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.25)"}}>OR</span>
            <div style={{flex:1,height:1,background:"rgba(255,255,255,0.08)"}}/>
          </div>
          <button onClick={()=>onLogin("guest")} style={{width:"100%",padding:"12px",borderRadius:10,
            border:"1px solid rgba(255,255,255,0.15)",cursor:"pointer",background:"rgba(255,255,255,0.04)",
            color:"rgba(255,255,255,0.6)",fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:13,transition:"all .2s"}}
            onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,255,255,0.09)";e.currentTarget.style.color="#fff";}}
            onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.04)";e.currentTarget.style.color="rgba(255,255,255,0.6)";}}>
            👀 Continue as Guest (View Only)
          </button>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.2)",textAlign:"center",marginTop:18,lineHeight:1.6}}>
            Guests can view leaderboards &amp; riddles.<br/>Admin access required to enter scores &amp; riddles.
          </p>
        </Glass>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  ⏳  LOADING SCREEN
// ══════════════════════════════════════════════════════════════════
function LoadingScreen({status}){
  return(
    <div style={{position:"fixed",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
      background:"#060609",zIndex:200,gap:16}}>
      <div style={{fontSize:48}}>🥷</div>
      <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:14,color:"#39ff14",letterSpacing:2}}>LOADING DOJO...</div>
      <div style={{width:40,height:40,border:"3px solid rgba(57,255,20,0.2)",borderTop:"3px solid #39ff14",
        borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <div style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.3)"}}>{status}</div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  🚀  APP ROOT
// ══════════════════════════════════════════════════════════════════
function App(){
  const [role,    setRole]    = useState(null);
  const [tab,     setTab]     = useState("home");
  const [allEntries,  setAllEntries]  = useState([]);
  const [riddleMap,   setRiddleMap]   = useState({});
  const [toast,   setToast]   = useState(null);
  const [loading, setLoading] = useState(true);
  const [loadStatus, setLoadStatus] = useState("Connecting to Firebase...");
  const isAdmin = role==="admin";

  async function loadData(){
    setLoadStatus("Loading leaderboard...");
    try{
      const entries = await window.fbLeaderboard.getAll();
      setAllEntries(entries);
    } catch(e){ console.warn("leaderboard load error", e); }

    setLoadStatus("Loading riddles...");
    try{
      const map = await window.fbRiddles.getAll();
      setRiddleMap(map);
    } catch(e){ console.warn("riddle load error", e); }

    setLoading(false);
  }

  useEffect(()=>{ loadData(); },[]);

  // Refresh every 60s so guests see live updates
  useEffect(()=>{
    if(!role) return;
    const iv = setInterval(loadData, 60000);
    return () => clearInterval(iv);
  },[role]);

  if(loading) return <LoadingScreen status={loadStatus}/>;
  if(!role)   return <LoginScreen onLogin={r=>setRole(r)}/>;

  return(
    <>
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",
        background:"radial-gradient(ellipse 60% 50% at 80% 20%,rgba(57,255,20,0.06) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(0,207,255,0.07) 0%,transparent 70%),#060609"}}/>
      <div style={{display:"flex",height:"100vh",position:"relative",zIndex:1}}>
        <Sidebar active={tab} onNav={setTab} isAdmin={isAdmin} onLogout={()=>setRole(null)}/>
        <div key={tab} style={{flex:1,overflowY:"auto",animation:"fadeUp .35s ease both"}}>
          {tab==="home"        && <HomeTab onNav={setTab} allEntries={allEntries}/>}
          {tab==="leaderboards"&& <LeaderboardsTab allEntries={allEntries} setAllEntries={setAllEntries} setToast={setToast} isAdmin={isAdmin}/>}
          {tab==="riddle"      && <RiddleTab setToast={setToast} isAdmin={isAdmin} riddleMap={riddleMap} setRiddleMap={setRiddleMap}/>}
        </div>
      </div>
      {toast&&<Toast msg={toast.msg} color={toast.color||"#39ff14"} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
