        )}
      </div>
      {sub==="view"&&<LeaderboardView allEntries={allEntries}/>}
      {sub==="enter"&&isAdmin&&<EnterScores allEntries={allEntries} setAllEntries={setAllEntries} setToast={setToast}/>}
    </div>
  );
}

// ── Riddle Tab ──────────────────────────────────────────────────────────────
function RiddleTab({setToast,isAdmin,isStudent,studentUsername,riddleMap,setRiddleMap}){
  const cw = getCurrentWeek();
  const totalWeeks = getCurrentWeek()+1;
  const [week,setWeek] = useState(cw);
  const [sName,setSName] = useState(studentUsername||"");
  const [sAnswer,setSAnswer] = useState("");
  // Keep sName in sync if studentUsername changes (e.g. tab switch)
  useEffect(()=>{if(studentUsername) setSName(studentUsername);},[studentUsername]);
  const [newRiddleText,setNewRiddleText] = useState("");
  const [editMode,setEditMode] = useState(false);
  const [revealMode,setRevealMode] = useState(false);
  const [revealAnswer,setRevealAnswer] = useState("");
  const [gradeMode,setGradeMode] = useState(false);
  const [selectedWinner,setSelectedWinner] = useState(null);
  const [errors,setErrors] = useState({});
  const [saving,setSaving] = useState(false);

  const isPastWeek = week < cw;
  const isCurrentWeek = week === cw;
  const weekData = riddleMap[week] || {text:"No riddle set yet — check back soon!",answer:"",revealed:false,winner:null,locked:false,entries:[]};
  const gradingActive = weekData.revealed && !!weekData.answer;
  const isLocked = weekData.locked;

  // Students can submit only on current week; guests cannot submit
  const canSubmit = isCurrentWeek && (isAdmin || isStudent);

  function isCorrect(submitted, official){
    if(!official || !gradingActive) return false;
    return submitted.trim().toLowerCase().includes(official.trim().toLowerCase());
  }

  function getSortedEntries(entries){
    const latest = {};
    for(const e of entries){
      if(!latest[e.name] || e.ts > latest[e.name].ts) latest[e.name] = e;
    }
    const unique = Object.values(latest);
    if(gradingActive){
      const correct = unique.filter(e=>isCorrect(e.answer,weekData.answer)).sort((a,b)=>a.ts-b.ts);
      const wrong   = unique.filter(e=>!isCorrect(e.answer,weekData.answer)).sort((a,b)=>a.ts-b.ts);
      return {sorted:[...correct,...wrong], firstCorrect:correct[0]||null};
    }
    return {sorted:unique.sort((a,b)=>a.ts-b.ts), firstCorrect:null};
  }
  const {sorted:allSorted, firstCorrect} = getSortedEntries(weekData.entries||[]);

  async function submitAnswer(){
    const errs={};
    if(!sName.trim()) errs.name="Name required";
    if(!sAnswer.trim()) errs.answer="Answer required";
    if(Object.keys(errs).length){setErrors(errs);return;}
    setErrors({});setSaving(true);
    try{
      const ts = Date.now();
      const result = await window.fbRiddles.addSubmission(week,sName.trim(),sAnswer.trim(),ts);
      const existing = (weekData.entries||[]).filter(e=>e.name!==sName.trim());
      const newEntry = {id:result.id,name:sName.trim(),answer:sAnswer.trim(),ts};
      setRiddleMap(prev=>({...prev,[week]:{...weekData,entries:[...existing,newEntry]}}));
      setSName("");setSAnswer("");
      setToast({msg:`${sName.trim()} submitted! ✅`,color:"#39ff14"});
    } catch(e){setToast({msg:`Save failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  async function saveRiddle(){
    if(!newRiddleText.trim()) return;
    setSaving(true);
    try{
      await window.fbRiddles.setRiddle(week,newRiddleText.trim(),"");
      setRiddleMap(prev=>({...prev,[week]:{...weekData,text:newRiddleText.trim(),answer:"",revealed:false}}));
      setEditMode(false);
      setToast({msg:"Riddle saved! Reveal the answer at end of week. ✏️",color:"#39ff14"});
    } catch(e){setToast({msg:`Save failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  async function revealCorrectAnswer(){
    if(!revealAnswer.trim()) return;
    setSaving(true);
    try{
      await window.fbRiddles.setRiddle(week,weekData.text,revealAnswer.trim().toLowerCase());
      await db.ref(`riddles/week_${week}`).update({revealed:true});
      setRiddleMap(prev=>({...prev,[week]:{...weekData,answer:revealAnswer.trim().toLowerCase(),revealed:true}}));
      setRevealMode(false);setRevealAnswer("");
      setToast({msg:"Answer revealed! Grading is now active. 🎉",color:"#ffd700"});
    } catch(e){setToast({msg:`Save failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  async function lockWinner(){
    if(!selectedWinner) return;
    setSaving(true);
    try{
      await window.fbRiddles.setWinner(week,selectedWinner);
      setRiddleMap(prev=>({...prev,[week]:{...weekData,winner:selectedWinner,locked:true}}));
      setGradeMode(false);setSelectedWinner(null);
      setToast({msg:`🏆 ${selectedWinner} locked in as winner for Week ${week}!`,color:"#ffd700"});
    } catch(e){setToast({msg:`Lock failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  async function deleteSubmission(entry){
    setSaving(true);
    try{
      const live = weekData.entries.find(e=>e.name===entry.name);
      if(live&&live.id) await window.fbRiddles.deleteSubmission(week,live.id);
      setRiddleMap(prev=>({...prev,[week]:{...weekData,entries:weekData.entries.filter(e=>e.name!==entry.name)}}));
      setToast({msg:`Removed ${entry.name}'s answer.`,color:"#ff2d78"});
    } catch(e){setToast({msg:`Delete failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  return(
    <div style={{padding:"clamp(16px,3vw,28px) clamp(14px,3vw,36px)",animation:"fadeUp .4s ease both"}}>

      {/* ── Header row ── */}
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24,flexWrap:"wrap"}}>
        <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:"clamp(14px,2vw,20px)",color:"#fff",margin:0}}>🧩 Riddle of the Week</h2>
        <select value={week} onChange={e=>{setWeek(Number(e.target.value));setGradeMode(false);setEditMode(false);setRevealMode(false);}}
          style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:8,color:"#fff",padding:"7px 12px",fontFamily:"'Fira Code',monospace",fontSize:11,cursor:"pointer"}}>
          {Array.from({length:totalWeeks},(_,i)=>i+1).map(w=>(
            <option key={w} value={w} style={{background:"#0a0a0f"}}>
              {getWeekLabel(w)}{w===cw?" ← Current":""}
            </option>
          ))}
        </select>
        {/* Status badge */}
        {isLocked?(
          <div style={{padding:"4px 12px",borderRadius:99,background:"rgba(255,215,0,0.15)",
            border:"1px solid #ffd70055",fontFamily:"'Fira Code',monospace",fontSize:9,color:"#ffd700"}}>
            🏆 LOCKED — winner: {weekData.winner}
          </div>
        ):gradingActive?(
          <div style={{padding:"4px 12px",borderRadius:99,background:"rgba(57,255,20,0.1)",
            border:"1px solid #39ff1433",fontFamily:"'Fira Code',monospace",fontSize:9,color:"#39ff14"}}>
            ✅ ANSWER REVEALED — grading active
          </div>
        ):(
          <div style={{padding:"4px 12px",borderRadius:99,background:"rgba(255,255,255,0.05)",
            border:"1px solid rgba(255,255,255,0.1)",fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.35)"}}>
            {isPastWeek?"📅 PAST WEEK":"🔒 ANSWER HIDDEN — submissions open"}
          </div>
        )}
      </div>

      {/* ── Past-week closed banner for students ── */}
      {isPastWeek&&(
        <Glass style={{padding:"14px 20px",marginBottom:20,borderColor:"rgba(255,255,255,0.1)",
          background:"rgba(255,255,255,0.03)"}}>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.4)",margin:0,textAlign:"center"}}>
            📅 This week has ended — submissions are closed.
          </p>
        </Glass>
      )}

      {/* ── Locked winner banner ── */}
      {isLocked&&(
        <Glass style={{padding:"18px 24px",marginBottom:24,
          borderColor:"#ffd70044",background:"rgba(255,215,0,0.06)",
          boxShadow:"0 0 30px #ffd70022"}}>
          <div style={{display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
            <span style={{fontSize:32}}>👑</span>
            <div>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:14,fontWeight:700,color:"#ffd700",marginBottom:3}}>
                Week {week} Winner
              </div>
              <div style={{fontFamily:"'Exo 2',sans-serif",fontSize:18,fontWeight:700,color:"#fff"}}>
                {weekData.winner}
              </div>
              <div style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,215,0,0.5)",marginTop:2}}>
                🔒 Result locked — cannot be changed
              </div>
            </div>
          </div>
        </Glass>
      )}

      {/* ── Admin grading panel (past week, revealed, not yet locked) ── */}
      {isAdmin&&isPastWeek&&gradingActive&&!isLocked&&(
        <Glass style={{padding:"20px 24px",marginBottom:24,
          borderColor:"#ffd70044",background:"rgba(255,215,0,0.06)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{fontFamily:"'Orbitron',sans-serif",fontSize:13,color:"#ffd700",marginBottom:4}}>
                🏆 SELECT THIS WEEK'S WINNER
              </div>
              <div style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.35)"}}>
                Choose one ninja — this cannot be undone after locking.
              </div>
            </div>
            <button onClick={()=>setGradeMode(!gradeMode)}
              style={{background:gradeMode?"rgba(255,45,120,0.1)":"rgba(255,215,0,0.12)",
                border:`1px solid ${gradeMode?"#ff2d7844":"#ffd70044"}`,borderRadius:8,
                color:gradeMode?"#ff2d78":"#ffd700",padding:"7px 16px",cursor:"pointer",
                fontFamily:"'Fira Code',monospace",fontSize:11}}>
              {gradeMode?"✕ Cancel":"Choose Winner"}
            </button>
          </div>
          {gradeMode&&(
            <>
              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16,maxHeight:280,overflowY:"auto"}}>
                {allSorted.map((a,i)=>{
                  const corr = isCorrect(a.answer,weekData.answer);
                  const selected = selectedWinner===a.name;
                  return(
                    <div key={i} onClick={()=>setSelectedWinner(selected?null:a.name)}
                      style={{display:"flex",alignItems:"flex-start",gap:12,padding:"12px 14px",borderRadius:12,cursor:"pointer",
                        background:selected?"rgba(255,215,0,0.12)":"rgba(255,255,255,0.04)",
                        border:`2px solid ${selected?"#ffd700":corr?"#39ff1433":"rgba(255,255,255,0.08)"}`,
                        transition:"all .15s"}}>
                      {/* Selection circle */}
                      <div style={{width:20,height:20,borderRadius:"50%",flexShrink:0,marginTop:1,
                        background:selected?"#ffd700":"transparent",
                        border:`2px solid ${selected?"#ffd700":"rgba(255,255,255,0.3)"}`,
                        display:"flex",alignItems:"center",justifyContent:"center",transition:"all .15s"}}>
                        {selected&&<div style={{width:8,height:8,borderRadius:"50%",background:"#000"}}/>}
                      </div>
                      <div style={{flex:1}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
                          <span style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:13,
                            color:selected?"#ffd700":corr?"#39ff14":"#fff"}}>{a.name}</span>
                          {corr&&<span style={{background:"rgba(57,255,20,0.1)",border:"1px solid #39ff1433",
                            borderRadius:4,padding:"1px 6px",fontFamily:"'Fira Code',monospace",
                            fontSize:8,color:"#39ff14"}}>✓ CORRECT</span>}
                        </div>
                        <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,
                          color:"rgba(255,255,255,0.6)",margin:0,fontStyle:"italic"}}>"{a.answer}"</p>
                      </div>
                    </div>
                  );
                })}
              </div>
              <button onClick={lockWinner} disabled={!selectedWinner||saving}
                style={{width:"100%",padding:"12px",borderRadius:10,border:"none",
                  cursor:!selectedWinner||saving?"not-allowed":"pointer",
                  background:!selectedWinner||saving?"rgba(255,255,255,0.08)":"linear-gradient(135deg,#ffd700,#ff8c00)",
                  color:!selectedWinner||saving?"rgba(255,255,255,0.3)":"#000",
                  fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:12,letterSpacing:1,
                  display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
                {saving?<><Spinner/> Locking...</>:selectedWinner?`🔒 LOCK IN ${selectedWinner} AS WINNER`:"← Select a ninja above"}
              </button>
            </>
          )}
        </Glass>
      )}

      {/* ── Admin grading panel (past week, not yet revealed) ── */}
      {isAdmin&&isPastWeek&&!gradingActive&&!isLocked&&(
        <Glass style={{padding:"16px 20px",marginBottom:24,
          borderColor:"#ffd70033",background:"rgba(255,215,0,0.05)"}}>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"#ffd700",margin:0,lineHeight:1.7}}>
            📋 This week has ended. Reveal the correct answer to begin grading, then select a winner.
          </p>
        </Glass>
      )}

      {/* ── Riddle card ── */}
      <Glass style={{padding:24,marginBottom:24,borderColor:"#ff2d7833",
        boxShadow:"0 0 40px #ff2d7822,0 8px 32px rgba(0,0,0,0.4)",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:0,left:0,right:0,height:3,
          background:"linear-gradient(90deg,#ff2d78,#00cfff,#39ff14)"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,gap:8,flexWrap:"wrap"}}>
          <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)",letterSpacing:2}}>
            RIDDLE #{week}
          </span>
          {isAdmin&&!isLocked&&(
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <button onClick={()=>{setEditMode(!editMode);setRevealMode(false);setNewRiddleText(weekData.text);}}
                style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",
                  borderRadius:8,color:"rgba(255,255,255,0.5)",padding:"5px 12px",cursor:"pointer",
                  fontFamily:"'Fira Code',monospace",fontSize:11}}>
                {editMode?"✕ Cancel":"✏️ Edit Riddle"}
              </button>
              {!gradingActive&&(
                <button onClick={()=>{setRevealMode(!revealMode);setEditMode(false);setRevealAnswer(weekData.answer||"");}}
                  style={{background:revealMode?"rgba(255,45,120,0.1)":"rgba(255,215,0,0.1)",
                    border:`1px solid ${revealMode?"#ff2d7844":"#ffd70044"}`,borderRadius:8,
                    color:revealMode?"#ff2d78":"#ffd700",padding:"5px 12px",cursor:"pointer",
                    fontFamily:"'Fira Code',monospace",fontSize:11}}>
                  {revealMode?"✕ Cancel":"🔓 Reveal Answer"}
                </button>
              )}
            </div>
          )}
        </div>

        {editMode&&isAdmin&&!isLocked?(
          <div>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,
              color:"rgba(255,255,255,0.4)",marginBottom:7,letterSpacing:1}}>RIDDLE TEXT</label>
            <textarea value={newRiddleText} onChange={e=>setNewRiddleText(e.target.value)}
              style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid #00cfff44",
                borderRadius:10,padding:"12px 14px",color:"#fff",fontFamily:"'Exo 2',sans-serif",
                fontSize:14,lineHeight:1.6,outline:"none",resize:"vertical",minHeight:75,
                boxSizing:"border-box",marginBottom:12}}/>
            <div style={{background:"rgba(255,207,0,0.06)",border:"1px solid #ffd70033",borderRadius:8,
              padding:"10px 14px",marginBottom:12}}>
              <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"#ffd700",margin:0,lineHeight:1.6}}>
                💡 Set the correct answer separately via "Reveal Answer" at end of week.
              </p>
            </div>
            <button onClick={saveRiddle} disabled={saving}
              style={{padding:"9px 22px",borderRadius:8,border:"none",cursor:"pointer",
                background:"linear-gradient(135deg,#ff2d78,#00cfff)",color:"#000",
                fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11,
                display:"flex",alignItems:"center",gap:8}}>
              {saving?<><Spinner/> Saving...</>:"SAVE RIDDLE ✓"}
            </button>
          </div>
        ):revealMode&&isAdmin&&!isLocked?(
          <div style={{background:"rgba(255,215,0,0.06)",border:"1px solid #ffd70033",borderRadius:12,padding:"16px 18px"}}>
            <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"#ffd700",marginBottom:14,lineHeight:1.6}}>
              🔓 Enter the correct answer. Once saved, answers will be graded and you can select a winner.
            </p>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,
              color:"rgba(255,255,255,0.4)",marginBottom:7,letterSpacing:1}}>CORRECT ANSWER</label>
            <input value={revealAnswer} onChange={e=>setRevealAnswer(e.target.value)}
              placeholder="e.g. echo" style={{...iStyle(false),marginBottom:12}}
              onFocus={e=>e.target.style.borderColor="#ffd700"}
              onBlur={e=>e.target.style.borderColor="rgba(255,255,255,0.15)"}/>
            <button onClick={revealCorrectAnswer} disabled={saving||!revealAnswer.trim()}
              style={{padding:"10px 24px",borderRadius:8,border:"none",
                cursor:saving||!revealAnswer.trim()?"not-allowed":"pointer",
                background:saving?"rgba(255,255,255,0.1)":"linear-gradient(135deg,#ffd700,#ff8c00)",
                color:"#000",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11,
                display:"flex",alignItems:"center",gap:8}}>
              {saving?<><Spinner/> Saving...</>:"🔓 REVEAL & GRADE ANSWERS"}
            </button>
          </div>
        ):(
          <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:"clamp(13px,1.5vw,18px)",color:"#fff",
            lineHeight:1.7,margin:0,fontStyle:"italic"}}>"{weekData.text}"</p>
        )}
      </Glass>

      {/* ── Submit + Answers grid ── */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:24}}>

        {/* Submit panel — admin/student on current week only; guests always see closed */}
        {isCurrentWeek && (isAdmin || isStudent)?(
          <Glass style={{padding:22}}>
            <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"#ff2d78",marginBottom:14,letterSpacing:1}}>
              SUBMIT YOUR ANSWER
            </h3>
            <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)",marginBottom:14,lineHeight:1.6}}>
              Already answered? Submit again to update.
            </p>
            <div style={{marginBottom:12}}>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,
                color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>STUDENT NAME</label>
              <input value={sName}
                onChange={e=>{if(!studentUsername) setSName(e.target.value);}}
                readOnly={!!studentUsername}
                placeholder="Your ninja name"
                style={{...iStyle(errors.name),
                  cursor:studentUsername?"default":"text",
                  opacity:studentUsername?0.75:1,
                  background:studentUsername?"rgba(57,255,20,0.06)":"rgba(255,255,255,0.06)",
                  borderColor:studentUsername?"#39ff1444":undefined
                }}/>
              {studentUsername&&<p style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"#39ff14",marginTop:3}}>🔐 Locked to your username</p>}
              {errors.name&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.name}</p>}
            </div>
            <div style={{marginBottom:16}}>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,
                color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>YOUR ANSWER</label>
              <textarea value={sAnswer} onChange={e=>setSAnswer(e.target.value)} placeholder="Type your answer here..."
                style={{...iStyle(errors.answer),resize:"vertical",minHeight:70}}/>
              {errors.answer&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.answer}</p>}
            </div>
            <button onClick={submitAnswer} disabled={saving}
              style={{width:"100%",padding:11,borderRadius:10,border:"none",cursor:saving?"not-allowed":"pointer",
                background:saving?"rgba(255,255,255,0.1)":"linear-gradient(135deg,#ff2d78,#00cfff)",
                color:saving?"rgba(255,255,255,0.4)":"#000",fontFamily:"'Orbitron',sans-serif",
                fontWeight:700,fontSize:11,letterSpacing:1,
                display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              {saving?<><Spinner/> Saving...</>:"SUBMIT ANSWER 🧩"}
            </button>
          </Glass>
        ):(
          <Glass style={{padding:22,borderColor:"rgba(255,255,255,0.06)",opacity:.65}}>
            <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"rgba(255,255,255,0.3)",marginBottom:14,letterSpacing:1}}>
              SUBMIT YOUR ANSWER
            </h3>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
              height:120,gap:10}}>
              <span style={{fontSize:28}}>{!isAdmin&&!isStudent?"🔒":"📅"}</span>
              <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.3)",
                textAlign:"center",lineHeight:1.6}}>
                {!isAdmin&&!isStudent
                  ?<>Guest access.<br/>Log in with your username to submit.</>
                  :<>This week has ended.<br/>Submissions are closed.</>
                }
              </p>
            </div>
          </Glass>
        )}

        {/* Answers list */}
        <div>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:11,color:"#00cfff",marginBottom:12,letterSpacing:1}}>
            STUDENT ANSWERS ({allSorted.length})
          </h3>
          <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:420,overflowY:"auto"}}>
            {allSorted.length===0?(
              <Glass style={{padding:22,textAlign:"center"}}>
                <p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.35)",fontSize:13}}>
                  No answers yet — be the first! 🧠
                </p>
              </Glass>
            ):allSorted.map((a,i)=>{
              const isWinner = isLocked && weekData.winner===a.name;
              const isFirst  = !isLocked && firstCorrect && a.name===firstCorrect.name;
              const corr     = gradingActive && isCorrect(a.answer,weekData.answer);
              const borderCol= isWinner?"#ffd700":isFirst?"#ffd700":corr?"#39ff14":"rgba(255,255,255,0.08)";
              return(
                <Glass key={i} style={{padding:"11px 14px",borderColor:borderCol,
                  animation:`fadeUp .3s ease both ${i*.05}s`,
                  boxShadow:isWinner?"0 0 20px #ffd70033":undefined}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                    <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                      {(isWinner||isFirst)&&<span style={{fontSize:14}}>👑</span>}
                      <span style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:12,
                        color:isWinner?"#ffd700":corr?"#39ff14":"#00cfff"}}>{a.name}</span>
                      {isWinner&&(
                        <span style={{background:"rgba(255,215,0,0.15)",border:"1px solid #ffd70044",
                          borderRadius:4,padding:"1px 6px",fontFamily:"'Fira Code',monospace",
                          fontSize:8,color:"#ffd700"}}>🏆 WINNER</span>
                      )}
                      {!isWinner&&corr&&!isFirst&&(
                        <span style={{background:"rgba(57,255,20,0.1)",border:"1px solid #39ff1433",
                          borderRadius:4,padding:"1px 5px",fontFamily:"'Fira Code',monospace",
                          fontSize:8,color:"#39ff14"}}>✓ CORRECT</span>
                      )}
                      {!isWinner&&isFirst&&gradingActive&&(
                        <span style={{background:"rgba(255,215,0,0.15)",border:"1px solid #ffd70044",
                          borderRadius:4,padding:"1px 5px",fontFamily:"'Fira Code',monospace",
                          fontSize:8,color:"#ffd700"}}>FIRST CORRECT</span>
                      )}
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                      <span style={{fontFamily:"'Fira Code',monospace",fontSize:8,color:"rgba(255,255,255,0.3)"}}>
                        {new Date(a.ts).toLocaleDateString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}
                      </span>
                      {isAdmin&&!isLocked&&(
                        <button onClick={()=>deleteSubmission(a)} disabled={saving}
                          style={{background:"rgba(255,45,120,0.1)",border:"1px solid #ff2d7844",
                            borderRadius:6,color:"#ff2d78",padding:"1px 6px",cursor:"pointer",
                            fontFamily:"'Fira Code',monospace",fontSize:10}}>✕</button>
                      )}
                    </div>
                  </div>
                  <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.75)",margin:0}}>
                    {a.answer}
                  </p>
                </Glass>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── NOTM Tab ─────────────────────────────────────────────────────────────────
function NOTMTab({isAdmin,notmEntries,setNotmEntries,setToast}){
  const [selMonth,setSelMonth]=useState(()=>{
    const n=new Date();
    return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;
  });
  const [name,setName]=useState("");
  const [points,setPoints]=useState("");
  const [errors,setErrors]=useState({});
  const [saving,setSaving]=useState(false);
  const [deleting,setDeleting]=useState(null);
  const [addMode,setAddMode]=useState(false);

  // Build sorted month list from entries + current month
  function monthLabel(mk){
    const [y,m]=mk.split("-");
    return new Date(Number(y),Number(m)-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
  }
  function monthShort(mk){
    const [y,m]=mk.split("-");
    return `${String(m).padStart(2,"0")}/${String(y).slice(2)}`;
  }

  const allMonths=Array.from(new Set([
    selMonth,
    ...notmEntries.map(e=>e.monthKey)
  ])).sort((a,b)=>b.localeCompare(a));

  const monthEntries=notmEntries
    .filter(e=>e.monthKey===selMonth)
    .sort((a,b)=>b.points-a.points);

  // Overall all-time leaderboard (deduplicated by name, highest monthly score)
  const allTimeMap={};
  for(const e of notmEntries){
    if(!allTimeMap[e.name]||e.points>allTimeMap[e.name].points){
      allTimeMap[e.name]={name:e.name,points:e.points,monthKey:e.monthKey};
    }
  }
  const allTime=Object.values(allTimeMap).sort((a,b)=>b.points-a.points);

  async function addEntry(){
    const errs={};
    if(!name.trim()) errs.name="Name required";
    const p=Number(points);
    if(!points||isNaN(p)) errs.points="Must be a number";
    else if(p<0) errs.points="No negative points";
    if(Object.keys(errs).length){setErrors(errs);return;}
    setErrors({});setSaving(true);
    try{
      const result=await window.fbNOTM.addEntry(selMonth,name.trim(),p);
      setNotmEntries(prev=>[...prev,{id:result.id,monthKey:selMonth,name:name.trim(),points:p,ts:Date.now()}]);
      setName("");setPoints("");setAddMode(false);
      setToast({msg:`${name.trim()} added with ${p} pts for ${monthLabel(selMonth)}! ⭐`,color:"#ffd700"});
    } catch(e){setToast({msg:`Save failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  async function removeEntry(entry){
    setDeleting(entry.id);
    try{
      await window.fbNOTM.deleteEntry(entry.id);
      setNotmEntries(prev=>prev.filter(e=>e.id!==entry.id));
      setToast({msg:`Removed ${entry.name}.`,color:"#ff2d78"});
    } catch(e){setToast({msg:`Delete failed: ${e.message}`,color:"#ff2d78"});}
    setDeleting(null);
  }

  const PODIUM_COLORS=["#ffd700","#c0c0c0","#cd7f32"];

  function MonthRow({entry,rank}){
    const gc=rank<=3?PODIUM_COLORS[rank-1]:"transparent";
    return(
      <Glass style={{padding:"12px 18px",marginBottom:8,
        borderColor:rank<=3?`${gc}44`:"rgba(255,255,255,0.08)",
        boxShadow:rank<=3?`0 0 18px ${gc}22,0 4px 20px rgba(0,0,0,0.4)`:"0 4px 14px rgba(0,0,0,0.3)",
        animation:`fadeUp .35s ease both ${(rank-1)*.05}s`}}>
        <div style={{display:"grid",gridTemplateColumns:"40px 1fr 80px 90px",gap:10,alignItems:"center"}}>
          {/* Rank badge */}
          <div style={{width:32,height:32,borderRadius:"50%",flexShrink:0,
            background:rank<=3?`linear-gradient(135deg,${gc},${gc}99)`:"rgba(255,255,255,0.08)",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontWeight:700,fontSize:rank<=3?14:11,color:rank<=3?"#000":"#999",
            boxShadow:rank<=3?`0 0 12px ${gc}88`:"none"}}>
            {rank===1?"👑":rank===2?"🥈":rank===3?"🥉":`#${rank}`}
          </div>
          {/* Name */}
          <div style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,
            fontSize:"clamp(12px,1.5vw,14px)",color:"#fff"}}>{entry.name}</div>
          {/* MM/YY */}
          <div style={{fontFamily:"'Fira Code',monospace",fontSize:11,
            color:"rgba(255,255,255,0.45)",textAlign:"center"}}>{monthShort(entry.monthKey)}</div>
          {/* Points */}
          <div style={{textAlign:"right",fontFamily:"'Orbitron',sans-serif",fontWeight:700,
            fontSize:"clamp(13px,1.8vw,16px)",color:rank<=3?gc:"#39ff14",
            textShadow:rank<=3?`0 0 10px ${gc}88`:"0 0 8px #39ff1455"}}>
            {Number(entry.points).toLocaleString()}
            {isAdmin&&(
              <button onClick={()=>removeEntry(entry)} disabled={!!deleting}
                style={{marginLeft:8,background:"rgba(255,45,120,0.12)",border:"1px solid #ff2d7833",
                  borderRadius:5,color:"#ff2d78",padding:"1px 6px",cursor:"pointer",
                  fontFamily:"'Fira Code',monospace",fontSize:9,verticalAlign:"middle"}}>
                {deleting===entry.id?<Spinner/>:"✕"}
              </button>
            )}
          </div>
        </div>
      </Glass>
    );
  }

  return(
    <div style={{padding:"clamp(16px,3vw,28px) clamp(14px,3vw,36px)",animation:"fadeUp .4s ease both"}}>

      {/* ── Header ── */}
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28,flexWrap:"wrap"}}>
        <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:"clamp(15px,2vw,22px)",
          color:"#fff",margin:0,
          background:"linear-gradient(135deg,#ffd700,#ff8c00)",
          WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
          ⭐ Ninja of the Month
        </h2>
        {isAdmin&&(
          <button onClick={()=>setAddMode(!addMode)}
            style={{padding:"8px 18px",borderRadius:99,border:"none",cursor:"pointer",
              fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:12,transition:"all .2s",
              background:addMode?"rgba(255,45,120,0.12)":"linear-gradient(135deg,#ffd700,#ff8c00)",
              color:addMode?"#ff2d78":"#000",
              border:addMode?"1px solid #ff2d7844":"none"}}>
            {addMode?"✕ Cancel":"+ Add Entry"}
          </button>
        )}
      </div>

      {/* ── Admin add entry panel ── */}
      {isAdmin&&addMode&&(
        <Glass style={{padding:24,marginBottom:28,borderColor:"#ffd70033",
          background:"rgba(255,215,0,0.04)"}}>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,color:"#ffd700",
            marginBottom:18,letterSpacing:1}}>ADD NOTM ENTRY</h3>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:16,marginBottom:18}}>
            {/* Month picker */}
            <div>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,
                color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>MONTH</label>
              <select value={selMonth} onChange={e=>setSelMonth(e.target.value)}
                style={{width:"100%",background:"rgba(255,255,255,0.06)",
                  border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,
                  color:"#fff",padding:"11px 14px",fontFamily:"'Fira Code',monospace",
                  fontSize:13,outline:"none",cursor:"pointer"}}>
                {/* Show past 12 months + next month */}
                {Array.from({length:13},(_,i)=>{
                  const d=new Date();d.setMonth(d.getMonth()-6+i);
                  const mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
                  return <option key={mk} value={mk} style={{background:"#0a0a0f"}}>{monthLabel(mk)}</option>;
                })}
              </select>
            </div>
            {/* Name */}
            <div>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,
                color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>NINJA NAME</label>
              <input value={name} onChange={e=>{setName(e.target.value);setErrors({});}}
                placeholder="e.g. ShadowByte" style={iStyle(errors.name)}
                onFocus={e=>e.target.style.borderColor="#ffd700"}
                onBlur={e=>e.target.style.borderColor=errors.name?"#ff2d78":"rgba(255,255,255,0.15)"}/>
              {errors.name&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.name}</p>}
            </div>
            {/* Points */}
            <div>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,
                color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>POINTS</label>
              <input value={points} onChange={e=>setPoints(e.target.value)} type="number" min="0"
                placeholder="e.g. 2500"
                style={{...iStyle(errors.points),fontFamily:"'Fira Code',monospace",fontSize:16}}
                onFocus={e=>e.target.style.borderColor="#ffd700"}
                onBlur={e=>e.target.style.borderColor=errors.points?"#ff2d78":"rgba(255,255,255,0.15)"}
                onKeyDown={e=>e.key==="Enter"&&!saving&&addEntry()}/>
              {errors.points&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.points}</p>}
            </div>
          </div>
          <button onClick={addEntry} disabled={saving}
            style={{padding:"12px 32px",borderRadius:10,border:"none",cursor:saving?"not-allowed":"pointer",
              background:saving?"rgba(255,255,255,0.08)":"linear-gradient(135deg,#ffd700,#ff8c00)",
              color:saving?"rgba(255,255,255,0.3)":"#000",
              fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:12,letterSpacing:1,
              display:"flex",alignItems:"center",gap:10}}>
            {saving?<><Spinner/> SAVING...</>:"⭐ ADD ENTRY"}
          </button>
        </Glass>
      )}

      {/* ── Two column layout: monthly view + all-time ── */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:28}}>

        {/* ── Monthly leaderboard ── */}
        <div>
          {/* Month selector tabs */}
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:18}}>
            {allMonths.slice(0,8).map(mk=>(
              <button key={mk} onClick={()=>setSelMonth(mk)} style={{
                padding:"7px 14px",borderRadius:99,border:"none",cursor:"pointer",
                fontFamily:"'Fira Code',monospace",fontSize:11,transition:"all .2s",
                background:selMonth===mk?"linear-gradient(135deg,#ffd700,#ff8c00)":"rgba(255,255,255,0.07)",
                color:selMonth===mk?"#000":"rgba(255,255,255,0.55)",
                boxShadow:selMonth===mk?"0 0 16px #ffd70044":"none"}}>
                {monthShort(mk)}
              </button>
            ))}
          </div>

          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:13,color:"#ffd700",
              margin:0,letterSpacing:1}}>
              {monthLabel(selMonth).toUpperCase()}
            </h3>
            <div style={{flex:1,height:1,background:"linear-gradient(90deg,#ffd70033,transparent)"}}/>
          </div>

          {monthEntries.length===0?(
            <Glass style={{padding:32,textAlign:"center"}}>
              <p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.35)",fontSize:13}}>
                No entries for this month yet.{isAdmin?" Use '+ Add Entry' above.":""}
              </p>
            </Glass>
          ):(
            <div>
              {/* Column headers */}
              <div style={{display:"grid",gridTemplateColumns:"40px 1fr 80px 90px",gap:10,
                padding:"4px 18px",fontFamily:"'Fira Code',monospace",fontSize:9,
                color:"rgba(255,255,255,0.25)",letterSpacing:1.5,marginBottom:6}}>
                <span>RANK</span><span>NINJA</span><span style={{textAlign:"center"}}>MM/YY</span><span style={{textAlign:"right"}}>PTS</span>
              </div>
              {monthEntries.map((entry,i)=>(
                <MonthRow key={entry.id} entry={entry} rank={i+1}/>
              ))}
            </div>
          )}
        </div>

        {/* ── All-time Hall of Fame ── */}
        <div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:13,
              color:"#ff2d78",margin:0,letterSpacing:1}}>🏛️ HALL OF FAME</h3>
            <div style={{flex:1,height:1,background:"linear-gradient(90deg,#ff2d7833,transparent)"}}/>
          </div>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:9,
            color:"rgba(255,255,255,0.25)",marginBottom:14,lineHeight:1.5}}>
            Best single-month score per ninja, all time
          </p>
          {allTime.length===0?(
            <Glass style={{padding:32,textAlign:"center"}}>
              <p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.35)",fontSize:13}}>
                No data yet.
              </p>
            </Glass>
          ):(
            <div>
              <div style={{display:"grid",gridTemplateColumns:"40px 1fr 80px 90px",gap:10,
                padding:"4px 18px",fontFamily:"'Fira Code',monospace",fontSize:9,
                color:"rgba(255,255,255,0.25)",letterSpacing:1.5,marginBottom:6}}>
                <span>RANK</span><span>NINJA</span><span style={{textAlign:"center"}}>BEST</span><span style={{textAlign:"right"}}>PTS</span>
              </div>
              {allTime.map((entry,i)=>(
                <MonthRow key={entry.name} entry={entry} rank={i+1}/>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Polls Tab ────────────────────────────────────────────────────────────────
function PollsTab({isAdmin,isStudent,studentUsername,pollsData,setPollsData,setToast}){
  const [view,setView] = useState("results"); // results | create | pending (admin)
  const [title,setTitle] = useState("");
  const [options,setOptions] = useState(["",""]);
  const [errors,setErrors] = useState({});
  const [saving,setSaving] = useState(false);
  const [actionId,setActionId] = useState(null);

  // Determine a stable voterId for this session — student username, or a guest-local id stored in memory
  const voterId = isStudent ? studentUsername : (isAdmin ? "ADMIN" : null);

  const approvedPolls = pollsData.filter(p=>p.status==="approved").sort((a,b)=>b.ts-a.ts);
  const pendingPolls  = pollsData.filter(p=>p.status==="pending").sort((a,b)=>a.ts-b.ts);

  const PODIUM = ["#39ff14","#00cfff","#ff2d78","#ffd700","#bf5fff","#ff8c00","#00ff9d"];

  // ── Create poll ──────────────────────────────────────────────────────────
  function updateOption(i,val){
    const next=[...options]; next[i]=val; setOptions(next);
  }
  function addOption(){
    if(options.length>=7) return;
    setOptions([...options,""]);
  }
  function removeOption(i){
    if(options.length<=2) return;
    setOptions(options.filter((_,idx)=>idx!==i));
  }

  async function submitPoll(){
    const errs={};
    if(!title.trim()) errs.title="Poll title is required";
    const filled = options.map(o=>o.trim()).filter(Boolean);
    if(filled.length<2) errs.options="At least 2 options are required";
    if(Object.keys(errs).length){setErrors(errs);return;}
    setErrors({});setSaving(true);
    try{
      const creator = isStudent ? studentUsername : (isAdmin ? "Sensei" : "Unknown");
      const result = await window.fbPolls.createPoll(title.trim(),filled,creator);
      setPollsData(prev=>[...prev,{id:result.id,title:title.trim(),options:filled,status:"pending",createdBy:creator,ts:Date.now(),votes:[]}]);
      setTitle("");setOptions(["",""]);setView("results");
      setToast({msg:"Poll sent for admin approval! 📊",color:"#00cfff"});
    } catch(e){setToast({msg:`Failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  // ── Admin approve/deny ───────────────────────────────────────────────────
  async function approvePoll(pollId){
    setActionId(pollId);
    try{
      await window.fbPolls.setStatus(pollId,"approved");
      setPollsData(prev=>prev.map(p=>p.id===pollId?{...p,status:"approved"}:p));
      setToast({msg:"Poll approved! Now live for everyone. ✅",color:"#39ff14"});
    } catch(e){setToast({msg:`Failed: ${e.message}`,color:"#ff2d78"});}
    setActionId(null);
  }
  async function denyPoll(pollId){
    setActionId(pollId);
    try{
      await window.fbPolls.deletePoll(pollId);
      setPollsData(prev=>prev.filter(p=>p.id!==pollId));
      setToast({msg:"Poll denied and removed.",color:"#ff2d78"});
    } catch(e){setToast({msg:`Failed: ${e.message}`,color:"#ff2d78"});}
    setActionId(null);
  }

  // ── Voting ───────────────────────────────────────────────────────────────
  async function castVote(poll,optIdx){
    if(!voterId) return; // guests can't vote
    setActionId(poll.id);
    try{
      await window.fbPolls.vote(poll.id,voterId,optIdx);
      setPollsData(prev=>prev.map(p=>{
        if(p.id!==poll.id) return p;
        const otherVotes = p.votes.filter(v=>v.voterId!==voterId);
        return {...p,votes:[...otherVotes,{voterId,optIdx}]};
      }));
      setToast({msg:"Vote cast! 🗳️",color:"#39ff14"});
    } catch(e){setToast({msg:`Vote failed: ${e.message}`,color:"#ff2d78"});}
    setActionId(null);
  }

  function getMyVote(poll){
    if(!voterId) return null;
    const v = poll.votes.find(v=>v.voterId===voterId);
    return v?v.optIdx:null;
  }

  function getCounts(poll){
    const counts = poll.options.map(()=>0);
    poll.votes.forEach(v=>{ if(counts[v.optIdx]!==undefined) counts[v.optIdx]++; });
    const total = counts.reduce((s,c)=>s+c,0);
    return {counts,total};
  }

  // ── Poll result card (used by everyone) ──────────────────────────────────
  function PollCard({poll,index}){
    const {counts,total} = getCounts(poll);
    const myVote = getMyVote(poll);
    const canVote = !!voterId && myVote===null;
    const showResults = myVote!==null || isAdmin; // once voted (or admin), show bars; otherwise show vote buttons

    return(
      <Glass style={{padding:22,marginBottom:16,borderColor:"rgba(255,255,255,0.1)",
        animation:`fadeUp .4s ease both ${index*.06}s`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16,gap:8,flexWrap:"wrap"}}>
          <h3 style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:15,color:"#fff",margin:0}}>
            📊 {poll.title}
          </h3>
          <span style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)",whiteSpace:"nowrap"}}>
            by {poll.createdBy} · {total} vote{total!==1?"s":""}
          </span>
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {poll.options.map((opt,i)=>{
            const c = counts[i];
            const pct = total>0 ? Math.round((c/total)*100) : 0;
            const isMine = myVote===i;
            const color = PODIUM[i%PODIUM.length];

            if(!showResults){
              // Show as clickable vote button (WhatsApp-style bar, unfilled)
              return(
                <button key={i} onClick={()=>castVote(poll,i)} disabled={!canVote||actionId===poll.id}
                  style={{
                    position:"relative",width:"100%",textAlign:"left",
                    padding:"13px 16px",borderRadius:10,
                    border:`1px solid ${color}44`,
                    background:"rgba(255,255,255,0.04)",
                    cursor:canVote?"pointer":"not-allowed",
                    color:"#fff",fontFamily:"'Exo 2',sans-serif",fontSize:13,fontWeight:600,
                    transition:"all .15s",overflow:"hidden"
                  }}
                  onMouseEnter={e=>{if(canVote){e.currentTarget.style.background=`${color}22`;e.currentTarget.style.borderColor=color;}}}
                  onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.04)";e.currentTarget.style.borderColor=`${color}44`;}}>
                  {opt}
                </button>
              );
            }

            // Show as result bar (WhatsApp-poll style, filled by percentage)
            return(
              <div key={i} style={{position:"relative"}}>
                <div style={{
                  position:"relative",width:"100%",borderRadius:10,overflow:"hidden",
                  border:`1px solid ${isMine?color:"rgba(255,255,255,0.1)"}`,
                  background:"rgba(255,255,255,0.04)",
                  boxShadow:isMine?`0 0 16px ${color}44`:"none"
                }}>
                  {/* Fill bar */}
                  <div style={{
                    position:"absolute",top:0,left:0,bottom:0,
                    width:`${pct}%`,background:`linear-gradient(90deg,${color}55,${color}33)`,
                    transition:"width .6s ease"
                  }}/>
                  {/* Content row */}
                  <div style={{position:"relative",display:"flex",justifyContent:"space-between",alignItems:"center",
                    padding:"12px 16px",zIndex:1}}>
                    <span style={{fontFamily:"'Exo 2',sans-serif",fontSize:13,fontWeight:600,color:"#fff",
                      display:"flex",alignItems:"center",gap:6}}>
                      {isMine&&<span style={{fontSize:12}}>✓</span>}
                      {opt}
                    </span>
                    <span style={{fontFamily:"'Orbitron',sans-serif",fontSize:13,fontWeight:700,color}}>
                      {pct}%
                    </span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {!voterId&&(
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)",marginTop:12,textAlign:"center"}}>
            👀 Log in with your username to vote
          </p>
        )}
        {myVote!==null&&(
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"#39ff14",marginTop:12,textAlign:"center"}}>
            ✓ You voted — results shown above
          </p>
        )}
      </Glass>
    );
  }

  return(
    <div style={{padding:"clamp(16px,3vw,28px) clamp(14px,3vw,36px)",animation:"fadeUp .4s ease both"}}>

      {/* ── Header + view tabs ── */}
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28,flexWrap:"wrap"}}>
        <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:"clamp(15px,2vw,22px)",
          color:"#fff",margin:0,
          background:"linear-gradient(135deg,#00cfff,#39ff14)",
          WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
          📊 Polls
        </h2>

        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button onClick={()=>setView("results")} style={{padding:"8px 16px",borderRadius:99,border:"none",cursor:"pointer",
            fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:12,transition:"all .2s",
            background:view==="results"?"linear-gradient(135deg,#00cfff,#39ff14)":"rgba(255,255,255,0.07)",
            color:view==="results"?"#000":"rgba(255,255,255,0.6)"}}>
            Live Polls
          </button>

          {(isStudent||isAdmin)&&(
            <button onClick={()=>setView("create")} style={{padding:"8px 16px",borderRadius:99,border:"none",cursor:"pointer",
              fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:12,transition:"all .2s",
              background:view==="create"?"linear-gradient(135deg,#00cfff,#39ff14)":"rgba(255,255,255,0.07)",
              color:view==="create"?"#000":"rgba(255,255,255,0.6)"}}>
              + Create Poll
            </button>
          )}

          {isAdmin&&(
            <button onClick={()=>setView("pending")} style={{padding:"8px 16px",borderRadius:99,border:"none",cursor:"pointer",
              fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:12,transition:"all .2s",position:"relative",
              background:view==="pending"?"linear-gradient(135deg,#ffd700,#ff8c00)":"rgba(255,255,255,0.07)",
              color:view==="pending"?"#000":"rgba(255,255,255,0.6)"}}>
              🔔 Pending {pendingPolls.length>0&&`(${pendingPolls.length})`}
            </button>
          )}
        </div>

        {!isStudent&&!isAdmin&&(
          <div style={{padding:"7px 14px",borderRadius:99,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.1)"}}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.35)"}}>👀 Guest — results only</span>
          </div>
        )}
      </div>

      {/* ══ VIEW: LIVE RESULTS (everyone) ══ */}
      {view==="results"&&(
        approvedPolls.length===0?(
          <Glass style={{padding:40,textAlign:"center"}}>
            <p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.4)",fontSize:15}}>
              No live polls yet.{(isStudent||isAdmin)?" Create one to get started! 📊":""}
            </p>
          </Glass>
        ):(
          <div>
            {approvedPolls.map((poll,i)=>(
              <PollCard key={poll.id} poll={poll} index={i}/>
            ))}
          </div>
        )
      )}

      {/* ══ VIEW: CREATE (student/admin) ══ */}
      {view==="create"&&(isStudent||isAdmin)&&(
        <Glass style={{padding:26,borderColor:"#00cfff33",background:"rgba(0,207,255,0.04)"}}>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:13,color:"#00cfff",marginBottom:6,letterSpacing:1}}>
            CREATE A NEW POLL
          </h3>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.35)",marginBottom:20,lineHeight:1.6}}>
            Your poll will be sent to the Sensei for approval before it goes live.
          </p>

          <div style={{marginBottom:18}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,
              color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>POLL TITLE</label>
            <input value={title} onChange={e=>{setTitle(e.target.value);setErrors({});}}
              placeholder="e.g. What should next week's riddle theme be?"
              style={iStyle(errors.title)}
              onFocus={e=>e.target.style.borderColor="#00cfff"}
              onBlur={e=>e.target.style.borderColor=errors.title?"#ff2d78":"rgba(255,255,255,0.15)"}/>
            {errors.title&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.title}</p>}
          </div>

          <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,
            color:"rgba(255,255,255,0.45)",marginBottom:10,letterSpacing:1}}>
            OPTIONS (2–7)
          </label>
          <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
            {options.map((opt,i)=>(
              <div key={i} style={{display:"flex",gap:8,alignItems:"center"}}>
                <div style={{width:28,height:28,borderRadius:8,flexShrink:0,
                  background:"rgba(0,207,255,0.1)",border:"1px solid #00cfff33",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontFamily:"'Fira Code',monospace",fontSize:11,color:"#00cfff"}}>
                  {i+1}
                </div>
                <input value={opt} onChange={e=>updateOption(i,e.target.value)}
                  placeholder={`Option ${i+1}`} style={iStyle(false)}/>
                {options.length>2&&(
                  <button onClick={()=>removeOption(i)}
                    style={{flexShrink:0,background:"rgba(255,45,120,0.1)",border:"1px solid #ff2d7844",
                      borderRadius:8,color:"#ff2d78",padding:"8px 11px",cursor:"pointer",fontSize:13}}>
                    ✕
                  </button>
                )}
              </div>
            ))}
          </div>
          {errors.options&&<p style={{color:"#ff2d78",fontSize:11,marginBottom:14,fontFamily:"'Fira Code',monospace"}}>{errors.options}</p>}

          {options.length<7&&(
            <button onClick={addOption} style={{marginBottom:20,padding:"8px 18px",borderRadius:8,
              border:"1px dashed rgba(255,255,255,0.25)",background:"rgba(255,255,255,0.03)",
              color:"rgba(255,255,255,0.5)",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:11}}>
              + Add another option
            </button>
          )}

          <button onClick={submitPoll} disabled={saving}
            style={{width:"100%",padding:13,borderRadius:10,border:"none",cursor:saving?"not-allowed":"pointer",
              background:saving?"rgba(255,255,255,0.08)":"linear-gradient(135deg,#00cfff,#39ff14)",
              color:saving?"rgba(255,255,255,0.3)":"#000",
              fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:12,letterSpacing:1,
              display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
            {saving?<><Spinner/> SENDING...</>:"📤 SEND FOR APPROVAL"}
          </button>
        </Glass>
      )}

      {/* ══ VIEW: PENDING APPROVAL (admin only) ══ */}
      {view==="pending"&&isAdmin&&(
        pendingPolls.length===0?(
          <Glass style={{padding:40,textAlign:"center"}}>
            <p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.4)",fontSize:15}}>
              No pending polls to review. 🎉
            </p>
          </Glass>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            {pendingPolls.map((poll,i)=>(
              <Glass key={poll.id} style={{padding:22,borderColor:"#ffd70033",
                background:"rgba(255,215,0,0.04)",animation:`fadeUp .35s ease both ${i*.06}s`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14,flexWrap:"wrap",gap:8}}>
                  <h3 style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:15,color:"#fff",margin:0}}>
                    {poll.title}
                  </h3>
                  <span style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,215,0,0.5)"}}>
                    by {poll.createdBy}
                  </span>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:18}}>
                  {poll.options.map((opt,oi)=>(
                    <div key={oi} style={{padding:"9px 14px",borderRadius:8,
                      background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",
                      fontFamily:"'Exo 2',sans-serif",fontSize:13,color:"rgba(255,255,255,0.8)"}}>
                      {oi+1}. {opt}
                    </div>
                  ))}
                </div>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>approvePoll(poll.id)} disabled={actionId===poll.id}
                    style={{flex:1,padding:11,borderRadius:9,border:"none",cursor:"pointer",
                      background:actionId===poll.id?"rgba(255,255,255,0.08)":"linear-gradient(135deg,#39ff14,#00cfff)",
                      color:actionId===poll.id?"rgba(255,255,255,0.3)":"#000",
                      fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11,
                      display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                    {actionId===poll.id?<Spinner/>:"✓ APPROVE"}
                  </button>
                  <button onClick={()=>denyPoll(poll.id)} disabled={actionId===poll.id}
                    style={{flex:1,padding:11,borderRadius:9,
                      border:"1px solid #ff2d7844",cursor:"pointer",
                      background:"rgba(255,45,120,0.1)",color:"#ff2d78",
                      fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
                    ✕ DENY
                  </button>
                </div>
              </Glass>
            ))}
          </div>
        )
      )}
    </div>
  );
}

// ── Login Screen ────────────────────────────────────────────────────────────
function LoginScreen({onLogin}){
  const [pw,setPw]=useState("");
  const [show,setShow]=useState(false);
  const [shake,setShake]=useState(false);
  const [hint,setHint]=useState("");
  const [checking,setChecking]=useState(false);

  async function attempt(){
    const trimmed = pw.trim();
    if(trimmed===""){
      setHint("Enter your username or the Sensei password.");
      setShake(true);setTimeout(()=>setShake(false),500);
      return;
    }
    // Admin check first
    if(trimmed===ADMIN_PASS){onLogin("admin",null);return;}
    // Check Firebase usernames
    setChecking(true);setHint("");
    try{
      const matched = await window.fbUsernames.check(trimmed);
      if(matched){
        onLogin("student",matched);
      } else {
        // Not admin, not a valid username → guest
        onLogin("guest",null);
      }
    } catch(e){
      console.warn("Username check failed:",e);
      onLogin("guest",null);
    }
    setChecking(false);
  }
  return(
    <div style={{position:"fixed",inset:0,display:"flex",alignItems:"center",justifyContent:"center",
      background:"radial-gradient(ellipse 70% 60% at 50% 40%,rgba(57,255,20,0.07) 0%,transparent 70%),#060609",zIndex:100,padding:"16px",overflow:"auto"}}>
      <Particles/><FloatingCode/>
      <div style={{position:"relative",zIndex:2,width:"100%",maxWidth:400,animation:"fadeUp .6s ease both"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:900,fontSize:20,letterSpacing:2,color:"#39ff14",marginBottom:3}}>CODE NINJAS</div>
          <div style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)",letterSpacing:3}}>ROBBINSVILLE</div>
          <div style={{width:60,height:2,background:"linear-gradient(90deg,#39ff14,#00cfff)",margin:"12px auto 0",borderRadius:99}}/>
        </div>
        <Glass style={{padding:"clamp(20px,4vw,32px)",borderColor:"rgba(57,255,20,0.15)",animation:shake?"shakeCard .5s ease":"none"}}>
          <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:15,color:"#fff",textAlign:"center",marginBottom:5,letterSpacing:1}}>WELCOME BACK</h2>
          <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.4)",textAlign:"center",marginBottom:24}}>Enter your username for student access, Sensei password for admin, or continue as guest</p>
          <div style={{marginBottom:8}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:7,letterSpacing:1.5}}>USERNAME / PASSWORD</label>
            <div style={{position:"relative"}}>
              <input value={pw} onChange={e=>{setPw(e.target.value);setHint("");}} onKeyDown={e=>e.key==="Enter"&&attempt()}
                type={show?"text":"password"} placeholder="Username or Sensei password..."
                style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,
                  padding:"12px 42px 12px 14px",color:"#fff",fontFamily:"'Fira Code',monospace",fontSize:14,outline:"none",boxSizing:"border-box",letterSpacing:pw&&!show?3:1}}
                onFocus={e=>e.target.style.borderColor="#39ff14"}
                onBlur={e=>e.target.style.borderColor="rgba(255,255,255,0.15)"}/>
              <button onClick={()=>setShow(!show)} style={{position:"absolute",right:11,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.4)",fontSize:15,padding:0}}>{show?"🙈":"👁️"}</button>
            </div>
            {hint&&<p style={{color:"#ff2d78",fontSize:11,marginTop:5,fontFamily:"'Fira Code',monospace"}}>{hint}</p>}
          </div>
          <button onClick={attempt} disabled={checking} style={{width:"100%",padding:"12px",borderRadius:10,border:"none",cursor:checking?"not-allowed":"pointer",
            background:checking?"rgba(255,255,255,0.1)":"linear-gradient(135deg,#39ff14,#00cfff)",color:checking?"rgba(255,255,255,0.4)":"#000",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:13,letterSpacing:1.5,marginTop:16,transition:"transform .2s,opacity .2s"}}
            onMouseEnter={e=>{e.target.style.transform="scale(1.02)";e.target.style.opacity=".92";}}
            onMouseLeave={e=>{e.target.style.transform="none";e.target.style.opacity="1";}}>
            {checking?<><Spinner/> CHECKING...</>:"ENTER DOJO ⚡"}
          </button>
          <div style={{display:"flex",alignItems:"center",gap:10,margin:"18px 0"}}>
            <div style={{flex:1,height:1,background:"rgba(255,255,255,0.08)"}}/>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.25)"}}>OR</span>
            <div style={{flex:1,height:1,background:"rgba(255,255,255,0.08)"}}/>
          </div>
          <button onClick={()=>onLogin("guest")} style={{width:"100%",padding:"11px",borderRadius:10,border:"1px solid rgba(255,255,255,0.15)",cursor:"pointer",background:"rgba(255,255,255,0.04)",color:"rgba(255,255,255,0.6)",fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:13,transition:"all .2s"}}
            onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,255,255,0.09)";e.currentTarget.style.color="#fff";}}
            onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.04)";e.currentTarget.style.color="rgba(255,255,255,0.6)";}}>
            👀 Continue as Guest (View Only)
          </button>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.2)",textAlign:"center",marginTop:16,lineHeight:1.6}}>
            Students: enter your username · Sensei: enter Senseis<br/>Guests can view but not interact.
          </p>
        </Glass>
      </div>
    </div>
  );
}

// ── Loading Screen ──────────────────────────────────────────────────────────
function LoadingScreen({status}){
  return(
    <div style={{position:"fixed",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#060609",zIndex:200,gap:16,padding:16}}>
      <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:13,color:"#39ff14",letterSpacing:2}}>LOADING DOJO...</div>
      <div style={{width:36,height:36,border:"3px solid rgba(57,255,20,0.2)",borderTop:"3px solid #39ff14",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <div style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.3)"}}>{status}</div>
    </div>
  );
}

// ── useIsMobile ─────────────────────────────────────────────────────────────
function useIsMobile(){
  const [mobile,setMobile]=useState(window.innerWidth<=768);
  useEffect(()=>{const h=()=>setMobile(window.innerWidth<=768);window.addEventListener("resize",h);return()=>window.removeEventListener("resize",h);},[]);
  return mobile;
}

// ── App Root ────────────────────────────────────────────────────────────────
function App(){
  const [role,setRole]=useState(null);
  const [studentUsername,setStudentUsername]=useState(null);
  const [tab,setTab]=useState("home");
  const [allEntries,setAllEntries]=useState([]);
  const [riddleMap,setRiddleMap]=useState({});
  const [notmEntries,setNotmEntries]=useState([]);
  const [pollsData,setPollsData]=useState([]);
  const [toast,setToast]=useState(null);
  const [loading,setLoading]=useState(true);
  const [loadStatus,setLoadStatus]=useState("Connecting to Firebase...");
  const isAdmin=role==="admin";
  const isStudent=role==="student";
  const isMobile=useIsMobile();

  async function loadData(){
    setLoadStatus("Loading leaderboard...");
    try{const entries=await window.fbLeaderboard.getAll();setAllEntries(entries);}catch(e){console.warn(e);}
    setLoadStatus("Loading riddles...");
    try{const map=await window.fbRiddles.getAll();setRiddleMap(map);}catch(e){console.warn(e);}
    setLoadStatus("Loading NOTM...");
    try{
      let ne=await window.fbNOTM.getAll();
      // Seed default entries if DB is empty
      if(ne.length===0){
        const seed=[
          {monthKey:"2026-04",name:"Nandish",points:7},
          {monthKey:"2026-05",name:"Cameron",points:4},
        ];
        for(const s of seed){
          const r=await window.fbNOTM.addEntry(s.monthKey,s.name,s.points);
          ne.push({id:r.id,...s,ts:Date.now()});
        }
      }
      setNotmEntries(ne);
    }catch(e){console.warn(e);}
    setLoadStatus("Loading polls...");
    try{const pd=await window.fbPolls.getAll();setPollsData(pd);}catch(e){console.warn(e);}
    setLoading(false);
  }

  useEffect(()=>{loadData();},[]);
  useEffect(()=>{
    if(!role) return;
    const iv=setInterval(loadData,60000);
    return()=>clearInterval(iv);
  },[role]);

  if(loading) return <LoadingScreen status={loadStatus}/>;
  if(!role) return <LoginScreen onLogin={(r,u)=>{setRole(r);setStudentUsername(u);}}/>;

  return(
    <>
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",
        background:"radial-gradient(ellipse 60% 50% at 80% 20%,rgba(57,255,20,0.06) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(0,207,255,0.07) 0%,transparent 70%),#060609"}}/>
      <div style={{display:"flex",flexDirection:isMobile?"column":"row",minHeight:"100vh",position:"relative",zIndex:1}}>
        {isMobile
          ?<MobileNav active={tab} onNav={setTab} isAdmin={isAdmin} isStudent={isStudent} studentUsername={studentUsername} onLogout={()=>setRole(null)}/>
          :<Sidebar active={tab} onNav={setTab} isAdmin={isAdmin} isStudent={isStudent} studentUsername={studentUsername} onLogout={()=>setRole(null)}/>
        }
        <div key={tab} style={{flex:1,overflowY:"auto",animation:"fadeUp .35s ease both",...(isMobile?{}:{height:"100vh"})}}>
          {tab==="home"&&<HomeTab onNav={setTab} allEntries={allEntries}/>}
          {tab==="leaderboards"&&<LeaderboardsTab allEntries={allEntries} setAllEntries={setAllEntries} setToast={setToast} isAdmin={isAdmin}/>}
          {tab==="riddle"&&<RiddleTab setToast={setToast} isAdmin={isAdmin} isStudent={isStudent} studentUsername={studentUsername} riddleMap={riddleMap} setRiddleMap={setRiddleMap}/>}
          {tab==="notm"&&<NOTMTab isAdmin={isAdmin} notmEntries={notmEntries} setNotmEntries={setNotmEntries} setToast={setToast}/>}
          {tab==="polls"&&<PollsTab isAdmin={isAdmin} isStudent={isStudent} studentUsername={studentUsername} pollsData={pollsData} setPollsData={setPollsData} setToast={setToast}/>}
        </div>
      </div>
      {toast&&<Toast msg={toast.msg} color={toast.color||"#39ff14"} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
