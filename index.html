<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Code Ninjas – Robbinsville</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@400;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#060609;color:#fff;}
#root{min-height:100vh;display:flex;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(57,255,20,0.3);border-radius:99px;}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,0.2);}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
select option{background:#0a0a0f;color:#fff;}
@keyframes fadeSlideLeft{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeSlideRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 30px #39ff1455,0 0 60px #00cfff33}50%{box-shadow:0 0 50px #39ff1488,0 0 80px #00cfff55}}
@keyframes floatUp{0%{transform:translateY(0) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:0.5}100%{transform:translateY(-110vh) rotate(5deg);opacity:0}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes shakeCard{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media(max-width:768px){#root{flex-direction:column;}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const firebaseConfig = {
  apiKey:"AIzaSyBaZLr1zIzGPYhl6e7Gqy0dI3o6ZuyvP4s",
  authDomain:"githubpat-2d39d.firebaseapp.com",
  projectId:"githubpat-2d39d",
  storageBucket:"githubpat-2d39d.firebasestorage.app",
  messagingSenderId:"375553339098",
  appId:"1:375553339098:web:729bb04215f50217937fe3",
  databaseURL:"https://githubpat-2d39d-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

window.fbUsernames = {
  async check(username){
    const trimmedLower = username.trim().toLowerCase();
    if(!trimmedLower) return null;
    const snap = await db.ref("usernames").once("value");
    const val = snap.val() || {};
    for(const [key,storedVal] of Object.entries(val)){
      if(key.toLowerCase() === trimmedLower) return key;
      if(typeof storedVal === "string" && storedVal.toLowerCase() === trimmedLower) return storedVal;
    }
    return null;
  }
};
</script>
<script type="text/babel">
const {useState,useEffect} = React;
const ADMIN_PASS = "Senseis";

function Particles(){
  const ref=React.useRef();
  useEffect(()=>{
    const c=ref.current; if(!c) return;
    const ctx=c.getContext("2d");
    c.width=c.offsetWidth; c.height=c.offsetHeight;
    const ps=Array.from({length:40},()=>({
      x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*1.8+0.4,dx:(Math.random()-.5)*.35,dy:(Math.random()-.5)*.35,
      color:["#39ff14","#00cfff","#ff2d78"][Math.floor(Math.random()*3)],a:Math.random()*.5+.15
    }));
    let raf;
    function draw(){
      ctx.clearRect(0,0,c.width,c.height);
      ps.forEach(p=>{
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=p.color;ctx.globalAlpha=p.a;ctx.shadowBlur=8;ctx.shadowColor=p.color;ctx.fill();
        p.x+=p.dx;p.y+=p.dy;
        if(p.x<0||p.x>c.width)p.dx*=-1;if(p.y<0||p.y>c.height)p.dy*=-1;
      });
      ctx.globalAlpha=1;raf=requestAnimationFrame(draw);
    }
    draw();return()=>cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={ref} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}}/>;
}

const CODE_LINES=["const ninja = new Coder();","while(learning) { level++; }","function achieve(goal) {","  return skill * effort;","}","if (rank === 1) celebrate();","ninja.train(['python','js']);","const points = score * combo;","export default Ninja;","// keep coding! 🥷"];
function FloatingCode(){
  return(
    <div style={{position:"absolute",inset:0,overflow:"hidden",pointerEvents:"none"}}>
      {CODE_LINES.map((line,i)=>(
        <div key={i} style={{position:"absolute",left:`${8+i*8}%`,bottom:"-2em",fontFamily:"'Fira Code',monospace",fontSize:"11px",
          color:i%3===0?"#39ff14":i%3===1?"#00cfff":"#ff2d78",opacity:.10+(i%4)*.05,
          animation:`floatUp ${9+i*.8}s linear infinite`,animationDelay:`${i*1.1}s`,whiteSpace:"nowrap"}}>{line}</div>
      ))}
    </div>
  );
}

function Glass({children,style={},onClick}){
  return(
    <div onClick={onClick} style={{
      background:"rgba(255,255,255,0.06)",backdropFilter:"blur(18px)",WebkitBackdropFilter:"blur(18px)",
      border:"1px solid rgba(255,255,255,0.12)",borderRadius:16,
      boxShadow:"0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08)",...style
    }}>{children}</div>
  );
}

function Spinner(){
  return <div style={{width:16,height:16,border:"2px solid rgba(255,255,255,0.2)",borderTop:"2px solid #39ff14",borderRadius:"50%",animation:"spin .8s linear infinite",display:"inline-block"}}/>;
}

function LoadingScreen({status}){
  return(
    <div style={{position:"fixed",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#060609",zIndex:200,gap:16,padding:16}}>
      <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:13,color:"#39ff14",letterSpacing:2}}>LOADING DOJO...</div>
      <div style={{width:36,height:36,border:"3px solid rgba(57,255,20,0.2)",borderTop:"3px solid #39ff14",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <div style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.3)"}}>{status}</div>
    </div>
  );
}

function LoginScreen({onLogin}){
  const [pw,setPw]=useState("");
  const [show,setShow]=useState(false);
  const [shake,setShake]=useState(false);
  const [hint,setHint]=useState("");
  const [checking,setChecking]=useState(false);

  async function attempt(){
    const trimmed = pw.trim();
    if(trimmed===""){
      setHint("Enter your username or the Sensei password.");
      setShake(true);setTimeout(()=>setShake(false),500);
      return;
    }
    if(trimmed===ADMIN_PASS){onLogin("admin",null);return;}
    setChecking(true);setHint("");
    try{
      const matched = await window.fbUsernames.check(trimmed);
      if(matched){
        onLogin("student",matched);
      } else {
        onLogin("guest",null);
      }
    } catch(e){
      console.warn("Username check failed:",e);
      onLogin("guest",null);
    }
    setChecking(false);
  }
  return(
    <div style={{position:"fixed",inset:0,display:"flex",alignItems:"center",justifyContent:"center",
      background:"radial-gradient(ellipse 70% 60% at 50% 40%,rgba(57,255,20,0.07) 0%,transparent 70%),#060609",zIndex:100,padding:"16px",overflow:"auto"}}>
      <Particles/><FloatingCode/>
      <div style={{position:"relative",zIndex:2,width:"100%",maxWidth:400,animation:"fadeUp .6s ease both"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:900,fontSize:20,letterSpacing:2,color:"#39ff14",marginBottom:3}}>CODE NINJAS</div>
          <div style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)",letterSpacing:3}}>ROBBINSVILLE</div>
          <div style={{width:60,height:2,background:"linear-gradient(90deg,#39ff14,#00cfff)",margin:"12px auto 0",borderRadius:99}}/>
        </div>
        <Glass style={{padding:"clamp(20px,4vw,32px)",borderColor:"rgba(57,255,20,0.15)",animation:shake?"shakeCard .5s ease":"none"}}>
          <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:15,color:"#fff",textAlign:"center",marginBottom:5,letterSpacing:1}}>WELCOME BACK</h2>
          <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:12,color:"rgba(255,255,255,0.4)",textAlign:"center",marginBottom:24}}>Enter your username for student access, Sensei password for admin, or continue as guest</p>
          <div style={{marginBottom:8}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.4)",marginBottom:7,letterSpacing:1.5}}>USERNAME / PASSWORD</label>
            <div style={{position:"relative"}}>
              <input value={pw} onChange={e=>{setPw(e.target.value);setHint("");}} onKeyDown={e=>e.key==="Enter"&&attempt()}
                type={show?"text":"password"} placeholder="Username or Sensei password..."
                style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,
                  padding:"12px 42px 12px 14px",color:"#fff",fontFamily:"'Fira Code',monospace",fontSize:14,outline:"none",boxSizing:"border-box",letterSpacing:pw&&!show?3:1}}
                onFocus={e=>e.target.style.borderColor="#39ff14"}
                onBlur={e=>e.target.style.borderColor="rgba(255,255,255,0.15)"}/>
              <button onClick={()=>setShow(!show)} style={{position:"absolute",right:11,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:"rgba(255,255,255,0.4)",fontSize:15,padding:0}}>{show?"🙈":"👁️"}</button>
            </div>
            {hint&&<p style={{color:"#ff2d78",fontSize:11,marginTop:5,fontFamily:"'Fira Code',monospace"}}>{hint}</p>}
          </div>
          <button onClick={attempt} disabled={checking} style={{width:"100%",padding:"12px",borderRadius:10,border:"none",cursor:checking?"not-allowed":"pointer",
            background:checking?"rgba(255,255,255,0.1)":"linear-gradient(135deg,#39ff14,#00cfff)",color:checking?"rgba(255,255,255,0.4)":"#000",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:13,letterSpacing:1.5,marginTop:16,transition:"transform .2s,opacity .2s"}}
            onMouseEnter={e=>{e.target.style.transform="scale(1.02)";e.target.style.opacity=".92";}}
            onMouseLeave={e=>{e.target.style.transform="none";e.target.style.opacity="1";}}>
            {checking?<><Spinner/> CHECKING...</>:"ENTER DOJO ⚡"}
          </button>
          <div style={{display:"flex",alignItems:"center",gap:10,margin:"18px 0"}}>
            <div style={{flex:1,height:1,background:"rgba(255,255,255,0.08)"}}/>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.25)"}}>OR</span>
            <div style={{flex:1,height:1,background:"rgba(255,255,255,0.08)"}}/>
          </div>
          <button onClick={()=>onLogin("guest",null)} style={{width:"100%",padding:"11px",borderRadius:10,border:"1px solid rgba(255,255,255,0.15)",cursor:"pointer",background:"rgba(255,255,255,0.04)",color:"rgba(255,255,255,0.6)",fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:13,transition:"all .2s"}}
            onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,255,255,0.09)";e.currentTarget.style.color="#fff";}}
            onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.04)";e.currentTarget.style.color="rgba(255,255,255,0.6)";}}>
            👀 Continue as Guest (View Only)
          </button>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.2)",textAlign:"center",marginTop:16,lineHeight:1.6}}>
            Students: enter your username · Sensei: enter Senseis<br/>Guests can view but not interact.
          </p>
        </Glass>
      </div>
    </div>
  );
}

function IndexApp(){
  const [checked,setChecked]=useState(false);
  useEffect(()=>{
    const role = localStorage.getItem("cn_role");
    if(role){ window.location.href="home.html"; }
    else setChecked(true);
  },[]);
  if(!checked) return <LoadingScreen status="Checking session..."/>;
  return <LoginScreen onLogin={(r,u)=>{
    localStorage.setItem("cn_role", r);
    if(u) localStorage.setItem("cn_username", u); else localStorage.removeItem("cn_username");
    window.location.href="home.html";
  }}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<IndexApp/>);
</script>
</body>
</html>
