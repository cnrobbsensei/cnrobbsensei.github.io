const { useState, useEffect, useRef, useCallback } = React;

// ── WEEK UTILS ──────────────────────────────────────────────────────────────
const WEEK_START = new Date("2026-05-13T00:00:00");
function getCurrentWeek(){
  const diff = new Date() - WEEK_START;
  return diff < 0 ? 1 : Math.floor(diff/(7*24*60*60*1000))+1;
}
function getWeekLabel(n){
  const s = new Date(WEEK_START.getTime()+(n-1)*7*24*60*60*1000);
  const e = new Date(s.getTime()+6*24*60*60*1000);
  const fmt = d => d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  return `Week ${n} (${fmt(s)} – ${fmt(e)})`;
}

// ── LEADERBOARD CALC ─────────────────────────────────────────────────────────
function calcBoard(entries=[]){
  const map={};
  entries.forEach(e=>{if(!map[e.name])map[e.name]=[];map[e.name].push(e.points);});
  return Object.entries(map).map(([name,pts])=>{
    const sorted=[...pts].sort((a,b)=>b-a);
    const top3=sorted.slice(0,3);
    return{name,total:top3.reduce((s,v)=>s+v,0),entries:pts.length,top3,all:sorted};
  }).sort((a,b)=>b.total-a.total);
}

// ── PARTICLES ────────────────────────────────────────────────────────────────
function Particles(){
  const ref=useRef();
  useEffect(()=>{
    const c=ref.current; if(!c)return;
    const ctx=c.getContext("2d");
    c.width=c.offsetWidth; c.height=c.offsetHeight;
    const ps=Array.from({length:55},()=>({
      x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*1.8+0.4,
      dx:(Math.random()-.5)*.35,dy:(Math.random()-.5)*.35,
      color:["#39ff14","#00cfff","#ff2d78"][Math.floor(Math.random()*3)],
      a:Math.random()*.5+.15
    }));
    let raf;
    function draw(){
      ctx.clearRect(0,0,c.width,c.height);
      ps.forEach(p=>{
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=p.color;ctx.globalAlpha=p.a;
        ctx.shadowBlur=10;ctx.shadowColor=p.color;ctx.fill();
        p.x+=p.dx;p.y+=p.dy;
        if(p.x<0||p.x>c.width)p.dx*=-1;
        if(p.y<0||p.y>c.height)p.dy*=-1;
      });
      ctx.globalAlpha=1;raf=requestAnimationFrame(draw);
    }
    draw();
    return()=>cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={ref} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}}/>;
}

// ── FLOATING CODE ────────────────────────────────────────────────────────────
const CODE_LINES=["const ninja = new Coder();","while(learning) { level++; }","function achieve(goal) {","  return skill * effort;","}","if (rank === 1) celebrate();","ninja.train(['python','js']);","const points = score * combo;","export default Ninja;","// keep coding! 🥷"];
function FloatingCode(){
  return(
    <div style={{position:"absolute",inset:0,overflow:"hidden",pointerEvents:"none"}}>
      {CODE_LINES.map((line,i)=>(
        <div key={i} style={{position:"absolute",left:`${8+i*8}%`,bottom:"-2em",
          fontFamily:"'Fira Code',monospace",fontSize:"11px",
          color:i%3===0?"#39ff14":i%3===1?"#00cfff":"#ff2d78",
          opacity:.12+(i%4)*.06,
          animation:`floatUp ${9+i*.8}s linear infinite`,
          animationDelay:`${i*1.1}s`,whiteSpace:"nowrap",
          textShadow:"0 0 8px currentColor"}}>{line}</div>
      ))}
    </div>
  );
}

// ── GLASS ────────────────────────────────────────────────────────────────────
function Glass({children,style={},onMouseEnter,onMouseLeave}){
  return(
    <div onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave} style={{
      background:"rgba(255,255,255,0.06)",
      backdropFilter:"blur(18px)",WebkitBackdropFilter:"blur(18px)",
      border:"1px solid rgba(255,255,255,0.12)",borderRadius:16,
      boxShadow:"0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08)",
      ...style}}>{children}</div>
  );
}

// ── RANK BADGE ───────────────────────────────────────────────────────────────
function RankBadge({rank}){
  const cfg={1:{bg:"linear-gradient(135deg,#ffd700,#ff8c00)",shadow:"#ffd700",e:"👑"},
             2:{bg:"linear-gradient(135deg,#c0c0c0,#808080)",shadow:"#c0c0c0",e:"🥈"},
             3:{bg:"linear-gradient(135deg,#cd7f32,#8b4513)",shadow:"#cd7f32",e:"🥉"}};
  const c=cfg[rank]||{bg:"rgba(255,255,255,0.1)",shadow:"transparent",e:null};
  return(
    <div style={{width:36,height:36,borderRadius:"50%",background:c.bg,flexShrink:0,
      boxShadow:rank<=3?`0 0 14px ${c.shadow}88`:"none",
      display:"flex",alignItems:"center",justifyContent:"center",
      fontWeight:700,fontSize:rank<=3?15:12,color:rank<=3?"#000":"#999"}}>
      {c.e||`#${rank}`}
    </div>
  );
}

// ── TOAST ────────────────────────────────────────────────────────────────────
function Toast({msg,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3000);return()=>clearTimeout(t);},[]);
  return(
    <div style={{position:"fixed",bottom:32,right:32,zIndex:9999,
      background:"rgba(10,10,20,0.95)",border:"1px solid #39ff14",borderRadius:12,
      padding:"14px 24px",color:"#39ff14",fontFamily:"'Fira Code',monospace",
      fontWeight:600,fontSize:14,boxShadow:"0 0 24px #39ff1466",
      animation:"slideIn .3s ease"}}>✅ {msg}</div>
  );
}

// ── LEADERBOARD VIEW ─────────────────────────────────────────────────────────
function LeaderboardView({scores}){
  const totalWeeks=getCurrentWeek()+1;
  const [week,setWeek]=useState(getCurrentWeek());
  const entries=scores[week]||[];
  const board=calcBoard(entries);
  return(
    <div style={{padding:"28px 36px",animation:"fadeUp .4s ease both"}}>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:28,flexWrap:"wrap"}}>
        <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:20,color:"#fff",margin:0}}>🏆 Weekly Leaderboard</h2>
        <select value={week} onChange={e=>setWeek(Number(e.target.value))}
          style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.2)",
            borderRadius:8,color:"#fff",padding:"8px 14px",fontFamily:"'Fira Code',monospace",fontSize:12,cursor:"pointer"}}>
          {Array.from({length:totalWeeks},(_,i)=>i+1).map(w=>(
            <option key={w} value={w} style={{background:"#0a0a0f"}}>{getWeekLabel(w)}{w===getCurrentWeek()?" ← Current":""}</option>
          ))}
        </select>
      </div>
      {board.length===0?(
        <Glass style={{padding:40,textAlign:"center"}}>
          <p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.4)",fontSize:15}}>No scores yet for this week. Be the first! 🥷</p>
        </Glass>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:9}}>
          <div style={{display:"grid",gridTemplateColumns:"50px 1fr 130px 110px",gap:14,
            padding:"6px 18px",fontFamily:"'Fira Code',monospace",fontSize:10,
            color:"rgba(255,255,255,0.3)",letterSpacing:1.5}}>
            <span>RANK</span><span>NINJA</span><span style={{textAlign:"right"}}>TOTAL</span><span style={{textAlign:"right"}}>ENTRIES</span>
          </div>
          {board.map((ninja,i)=>{
            const rank=i+1;
            const gc=rank===1?"#ffd700":rank===2?"#c0c0c0":rank===3?"#cd7f32":"transparent";
            return(
              <Glass key={ninja.name} style={{padding:"14px 18px",
                borderColor:rank<=3?`${gc}44`:"rgba(255,255,255,0.08)",
                boxShadow:rank<=3?`0 0 20px ${gc}22,0 8px 24px rgba(0,0,0,0.4)`:"0 4px 16px rgba(0,0,0,0.3)",
                animation:`fadeUp .4s ease both ${i*.06}s`,transition:"transform .2s"}}
                onMouseEnter={e=>e.currentTarget.style.transform="translateX(4px)"}
                onMouseLeave={e=>e.currentTarget.style.transform="none"}>
                <div style={{display:"grid",gridTemplateColumns:"50px 1fr 130px 110px",gap:14,alignItems:"center"}}>
                  <RankBadge rank={rank}/>
                  <div>
                    <div style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:14,color:"#fff"}}>{ninja.name}</div>
                    <div style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)",marginTop:2}}>
                      Best 3: {ninja.top3.join(" + ")}
                    </div>
                  </div>
                  <div style={{textAlign:"right",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:17,
                    color:rank<=3?gc:"#39ff14",textShadow:rank<=3?`0 0 12px ${gc}`:"0 0 8px #39ff14"}}>
                    {ninja.total.toLocaleString()}
                  </div>
                  <div style={{textAlign:"right",fontFamily:"'Fira Code',monospace",fontSize:12,color:"rgba(255,255,255,0.45)"}}>
                    {ninja.entries} {ninja.entries===1?"entry":"entries"}
                  </div>
                </div>
              </Glass>
            );

        </div>
      )}
    </div>
  );
}

// ── ENTER SCORES ─────────────────────────────────────────────────────────────
function EnterScores({scores,setScores,setToast}){
  const [name,setName]=useState("");
  const [pts,setPts]=useState("");
  const [errors,setErrors]=useState({});
  const cw=getCurrentWeek();
  const weekEntries=scores[cw]||[];
  const ninjaEntries=name.trim()?weekEntries.filter(e=>e.name.toLowerCase()===name.trim().toLowerCase()):[];
  const board=calcBoard(weekEntries);
  const ninjaSummary=board.find(n=>n.name.toLowerCase()===name.trim().toLowerCase());
  const ninjaRank=board.findIndex(n=>n.name.toLowerCase()===name.trim().toLowerCase())+1;

  function submit(){
    const errs={};
    if(!name.trim())errs.name="Name is required";
    const p=Number(pts);
    if(!pts||isNaN(p))errs.pts="Must be a number";
    else if(p<0)errs.pts="No negative points!";
    if(Object.keys(errs).length){setErrors(errs);return;}
    setErrors({});
    const updated={...scores,[cw]:[...weekEntries,{id:Date.now(),name:name.trim(),points:p,ts:Date.now()}]};
    setScores(updated);saveScores(updated);
    setPts("");
    setToast(`${name.trim()} scored ${p} points! 🎉`);
  }

  const inputStyle=(err)=>({width:"100%",background:"rgba(255,255,255,0.06)",
    border:`1px solid ${err?"#ff2d78":"rgba(255,255,255,0.15)"}`,borderRadius:10,
    padding:"12px 16px",color:"#fff",fontFamily:"'Exo 2',sans-serif",fontSize:14,
    outline:"none",boxSizing:"border-box",transition:"border-color .2s"});

  return(
    <div style={{padding:"28px 36px",animation:"fadeUp .4s ease both"}}>
      <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:20,color:"#fff",marginBottom:6}}>📝 Enter Scores</h2>
      <p style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.35)",marginBottom:28}}>{getWeekLabel(cw)}</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:28}}>
        <Glass style={{padding:26}}>
          <div style={{marginBottom:18}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:8,letterSpacing:1}}>NINJA NAME</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. ShadowByte" style={inputStyle(errors.name)}
              onFocus={e=>e.target.style.borderColor="#00cfff"} onBlur={e=>e.target.style.borderColor=errors.name?"#ff2d78":"rgba(255,255,255,0.15)"}/>
            {errors.name&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.name}</p>}
          </div>
          <div style={{marginBottom:24}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:8,letterSpacing:1}}>POINTS</label>
            <input value={pts} onChange={e=>setPts(e.target.value)} placeholder="e.g. 850" type="number" min="0"
              style={{...inputStyle(errors.pts),fontFamily:"'Fira Code',monospace",fontSize:16}}
              onFocus={e=>e.target.style.borderColor="#39ff14"} onBlur={e=>e.target.style.borderColor=errors.pts?"#ff2d78":"rgba(255,255,255,0.15)"}
              onKeyDown={e=>e.key==="Enter"&&submit()}/>

// ── RIDDLE TAB ───────────────────────────────────────────────────────────────
function RiddleTab({setToast}){
  const totalWeeks=getCurrentWeek()+1;
  const [week,setWeek]=useState(getCurrentWeek());
  const [riddlesData,setRiddlesData]=useState(loadRiddles);
  const [sName,setSName]=useState("");
  const [sAnswer,setSAnswer]=useState("");
  const [riddleText,setRiddleText]=useState("");
  const [editMode,setEditMode]=useState(false);
  const [errors,setErrors]=useState({});
  const weekData=riddlesData[week]||{text:DEFAULT_RIDDLE_TEXT[week]||"No riddle set yet. Check back soon!",answers:[]};

  function submitAnswer(){
    const errs={};
    if(!sName.trim())errs.name="Name required";
    if(!sAnswer.trim())errs.answer="Answer required";
    if(Object.keys(errs).length){setErrors(errs);return;}
    setErrors({});
    const updated={...riddlesData,[week]:{...weekData,answers:[...weekData.answers,{name:sName.trim(),answer:sAnswer.trim(),ts:Date.now()}]}};
    setRiddlesData(updated);saveRiddles(updated);
    setSName("");setSAnswer("");
    setToast(`${sName.trim()} submitted their answer! 🧩`);
  }
  function saveRiddle(){
    const updated={...riddlesData,[week]:{...weekData,text:riddleText}};
    setRiddlesData(updated);saveRiddles(updated);
    setEditMode(false);setToast("Riddle updated! ✏️");
  }

  const inputStyle=(err)=>({width:"100%",background:"rgba(255,255,255,0.06)",
    border:`1px solid ${err?"#ff2d78":"rgba(255,255,255,0.15)"}`,borderRadius:10,
    padding:"12px 16px",color:"#fff",fontFamily:"'Exo 2',sans-serif",fontSize:14,
    outline:"none",boxSizing:"border-box"});

  return(
    <div style={{padding:"28px 36px",animation:"fadeUp .4s ease both"}}>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:28,flexWrap:"wrap"}}>
        <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:20,color:"#fff",margin:0}}>🧩 Riddle of the Week</h2>
        <select value={week} onChange={e=>setWeek(Number(e.target.value))}
          style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.2)",
            borderRadius:8,color:"#fff",padding:"8px 14px",fontFamily:"'Fira Code',monospace",fontSize:12,cursor:"pointer"}}>
          {Array.from({length:totalWeeks},(_,i)=>i+1).map(w=>(
            <option key={w} value={w} style={{background:"#0a0a0f"}}>{getWeekLabel(w)}{w===getCurrentWeek()?" ← Current":""}</option>
          ))}
        </select>
      </div>
      {/* RIDDLE CARD */}
      <Glass style={{padding:28,marginBottom:28,borderColor:"#ff2d7833",
        boxShadow:"0 0 40px #ff2d7822,0 8px 32px rgba(0,0,0,0.4)",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:"linear-gradient(90deg,#ff2d78,#00cfff,#39ff14)"}}/>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
          <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.3)",letterSpacing:2}}>RIDDLE #{week}</span>
          <button onClick={()=>{setEditMode(!editMode);setRiddleText(weekData.text);}}
            style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:8,
              color:"rgba(255,255,255,0.5)",padding:"5px 12px",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:11}}>
            {editMode?"✕ Cancel":"✏️ Edit"}
          </button>
        </div>
        {editMode?(
          <div>
            <textarea value={riddleText} onChange={e=>setRiddleText(e.target.value)}
              style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid #00cfff44",borderRadius:10,
                padding:"14px 16px",color:"#fff",fontFamily:"'Exo 2',sans-serif",fontSize:15,lineHeight:1.6,
                outline:"none",resize:"vertical",minHeight:90,boxSizing:"border-box"}}/>
            <button onClick={saveRiddle} style={{marginTop:10,padding:"10px 24px",borderRadius:8,border:"none",cursor:"pointer",
              background:"linear-gradient(135deg,#ff2d78,#00cfff)",color:"#000",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:11}}>
              SAVE RIDDLE
            </button>
          </div>
        ):(
          <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:"clamp(14px,1.6vw,19px)",color:"#fff",lineHeight:1.7,margin:0,fontStyle:"italic"}}>
            "{weekData.text}"
          </p>
        )}
      </Glass>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:28}}>
        {/* SUBMIT */}
        <Glass style={{padding:24}}>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,color:"#ff2d78",marginBottom:18,letterSpacing:1}}>SUBMIT YOUR ANSWER</h3>
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:8,letterSpacing:1}}>STUDENT NAME</label>
            <input value={sName} onChange={e=>setSName(e.target.value)} placeholder="Your ninja name" style={inputStyle(errors.name)}/>
            {errors.name&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.name}</p>}
          </div>
          <div style={{marginBottom:18}}>
            <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:8,letterSpacing:1}}>YOUR ANSWER</label>
            <textarea value={sAnswer} onChange={e=>setSAnswer(e.target.value)} placeholder="Type your answer here..."
              style={{...inputStyle(errors.answer),resize:"vertical",minHeight:75}}/>
            {errors.answer&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.answer}</p>}
          </div>
          <button onClick={submitAnswer} style={{width:"100%",padding:12,borderRadius:10,border:"none",cursor:"pointer",
            background:"linear-gradient(135deg,#ff2d78,#00cfff)",color:"#000",
            fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:12,letterSpacing:1}}
            onMouseEnter={e=>e.target.style.opacity=".9"} onMouseLeave={e=>e.target.style.opacity="1"}>
            SUBMIT ANSWER 🧩
          </button>
        </Glass>
        {/* ANSWERS */}
        <div>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,color:"#00cfff",marginBottom:14,letterSpacing:1}}>
            STUDENT ANSWERS ({weekData.answers.length})
          </h3>
          <div style={{display:"flex",flexDirection:"column",gap:9,maxHeight:360,overflowY:"auto"}}>
            {weekData.answers.length===0?(
              <Glass style={{padding:24,textAlign:"center"}}>
                <p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.35)",fontSize:13}}>No answers yet — be the first! 🧠</p>
              </Glass>
            ):weekData.answers.map((a,i)=>(
              <Glass key={i} style={{padding:"13px 16px",animation:`fadeUp .3s ease both ${i*.05}s`,transition:"transform .2s"}}
                onMouseEnter={e=>e.currentTarget.style.transform="translateX(4px)"}
                onMouseLeave={e=>e.currentTarget.style.transform="none"}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                  <span style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:13,color:"#00cfff"}}>{a.name}</span>
                  <span style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.3)"}}>
                    {new Date(a.ts).toLocaleDateString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}
                  </span>
                </div>
                <p style={{fontFamily:"'Exo 2',sans-serif",fontSize:13,color:"rgba(255,255,255,0.75)",margin:0}}>{a.answer}</p>
              </Glass>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── LOGIN SCREEN ─────────────────────────────────────────────────────────────
const ADMIN_PASS = "Robbinsvillle"; // three l's as requested

function LoginScreen({onLogin}){
  const [pw,setPw]=useState("");
  const [show,setShow]=useState(false);
  const [shake,setShake]=useState(false);
  const [hint,setHint]=useState("");

  function attempt(){
    if(pw === ADMIN_PASS){
      onLogin("admin");
    } else if(pw.trim() === ""){
      setHint("Enter a password or choose Guest access below.");
      triggerShake();
    } else {
      onLogin("guest");
    }
  }

  function triggerShake(){
    setShake(true);
    setTimeout(()=>setShake(false),500);
  }

  return(
    <div style={{position:"fixed",inset:0,display:"flex",alignItems:"center",justifyContent:"center",
      background:"radial-gradient(ellipse 70% 60% at 50% 40%,rgba(57,255,20,0.07) 0%,transparent 70%),radial-gradient(ellipse 50% 50% at 30% 70%,rgba(0,207,255,0.08) 0%,transparent 70%),#060609",
      zIndex:100}}>
      <Particles/>
      <FloatingCode/>
      <div style={{position:"relative",zIndex:2,width:"100%",maxWidth:420,padding:"0 24px",animation:"fadeUp .6s ease both"}}>
        {/* LOGO */}
        <div style={{textAlign:"center",marginBottom:40}}>
          <div style={{display:"inline-flex",alignItems:"center",justifyContent:"center",
            width:72,height:72,borderRadius:"50%",marginBottom:16,
            background:"rgba(57,255,20,0.08)",border:"2px solid #39ff1444",
            boxShadow:"0 0 30px #39ff1433"}}>
            <span style={{fontSize:36}}>🥷</span>
          </div>
          <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:900,fontSize:22,letterSpacing:2,
            color:"#39ff14",textShadow:"0 0 20px #39ff14aa",marginBottom:4}}>CODE NINJAS</div>
          <div style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.3)",letterSpacing:3}}>ROBBINSVILLE</div>

            <div style={{position:"relative"}}>
              <input

                onKeyDown={e=>e.key==="Enter"&&attempt()}
                type={show?"text":"password"}
                placeholder="Enter admin password..."

                  border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,
                  padding:"13px 44px 13px 16px",color:"#fff",
                  fontFamily:"'Fira Code',monospace",fontSize:14,
                  outline:"none",boxSizing:"border-box",transition:"border-color .2s",letterSpacing:pw&&!show?3:1}}
                onFocus={e=>e.target.style.borderColor="#39ff14"}

            fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:13,transition:"all .2s"}}
            onMouseEnter={e=>{e.currentTarget.style.background="rgba(255,255,255,0.09)";e.currentTarget.style.color="#fff";e.currentTarget.style.borderColor="rgba(255,255,255,0.3)";}}
            onMouseLeave={e=>{e.currentTarget.style.background="rgba(255,255,255,0.04)";e.currentTarget.style.color="rgba(255,255,255,0.6)";e.currentTarget.style.borderColor="rgba(255,255,255,0.15)";}}>
            👀 Continue as Guest (View Only)
          </button>

          <p style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.2)",
            textAlign:"center",marginTop:18,lineHeight:1.6}}>
            Guests can view leaderboards & riddles.<br/>Admin access required to enter scores.
          </p>
        </Glass>
      </div>
      <style>{`@keyframes shakeCard{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}`}</style>
    </div>
  );
}

// ── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const [role,setRole]=useState(null); // null=login, "admin", "guest"
  const [tab,setTab]=useState("home");
  const [scores,setScores]=useState(loadScores);
  const [toast,setToast]=useState(null);
  const isAdmin = role==="admin";

  if(!role) return <LoginScreen onLogin={r=>setRole(r)}/>;

  return(
    <>
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",
        background:"radial-gradient(ellipse 60% 50% at 80% 20%,rgba(57,255,20,0.06) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(0,207,255,0.07) 0%,transparent 70%),radial-gradient(ellipse 40% 40% at 60% 60%,rgba(255,45,120,0.04) 0%,transparent 70%),#060609"}}/>
      <div style={{display:"flex",height:"100vh",position:"relative",zIndex:1}}>
        <Sidebar active={tab} onNav={setTab} isAdmin={isAdmin} onLogout={()=>setRole(null)}/>
        <div key={tab} style={{flex:1,overflowY:"auto",animation:"fadeUp .35s ease both"}}>
          {tab==="home"&&<HomeTab onNav={setTab}/>}
          {tab==="leaderboards"&&<LeaderboardsTab scores={scores} setScores={setScores} setToast={setToast} isAdmin={isAdmin}/>}
          {tab==="riddle"&&<RiddleTab setToast={setToast} isAdmin={isAdmin}/>}
        </div>
      </div>
      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
