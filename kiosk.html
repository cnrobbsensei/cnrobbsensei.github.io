<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Code Ninjas – Kiosk Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@400;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#060609;color:#fff;overflow:hidden;}
#root{min-height:100vh;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(57,255,20,0.3);border-radius:99px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pulseBorder{0%,100%{box-shadow:0 0 0 rgba(255,140,0,0)}50%{box-shadow:0 0 14px rgba(255,140,0,0.55)}}
.kiosk-grid{grid-template-columns:repeat(4,minmax(0,1fr));}
@media(max-width:1100px){.kiosk-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:560px){.kiosk-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="root"></div>
<script src="shared.js"></script>
<script type="text/babel">
const {useState,useEffect,useMemo} = React;

// Visual identity per section — keeps each column instantly distinguishable
// from across a room.
const SECTION_STYLE = {
  Impact:  {color:"#ff2d78", icon:"💥"},
  JR:      {color:"#00cfff", icon:"🧒"},
  Robotics:{color:"#ff8c00", icon:"🤖"},
  Unity:   {color:"#39ff14", icon:"🎮"},
};
function styleFor(section){ return SECTION_STYLE[section] || {color:"#fff", icon:"🥷"}; }

function Clock(){
  const [now,setNow]=useState(new Date());
  useEffect(()=>{ const iv=setInterval(()=>setNow(new Date()),1000); return ()=>clearInterval(iv); },[]);
  return(
    <div style={{textAlign:"right"}}>
      <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:"clamp(16px,1.6vw,22px)",color:"#fff"}}>
        {now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit"})}
      </div>
      <div style={{fontFamily:"'Fira Code',monospace",fontSize:"clamp(9px,0.9vw,12px)",color:"rgba(255,255,255,0.4)"}}>
        {now.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}
      </div>
    </div>
  );
}

// A single ninja card. Sizing (font/padding) is driven entirely by CSS
// vars set on the ancestor grid, so cards shrink/grow together as the
// section's roster count changes — no per-card measurement needed.
function NinjaCard({name,goal,onBreak,remainingMin,accent}){
  return(
    <div style={{
      position:"relative",
      padding:"calc(var(--card-pad,14px))",
      borderRadius:"calc(var(--card-radius,14px))",
      background: onBreak ? "rgba(255,140,0,0.08)" : "rgba(255,255,255,0.05)",
      border: onBreak ? "1px solid rgba(255,140,0,0.5)" : `1px solid ${accent}33`,
      animation: onBreak ? "fadeUp .35s ease both, pulseBorder 2.2s ease-in-out infinite" : "fadeUp .35s ease both",
      minWidth:0,
    }}>
      <div style={{
        fontFamily:"'Exo 2',sans-serif",fontWeight:700,
        fontSize:"var(--name-size,15px)",color:"#fff",
        overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:4,
      }} title={name}>
        🥷 {name}
      </div>
      {goal ? (
        <div style={{
          fontFamily:"'Fira Code',monospace",fontSize:"var(--goal-size,11px)",
          color:"rgba(255,255,255,0.65)",lineHeight:1.35,
          display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical",overflow:"hidden",
        }} title={goal}>
          🎯 {goal}
        </div>
      ) : (
        <div style={{fontFamily:"'Fira Code',monospace",fontSize:"var(--goal-size,11px)",color:"rgba(255,255,255,0.25)"}}>
          No goal set yet
        </div>
      )}
      {onBreak && (
        <div style={{
          marginTop:6,display:"inline-flex",alignItems:"center",gap:5,
          padding:"3px 8px",borderRadius:99,background:"rgba(255,140,0,0.18)",border:"1px solid #ff8c0055",
        }}>
          <span style={{width:6,height:6,borderRadius:"50%",background:"#ff8c00",animation:"pulseDot 1.4s ease-in-out infinite"}}/>
          <span style={{fontFamily:"'Fira Code',monospace",fontSize:"var(--badge-size,9px)",color:"#ff8c00"}}>
            ON BREAK · {remainingMin}m left
          </span>
        </div>
      )}
    </div>
  );
}

// Computes card sizing for a section purely from how many ninjas are in it,
// so a 2-person section gets big roomy cards and a 20-person section gets
// compact ones — while both still fill the full width of their column.
function sizingFor(count){
  const n = Math.max(count,1);
  const cardMin   = Math.max(105, Math.min(240, 260 - n*7));
  const cardPad   = Math.max(8,   Math.min(16,  18 - n*0.4));
  const nameSize  = Math.max(11,  Math.min(16,  17 - n*0.25));
  const goalSize  = Math.max(9,   Math.min(11.5,12.5 - n*0.15));
  const badgeSize = Math.max(8,   Math.min(9.5, 10 - n*0.05));
  const radius    = Math.max(8,   Math.min(14,  15 - n*0.2));
  return {cardMin,cardPad,nameSize,goalSize,badgeSize,radius};
}

function SectionColumn({section,ninjas}){
  const {color,icon} = styleFor(section);
  const s = sizingFor(ninjas.length);
  return(
    <div style={{
      display:"flex",flexDirection:"column",minHeight:0,height:"100%",
      background:"rgba(255,255,255,0.03)",border:`1px solid ${color}2e`,borderRadius:16,overflow:"hidden",
    }}>
      <div style={{
        display:"flex",alignItems:"center",gap:8,padding:"10px 14px",flexShrink:0,
        background:`${color}14`,borderBottom:`1px solid ${color}33`,
      }}>
        <span style={{fontSize:"clamp(14px,1.4vw,18px)"}}>{icon}</span>
        <span style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:"clamp(12px,1.2vw,15px)",color,letterSpacing:.5}}>
          {section}
        </span>
        <span style={{
          marginLeft:"auto",fontFamily:"'Fira Code',monospace",fontSize:"clamp(9px,1vw,11px)",
          color:"rgba(255,255,255,0.4)",background:"rgba(0,0,0,0.3)",padding:"2px 8px",borderRadius:99,
        }}>
          {ninjas.length}
        </span>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:10,minHeight:0}}>
        {ninjas.length===0 ? (
          <div style={{
            height:"100%",display:"flex",alignItems:"center",justifyContent:"center",textAlign:"center",padding:12,
          }}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.25)"}}>
              No ninjas assigned yet
            </span>
          </div>
        ) : (
          <div style={{
            display:"grid",
            gridTemplateColumns:`repeat(auto-fill,minmax(${s.cardMin}px,1fr))`,
            gap:8,
            "--card-pad":`${s.cardPad}px`,
            "--card-radius":`${s.radius}px`,
            "--name-size":`${s.nameSize}px`,
            "--goal-size":`${s.goalSize}px`,
            "--badge-size":`${s.badgeSize}px`,
          }}>
            {ninjas.map(nj=>(
              <NinjaCard key={nj.key} name={nj.name} goal={nj.goal} onBreak={nj.onBreak} remainingMin={nj.remainingMin} accent={color}/>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function KioskApp(){
  const [goals,setGoals]=useState(null);
  const [breaks,setBreaks]=useState({});
  const [nowTick,setNowTick]=useState(Date.now());

  useEffect(()=>{
    const unsubGoals = window.fbGoals.listen(setGoals);
    const unsubBreaks = window.fbBreak.listen(setBreaks);
    return ()=>{ unsubGoals&&unsubGoals(); unsubBreaks&&unsubBreaks(); };
  },[]);

  useEffect(()=>{
    const iv=setInterval(()=>setNowTick(Date.now()),15000);
    return ()=>clearInterval(iv);
  },[]);

  const bySection = useMemo(()=>{
    const map = {}; window.CN_SECTIONS.forEach(s=>map[s]=[]);
    Object.entries(goals||{}).forEach(([key,g])=>{
      if(!g || !g.name) return;
      const section = window.CN_SECTIONS.includes(g.section) ? g.section : window.CN_SECTIONS[0];
      const breakEntry = breaks[key];
      const onBreak = window.cnIsBreakActive(breakEntry);
      const remainingMin = onBreak ? Math.max(1,Math.ceil((breakEntry.startedAt+window.BREAK_DURATION_MS-nowTick)/60000)) : 0;
      map[section].push({key,name:g.name,goal:(g.goal||"").trim(),onBreak,remainingMin});
    });
    Object.values(map).forEach(list=>list.sort((a,b)=>a.name.localeCompare(b.name)));
    return map;
  },[goals,breaks,nowTick]);

  const loading = goals===null;
  const totalCount = Object.values(bySection).reduce((n,l)=>n+l.length,0);

  return(
    <div style={{
      position:"fixed",inset:0,display:"flex",flexDirection:"column",padding:"16px 20px",
      background:"radial-gradient(ellipse 60% 50% at 80% 20%,rgba(57,255,20,0.06) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(0,207,255,0.07) 0%,transparent 70%),#060609",
    }}>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:14,flexShrink:0}}>
        <div>
          <div style={{
            fontFamily:"'Orbitron',sans-serif",fontWeight:900,fontSize:"clamp(16px,1.8vw,24px)",letterSpacing:1,
            background:"linear-gradient(135deg,#39ff14,#00cfff)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",
          }}>
            CODE NINJAS <span style={{fontFamily:"'Fira Code',monospace",fontSize:"clamp(9px,1vw,12px)",color:"rgba(255,255,255,0.35)",letterSpacing:2}}>ROBBINSVILLE</span>
          </div>
          <div style={{fontFamily:"'Fira Code',monospace",fontSize:"clamp(9px,1vw,11px)",color:"rgba(255,255,255,0.35)"}}>
            Project Goals · {totalCount} ninja{totalCount!==1?"s":""} assigned
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,padding:"4px 12px",borderRadius:99,
          background:"rgba(57,255,20,0.1)",border:"1px solid #39ff1444"}}>
          <span style={{width:7,height:7,borderRadius:"50%",background:"#39ff14",animation:"pulseDot 1.6s ease-in-out infinite"}}/>
          <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"#39ff14"}}>LIVE</span>
        </div>
        <div style={{marginLeft:"auto"}}><Clock/></div>
      </div>

      {loading ? (
        <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"rgba(255,255,255,0.3)"}}>Loading goals...</div>
        </div>
      ) : (
        <div className="kiosk-grid" style={{flex:1,minHeight:0,display:"grid",gap:12}}>
          {window.CN_SECTIONS.map(section=>(
            <SectionColumn key={section} section={section} ninjas={bySection[section]}/>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<KioskApp/>);
</script>
</body>
</html>
