<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Code Ninjas – Kiosk Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@400;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#f4f6f9;color:#14161a;overflow:hidden;}
#root{min-height:100vh;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(26,140,26,0.35);border-radius:99px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pulseBorder{0%,100%{box-shadow:0 0 0 rgba(204,109,0,0)}50%{box-shadow:0 0 12px rgba(204,109,0,0.35)}}
.kiosk-grid{grid-template-columns:repeat(4,minmax(0,1fr));}
@media(max-width:1100px){.kiosk-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:560px){.kiosk-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="root"></div>
<script src="shared.js"></script>
<script type="text/babel">
const {useState,useEffect,useMemo} = React;

// Visual identity per section — darker, more saturated tones than a dark-mode
// UI would use, so each column stays legible against a bright projected white
// background. Keeps each column instantly distinguishable from across a room.
const SECTION_STYLE = {
  Impact:  {color:"#c2005f", icon:"💥"},
  JR:      {color:"#0077b6", icon:"🧒"},
  Robotics:{color:"#c96a00", icon:"🤖"},
  Unity:   {color:"#1a8c1a", icon:"🎮"},
};
function styleFor(section){ return SECTION_STYLE[section] || {color:"#14161a", icon:"🥷"}; }

function Clock(){
  const [now,setNow]=useState(new Date());
  useEffect(()=>{ const iv=setInterval(()=>setNow(new Date()),1000); return ()=>clearInterval(iv); },[]);
  return(
    <div style={{textAlign:"right"}}>
      <div style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:"clamp(16px,1.6vw,22px)",color:"#14161a"}}>
        {now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit"})}
      </div>
      <div style={{fontFamily:"'Fira Code',monospace",fontSize:"clamp(9px,0.9vw,12px)",color:"rgba(0,0,0,0.45)"}}>
        {now.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}
      </div>
    </div>
  );
}

// A single ninja card. Sizing (font/padding) is driven entirely by CSS
// vars set on the ancestor grid, so cards shrink/grow together as the
// section's roster count changes — no per-card measurement needed.
function NinjaCard({name,goal,onBreak,remainingMin,accent}){
  return(
    <div style={{
      position:"relative",
      padding:"calc(var(--card-pad,14px))",
      borderRadius:"calc(var(--card-radius,14px))",
      background: onBreak ? "rgba(204,109,0,0.07)" : "#ffffff",
      border: onBreak ? "1px solid rgba(204,109,0,0.45)" : `1px solid ${accent}33`,
      boxShadow: onBreak ? "none" : "0 1px 3px rgba(20,22,26,0.06)",
      animation: onBreak ? "fadeUp .35s ease both, pulseBorder 2.2s ease-in-out infinite" : "fadeUp .35s ease both",
      minWidth:0,
    }}>
      <div style={{
        fontFamily:"'Exo 2',sans-serif",fontWeight:700,
        fontSize:"var(--name-size,15px)",color:"#14161a",
        overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:4,
      }} title={name}>
        🥷 {name}
      </div>
      {goal ? (
        <div style={{
          fontFamily:"'Fira Code',monospace",fontSize:"var(--goal-size,11px)",
          color:"rgba(20,22,26,0.7)",lineHeight:1.35,
          display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical",overflow:"hidden",
        }} title={goal}>
          🎯 {goal}
        </div>
      ) : (
        <div style={{fontFamily:"'Fira Code',monospace",fontSize:"var(--goal-size,11px)",color:"rgba(20,22,26,0.35)"}}>
          No goal set yet
        </div>
      )}
      {onBreak && (
        <div style={{
          marginTop:6,display:"inline-flex",alignItems:"center",gap:5,
          padding:"3px 8px",borderRadius:99,background:"rgba(204,109,0,0.14)",border:"1px solid rgba(204,109,0,0.4)",
        }}>
          <span style={{width:6,height:6,borderRadius:"50%",background:"#c96a00",animation:"pulseDot 1.4s ease-in-out infinite"}}/>
          <span style={{fontFamily:"'Fira Code',monospace",fontSize:"var(--badge-size,9px)",color:"#c96a00"}}>
            ON BREAK · {remainingMin}m left
          </span>
        </div>
      )}
    </div>
  );
}

// Computes card sizing for a section purely from how many ninjas are in it,
// so a 2-person section gets big roomy cards and a 20-person section gets
// compact ones — while both still fill the full width of their column.
function sizingFor(count){
  const n = Math.max(count,1);
  const cardMin   = Math.max(105, Math.min(240, 260 - n*7));
  const cardPad   = Math.max(8,   Math.min(16,  18 - n*0.4));
  const nameSize  = Math.max(11,  Math.min(16,  17 - n*0.25));
  const goalSize  = Math.max(9,   Math.min(11.5,12.5 - n*0.15));
  const badgeSize = Math.max(8,   Math.min(9.5, 10 - n*0.05));
  const radius    = Math.max(8,   Math.min(14,  15 - n*0.2));
  return {cardMin,cardPad,nameSize,goalSize,badgeSize,radius};
}

function SectionColumn({section,ninjas}){
  const {color,icon} = styleFor(section);
  const s = sizingFor(ninjas.length);
  return(
    <div style={{
      display:"flex",flexDirection:"column",minHeight:0,height:"100%",
      background:"#ffffff",border:`1px solid ${color}2e`,borderRadius:16,overflow:"hidden",
      boxShadow:"0 1px 4px rgba(20,22,26,0.05)",
    }}>
      <div style={{
        display:"flex",alignItems:"center",gap:8,padding:"10px 14px",flexShrink:0,
        background:`${color}14`,borderBottom:`1px solid ${color}33`,
      }}>
        <span style={{fontSize:"clamp(14px,1.4vw,18px)"}}>{icon}</span>
        <span style={{fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:"clamp(12px,1.2vw,15px)",color,letterSpacing:.5}}>
          {section}
        </span>
        <span style={{
          marginLeft:"auto",fontFamily:"'Fira Code',monospace",fontSize:"clamp(9px,1vw,11px)",
          color:"rgba(20,22,26,0.55)",background:"rgba(20,22,26,0.06)",padding:"2px 8px",borderRadius:99,
        }}>
          {ninjas.length}
        </span>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:10,minHeight:0}}>
        {ninjas.length===0 ? (
          <div style={{
            height:"100%",display:"flex",alignItems:"center",justifyContent:"center",textAlign:"center",padding:12,
          }}>
            <span style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(20,22,26,0.3)"}}>
              No ninjas assigned yet
            </span>
          </div>
        ) : (
          <div style={{
            display:"grid",
            gridTemplateColumns:`repeat(auto-fill,minmax(${s.cardMin}px,1fr))`,
            gap:8,
            "--card-pad":`${s.cardPad}px`,
            "--card-radius":`${s.radius}px`,
            "--name-size":`${s.nameSize}px`,
            "--goal-size":`${s.goalSize}px`,
            "--badge-size":`${s.badgeSize}px`,
          }}>
            {ninjas.map(nj=>(
              <NinjaCard key={nj.key} name={nj.name} goal={nj.goal} onBreak={nj.onBreak} remainingMin={nj.remainingMin} accent={color}/>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// Uses ElevenLabs text-to-speech for announcements.
// NOTE: this API key is embedded in client-side code and is visible to
// anyone viewing page source on the kiosk. Consider proxying this call
// through a small backend if that's a concern for your setup.
//
// `audioEl` is a single, reused <audio> element that was already played
// once from a real user click (see the "enable announcements" button).
// Browsers only allow audio to autoplay after a user gesture has
// unlocked it — reusing that same already-unlocked element for every
// later, gesture-less announcement is what keeps those from being
// silently blocked. onError lets the UI show a visible message, since
// a kiosk display has no console anyone will ever look at.
async function speak(text, audioEl, onError){

  try{

    const API_KEY = "sk_9d372ccc7d484f8816f0957f97cf131956c4a1b250b30aa6";
    const VOICE_ID = "JBFqnCBsd6RMkjVDRZzb";
    const OUTPUT_FORMAT = "mp3_44100_128"; // matches the ElevenLabs SDK's default

    const response = await fetch(
      `https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}?output_format=${OUTPUT_FORMAT}`,
      {
        method:"POST",
        headers:{
          "xi-api-key":API_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          text:text,
          model_id:"eleven_multilingual_v2",
          voice_settings:{
            stability:0.5,
            similarity_boost:0.8,
            style:0.3,
            use_speaker_boost:true
          }
        })
      }
    );


    if(!response.ok){
      const detail = await response.text();
      console.error("ElevenLabs Error:", detail);
      onError && onError(`ElevenLabs API error (${response.status}): ${detail.slice(0,200)}`);
      return;
    }


    const blob = await response.blob();

    const url = URL.createObjectURL(blob);

    const el = audioEl || new Audio();
    el.src = url;
    el.volume = 1;

    try{
      await el.play();
    }catch(playErr){
      console.error("Audio playback blocked:", playErr);
      onError && onError(`Playback blocked by browser: ${playErr.message}. Tap "enable announcements" again.`);
    }


  }catch(err){

    console.error(
      "ElevenLabs TTS failed:",
      err
    );
    onError && onError(`TTS request failed: ${err.message}`);

  }

}

function KioskApp(){
  const [goals,setGoals]=useState(null);
  const [breaks,setBreaks]=useState({});
  const [allEntries,setAllEntries]=useState([]);
  const [usernames,setUsernames]=useState([]);
  const [nowTick,setNowTick]=useState(Date.now());
  const [soundEnabled,setSoundEnabled]=useState(
  localStorage.getItem("kioskSound") === "true"
  );
  const [ttsError,setTtsError]=useState(null);
  const prevBreakRef = React.useRef({});
  // Single <audio> element, unlocked by the real click on the "enable
  // announcements" button below. Every later announcement reuses it
  // instead of creating a fresh Audio() from inside a non-click
  // useEffect, which browsers are liable to block silently.
  const audioElRef = React.useRef(null);
  if(!audioElRef.current && typeof Audio !== "undefined"){
    audioElRef.current = new Audio();
  }

  useEffect(()=>{
    const unsubGoals = window.fbGoals.listen(setGoals);
    const unsubBreaks = window.fbBreak.listen(setBreaks);
    const unsubEntries = window.fbLeaderboard.listen(setAllEntries);
    const unsubUsernames = window.fbUsernames.listen(setUsernames);
    return ()=>{ unsubGoals&&unsubGoals(); unsubBreaks&&unsubBreaks(); unsubEntries&&unsubEntries(); unsubUsernames&&unsubUsernames(); };
  },[]);

  useEffect(()=>{
    const iv=setInterval(()=>setNowTick(Date.now()),1000);
    return ()=>clearInterval(iv);
  },[]);

  // Which accounts are currently within their 2-hour Points access window —
  // the exact same rule that drives "In The Dojo" and student login, so a
  // ninja whose access has expired disappears from the kiosk automatically.
  const presentAccountKeys = useMemo(()=>{
    const today = window.todayStr();
    const map = {};
    (allEntries||[]).filter(e=>e && e.date===today).forEach(e=>{
      if(!e.name) return;
      const key = e.name.trim().toLowerCase();
      if(!map[key]) map[key]={name:e.name.trim(),lastSeen:0};
      map[key].name = e.name.trim();
      map[key].lastSeen = Math.max(map[key].lastSeen, e.createdAt||0);
    });
    const keys = new Set();
    Object.values(map)
      .filter(p=>p.lastSeen && (nowTick-p.lastSeen<=window.SESSION_MS))
      .forEach(p=>{
        const account = window.findLinkedAccount(p.name, usernames);
        if(account) keys.add(window.cnKeySafe(account));
      });
    return keys;
  },[allEntries,usernames,nowTick]);

  const bySection = useMemo(()=>{
    const map = {}; window.CN_SECTIONS.forEach(s=>map[s]=[]);
    Object.entries(goals||{}).forEach(([key,g])=>{
      if(!g || !g.name) return;
      if(!presentAccountKeys.has(key)) return; // hide ninjas past their 2-hour window
      const section = window.CN_SECTIONS.includes(g.section) ? g.section : window.CN_SECTIONS[0];
      const breakEntry = breaks[key];
      const onBreak = window.cnIsBreakActive(breakEntry);
      const remainingMin = onBreak ? Math.max(1,Math.ceil((breakEntry.startedAt+window.BREAK_DURATION_MS-nowTick)/60000)) : 0;
      map[section].push({key,name:g.name,goal:(g.goal||"").trim(),onBreak,remainingMin});
    });
    Object.values(map).forEach(list=>list.sort((a,b)=>a.name.localeCompare(b.name)));
    return map;
  },[goals,breaks,presentAccountKeys,nowTick]);

  const loading = goals===null;
  const totalCount = Object.values(bySection).reduce((n,l)=>n+l.length,0);

  // Watches every card currently on the kiosk for a break flipping from
  // active -> inactive (either the Sensei ended it early, or the 10-minute
  // timer ran out) and announces it out loud. Uses a ref (not state) to
  // remember each ninja's last-seen status without triggering re-renders.
  useEffect(()=>{
    const allNinjas = Object.values(bySection).flat();
    allNinjas.forEach(nj=>{
      const was = prevBreakRef.current[nj.key];
      if(was===true && nj.onBreak===false && soundEnabled){
        speak(`${nj.name}'s break has finished.`, audioElRef.current, setTtsError);
      }
      prevBreakRef.current[nj.key] = nj.onBreak;
    });
  },[bySection,soundEnabled]);

  return(
    <div style={{
      position:"fixed",inset:0,display:"flex",flexDirection:"column",padding:"16px 20px",
      background:"radial-gradient(ellipse 60% 50% at 80% 20%,rgba(26,140,26,0.05) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(0,119,182,0.05) 0%,transparent 70%),#f4f6f9",
    }}>
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:14,flexShrink:0}}>
        <div>
          <div style={{
            fontFamily:"'Orbitron',sans-serif",fontWeight:900,fontSize:"clamp(16px,1.8vw,24px)",letterSpacing:1,
            background:"linear-gradient(135deg,#1a8c1a,#0077b6)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",
          }}>
            CODE NINJAS <span style={{fontFamily:"'Fira Code',monospace",fontSize:"clamp(9px,1vw,12px)",color:"rgba(20,22,26,0.45)",letterSpacing:2}}>ROBBINSVILLE</span>
          </div>
          <div style={{fontFamily:"'Fira Code',monospace",fontSize:"clamp(9px,1vw,11px)",color:"rgba(20,22,26,0.45)"}}>
            Project Goals · {totalCount} ninja{totalCount!==1?"s":""} present now
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,padding:"4px 12px",borderRadius:99,
          background:"rgba(26,140,26,0.1)",border:"1px solid rgba(26,140,26,0.35)"}}>
          <span style={{width:7,height:7,borderRadius:"50%",background:"#1a8c1a",animation:"pulseDot 1.6s ease-in-out infinite"}}/>
          <span style={{fontFamily:"'Fira Code',monospace",fontSize:10,color:"#1a8c1a"}}>LIVE</span>
        </div>
        <button
          onClick={()=>{
            const next = !soundEnabled;
            setSoundEnabled(next);
            localStorage.setItem("kioskSound", next ? "true" : "false");
            setTtsError(null);
            if(next) speak("Announcements enabled.", audioElRef.current, setTtsError);
          }}
          style={{
            display:"flex",alignItems:"center",gap:6,padding:"4px 12px",borderRadius:99,cursor:"pointer",
            background: soundEnabled ? "rgba(20,22,26,0.05)" : "rgba(201,106,0,0.12)",
            border: soundEnabled ? "1px solid rgba(20,22,26,0.12)" : "1px solid rgba(201,106,0,0.4)",
            fontFamily:"'Fira Code',monospace",fontSize:10,
            color: soundEnabled ? "rgba(20,22,26,0.45)" : "#c96a00",
          }}>
          {soundEnabled ? "🔊 Announcements on" : "🔇 Tap to enable announcements"}
        </button>
        {soundEnabled && (
          <button
            onClick={()=>{
              setTtsError(null);
              speak("Hahahaha", audioElRef.current, setTtsError);
            }}
            style={{
              padding:"4px 12px",borderRadius:99,cursor:"pointer",
              background:"rgba(20,22,26,0.05)",border:"1px solid rgba(20,22,26,0.12)",
              fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(20,22,26,0.45)",
            }}>
            ▶ Test sound
          </button>
        )}
        <div style={{marginLeft:"auto"}}><Clock/></div>
      </div>

      {ttsError && (
        <div style={{
          marginBottom:10,padding:"6px 12px",borderRadius:8,flexShrink:0,
          background:"rgba(194,0,0,0.08)",border:"1px solid rgba(194,0,0,0.3)",
          fontFamily:"'Fira Code',monospace",fontSize:10,color:"#c20000",
        }}>
          ⚠ {ttsError}
        </div>
      )}

      {loading ? (
        <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{fontFamily:"'Fira Code',monospace",fontSize:12,color:"rgba(20,22,26,0.35)"}}>Loading goals...</div>
        </div>
      ) : (
        <div className="kiosk-grid" style={{flex:1,minHeight:0,display:"grid",gap:12}}>
          {window.CN_SECTIONS.map(section=>(
            <SectionColumn key={section} section={section} ninjas={bySection[section]}/>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<KioskApp/>);
</script>
</body>
</html>
