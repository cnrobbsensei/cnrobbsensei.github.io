const db = firebase.database();

window.fbNOTM = {
  async getAll(){
    const snap = await db.ref("notm").once("value");
    const val = snap.val() || {};
    const entries = [];
    for(const [id,e] of Object.entries(val)){
      entries.push({id,...e});
    }
    return entries;
  },
  async addEntry(monthKey,name,points){
    const ref = db.ref("notm").push();
    await ref.set({monthKey,name,points,ts:Date.now()});
    return {id:ref.key};
  },
  async deleteEntry(entryId){
    await db.ref(`notm/${entryId}`).remove();
  }
};

<script type="text/babel">
const {useState,useEffect} = React;

const WEEK_START = new Date("2026-05-14T00:00:00");
function getCurrentWeek(){
  const diff = new Date() - WEEK_START;
  return diff < 0 ? 1 : Math.floor(diff/(7*24*60*60*1000))+1;
}

function Glass({children,style={},onClick,onMouseEnter,onMouseLeave}){
  return(
    <div onClick={onClick} onMouseEnter={onMouseEnter} onMouseLeave={onMouseLeave} style={{
      background:"rgba(255,255,255,0.06)",backdropFilter:"blur(18px)",WebkitBackdropFilter:"blur(18px)",
      border:"1px solid rgba(255,255,255,0.12)",borderRadius:16,
      boxShadow:"0 8px 32px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08)",...style
    }}>{children}</div>
  );
}
function Toast({msg,color="#39ff14",onDone}){
  useEffect(()=>{const t=setTimeout(onDone,3500);return()=>clearTimeout(t);},[]);
  return(
    <div style={{position:"fixed",bottom:24,right:16,left:16,zIndex:9999,maxWidth:380,margin:"0 auto",
      background:"rgba(10,10,20,0.96)",border:`1px solid ${color}`,borderRadius:12,
      padding:"14px 20px",color,fontFamily:"'Fira Code',monospace",fontWeight:600,fontSize:13,
      boxShadow:`0 0 24px ${color}55`,animation:"slideIn .3s ease"}}>{msg}</div>
  );
}
function Spinner(){
  return <div style={{width:16,height:16,border:"2px solid rgba(255,255,255,0.2)",borderTop:"2px solid #39ff14",borderRadius:"50%",animation:"spin .8s linear infinite",display:"inline-block"}}/>;
}
function iStyle(err){

}

function NOTMTab({isAdmin,notmEntries,setNotmEntries,setToast}){
  const [selMonth,setSelMonth]=useState(()=>{
    const n=new Date();
    return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;
  });
  const [name,setName]=useState("");
  const [points,setPoints]=useState("");
  const [errors,setErrors]=useState({});
  const [saving,setSaving]=useState(false);
  const [deleting,setDeleting]=useState(null);
  const [addMode,setAddMode]=useState(false);

  function monthLabel(mk){
    const [y,m]=mk.split("-");
    return new Date(Number(y),Number(m)-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});
  }
  function monthShort(mk){
    const [y,m]=mk.split("-");
    return `${String(m).padStart(2,"0")}/${String(y).slice(2)}`;
  }

  const allMonths=Array.from(new Set([selMonth,...notmEntries.map(e=>e.monthKey)])).sort((a,b)=>b.localeCompare(a));
  const monthEntries=notmEntries.filter(e=>e.monthKey===selMonth).sort((a,b)=>b.points-a.points);

  const allTimeMap={};
  for(const e of notmEntries){
    if(!allTimeMap[e.name]||e.points>allTimeMap[e.name].points){
      allTimeMap[e.name]={name:e.name,points:e.points,monthKey:e.monthKey};
    }
  }
  const allTime=Object.values(allTimeMap).sort((a,b)=>b.points-a.points);

  async function addEntry(){
    const errs={};
    if(!name.trim()) errs.name="Name required";
    const p=Number(points);
    if(!points||isNaN(p)) errs.points="Must be a number";
    else if(p<0) errs.points="No negative points";
    if(Object.keys(errs).length){setErrors(errs);return;}
    setErrors({});setSaving(true);
    try{
      const result=await window.fbNOTM.addEntry(selMonth,name.trim(),p);
      setNotmEntries(prev=>[...prev,{id:result.id,monthKey:selMonth,name:name.trim(),points:p,ts:Date.now()}]);
      setName("");setPoints("");setAddMode(false);
      setToast({msg:`${name.trim()} added with ${p} pts for ${monthLabel(selMonth)}! ⭐`,color:"#ffd700"});
    } catch(e){setToast({msg:`Save failed: ${e.message}`,color:"#ff2d78"});}
    setSaving(false);
  }

  async function removeEntry(entry){
    setDeleting(entry.id);
    try{
      await window.fbNOTM.deleteEntry(entry.id);
      setNotmEntries(prev=>prev.filter(e=>e.id!==entry.id));
      setToast({msg:`Removed ${entry.name}.`,color:"#ff2d78"});
    } catch(e){setToast({msg:`Delete failed: ${e.message}`,color:"#ff2d78"});}
    setDeleting(null);
  }

  const PODIUM_COLORS=["#ffd700","#c0c0c0","#cd7f32"];

  function MonthRow({entry,rank}){
    const gc=rank<=3?PODIUM_COLORS[rank-1]:"transparent";
    return(
      <Glass style={{padding:"12px 18px",marginBottom:8,
        borderColor:rank<=3?`${gc}44`:"rgba(255,255,255,0.08)",
        boxShadow:rank<=3?`0 0 18px ${gc}22,0 4px 20px rgba(0,0,0,0.4)`:"0 4px 14px rgba(0,0,0,0.3)",
        animation:`fadeUp .35s ease both ${(rank-1)*.05}s`}}>
        <div style={{display:"grid",gridTemplateColumns:"40px 1fr 80px 90px",gap:10,alignItems:"center"}}>
          <div style={{width:32,height:32,borderRadius:"50%",flexShrink:0,
            background:rank<=3?`linear-gradient(135deg,${gc},${gc}99)`:"rgba(255,255,255,0.08)",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontWeight:700,fontSize:rank<=3?14:11,color:rank<=3?"#000":"#999",
            boxShadow:rank<=3?`0 0 12px ${gc}88`:"none"}}>
            {rank===1?"👑":rank===2?"🥈":rank===3?"🥉":`#${rank}`}
          </div>
          <div style={{fontFamily:"'Exo 2',sans-serif",fontWeight:700,fontSize:"clamp(12px,1.5vw,14px)",color:"#fff"}}>{entry.name}</div>
          <div style={{fontFamily:"'Fira Code',monospace",fontSize:11,color:"rgba(255,255,255,0.45)",textAlign:"center"}}>{monthShort(entry.monthKey)}</div>
          <div style={{textAlign:"right",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:"clamp(13px,1.8vw,16px)",color:rank<=3?gc:"#39ff14",textShadow:rank<=3?`0 0 10px ${gc}88`:"0 0 8px #39ff1455"}}>
            {Number(entry.points).toLocaleString()}
            {isAdmin&&(
              <button onClick={()=>removeEntry(entry)} disabled={!!deleting}
                style={{marginLeft:8,background:"rgba(255,45,120,0.12)",border:"1px solid #ff2d7833",borderRadius:5,color:"#ff2d78",padding:"1px 6px",cursor:"pointer",fontFamily:"'Fira Code',monospace",fontSize:9,verticalAlign:"middle"}}>
                {deleting===entry.id?<Spinner/>:"✕"}
              </button>
            )}
          </div>
        </div>
      </Glass>
    );
  }

  return(
    <div style={{padding:"clamp(16px,3vw,28px) clamp(14px,3vw,36px)",animation:"fadeUp .4s ease both"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:28,flexWrap:"wrap"}}>
        <h2 style={{fontFamily:"'Orbitron',sans-serif",fontSize:"clamp(15px,2vw,22px)",color:"#fff",margin:0,
          background:"linear-gradient(135deg,#ffd700,#ff8c00)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>⭐ Ninja of the Month</h2>
        {isAdmin&&(
          <button onClick={()=>setAddMode(!addMode)}
            style={{padding:"8px 18px",borderRadius:99,border:"none",cursor:"pointer",
              fontFamily:"'Exo 2',sans-serif",fontWeight:600,fontSize:12,transition:"all .2s",
              background:addMode?"rgba(255,45,120,0.12)":"linear-gradient(135deg,#ffd700,#ff8c00)",
              color:addMode?"#ff2d78":"#000",border:addMode?"1px solid #ff2d7844":"none"}}>
            {addMode?"✕ Cancel":"+ Add Entry"}
          </button>
        )}
      </div>

      {isAdmin&&addMode&&(
        <Glass style={{padding:24,marginBottom:28,borderColor:"#ffd70033",background:"rgba(255,215,0,0.04)"}}>
          <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:12,color:"#ffd700",marginBottom:18,letterSpacing:1}}>ADD NOTM ENTRY</h3>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:16,marginBottom:18}}>
            <div>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>MONTH</label>
              <select value={selMonth} onChange={e=>setSelMonth(e.target.value)}
                style={{width:"100%",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,color:"#fff",padding:"11px 14px",fontFamily:"'Fira Code',monospace",fontSize:13,outline:"none",cursor:"pointer"}}>
                {Array.from({length:13},(_,i)=>{
                  const d=new Date();d.setMonth(d.getMonth()-6+i);
                  const mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
                  return <option key={mk} value={mk} style={{background:"#0a0a0f"}}>{monthLabel(mk)}</option>;
                })}
              </select>
            </div>
            <div>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>NINJA NAME</label>
              <input value={name} onChange={e=>{setName(e.target.value);setErrors({});}}
                placeholder="e.g. ShadowByte" style={iStyle(errors.name)}
                onFocus={e=>e.target.style.borderColor="#ffd700"}
                onBlur={e=>e.target.style.borderColor=errors.name?"#ff2d78":"rgba(255,255,255,0.15)"}/>
              {errors.name&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.name}</p>}
            </div>
            <div>
              <label style={{display:"block",fontFamily:"'Fira Code',monospace",fontSize:10,color:"rgba(255,255,255,0.45)",marginBottom:7,letterSpacing:1}}>POINTS</label>
              <input value={points} onChange={e=>setPoints(e.target.value)} type="number" min="0"
                placeholder="e.g. 2500" style={{...iStyle(errors.points),fontFamily:"'Fira Code',monospace",fontSize:16}}
                onFocus={e=>e.target.style.borderColor="#ffd700"}
                onBlur={e=>e.target.style.borderColor=errors.points?"#ff2d78":"rgba(255,255,255,0.15)"}
                onKeyDown={e=>e.key==="Enter"&&!saving&&addEntry()}/>
              {errors.points&&<p style={{color:"#ff2d78",fontSize:11,marginTop:4,fontFamily:"'Fira Code',monospace"}}>{errors.points}</p>}
            </div>
          </div>
          <button onClick={addEntry} disabled={saving}
            style={{padding:"12px 32px",borderRadius:10,border:"none",cursor:saving?"not-allowed":"pointer",
              background:saving?"rgba(255,255,255,0.08)":"linear-gradient(135deg,#ffd700,#ff8c00)",
              color:saving?"rgba(255,255,255,0.3)":"#000",fontFamily:"'Orbitron',sans-serif",fontWeight:700,fontSize:12,letterSpacing:1,
              display:"flex",alignItems:"center",gap:10}}>
            {saving?<><Spinner/> SAVING...</>:"⭐ ADD ENTRY"}
          </button>
        </Glass>
      )}

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:28}}>
        <div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:18}}>
            {allMonths.slice(0,8).map(mk=>(
              <button key={mk} onClick={()=>setSelMonth(mk)} style={{
                padding:"7px 14px",borderRadius:99,border:"none",cursor:"pointer",
                fontFamily:"'Fira Code',monospace",fontSize:11,transition:"all .2s",
                background:selMonth===mk?"linear-gradient(135deg,#ffd700,#ff8c00)":"rgba(255,255,255,0.07)",
                color:selMonth===mk?"#000":"rgba(255,255,255,0.55)",
                boxShadow:selMonth===mk?"0 0 16px #ffd70044":"none"}}>
                {monthShort(mk)}
              </button>
            ))}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:13,color:"#ffd700",margin:0,letterSpacing:1}}>{monthLabel(selMonth).toUpperCase()}</h3>
            <div style={{flex:1,height:1,background:"linear-gradient(90deg,#ffd70033,transparent)"}}/>
          </div>
          {monthEntries.length===0?(
            <Glass style={{padding:32,textAlign:"center"}}>
              <p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.35)",fontSize:13}}>No entries for this month yet.{isAdmin?" Use '+ Add Entry' above.":""}</p>
            </Glass>
          ):(
            <div>
              <div style={{display:"grid",gridTemplateColumns:"40px 1fr 80px 90px",gap:10,padding:"4px 18px",fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.25)",letterSpacing:1.5,marginBottom:6}}>
                <span>RANK</span><span>NINJA</span><span style={{textAlign:"center"}}>MM/YY</span><span style={{textAlign:"right"}}>PTS</span>
              </div>
              {monthEntries.map((entry,i)=>(<MonthRow key={entry.id} entry={entry} rank={i+1}/>))}
            </div>
          )}
        </div>

        <div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <h3 style={{fontFamily:"'Orbitron',sans-serif",fontSize:13,color:"#ff2d78",margin:0,letterSpacing:1}}>🏛️ HALL OF FAME</h3>
            <div style={{flex:1,height:1,background:"linear-gradient(90deg,#ff2d7833,transparent)"}}/>
          </div>
          <p style={{fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.25)",marginBottom:14,lineHeight:1.5}}>Best single-month score per ninja, all time</p>
          {allTime.length===0?(
            <Glass style={{padding:32,textAlign:"center"}}>
              <p style={{fontFamily:"'Exo 2',sans-serif",color:"rgba(255,255,255,0.35)",fontSize:13}}>No data yet.</p>
            </Glass>
          ):(
            <div>
              <div style={{display:"grid",gridTemplateColumns:"40px 1fr 80px 90px",gap:10,padding:"4px 18px",fontFamily:"'Fira Code',monospace",fontSize:9,color:"rgba(255,255,255,0.25)",letterSpacing:1.5,marginBottom:6}}>
                <span>RANK</span><span>NINJA</span><span style={{textAlign:"center"}}>BEST</span><span style={{textAlign:"right"}}>PTS</span>
              </div>
              {allTime.map((entry,i)=>(<MonthRow key={entry.name} entry={entry} rank={i+1}/>))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function NOTMApp(){
  const [auth,setAuth]=useState(null);
  const [notmEntries,setNotmEntries]=useState([]);
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState(null);
  const isMobile=useIsMobile();

  useEffect(()=>{
    const role = localStorage.getItem("cn_role");
    if(!role){ window.location.href="index.html"; return; }
    setAuth({role,username:localStorage.getItem("cn_username")});
    (async()=>{
      try{
        let ne=await window.fbNOTM.getAll();
        if(ne.length===0){
          const seed=[
            {monthKey:"2026-04",name:"Nandish",points:7},
            {monthKey:"2026-05",name:"Cameron",points:4},
          ];
          for(const s of seed){
            const r=await window.fbNOTM.addEntry(s.monthKey,s.name,s.points);
            ne.push({id:r.id,...s,ts:Date.now()});
          }
        }
        setNotmEntries(ne);
      }catch(e){console.warn(e);}
      setLoading(false);
    })();
  },[]);

  if(!auth||loading) return <LoadingScreen status="Loading NOTM..."/>;
  const isAdmin=auth.role==="admin", isStudent=auth.role==="student";

  return(
    <>
      <div style={{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",
        background:"radial-gradient(ellipse 60% 50% at 80% 20%,rgba(57,255,20,0.06) 0%,transparent 70%),radial-gradient(ellipse 50% 40% at 20% 80%,rgba(0,207,255,0.07) 0%,transparent 70%),#060609"}}/>
      <div style={{display:"flex",flexDirection:isMobile?"column":"row",minHeight:"100vh",position:"relative",zIndex:1,width:"100%"}}>
        {isMobile
          ?<MobileNav active="notm" isAdmin={isAdmin} isStudent={isStudent} studentUsername={auth.username}/>
          :<Sidebar active="notm" isAdmin={isAdmin} isStudent={isStudent} studentUsername={auth.username}/>
        }
        <div style={{flex:1,overflowY:"auto",...(isMobile?{}:{height:"100vh"})}}>
          <NOTMTab isAdmin={isAdmin} notmEntries={notmEntries} setNotmEntries={setNotmEntries} setToast={setToast}/>
        </div>
      </div>
      {toast&&<Toast msg={toast.msg} color={toast.color||"#39ff14"} onDone={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NOTMApp/>);
</script>
</body>
</html>
